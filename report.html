<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#103B3C">
<link rel="icon" type="image/png" href="app/icon-192.png">
<title>تقرير خُطوة</title>
<style>
:root{--bg:#F2F5F3;--card:#FFFFFF;--ink:#0F2526;--muted:#5B6E70;--line:#DCE6E2;--hero:#103B3C;--on-hero:#F4F1E8;--sun:#F2A541;--accent:#0E6F62;--mint:#6FD3B0;--bad:#C2413A}
@media (prefers-color-scheme: dark){:root{--bg:#0B1718;--card:#132425;--ink:#E7F0EE;--muted:#93A7A7;--line:#243A3B;--hero:#0E2B2C;--accent:#3DBFA3;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) 32px}
.hero{background:var(--hero);color:var(--on-hero);border-radius:24px;padding:20px;display:flex;gap:18px;align-items:center}
.ring{width:120px;height:120px;flex:0 0 120px;position:relative}.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;direction:ltr}
.hero h1{margin:0;font-size:22px}.hero .m{opacity:.8;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px}
.card h2{font-size:16px;margin:0 0 10px}
.row{display:flex;justify-content:space-between;gap:10px;font-size:15px;margin-bottom:4px}
.bar{height:10px;border-radius:9px;background:color-mix(in srgb,var(--accent) 14%,transparent);overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--accent);border-radius:9px;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.st{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.st b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.st span{font-size:12.5px;color:var(--muted)}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}
.cta{display:block;text-align:center;background:var(--accent);color:#fff;text-decoration:none;border-radius:14px;padding:12px;font-weight:700;margin-top:14px}
.err{text-align:center;padding:40px 10px}
</style>
</head>
<body>
<div class="wrap" id="root"><div class="err">جاري التحميل…</div></div>
<script>
window.addEventListener("hashchange",function(){ location.reload(); });
(function(){
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }
  function num(v,lo,hi){ v=+v; return isFinite(v)?Math.max(lo,Math.min(hi,v)):lo; }
  var MON=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  function nice(d){ var p=String(d||"").split("-"); return p.length===3 ? (+p[2])+" "+MON[(+p[1])-1]+" "+p[0] : ""; }
  var root=document.getElementById("root"), m=location.hash.match(/#r=([A-Za-z0-9_-]{10,6000})/), r=null;
  try{ if(m){ var s=m[1].replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="="; var bin=atob(s), b=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i); r=JSON.parse(new TextDecoder().decode(b)); } }catch(e){ r=null; }
  function dt(x){ x=String(x||""); return /^\d{8}$/.test(x) ? x.slice(0,4)+"-"+x.slice(4,6)+"-"+x.slice(6) : ""; }
  function expand(a, ST, CU){ if(!Array.isArray(a)||a[0]!==2) return null; var st=ST&&ST[a[3]], sec=st&&st.sections&&st.sections[a[4]], subs=sec?sec.subjects:[];
    return {v:1,n:a[1],g:a[2]?"m":"f",st:st?st.label:"",tr:sec?(sec.meta||sec.label):"",d:dt(a[5]),p:a[6],s:(Array.isArray(a[7])?a[7]:[]).map(function(v,i){ return [CU&&CU[subs[i]]?CU[subs[i]].name:"مادة "+(i+1), v]; }),a:[a[8],a[9]],w:[a[10],a[11],a[12]],k:a[13],b:a[14],x:a[15]?[a[15],dt(a[16])]:null}; }
  if(Array.isArray(r)){ var packed=r; r=null; fetch("app/curriculum.json").then(function(x){ return x.ok?x.json():null; }).catch(function(){ return null; }).then(function(j){ render(expand(packed, j&&j.STAGES, j&&j.CURR)); }); return; }
  render(r && r.v===1 ? r : null);
  function render(r){
  if(!r){ root.innerHTML='<div class="err"><h2>اللينك ده مش تقرير صحيح</h2><p>اطلب من الطالب يبعت لينك جديد من خُطوة ← المزيد ← شارك تقدمك.</p><a class="cta" href="./">تعرّف على خُطوة</a></div>'; return; }
  var he=r.g==="m", p=num(r.p,0,100), C=2*Math.PI*52, w=Array.isArray(r.w)?r.w:[0,0,0], a=Array.isArray(r.a)?r.a:[null,null];
  function fm(x){ x=Math.round(x||0); if(x<60) return x+" د"; var h=Math.floor(x/60), q=x%60; return h+" س"+(q?" "+q+" د":""); }
  var subs=(Array.isArray(r.s)?r.s:[]).slice(0,8).map(function(x){ var v=num(x&&x[1],0,100); return '<div class="row"><span>'+esc(x&&x[0])+'</span><b dir="ltr">'+Math.round(v)+'%</b></div><div class="bar"><i style="width:'+v+'%"></i></div>'; }).join("");
  document.title="تقرير "+(r.n||"خُطوة");
  root.innerHTML='<div class="hero"><div class="ring"><svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="rgba(244,241,232,.15)" stroke-width="12"/><circle cx="60" cy="60" r="52" fill="none" stroke="#F2A541" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-p/100)).toFixed(1)+'"/></svg><b>'+Math.round(p)+'%</b></div><div><div class="m">تقرير خُطوة</div><h1>'+esc(r.n||(he?"طالب":"طالبة"))+'</h1><div class="m">'+esc(r.st)+(r.tr?" · "+esc(r.tr):"")+'</div><div class="m">لحد '+nice(r.d)+'</div></div></div>'+
   '<div class="grid" style="margin-top:12px"><div class="st"><b>'+num(w[0],0,1e5)+'</b><span>خطوات في آخر 7 أيام</span></div><div class="st"><b>'+num(w[2],0,7)+' / 7</b><span>أيام '+(he?"ذاكر":"ذاكرت")+' فيها</span></div><div class="st"><b>'+fm(num(w[1],0,1e6))+'</b><span>وقت مذاكرة بالمؤقت</span></div><div class="st"><b>🔥 '+num(r.k,0,5000)+'</b><span>يوم ورا بعض</span></div>'+(a[0]!==null&&a[0]!==undefined?'<div class="st"><b>'+num(a[0],0,100)+'%</b><span>حضور المدرسة</span></div>':'')+'<div class="st"><b>🏅 '+num(r.b,0,500)+'</b><span>وسام</span></div></div>'+
   (r.x&&r.x[0]?'<div class="card"><h2>📌 الامتحان الجاي</h2>'+esc(r.x[0])+' · '+nice(r.x[1])+'</div>':'')+
   '<div class="card"><h2>📚 المواد</h2>'+subs+'</div>'+
   '<a class="cta" href="./">جرّب خُطوة</a><div class="foot">النسب محسوبة بخطوات الدروس الأربعة: سماع، فهم، حل، مراجعة.<br>التقرير ده جوه اللينك نفسه، ومش متخزن على أي سيرفر.<br>Created by <b>Add Value</b></div>';
  }
})();
</script>
</body>
</html>
