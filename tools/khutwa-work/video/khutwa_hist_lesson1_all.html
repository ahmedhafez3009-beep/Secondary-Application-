<script id="boards" type="application/json">{"A": "<!doctype html><html lang=\"ar\" dir=\"rtl\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>خُطوة · تاريخ · السبورة A (v7)<\/title>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@500;700&display=swap\">\n<style>\n*{box-sizing:border-box}body{margin:0;background:#0b1620;color:#e8eef0;font-family:Cairo,Tahoma,sans-serif}\n#wrap{max-width:1280px;margin:0 auto;padding:8px}\n#stage{position:relative;width:100%;aspect-ratio:16/9;background:#FCFCFA;border-radius:10px;overflow:hidden;user-select:none}\n#stage svg{position:absolute;inset:0;width:100%;height:100%}\n#world text{font-family:Lalezar,Cairo,Tahoma,sans-serif}\n#bar{position:absolute;inset:auto 0 0 0;height:12%;background:#0E2A47;display:flex;align-items:center;gap:1.2%;padding:0 2%;font-size:clamp(11px,2.1vw,26px);font-weight:700;color:#fff}\n#who{background:#1EA05F;border-radius:999px;padding:.1em .8em;font-size:.72em;white-space:nowrap}\n#sub{flex:1;min-width:0;line-height:1.35}#sub .w{color:#7f93a8}#sub .w.on{color:#fff}#sub .w.cur{color:#F5BE32}#sub .pz{font-size:.6em;border:1px dashed #7f93a8;border-radius:4px;padding:0 .35em;color:#7f93a8;white-space:nowrap}#sub .pz.cur{color:#fff;background:#D7463C;border-color:#D7463C}\n#cd{position:absolute;inset:0 0 12% 0;display:grid;place-items:center;font:400 22vw Lalezar,sans-serif;color:#D7463C;background:rgba(252,252,250,.6)}#cd[hidden]{display:none}#msg{color:#F5BE32;font-size:13px;width:100%}#src{font-size:.6em;color:#F5BE32;white-space:nowrap;font-weight:500}\n#badge{position:absolute;top:2.2%;right:1.6%;display:flex;align-items:center;gap:.5em;font-size:clamp(9px,1.5vw,19px);color:#0E2A47;font-weight:700;line-height:1.15}\n#badge i{width:2.4em;height:2.4em;border-radius:50%;border:.22em solid #1EA05F;display:grid;place-items:center;font-style:normal;font-family:Lalezar;font-size:1.2em;background:#fff}\n#badge b{display:block}#badge span span{color:#C99A1B;font-size:.85em}\n#sl{position:absolute;top:2.2%;left:1.6%;background:#0E2A47;color:#fff;border-radius:8px;padding:.15em .7em;font-size:clamp(9px,1.4vw,18px);font-weight:700}\n#ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;font-size:14px}\n#ctl button,#ctl label{background:#16212c;color:#e8eef0;border:1px solid #2a3945;border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}\n#ctl button[aria-pressed=true]{background:#1EA05F;border-color:#1EA05F}#seek{flex:1;min-width:140px}#tm{font-variant-numeric:tabular-nums}\n#note{color:#9aa9ad;font-size:13px;margin:8px 2px;line-height:1.7}\nbody.rec #ctl,body.rec #note{display:none}body.rec #wrap{max-width:none;padding:0}body.rec #stage{border-radius:0}\n@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}.blink{transform-box:fill-box;transform-origin:center;animation:blink 3.4s infinite}\n<\/style><\/head><body><div id=\"wrap\">\n<div id=\"stage\">\n <svg id=\"world\" viewBox=\"0 0 3200 1800\" preserveAspectRatio=\"xMidYMin slice\"><defs><pattern id=\"dots\" width=\"48\" height=\"48\" patternUnits=\"userSpaceOnUse\"><circle cx=\"24\" cy=\"24\" r=\"2\" fill=\"#d9dcd8\"/><\/pattern><\/defs><rect y=\"-1800\" width=\"3200\" height=\"3600\" fill=\"#FCFCFA\"/><rect y=\"-1800\" width=\"3200\" height=\"3600\" fill=\"url(#dots)\"/><g id=\"L\"><\/g><\/svg>\n <svg id=\"ov\" viewBox=\"0 0 1280 720\"><g id=\"pen\" visibility=\"hidden\"><g transform=\"rotate(28)\"><path d=\"M0,0 L-7,-22 L7,-22 Z\" fill=\"#e9d9b0\" stroke=\"#0E2A47\" stroke-width=\"1.5\"/><rect x=\"-7\" y=\"-112\" width=\"14\" height=\"90\" fill=\"#0E2A47\"/><rect x=\"-7\" y=\"-40\" width=\"14\" height=\"9\" fill=\"#1EA05F\"/><rect x=\"-8\" y=\"-128\" width=\"16\" height=\"18\" rx=\"3\" fill=\"#1EA05F\"/><\/g><\/g><\/svg>\n <div id=\"badge\"><i>أ<\/i><span><b>أحمد الألفي<\/b><span>خُطوة من Add Value<\/span><\/span><\/div><div id=\"sl\"><\/div>\n <div id=\"cd\" hidden><\/div><div id=\"bar\"><span id=\"who\">أحمد<\/span><span id=\"sub\"><\/span><span id=\"src\"><\/span><\/div>\n<\/div>\n<div id=\"ctl\">\n <button id=\"play\">▶ تشغيل<\/button><button id=\"re\">↺ إعادة<\/button><input id=\"seek\" type=\"range\" min=\"0\" max=\"1000\" value=\"0\"><span id=\"tm\">0:00<\/span>\n <button id=\"rec\" style=\"background:#D7463C;border-color:#D7463C\">● سجّل الشريحة (عدّ ٣)<\/button><label style=\"cursor:default\">السرعة <input id=\"spd\" type=\"range\" min=\"0.7\" max=\"1.4\" step=\"0.05\" value=\"1\" style=\"vertical-align:middle\"> <span id=\"spdv\">100%<\/span><\/label>\n <button id=\"prev\">→ الشريحة اللي قبل<\/button><button id=\"next\">الشريحة الجاية ←<\/button>\n <button id=\"mode\" aria-pressed=\"false\">وضع الشرايح<\/button><button id=\"snd\" aria-pressed=\"true\">الصوت<\/button>\n <label>ارفع فويس الشريحة دي <input id=\"af\" type=\"file\" accept=\"audio/*\" hidden><\/label><button id=\"sync\">ظبط التوقيت على صوتي<\/button><button id=\"tap\" style=\"background:#1EA05F;border-color:#1EA05F\">جملة (Enter)<\/button><button id=\"cp\">انسخ كود التوقيت<\/button><span id=\"msg\"><\/span><button id=\"recm\">وضع تسجيل الشاشة<\/button><button id=\"fs\">ملء الشاشة<\/button>\n<\/div>\n<p id=\"note\">نسخة v7 · الافتتاحية A0 + الشرايح A1–A3 (السكريبت v3 + تبسيط v4). <b>التسجيل:<\/b> دوس «سجّل الشريحة»، هيعدّ ٣ وبعدين الكلام يتعلّم كلمة كلمة تحت وإنت بتقرا، والرسم ماشي معاه (ظبّط السرعة على كلامك). <b>بعد التسجيل:<\/b> ارفع فويس الشريحة، دوس «ظبط التوقيت على صوتي»، ودوس Enter أول ما تسمع بداية كل جملة؛ الرسم هيتشدّ على صوتك. شغّل واتأكد، وبعدين «انسخ كود التوقيت» وابعتهولي أثبّته. في «وضع الشرايح»: دوسة على شمال الشاشة للشريحة الجاية وعلى اليمين للي قبلها، والمسافة للتشغيل، والعرض بيقف آخر كل شريحة. للخروج من وضع تسجيل الشاشة دوس Esc.<\/p>\n<\/div>\n<script>\nconst G='#1EA05F',GD='#106942',N='#0E2A47',R='#D7463C',Y='#F5BE32',YD='#C99A1B',SAND='#F3E3B5',GR='#666';\nconst CW=1066,CH=600,NS='http://www.w3.org/2000/svg';\nconst OS=1.35;let CUR=[],LASTW=null,IT=[],LINES=[],CAM=[[0,1067,-1200,CW,CH]],SL=[],SFX=[],T0=0,ox=0,oy=0,LD=0;\nconst sm=p=>{p=Math.max(0,Math.min(1,p));return p*p*(3-2*p)};\nfunction cell(c,r){ox=(2-c)*CW;oy=r*CH}\nfunction camTo(o,x,y,w,h,d=1.2){const t=T0+o,l=CAM[CAM.length-1];CAM.push([t,l[1],l[2],l[3],l[4]],[t+d,x,y,w,h]);SFX.push({t,k:'whoosh'})}\nfunction go(c,r){cell(c,r);camTo(0,ox,oy,CW,CH)}\nfunction line(id,src,txt,fn){const words=txt.replace(/\\[\\[[\\d.]+\\]\\]/g,'').trim().split(/\\s+/).length;let pz=0;txt.replace(/\\[\\[([\\d.]+)\\]\\]/g,(m,v)=>pz+=+v);\n LD=words*0.58+pz+0.45;let cu=0;const tk=txt.trim().split(/\\s+/).filter(Boolean).map(w=>{const m=w.match(/^\\[\\[([\\d.]+)\\]\\]$/),d=m?+m[1]:.58,o={w,p:!!m,v:m&&m[1],s:cu,e:cu+d};cu+=d;return o});\n CUR=tk;LINES.push({id,src,tk,t:T0,d:LD,txt:txt.replace(/\\s*\\[\\[[\\d.]+\\]\\]\\s*/g,' ').trim()});fn&&fn();T0+=LD}\n/* at('كلمة'[,n]) = وقت بداية أول (أو رقم n) كلمة فيها النص ده في السطر الحالي؛ استخدمها كـ offset لأي عنصر */\nfunction at(sub,n){let c=0;for(const k of CUR){if(!k.p&&k.w.includes(sub)){if(c==(n||0))return k.s/OS;c++}}throw new Error('at: «'+sub+'» مش في السطر: '+CUR.map(k=>k.w).join(' '))}\nfunction slide(name){SL.push({t:T0,name})}\nfunction W(o,x,y,txt,sz,col,a){IT.push(LASTW={k:'w',t:T0+o*OS,x:ox+x,y:oy+y,txt,sz,col,a:a||'end',d:Math.min(1.4,.06*txt.length+.3),cx:ox,cy:oy})}\nfunction P(o,d,col,w,dur,fill,cls){IT.push({k:'p',t:T0+o*OS,tx:ox,ty:oy,dd:d,col,w:w||3,d:dur||.8,fill,cls})}\nfunction ST(o,x,y,ok){IT.push({k:'s',t:T0+o*OS,x:ox+x,y:oy+y,ok,d:.5});SFX.push({t:T0+o*OS,k:ok?'chime':'tick'})}\nfunction Q(o,x,y,dur){o*=OS;IT.push({k:'q',t:T0+o,x:ox+x,y:oy+y,d:dur<3?dur:LD-o});SFX.push({t:T0+o,k:'tick'},{t:T0+o+1,k:'tick'},{t:T0+o+2,k:'tick'})}\nfunction AR(o,x1,y,x2){P(o,`M${x1},${y} H${x2} M${x2},${y} l14,-9 M${x2},${y} l14,9`,N,3,.4)}\nfunction CARD(o,x,y,w,h,col,fill){P(o,`M${x},${y} h${w} v${h} h${-w} Z`,col,3,.7,fill||'#fff');SFX.push({t:T0+o*OS,k:'chime'})}\nfunction BOOM(o){SFX.push({t:T0 . كل فرع وحدة، وكل وحدة فيها أربع دروس.\", \"الفرع الأول: مصر من زمان لحد النهارده. واسمه في الكتاب «مصر بين الماضي والحاضر».\", \"هنعرف الدولة المصرية اتبنت إزاي، وكمّلت إزاي. وبعدها الدولة المصرية القديمة ومقاومة الاحتلال.\", \"وبعدين التحولات الكبرى في مصر: مرة في العصر الوسيط، ومرة في العصر الحديث. [[0.5]]\", \"الفرع التاني: القوة لما تتغيّر، والوعي لما يتبني. ده في العصر الحديث والمعاصر.\", \"هنحكي عن سياسات الاحتلال في مصر. وعن صمود الشعب المصري ومقاومته.\", \"وعن ثورة تلاتة وعشرين يوليو والتحولات الكبرى. وعن الهوية الوطنية قصاد الاستعمار الجديد. [[0.5]]\", \"الفرع التالت: هنطلع برّه حدودنا شوية. للوطن العربي وإفريقيا، وقضايا التحرر الوطني فيهم.\", \"حركات التحرر في العالم العربي ضد الاحتلال الفرنسي والإيطالي. وبعدها ضد البريطاني والإسباني.\", \"وبعدين دور مصر: واقف على إيه، إقليميًا ودوليًا. ودعمت حركات التحرر إزاي. [[1.0]]\", \"لسه معايا؟ [[0.5]] حلو. ده كان الجزء الأول من الكتاب. نقلب الصفحة.\", \"الفرع الرابع: هنا الحكاية بتكبر وتبقى حكاية العالم كله. حربين عالميتين، والنظام الدولي بيتغيّر.\", \"مقدمات الحرب الأولى، ومعاركها الكبرى. ومقدمات الحرب التانية. وبعدها من الحرب التانية للحرب الباردة. [[0.5]]\", \"الفرع الخامس: مصر والقضية الفلسطينية. القضية والتحولات الدولية لحد سنة ألف وتسعمية تمانية وأربعين.\", \"ومصر والصراع العربي الإسرائيلي. وحرب أكتوبر تلاتة وسبعين، ملحمة العبور والنصر. ومصر والقضية بعد الحرب. [[0.5]]\", \"والفرع السادس والأخير: السلام. اللي موجود فعلًا، واللي بنتمناه.\", \"يعني إيه سلام عالمي، واتطوّر إزاي. وإيه التحديات اللي قدامه.\", \"والمنظمات الدولية والإقليمية ودورها في حفظه. ودور مصر في دعمه. [[1.0]]\", \"شايف؟ ست فروع، وأربعة وعشرين درس، وحكاية واحدة.\", \"وكل ما نبدأ درس، هرجّعلك الخريطة دي وأقولك: إنت هنا.\", \"دلوقتي قرّب معايا على الفرع الأول. [[0.5]] أول ورقة فيه: «بناء الدولة المصرية واستمرارها عبر التاريخ».\", \"ده درس الأساس. فيه كلمات كبيرة زي دولة، وسلطة، وسيادة. شكلها يخوّف، صح؟\", \"ما تقلقش. هنفكّها كلمة كلمة، وبالبلدي. [[0.5]] وأول الحكاية، سؤال.\"];const a0=(i,fn)=>line('A0.'+i,i>=6&&i<=22?'فهرس الكتاب':'',A0[i-1],fn t:T0+(o+k/OS)*OS,k:'tick'})}}\n\n/*__CONTENT_START__*/\nconst S={\"A4.0a\": \"إنت هنا: عرفنا الدولة وشعبها. [[0.5]] فاضل: حدودها فين؟\", \"A4.1\": \"تخيّل ملعب كورة. الخطوط بتحدده، وصفّارة الحكم ماشية جوّاه بس.\", \"A4.2\": \"وده تاني ركن: الحيز الجغرافي. والكتاب بيعرّفه:\", \"A4.3\": \"«الرقعة المحددة التي تمارس الدولة سيادتها عليها».\", \"A4.3a\": \"يعني مساحة حدودها معروفة، وقرار الدولة ماشي عليها. [[0.5]] وفيها تلات حاجات:\", \"A4.4\": \"اليابس، والمياه الإقليمية، والمجال الجوي. [[0.5]] يعني تحت رجلك أرض، قدامك بحر، وفوقك سما.\", \"A4.4a\": \"وخد بالك، مفيش دولة من غير حدود محددة معترف بيها. يعني الدول التانية مقرّة بيها.\", \"A4.5\": \"اليابس هو «المساحة الأرضية التي يعيش عليها السكان»، جوّه الحدود السياسية للدولة، يعني خطوطها الرسمية.\", \"A4.5a\": \"دايرة العرض خط نايم على الخريطة، وخط الطول خط واقف.\", \"A4.6\": \"وحدوده أربعة، بترتيب الكتاب:\", \"A4.7\": \"واحد، الحد الجنوبي: دائرة عرض اتنين وعشرين شمالًا، وبتفصلنا عن السودان، واترسمت سنة ألف وتمنمية وتسعة وتسعين.\", \"A4.8\": \"والحد الشمالي إيه؟ [[1.0]] اتنين: ساحل البحر المتوسط.\", \"A4.9\": \"تلاتة، الحد الشرقي: ساحل البحر الأحمر وخليج العقبة، والحد البري مع فلسطين، اترسم سنة ألف وتسعمية وستة.\", \"A4.10\": \"أربعة، الحد الغربي: خط طول خمسة وعشرين شرقًا، وبيفصلنا عن ليبيا، واترسم سنة ألف وتسعمية وخمسة وعشرين.\", \"A4.11\": \"والبحر؟ المياه الإقليمية «المساحات البحرية» اللي بتمتد عادةً اتناشر ميل بحري من خط الأساس للساحل.\", \"A4.11a\": \"والميل البحري مقياس لمسافات البحر. [[0.5]] يعني شريط بحر، زي الرصيف قدام بيتكم.\", \"A4.12\": \"ولو حد طيّر درون فوق بيتكم من غير إذن؟ هتعترضوا. والدولة كمان.\", \"A4.13\": \"ده المجال الجوي: «المساحة الرأسية التي تعلو الحيز الجغرافي للدولة». يعني طالعة لفوق. والدولة بتمارس سيادتها عليه.\", \"A4.14\": \"عشان كده مفيش طيارة تدخل المجال الجوي المصري من غير تصريح رسمي. وده فيه ركنين:\", \"A4.15\": \"الحيز الجغرافي، لأن السما جزء منه، والسيادة، لأن الدولة هي اللي بتسمح.\", \"A4.16\": \"ونفس الفكرة في قناة السويس، الدولة بتحميها وبتراقب السفن العابرة.\", \"A4.17\": \"ودي أدلتك في «دلّل»: الدولة كيان متكامل، أرض وبحر وسما، مش مجرد أرض.\", \"A4.18\": \"ووحدة الأرض أساس قيام الدولة، والحدود «رمز لوحدة الوطن واستقراره».\", \"A5.1\": \"اختبر نفسك قبل ما نراجع: الدولة أركانها كام؟ [[1.0]] أربعة: شعب، وحيز جغرافي، وسلطة، وسيادة.\", \"A5.2\": \"والشعب مصدر السلطات، وليه خمس أدوار.\", \"A5.3\": \"والحيز: يابس، ومياه إقليمية اتناشر ميل، ومجال جوي.\", \"A5.4\": \"والحدود: الجنوب دائرة عرض اتنين وعشرين شمالًا، والغرب خط طول خمسة وعشرين شرقًا،\", \"A5.5\": \"والشمال المتوسط، والشرق البحر الأحمر وخليج العقبة والحد مع فلسطين.\", \"A5.6\": \"وده أول جزء في إجابة سؤالنا: الدولة اللي بتعيش ليها شعب واعي، وحدود معترف بيها.\", \"A5.7\": \"الفصل الجاي: مين بيعمل القوانين؟ وإمتى يبقى قرار الدولة بإيدها؟\", \"R1\": \"دقيقة مراجعة. غمّض، وجاوب قبلي.\", \"R2\": \"الدولة أركانها كام، وإيه هم؟ [[2.0]] أربعة: شعب، وحيز جغرافي، وسلطة، وسيادة.\", \"R3\": \"الشعب مين؟ [[2.0]] كل حاملي الجنسية، جوّه مصر وبرّاها.\", \"R4\": \"مادة كام بتقول الشعب مصدر السلطات؟ [[2.0]] المادة الرابعة.\", \"R5\": \"أدوار الشعب الخمسة، على صوابعك؟ [[2.0]] سياسية، وأمن، وتنمية، وهوية، ودفاع.\", \"R6\": \"الحيز فيه إيه؟ [[2.0]] يابس، ومياه إقليمية، ومجال جوي.\", \"R7\": \"المياه الإقليمية كام ميل؟ [[2.0]] اتناشر ميل بحري.\", \"R8\": \"والحد الجنوبي والغربي؟ [[2.0]] دائرة عرض اتنين وعشرين شمالًا، وخط طول خمسة وعشرين شرقًا.\", \"R9\": \"سمّعهم تاني بكرة، وبعد أسبوع.\"};\n/* ============ السبورة A45: الشرايح A4–A5 + دقيقة المراجعة ============ */\nconst BLU='#3E8FCF',BRN='#B8860B',SKY='#DCEEFB',PUR='#8E44AD',CREAM='#FBF3DC';\n/* خريطة مصر (وحدة 400×300): الحد الغربي، ساحل المتوسط، الحد البري الشرقي، خليج العقبة، خليج السويس، ساحل البحر الأحمر، الحد الجنوبي */\nconst EGU={W:[[0,300],[0,6]],N:[[0,6],[40,12],[74,8],[131,25],[165,12],[181,5],[205,0],[228,3],[245,10],[280,16],[309,9]],E:[[309,9],[333,66]],AQ:[[333,66],[311,122]],SG:[[311,122],[290,95],[252,52]],RS:[[252,52],[262,80],[296,136],[345,215],[400,300]],\n NL:[[212,300],[240,262],[265,234],[262,200],[259,169],[242,173],[225,150],[208,137 origin:center;animation:blink 3.4s infinite}\n<\/style><\/head><body><div id=\"wrap\">\n<div id=\"stage\">\n <svg id=\"world\" viewBox=\"0 0 3200 1800\" preserveAspectRatio=\"xMidYMin slice\"><defs><pattern id=\"dots\" width=\"48\" height=\"48\" patternUnits=\"userSpaceOnUse\"><circle cx=\"24\" cy=\"24\" r=\"2\" fill=\"#d9dcd8\"/><\/pattern><\/defs><rect x=\"-2400\" y=\"-1800\" width=\"8000\" height=\"6000\" fill=\"#FCFCFA\"/><rect x=\"-2400\" y=\"-1800\" width=\"8000\" height=\"6000\" fill=\"url(#dots)\"/><g id=\"L\"><\/g><\/svg>\n <svg id=\"ov\" viewBox=\"0 0 1280 720\"><g id=\"pen\" visibility=\"hidden\"><g transform=\"rotate(28)\"><path d=\"M0,0 L-7,-22 L7,-22 Z\" fill=\"#e9d9b0\" stroke=\"#0E2A47\" stroke-width=\"1.5\"/><rect x=\"-7\" y=\"-112\" width=\"14\" height=\"90\" fill=\"#0E2A47\"/><rect x=\"-7\" y=\"-40\" width=\"14\" height=\"9\" fill=\"#1EA05F\"/><rect x=\"-8\" y=\"-128\" width=\"16\" height=\"18\" rx=\"3\" fill=\"#1EA05F\"/><\/g><\/g><\/svg>\n <div id=\"badge\"><i>أ<\/i><span><b>أحمد الألفي<\/b><span>خُطوة من Add Value<\/span><\/span><\/div><div id=\"sl\"><\/div>\n <div id=\"cd\" hidden><\/div><div id=\"bar\"><span id=\"who\">أحمد<\/span><span id=\"sub\"><\/span><span id=\"src\"><\/span><\/div>\n<\/div>\n<div id=\"ctl\">\n <button id=\"play\">▶ تشغيل<\/button><button id=\"re\">↺ إعادة<\/button><input id=\"seek\" type=\"range\" min=\"0\" max=\"1000\" value=\"0\"><span id=\"tm\">0:00<\/span>\n <button id=\"rec\" style=\"background:#D7463C;border-color:#D7463C\">● سجّل الشريحة (عدّ ٣)<\/button><label style=\"cursor:default\">السرعة <input id=\"spd\" type=\"range\" min=\"0.7\" max=\"1.4\" step=\"0.05\" value=\"1\" style=\"vertical-align:middle\"> <span id=\"spdv\">100%<\/span><\/label>\n <button id=\"prev\">→ الشريحة اللي قبل<\/button><button id=\"next\">الشريحة الجاية ←<\/button>\n <button id=\"mode\" aria-pressed=\"false\">وضع الشرايح<\/button><button id=\"snd\" aria-pressed=\"true\">الصوت<\/button>\n <label>ارفع فويس الشريحة دي <input id=\"af\" type=\"file\" accept=\"audio/*\" hidden><\/label><button id=\"sync\">ظبط التوقيت على صوتي<\/button><button id=\"tap\" style=\"background:#1EA05F;border-color:#1EA05F\">جملة (Enter)<\/button><button id=\"cp\">انسخ كود التوقيت<\/button><span id=\"msg\"><\/span><button id=\"recm\">وضع تسجيل الشاشة<\/button><button id=\"fs\">ملء الشاشة<\/button>\n<\/div>\n<p id=\"note\">نسخة v1 · السبورة B (الفصل الثاني · الشرايح B1–B6). <b>التسجيل:<\/b> دوس «سجّل الشريحة»، هيعدّ ٣ وبعدين الكلام يتعلّم كلمة كلمة تحت وإنت بتقرا، والرسم ماشي معاه (ظبّط السرعة على كلامك). <b>بعد التسجيل:<\/b> ارفع فويس الشريحة، دوس «ظبط التوقيت على صوتي»، ودوس Enter أول ما تسمع بداية كل جملة؛ الرسم هيتشدّ على صوتك. شغّل واتأكد، وبعدين «انسخ كود التوقيت» وابعتهولي أثبّته. في «وضع الشرايح»: دوسة على شمال الشاشة للشريحة الجاية وعلى اليمين للي قبلها، والمسافة للتشغيل، والعرض بيقف آخر كل شريحة. للخروج من وضع تسجيل الشاشة دوس Esc.<\/p>\n<\/div>\n<script>\nconst G='#1EA05F',GD='#106942',N='#0E2A47',R='#D7463C',Y='#F5BE32',YD='#C99A1B',SAND='#F3E3B5',GR='#666';\nconst CW=1066,CH=600,NS='http://www.w3.org/2000/svg';\nconst OS=1.35;let CUR=[],LASTW=null,IT=[],LINES=[],CAM=[[0,2133,0,CW,CH]],SL=[],SFX=[],T0=0,ox=0,oy=0,LD=0;\nconst sm=p=>{p=Math.max(0,Math.min(1,p));return p*p*(3-2*p)};\nfunction cell(c,r){ox=(2-c)*CW;oy=r*CH}\nfunction camTo(o,x,y,w,h,d=1.2){const t=T0+o,l=CAM[CAM.length-1];CAM.push([t,l[1],l[2],l[3],l[4]],[t+d,x,y,w,h]);SFX.push({t,k:'whoosh'})}\nfunction go(c,r){cell(c,r);camTo(0,ox,oy,CW,CH)}\nfunction line(id,src,txt,fn){const words=txt.replace(/\\[\\[[\\d.]+\\]\\]/g,'').trim().split(/\\s+/).length;let pz=0;txt.replace(/\\[\\[([\\d.]+)\\]\\]/g,(m,v)=>pz+=+v);\n LD=words*0.58+pz+0.45;let cu=0;const tk=txt.trim().split(/\\s+/).filter(Boolean).map(w=>{const m=w.match(/^\\[\\[([\\d.]+)\\]\\]$/),d=m?+m[1]:.58,o={w,p:!!m,v:m&&m[1],s:cu,e:cu+d};cu+=d;return o});\n CUR=tk;LINES.push({id,src,tk,t:T0,d:LD,txt:txt.replace(/\\s*\\[\\[[\\d.]+\\]\\]\\s*/g,' ').trim()});fn&&fn();T0+=LD}\n/* at('كلمة'[,n]) = وقت بداية أول (أو رقم n) كلمة فيها النص ده في السطر الحالي؛ استخدمها كـ offset لأي عنصر */\nfunction at(sub,n){let c=0;for(const k of CUR){if(!k.p&&k.w.includes(sub)){if(c==(n||0))return k.s/OS;c++}}throw new Error('at: «'+sub+'» مش في السطر: '+CUR.map(k=>k.w).join(' '))}\nfunction slide(name){SL.push({t:T0,name})}\nfunction W(o,x,y,txt,sz,col,a){IT.push(LASTW={k:'w',t:T0+o*OS,x:ox+x,y:oy+y,txt,sz,col,a:a||'end',d:Math.min(1.4,.06*txt.length+.3),cx:ox,cy:oy})}\nfunction P(o,d,col,w,dur,fill,cls){IT.push({k:'p',t:T0+o*OS,tx:ox,ty:oy,dd:d,col,w:w||3,d:dur||.8,fill,cls})}\nfunction ST(o,x,y,ok){IT.push({k:'s',t:T0+o*OS,x:ox+x,y:oy+y,ok,d:.5});SFX.push({t:T0+o*OS,k:ok?'chime':'tick'})}\nfunction Q(o,x,y,dur){o*=OS;IT.push({k:'q',t:T0+o,x:ox+x,y:oy+y,d:dur<3?dur:LD-o});SFX.push({t:T0+o,k:'tick'},{t:T0+o+1,k:'tick'},{t:T0+o+2,k:'tick'})}\nfunction AR(o,x1,y,x2){P(o,`M${x1},${y} H${x2} M${x2},${y} l14,-9 M${x2},${y} l14,9`,N,3,.4)}\nfunction CARD(o,x,y,w,h,col,fill){P(o,`M${x},${y} h${w} v${h} h${-w} Z`,col,3,.7,fill||'#fff');SFX.push({t:T0+o*OS,k:'chime'})}\nfunction BOOM(o){SFX.push({t:T0+o,k:'boom'})}\n\n\n/* ---- إضافات v5: تكملة نص على نفس السطر، إخفاء عنصر مؤقت، عدّاد وقفة، أشكال متكررة ---- */\nfunction WC(o,txt,col,gap){const p=LASTW;IT.push(LASTW={k:'w',t:T0+o*OS,x:p.x,y:p.y,txt,sz:p.sz,col:col||p.col,a:'end',d:Math.min(1.4,.06*txt.length+.3),cx:p.cx,cy:p.cy,af:p,gp:gap==null?p.sz*.28:gap})}\nfunction FADE(o,n){for(let i=1;i<=(n||1);i++)IT[IT.length-i].off=T0+o*OS}\nconst atp=n=>CUR.filter(k=>k.p)[n||0].s/OS,EOL=()=>LD/OS;\nconst CI=(x,y,r)=>`M${x-r},${y} a${r},${r} 0 1,0 ${2*r},0 a${r},${r} 0 1,0 ${-2*r},0 `;\nconst EL=(x,y,a,b)=>`M${x-a},${y} a${a},${b} 0 1,0 ${2*a},0 a${a},${b} 0 1,0 ${-2*a},0 `;\nconst MAN=(x,y,h)=>{const r=h*.15,f=v=>(v).toFixed(1);return CI(x,+f(y+r),+f(r))+`M${x},${f(y+2*r)} V${f(y+h*.66)} M${f(x-h*.2)},${f(y+h*.46)} L${x},${f(y+h*.38)} L${f(x+h*.2)},${f(y+h*.46)} M${x},${f(y+h*.66)} l${f(-h*.14)},${f(h*.34)} M${x},${f(y+h*.66)} l${f(h*.14)},${f(h*.34)} `};\nconst KEY=(x,y,s)=>CI(x,y,13*s)+`M${x+13*s},${y} h${48*s} M${x+47*s},${y} v${12*s} M${x+58*s},${y} v${9*s} `;\nconst CHAIR=(x,y)=>`M${x},${y} V${y-78} M${x},${y-38} H${x+46} V${y} `;\nconst BOOK=(x,y)=>`M${x},${y} q-18,-10 -34,0 v30 q16,-10 34,0 q18,-10 34,0 v-30 q-16,-10 -34,0 v30 `;\nfunction CDR(o,x,y,r,n){for(let k=0;k<n;k++){const a0=-Math.PI/2+k*2*Math.PI/n,a1=a0+2*Math.PI/n*.93,p=a=>`${(x+r*Math.cos(a)).toFixed(1)},${(y+r*Math.sin(a)).toFixed(1)}`;P(o+k/OS,`M${p(a0)} A${r},${r} 0 0,1 ${p(a1)}`,R,6,.92);IT[IT.length-1].off=T0+LD-.05;SFX.push({t:T0+(o+k/OS)*OS,k:'tick'})}}\n\n/*__CONTENT_START__ (اكتب محتوى السبورة هنا: slide()/go()/line()...) */\nconst SP={\"B1.1\": \"إنت هنا: خلّصنا ركنين، الشعب والحيز الجغرافي. [[0.5]] ولو داخل على الفصل ده على طول، خد دي:\", \"B1.2\": \"الدولة واقفة على أربع أركان: شعب، وحيز جغرافي، وسلطة، وسيادة.\", \"B1.3\": \"هنا هنكمّل بالسلطة والسيادة، ولو ركن غاب يحصل إيه.\", \"B2.1\": \"خد مدرستك: فيه لايحة بتتكتب، وإدارة بتطبّقها، وحد بيفصل في المشاكل.\", \"B2.2\": \"الدولة بتشتغل بنفس الطريقة. تالت ركن: السلطة، الجهة اللي بتدير. وتعريفها:\", \"B2.3\": \"«المؤسسات التي تدير شئون الدولة وتضع القوانين وتعمل على تنفيذها»، وبتحافظ على الأمن العام.\", \"B2.3a\": \"المؤسسات جهات منظّمة، بتكمّل شغلها حتى لو الأشخاص اتغيّروا. زي مدرستك.\", \"B2.4\": \"والدستور قسّمها تلات سلطات، في أربع مواد، لأن التنفيذية ليها مادتين.\", \"B2.5\": \"الأولى بتعمل القانون، والتانية بتنفّذه، والتالتة بتحكم بيه.\", \"B2.6\": \"تفتكر مين بيعمل القوانين؟ [[1.0]] مجلس النواب، اللي الشعب اختارهم! ودي السلطة التشريعية.\", \"B2.7\": \"والمادة مية وواحد: مجلس النواب «يتولى سلطة التشريع»، وبيقرّ السياسة العامة والموازنة.\", \"B2.7a\": \"بيقرّ يعني بيوافق. والموازنة خطة فلوس الدولة، زي مصروفك لما تقسّمه.\", \"B2.8\": \"وكمان «يمارس الرقابة على أعمال السلطة التنفيذية».\", \"B2.8a\": \"الرقابة يعني يتابع ويحاسب. زي حكم الفيديو لما يراجع القرار.\", \"B2.9\": \"السلطة التانية، التنفيذية. المادة مية تسعة وتلاتين: رئيس الجمهورية «رئيس الدولة ورئيس السلطة التنفيذية».\", \"B2.10\": \"والمادة مية تلاتة وستين: الحكومة «الهيئة التنفيذية والإدارية العليا للدولة».\", \"B2.10a\": \"يعني أعلى جهة بتنفّذ، وبتدير الشغل اليومي.\", \"B2.11\": \"السلطة التالتة: القضائية. والمادة مية أربعة وتمانين: «السلطة القضائية مستقلة».\", \"B2.11a\": \"مستقلة يعني محدش بيتدخّل في حكمها. زي الحكم في الماتش.\", \"B2.12\": \"بتتولاها المحاكم بكل أنواعها ودرجاتها، وبتصدر أحكامها حسب القانون.\", \"B2.13\": \"وقّف وخمّن: الموازنة العامة للدولة، مين بيقرّها؟ [[3.0]]\", \"B2.14\": \"مجلس النواب، يعني السلطة التشريعية.\", \"B3.1\": \"والعلاقة بينهم؟ التشريعية بتراقب التنفيذية، والقضائية مستقلة، وكلهم ماشيين حسب الدستور.\", \"B3.2\": \"وعشان كده «استقرار الدولة مرتبط بقوة مؤسساتها وتنظيمها».\", \"B3.3\": \"طب السلطة مهمة ليه؟ فيه أربع أسباب، احفظهم:\", \"B3.4\": \"واحد، تحفظ النظام والقانون. اتنين، تحقق الاستقرار السياسي والاجتماعي.\", \"B3.5\": \"تلاتة، تحمي حقوق المواطنين. أربعة، تمكّن الدولة من ممارسة سيادتها. يعني تخلّيها تقدر.\", \"B4.1\": \"ينفع حد من برّه البيت يقرر إنتو هتصرفوا فلوسكم في إيه؟\", \"B4.2\": \"لأ. وده المفتاح اللي قلنا عليه. رابع ركن: السيادة. وتعريفها:\", \"B4.3\": \"«استقلال الدولة في اتخاذ قراراتها فيما يتعلق بشئونها الداخلية والخارجية» [[0.5]] «من دون خضوع لسلطة خارجية».\", \"B4.3a\": \"يعني قرارها بإيدها، جوّه وبرّه، ومحدش بيمليه عليها.\", \"B4.4\": \"والسيادة ليها نوعين. داخلية، يعني جوّه البيت: الدولة بتحط قوانينها، وبتحفظ أمنها، وبتدير شئون مواطنيها،\", \"B4.5\": \"من غير أي ضغوط من برّه.\", \"B4.6\": \"وخارجية، يعني مع باقي الدول: مستقلة في علاقاتها الدولية، وبتمضي معاهداتها، وبتعمل علاقات دبلوماسية،\", \"B4.7\": \"وبتحمي مصالحها، وليها تمثيل في المنظمات الدولية.\", \"B4.7a\": \"المعاهدة اتفاق رسمي مكتوب بين دول. والدبلوماسية كلامهم الرسمي مع بعض.\", \"B4.8\": \"يعني بالبلدي: السلطة بتدير، والسيادة إن قرار الدولة ما يتفرضش عليها.\", \"B4.9\": \"والعلاقة بينهم إن السلطة هي اللي بتمكّن الدولة تمارس سيادتها.\", \"B4.10\": \"وفاكر المادة الرابعة؟ [[1.0]] الشعب مصدر السلطات، والدولة بسلطاتها بتمارس السيادة.\", \"B4.11\": \"ومثال لسعي مصر لاستقلال قرارها، من التاريخ الحديث: ثورة ألف وتسعمية وتسعتاشر.\", \"B4.12\": \"والأمثلة القديمة هتقابلها في الدرس الجاي.\", \"B5.1\": \"هات كرسي بأربع رجول، وشيل رجل واحدة. [[2.0]]\", \"B5.2\": \"الكرسي هيميل، ويبقى مهدد يقع. وأركان الدولة كده بالظبط، مترابطة،\", \"B5.3\": \"و«إذا اختل أحدها تأثّر كيان الدولة بأكمله».\", \"B5.4\": \"من غير شعب، مفيش مين يشارك ويبني. ولو مش واعي، الدولة بتضعف.\", \"B5.5\": \"ومن غير حدود محددة معترف بيها، مفيش دولة أصلًا.\", \"B5.6\": \"ومن غير سلطة، يضيع النظام والقانون، وحقوق المواطنين ما تلاقيش حماية.\", \"B5.7\": \"ومن غير سيادة، الدولة ما تقدرش تاخد قرارها بنفسها.\", \"B6.1\": \"نراجع. فاكر كام سلطة؟ [[1.0]] تلاتة: تشريعية، وتنفيذية، وقضائية.\", \"B6.2\": \"وأهمية السلطة في أربع حاجات: النظام والقانون، والاستقرار، والحقوق، وتمكين السيادة.\", \"B6.3\": \"والسيادة: استقلال قرار الدولة، وليها نوعين: داخلية وخارجية.\", \"B6.4\": \"ولو ركن اختل، الدولة كلها بتتأثر.\", \"B6.5\": \"وده تاني جزء في الإجابة: الدولة اللي بتعيش ليها سلطة بتحفظ النظام، وقرار مستقل.\", \"B6.6\": \"طب إيه اللي خلّى مصر بالذات تستمر آلاف السنين؟ ده الفصل الجاي.\", \"RB1\": \"دقيقة مراجعة. غمّض، وجاوب قبلي.\", \"RB2\": \"السلطة تعريفها إيه؟ [[2.0]] «المؤسسات التي تدير شئون الدولة وتضع القوانين وتعمل على تنفيذها».\", \"RB3\": \"السلطات كام، وكل واحدة بتعمل إيه؟ [[2.0]] تلاتة: تشريعية تعمل القانون، وتنفيذية تنفّذه، وقضائية تحكم بيه.\", \"RB4\": \"مواد الدستور الأربعة بالترتيب؟ [[2.0]] مية وواحد، مية تسعة وتلاتين، مية تلاتة وستين، مية أربعة وتمانين.\", \"RB5\": \"أهمية السلطة، بكلمة «ناحت»؟ [[2.0]] نظام وقانون، واستقرار، وحقوق المواطنين، وتمكين السيادة.\", \"RB6\": \"السيادة يعني إيه، ونوعيها؟ [[2.0]] استقلال قرار الدولة، من غير خضوع لسلطة خارجية. وهي داخلية وخارجية.\", \"RB7\": \"ولو ركن اختل؟ [[2.0]] الدولة كلها بتتأثر.\", \"RB8\": \"سمّعهم تاني بكرة، وبعد أسبوع.\", \"B2.3m\": \"المبنى، فالمكتب، فاللايحة، فالجرس، وترباس على البوابة.\", \"B2.8m\": \"مجلس النواب في كلمة: تسمّر. تشريع، سياسة، موازنة، رقابة.\", \"B3.5m\": \"أهمية السلطة في كلمة: ناحت. نظام، استق und:#1EA05F;border-color:#1EA05F\">جملة (Enter)<\/button><button id=\"cp\">انسخ كود التوقيت<\/button><span id=\"msg\"><\/span><button id=\"recm\">وضع تسجيل الشاشة<\/button><button id=\"fs\">ملء الشاشة<\/button>\n<\/div>\n<p id=\"note\">نسخة v1 · السبورة C (الفصل الثالث · الشرايح C1–C4). <b>التسجيل:<\/b> دوس «سجّل الشريحة»، هيعدّ ٣ وبعدين الكلام يتعلّم كلمة كلمة تحت وإنت بتقرا، والرسم ماشي معاه (ظبّط السرعة على كلامك). <b>بعد التسجيل:<\/b> ارفع فويس الشريحة، دوس «ظبط التوقيت على صوتي»، ودوس Enter أول ما تسمع بداية كل جملة؛ الرسم هيتشدّ على صوتك. شغّل واتأكد، وبعدين «انسخ كود التوقيت» وابعتهولي أثبّته. في «وضع الشرايح»: دوسة على شمال الشاشة للشريحة الجاية وعلى اليمين للي قبلها، والمسافة للتشغيل، والعرض بيقف آخر كل شريحة. للخروج من وضع تسجيل الشاشة دوس Esc.<\/p>\n<\/div>\n<script>\nconst G='#1EA05F',GD='#106942',N='#0E2A47',R='#D7463C',Y='#F5BE32',YD='#C99A1B',SAND='#F3E3B5',GR='#666';\nconst CW=1066,CH=600,NS='http://www.w3.org/2000/svg';\nconst OS=1.35;let CUR=[],LASTW=null,IT=[],LINES=[],CAM=[[0,2133,0,CW,CH]],SL=[],SFX=[],T0=0,ox=0,oy=0,LD=0;\nconst sm=p=>{p=Math.max(0,Math.min(1,p));return p*p*(3-2*p)};\nfunction cell(c,r){ox=(2-c)*CW;oy=r*CH}\nfunction camTo(o,x,y,w,h,d=1.2){const t=T0+o,l=CAM[CAM.length-1];CAM.push([t,l[1],l[2],l[3],l[4]],[t+d,x,y,w,h]);SFX.push({t,k:'whoosh'})}\nfunction go(c,r){cell(c,r);camTo(0,ox,oy,CW,CH)}\nfunction line(id,src,txt,fn){const words=txt.replace(/\\[\\[[\\d.]+\\]\\]/g,'').trim().split(/\\s+/).length;let pz=0;txt.replace(/\\[\\[([\\d.]+)\\]\\]/g,(m,v)=>pz+=+v);\n LD=words*0.58+pz+0.45;let cu=0;const tk=txt.trim().split(/\\s+/).filter(Boolean).map(w=>{const m=w.match(/^\\[\\[([\\d.]+)\\]\\]$/),d=m?+m[1]:.58,o={w,p:!!m,v:m&&m[1],s:cu,e:cu+d};cu+=d;return o});\n CUR=tk;LINES.push({id,src,tk,t:T0,d:LD,txt:txt.replace(/\\s*\\[\\[[\\d.]+\\]\\]\\s*/g,' ').trim()});fn&&fn();T0+=LD}\n/* at('كلمة'[,n]) = وقت بداية أول (أو رقم n) كلمة فيها النص ده في السطر الحالي؛ استخدمها كـ offset لأي عنصر */\nfunction at(sub,n){let c=0;for(const k of CUR){if(!k.p&&k.w.includes(sub)){if(c==(n||0))return k.s/OS;c++}}throw new Error('at: «'+sub+'» مش في السطر: '+CUR.map(k=>k.w).join(' '))}\nfunction slide(name){SL.push({t:T0,name})}\nfunction W(o,x,y,txt,sz,col,a){IT.push(LASTW={k:'w',t:T0+o*OS,x:ox+x,y:oy+y,txt,sz,col,a:a||'end',d:Math.min(1.4,.06*txt.length+.3),cx:ox,cy:oy})}\nfunction P(o,d,col,w,dur,fill,cls){IT.push({k:'p',t:T0+o*OS,tx:ox,ty:oy,dd:d,col,w:w||3,d:dur||.8,fill,cls})}\nfunction ST(o,x,y,ok){IT.push({k:'s',t:T0+o*OS,x:ox+x,y:oy+y,ok,d:.5});SFX.push({t:T0+o*OS,k:ok?'chime':'tick'})}\nfunction Q(o,x,y,dur){o*=OS;IT.push({k:'q',t:T0+o,x:ox+x,y:oy+y,d:dur<3?dur:LD-o});SFX.push({t:T0+o,k:'tick'},{t:T0+o+1,k:'tick'},{t:T0+o+2,k:'tick'})}\nfunction AR(o,x1,y,x2){P(o,`M${x1},${y} H${x2} M${x2},${y} l14,-9 M${x2},${y} l14,9`,N,3,.4)}\nfunction CARD(o,x,y,w,h,col,fill){P(o,`M${x},${y} h${w} v${h} h${-w} Z`,col,3,.7,fill||'#fff');SFX.push({t:T0+o*OS,k:'chime'})}\nfunction BOOM(o){SFX.push({t:T0+o,k:'boom'})}\n\n\n/* ---- إضافات v5: تكملة نص على نفس السطر، إخفاء عنصر مؤقت، عدّاد وقفة، أشكال متكررة ---- */\nfunction WC(o,txt,col,gap){const p=LASTW;IT.push(LASTW={k:'w',t:T0+o*OS,x:p.x,y:p.y,txt,sz:p.sz,col:col||p.col,a:'end',d:Math.min(1.4,.06*txt.length+.3),cx:p.cx,cy:p.cy,af:p,gp:gap==null?p.sz*.28:gap})}\nfunction FADE(o,n){for(let i=1;i<=(n||1);i++)IT[IT.length-i].off=T0+o*OS}\nconst atp=n=>CUR.filter(k=>k.p)[n||0].s/OS,EOL=()=>LD/OS;\nconst CI=(x,y,r)=>`M${x-r},${y} a${r},${r} 0 1,0 ${2*r},0 a${r},${r} 0 1,0 ${-2*r},0 `;\nconst EL=(x,y,a,b)=>`M${x-a},${y} a${a},${b} 0 1,0 ${2*a},0 a${a},${b} 0 1,0 ${-2*a},0 `;\nconst MAN=(x,y,h)=>{const r=h*.15,f=v=>(v).toFixed(1);return CI(x,+f(y+r),+f(r))+`M${x},${f(y+2*r)} V${f(y+h*.66)} M${f(x-h*.2)},${f(y+h*.46)} L${x},${f(y+h*.38)} L${f(x+h*.2)},${f(y+h*.46)} M${x},${f(y+h*.66)} l${f(-h*.14)},${f(h*.34)} M${x},${f(y+h*.66)} l${f(h*.14)},${f(h*.34)} `};\nconst KEY=(x,y,s)=>CI(x,y,13*s)+`M${x+13*s},${y} h${48*s} M${x+47*s},${y} v${12*s} M${x+58*s},${y} v${9*s} `;\nconst CHAIR=(x,y)=>`M${x},${y} V${y-78} M${x},${y-38} H${x+46} V${y} `;\nconst BOOK=(x,y)=>`M${x},${y} q-18,-10 -34,0 v30 q16,-10 34,0 q18,-10 34,0 v-30 q-16,-10 -34,0 v30 `;\nfunction CDR(o,x,y,r,n){for(let k=0;k<n;k++){const a0=-Math.PI/2+k*2*Math.PI/n,a1=a0+2*Math.PI/n*.93,p=a=>`${(x+r*Math.cos(a)).toFixed(1)},${(y+r*Math.sin(a)).toFixed(1)}`;P(o+k/OS,`M${p(a0)} A${r},${r} 0 0,1 ${p(a1)}`,R,6,.92);IT[IT.length-1].off=T0+LD-.05;SFX.push({t:T0+(o+k/OS)*OS,k:'tick'})}}\n\n/*__CONTENT_START__*/\nconst S={\"C1.1\": \"إنت هنا: خلّصنا الأركان الأربعة، شعب، وحيز، وسلطة، وسيادة. [[0.5]] فاضل السؤال الكبير: مصر كمّلت ليه؟\", \"C1.2\": \"بس الأركان لوحدها مش كفاية. الدول بتنشأ لما مقومات، يعني حاجات بتساعدها تقوم وتكمّل، تتجمّع،\", \"C1.3\": \"ويحوّلوا «تجمعات بشرية مشتتة» لـ«كيان سياسي منظم».\", \"C1.3a\": \"يعني من ناس متفرّقين، لبلد واحدة منظّمة.\", \"C1.4\": \"ومصر عندها ست مقومات، بترتيب الكتاب.\", \"C2.1\": \"لو أبوك عنده محل، يفتحه في شارع رئيسي ولا في حارة سد؟\", \"C2.2\": \"أكيد الشارع الرئيسي. أول مقوّم: الموقع الجغرافي، يعني مكانها على الخريطة، والحدود الطبيعية.\", \"C2.3\": \"مصر في قلب قارات العالم القديم، فبقت مركز للتواصل الحضاري والتبادل التجاري.\", \"C2.4\": \"وحدودها الطبيعية، صحرا وبحر، كانت حواجز بتحمي قلب الدولة، الوادي والدلتا.\", \"C2.5\": \"فالمصريين استقروا، وركّزوا في الزراعة والعمران، وده دعم نشأة الدولة واستقرارها.\", \"C2.6\": \"وجمال حمدان قال في «شخصية مصر»: «فمصر موضعًا دولة نهر، وموقعًا دولة برزخ».\", \"C2.7\": \"«دولة نهر» بسبب النيل، و«دولة برزخ» يعني موقعها بيربط القارات ببعض.\", \"C2.8\": \"وقّف الفيديو وفكّر: لو مفيش نيل، مصر كانت هتبقى مهمة؟ [[3.0]]\", \"C2.9\": \"حمدان بيجاوب: «ولو لم يكن النيل فرضًا لفرض الموقع نفسه يقينًا».\", \"C2.9a\": \"يعني حتى من غير نيل، الموقع لوحده كان هيخلّيها مهمة.\", \"C2.10\": \"تاني مقوّم: الموارد الطبيعية، يعني خير الأرض، وأهمها نهر النيل. وده أساس قيام الحضارة المصرية،\", \"C2.11\": \"لأنه خلّى المصري يتحوّل من «جامع للثمار» لـ«مزارع مستقر».\", \"C2.11a\": \"يعني بطّل يلفّ على أكله، وقعد يزرع.\", \"C2.12\": \"تخيّل عمارة فيها خزان مية واحد. لازم حد ينظّم التوزيع، وإلا الخناقات تبدأ.\", \"C2.13\": \"والنيل كده. الري والسدود محتاجين شغل جماعي، وسلطة مركزية قوية، من مركز واحد.\", \"C2.14\": \"السلطة دي كانت بتنظّم توزيع المية، وبتحل النزاعات بين الأقاليم، يعني خلافات المناطق.\", \"C2.15\": \"والنيل كمان كان شريان بيربط الشمال بالجنوب.\", \"C2.16\": \"والمصري القديم غنّى للنيل: «تحيةً لك يا حابي… لكي يعطي الحياة لمصر».\", \"C2.17\": \"وفي كتاب الموتى أقسم، يعني حلف: «لم أُلوّث ماء النهر». «لم أمنع الماء في موسمه». «لم أُقِم سدًا أمام الماء المتدفق».\", \"C2.18\": \"يعني النيل ما كانش مجرد مية. ده زراعة واستقرار، وسلطة مركزية، ومقدّس كمان.\", \"C2.19\": \"وجنب النيل فيه أراضي خصبة، يعني بتطرح كويس، ومعادن، وأحجار بناء.\", \"C2.20\": \"ودول نشّطوا الزراعة والصناعة والتجارة، ودعموا الاستقرار الاقتصادي.\", \"C3.1\": \"عيلة كبيرة بتتكلم بنفس الطريقة، وبتفرح وتزعل مع بعض. صعب حد يفرّقها، صح؟\", \"C3.2\": \"تالت مقوّم: التجانس البشري، يعني الناس شبه بعض ومتماسكين، والوحدة الوطنية. المصريين اتصهروا في ثقافة واحدة من فجر التاريخ.\", \"C3.3\": \"والكتاب بيسميها «بوتقة ثقافية واحدة»، طلّعت «اتحادًا متماسكًا يصعب تفتيته».\", \"C3.3a\": \"البوتقة وعاء المعادن بتسيح فيه وتبقى حتة واحدة. يعني صعب يتكسّر.\", \"C3.4\": \"فالوحدة السياسية بقت حاجة طبيعية، والمصريين ما اتأثروش بثقافة المحتل، وحافظوا على هويتهم المميزة.\", \"C3.5\": \"يعني التجانس بيقوّي الدولة، لأنه بيصعّب تفتيت وحدتها.\", \"C3.6\": \"قريتين، كل واحدة بتعمل اللي هي عايزاه من غير تنسيق؟ أكيد هيتخانقوا.\", \"C3.7\": \"رابع مقوّم: الحكومة المركزية القوية. الملك مينا، أو نعرمر، وحّد القطرين، الشمال والجنوب.\", \"C3.8\": \"وبعدها قامت حكومة مركزية قوية، وده كان «الأساس الحقيقي لظهور الدولة المصرية».\", \"C3.9\": \"ومصر بقت دولة ليها سلطة واحدة ونظام إداري موحد، يعني إدارة واحدة للكل.\", \"C3.10\": \"فاكر خزان المية؟ [[1.0]] الحاجة للتنظيم هي اللي جابت الحكومة المركزية.\", \"C3.11\": \"خامس مقوّم: القوة العسكرية، يعني الجيش. جيش من أبناء مصر بيدافع عن أرضها.\", \"C3.12\": \"والكتاب بيوصف الجيش إنه «الأداة التي تحمي حدود الدولة» [[0.5]] «وتصون إنجازاتها الحضارية وتضمن استقرارها السياسي».\", \"C3.12a\": \"تصون يعني تحافظ. وإنجازاتها الحضارية: كل اللي بنته.\", \"C3.13\": \"وعقيدته، يعني مبدأه: «يبني ويحمي ويحافظ على الأرض ولا يعتدي».\", \"C3.14\": \"«أفكّر وأناقش»: بعد التوحيد، مصر احتاجت جيش يحمي حدودها واستقرارها.\", \"C3.15\": \"والنهارده محتاجاه في أعلى جاهزية، يعني مستعد دايمًا، لنفس السبب، لأنه «كان ولا يزال» الأداة دي.\", \"C3.16\": \"سؤال سريع: الجيش ركن ولا مقوّم؟ [[1.0]] مقوّم! وده بيوقّع ناس كتير.\", \"C3.17\": \"سادس مقوّم: الحفاظ على الهوية المصرية. وتعريف الهوية الوطنية:\", \"C3.18\": \"«مجموعة من الخصائص التي تميّز الشعب المصري عبر التاريخ، وتشكّل شخصيته وتعكس انتماءه الوطني».\", \"C3.18a\": \"يعني اللي بيخلّي المصري مصري، وحاسس إنه تبع بلده. زي النادي بلونه ونشيده.\", \"C3.19\": \"ومرتكزاتها، يعني اللي واقفة عليه، تلاتة: الدين، واللغة، والتاريخ.\", \"C3.20\": \"والمصريين حافظوا عليها بلغتهم وتراثهم، اللي ورثوه عن جدودهم، فالدولة فضلت باقية.\", \"C3.21\": \"حتى لما اللغة اتغيرت، من المصرية القديمة للقبطية للعربية، الهوية فضلت مصرية.\", \"C3.22\": \"والدولة بتحافظ عليها بتلات إجراءات: حماية التراث والاحتفال بالمناسبات الوطنية،\", \"C3.23\": \"وتعريف الأجيال بتاريخ مصر، ودعم الثقافة والفنون، زي الأوبرا وقصور الثقافة.\", \"C3.24\": \"وإنت تقدر تشارك: زور مكان أثري، أو احكي لإخواتك تاريخ مصر.\", \"C3.25\": \"ومسئولية مين؟ الدولة وكل مواطن، لأنها من أدوار الشعب الخمسة.\", \"C4.1\": \"نراجع المقومات الست بالترتيب: الموقع والحدود الطبيعية، والموارد الطبيعية، والتجانس،\", \"C4.2\": \"والحكومة المركزية القوية، والقوة العسكرية، والحفاظ على الهوية.\", \"C4.3\": \"وده تالت جزء في الإجابة: الدولة اللي بتعيش ليها مقومات بتدعم نشأتها واستقرارها.\", \"C4.4\": \"والكلام ده هييجي في الامتحان إزاي؟ الفصل الجاي: ركن الامتحان ولوحات الحفظ.\", \"C4.2m\": \"مكان حلو، فيه نيل، لمّ الناس، فاحتاجوا حكومة واحدة، وجيش يحميهم، وفضلوا مصريين.\", \"C2.7m\": \"موضع بالضاد زي ضفة النهر. وموقع بالقاف زي القارات.\", \"C2.17m\": \"تلاتة «لم»: ما وسّختش، ما منعتش، ما سدّيتش.\", \"C3.8m\": \"اسمين، وقطرين، وتاج واحد.\", \"C3.12m\": \"الدرع على الحد، ووراه المعبد، وتحتهم أرض ثابتة.\", \"C3.19m\": \"المرتكزات في كلمة: دلّت. دين، لغة، تاريخ.\", \"C3.23m\": \"تلات مباني بالميم: معبد، مدرسة، مسرح.\", \"RC1\": \"دقيقة مراجعة. غمّض، وجاوب قبلي.\", \"RC2\": \"المقومات الست بالترتيب، على الخريطة؟ [[2.0]] الموقع، والموارد، والتجانس، والحكومة المركزية، والقوة العسكرية، والهوية.\", \"RC3\": \"حمدان قال مصر موضعًا إيه، وموقعًا إيه؟ [[2.0]] «موضعًا دولة نهر، وموقعًا دولة برزخ».\", \"RC4\": \"أهم مورد طبيعي؟ وطلب إيه؟ [[2.0]] نهر النيل، وطلب سلطة مركزية قوية.\", \"RC5\": \"مين وحّد القطرين؟ [[2.0]] الملك مينا، أو نعرمر. وده «الأساس الحقيقي لظهور الدولة المصرية».\", \"RC6\": \"الجيش ركن ولا مقوّم؟ [[2.0]] مقوّم.\", \"RC7\": \"مرتكزات الهوية تلاتة، إيه هم؟ [[2.0]] الدين، واللغة، والتاريخ.\", \"RC8\": \"والدولة بتحافظ على الهوية بإيه؟ [[2.0]] حماية التراث والمناسبات، وتعريف الأجيال، ودعم الثقافة والفنون.\", \"RC9\": \"سمّعهم تاني بكرة، وبعد أسبوع.\"},SRC={\"C1.1\": \"الكتاب ص١١\", \"C1.2\": \"الكتاب ص١٥ + شرح كلمة + تشبيه مرسوم\", \"C1.3\": \"الكتاب ص١٥\", \"C1.3a\": \"شرح كلمة\", \"C1.4\": \"الكتاب ص١٦–١٨\", \"C2.1\": \"تشبيه\", \"C2.2\": \"الكتاب ص١٦ + شرح كلمة\", \"C2.3\": \"الكتاب ص١٦\", \"C2.4\": \"الكتاب ص١٦ + شرح كلمة\", \"C2.5\": \"الكتاب ص١٦\", \"C2.6\": \"الكتاب ص١٦\", \"C2.7\": \"الكتاب ص١٦\", \"C2.8\": \"الكتاب ص١٦\", \"C2.9\": \"الكتاب ص١٦\", \"C2.9a\": \"الكتاب ص١٦ + شرح الاقتباس\", \"C2.10\": \"الكتاب ص١٦ + شرح كلمة\", \"C2.11\": \"الكتاب ص١٦\", \"C2.11a\": \"شرح كلمة\", \"C2.12\": \"تشبيه\", \"C2.13\": \"الكتاب ص١٦ + تذكير\", \"C2.14\": \"الكتاب ص١٦ + شرح كلمة\", \"C2.15\": \"الكتاب ص١٦\", \"C2.16\": \"الكتاب ص١٧\", \"C2.17\": \"الكتاب ص١٧ + شرح كلمة\", \"C2.18\": \"الكتاب ص١٦، ص١٧\", \"C2.19\": \"الكتاب ص١٦ + شرح كلمة\", \"C2.20\": \"الكتاب ص١٦\", \"C3.1\": \"تشبيه\", \"C3.2\": \"الكتاب ص١٧ + شرح كلمة\", \"C3.3\": \"الكتاب ص١٧\", \"C3.3a\": \"شرح كلمة\", \"C3.4\": \"الكتاب ص١٧\", \"C3.5\": \"الكتاب ص١٧\", \"C3.6\": \"تشبيه\", \"C3.7\": \"الكتاب ص١٧\", \"C3.8\": \"الكتاب ص١٧\", <span id=\"tm\">0:00<\/span>\n <button id=\"rec\" style=\"background:#D7463C;border-color:#D7463C\">● سجّل الشريحة (عدّ ٣)<\/button><label style=\"cursor:default\">السرعة <input id=\"spd\" type=\"range\" min=\"0.7\" max=\"1.4\" step=\"0.05\" value=\"1\" style=\"vertical-align:middle\"> <span id=\"spdv\">100%<\/span><\/label>\n <button id=\"prev\">→ الشريحة اللي قبل<\/button><button id=\"next\">الشريحة الجاية ←<\/button>\n <button id=\"mode\" aria-pressed=\"false\">وضع الشرايح<\/button><button id=\"snd\" aria-pressed=\"true\">الصوت<\/button>\n <label>ارفع فويس الشريحة دي <input id=\"af\" type=\"file\" accept=\"audio/*\" hidden><\/label><button id=\"sync\">ظبط التوقيت على صوتي<\/button><button id=\"tap\" style=\"background:#1EA05F;border-color:#1EA05F\">جملة (Enter)<\/button><button id=\"cp\">انسخ كود التوقيت<\/button><span id=\"msg\"><\/span><button id=\"recm\">وضع تسجيل الشاشة<\/button><button id=\"fs\">ملء الشاشة<\/button>\n<\/div>\n<p id=\"note\">نسخة v1 · السبورة D (الفصل الرابع · الشرايح D1–D7). <b>التسجيل:<\/b> دوس «سجّل الشريحة»، هيعدّ ٣ وبعدين الكلام يتعلّم كلمة كلمة تحت وإنت بتقرا، والرسم ماشي معاه (ظبّط السرعة على كلامك). <b>بعد التسجيل:<\/b> ارفع فويس الشريحة، دوس «ظبط التوقيت على صوتي»، ودوس Enter أول ما تسمع بداية كل جملة؛ الرسم هيتشدّ على صوتك. شغّل واتأكد، وبعدين «انسخ كود التوقيت» وابعتهولي أثبّته. في «وضع الشرايح»: دوسة على شمال الشاشة للشريحة الجاية وعلى اليمين للي قبلها، والمسافة للتشغيل، والعرض بيقف آخر كل شريحة. للخروج من وضع تسجيل الشاشة دوس Esc.<\/p>\n<\/div>\n<script>\nconst G='#1EA05F',GD='#106942',N='#0E2A47',R='#D7463C',Y='#F5BE32',YD='#C99A1B',SAND='#F3E3B5',GR='#666';\nconst CW=1066,CH=600,NS='http://www.w3.org/2000/svg';\nconst OS=1.35;let CUR=[],LASTW=null,IT=[],LINES=[],CAM=[[0,2133,0,CW,CH]],SL=[],SFX=[],T0=0,ox=0,oy=0,LD=0;\nconst sm=p=>{p=Math.max(0,Math.min(1,p));return p*p*(3-2*p)};\nfunction cell(c,r){ox=(2-c)*CW;oy=r*CH}\nfunction camTo(o,x,y,w,h,d=1.2){const t=T0+o,l=CAM[CAM.length-1];CAM.push([t,l[1],l[2],l[3],l[4]],[t+d,x,y,w,h]);SFX.push({t,k:'whoosh'})}\nfunction go(c,r){cell(c,r);camTo(0,ox,oy,CW,CH)}\nfunction line(id,src,txt,fn){const words=txt.replace(/\\[\\[[\\d.]+\\]\\]/g,'').trim().split(/\\s+/).length;let pz=0;txt.replace(/\\[\\[([\\d.]+)\\]\\]/g,(m,v)=>pz+=+v);\n LD=words*0.58+pz+0.45;let cu=0;const tk=txt.trim().split(/\\s+/).filter(Boolean).map(w=>{const m=w.match(/^\\[\\[([\\d.]+)\\]\\]$/),d=m?+m[1]:.58,o={w,p:!!m,v:m&&m[1],s:cu,e:cu+d};cu+=d;return o});\n CUR=tk;LINES.push({id,src,tk,t:T0,d:LD,txt:txt.replace(/\\s*\\[\\[[\\d.]+\\]\\]\\s*/g,' ').trim()});fn&&fn();T0+=LD}\n/* at('كلمة'[,n]) = وقت بداية أول (أو رقم n) كلمة فيها النص ده في السطر الحالي؛ استخدمها كـ offset لأي عنصر */\nfunction at(sub,n){let c=0;for(const k of CUR){if(!k.p&&k.w.includes(sub)){if(c==(n||0))return k.s/OS;c++}}throw new Error('at: «'+sub+'» مش في السطر: '+CUR.map(k=>k.w).join(' '))}\nfunction slide(name){SL.push({t:T0,name})}\nfunction W(o,x,y,txt,sz,col,a){IT.push(LASTW={k:'w',t:T0+o*OS,x:ox+x,y:oy+y,txt,sz,col,a:a||'end',d:Math.min(1.4,.06*txt.length+.3),cx:ox,cy:oy})}\nfunction P(o,d,col,w,dur,fill,cls){IT.push({k:'p',t:T0+o*OS,tx:ox,ty:oy,dd:d,col,w:w||3,d:dur||.8,fill,cls})}\nfunction ST(o,x,y,ok){IT.push({k:'s',t:T0+o*OS,x:ox+x,y:oy+y,ok,d:.5});SFX.push({t:T0+o*OS,k:ok?'chime':'tick'})}\nfunction Q(o,x,y,dur){o*=OS;IT.push({k:'q',t:T0+o,x:ox+x,y:oy+y,d:dur<3?dur:LD-o});SFX.push({t:T0+o,k:'tick'},{t:T0+o+1,k:'tick'},{t:T0+o+2,k:'tick'})}\nfunction AR(o,x1,y,x2){P(o,`M${x1},${y} H${x2} M${x2},${y} l14,-9 M${x2},${y} l14,9`,N,3,.4)}\nfunction CARD(o,x,y,w,h,col,fill){P(o,`M${x},${y} h${w} v${h} h${-w} Z`,col,3,.7,fill||'#fff');SFX.push({t:T0+o*OS,k:'chime'})}\nfunction BOOM(o){SFX.push({t:T0+o,k:'boom'})}\n\n\n/* ---- إضافات v5: تكملة نص على نفس السطر، إخفاء عنصر مؤقت، عدّاد وقفة، أشكال متكررة ---- */\nfunction WC(o,txt,col,gap){const p=LASTW;IT.push(LASTW={k:'w',t:T0+o*OS,x:p.x,y:p.y,txt,sz:p.sz,col:col||p.col,a:'end',d:Math.min(1.4,.06*txt.length+.3),cx:p.cx,cy:p.cy,af:p,gp:gap==null?p.sz*.28:gap})}\nfunction FADE(o,n){for(let i=1;i<=(n||1);i++)IT[IT.length-i].off=T0+o*OS}\nconst atp=n=>CUR.filter(k=>k.p)[n||0].s/OS,EOL=()=>LD/OS;\nconst CI=(x,y,r)=>`M${x-r},${y} a${r},${r} 0 1,0 ${2*r},0 a${r},${r} 0 1,0 ${-2*r},0 `;\nconst EL=(x,y,a,b)=>`M${x-a},${y} a${a},${b} 0 1,0 ${2*a},0 a${a},${b} 0 1,0 ${-2*a},0 `;\nconst MAN=(x,y,h)=>{const r=h*.15,f=v=>(v).toFixed(1);return CI(x,+f(y+r),+f(r))+`M${x},${f(y+2*r)} V${f(y+h*.66)} M${f(x-h*.2)},${f(y+h*.46)} L${x},${f(y+h*.38)} L${f(x+h*.2)},${f(y+h*.46)} M${x},${f(y+h*.66)} l${f(-h*.14)},${f(h*.34)} M${x},${f(y+h*.66)} l${f(h*.14)},${f(h*.34)} `};\nconst KEY=(x,y,s)=>CI(x,y,13*s)+`M${x+13*s},${y} h${48*s} M${x+47*s},${y} v${12*s} M${x+58*s},${y} v${9*s} `;\nconst CHAIR=(x,y)=>`M${x},${y} V${y-78} M${x},${y-38} H${x+46} V${y} `;\nconst BOOK=(x,y)=>`M${x},${y} q-18,-10 -34,0 v30 q16,-10 34,0 q18,-10 34,0 v-30 q-16,-10 -34,0 v30 `;\nfunction CDR(o,x,y,r,n){for(let k=0;k<n;k++){const a0=-Math.PI/2+k*2*Math.PI/n,a1=a0+2*Math.PI/n*.93,p=a=>`${(x+r*Math.cos(a)).toFixed(1)},${(y+r*Math.sin(a)).toFixed(1)}`;P(o+k/OS,`M${p(a0)} A${r},${r} 0 0,1 ${p(a1)}`,R,6,.92);IT[IT.length-1].off=T0+LD-.05;SFX.push({t:T0+(o+k/OS)*OS,k:'tick'})}}\n\n/*__CONTENT_START__*/\nconst SP={\"D1.1\": \"إنت هنا: آخر محطة. فهمنا الدرس، وفاضل نجاوب بيه في الامتحان. [[0.5]] ولو داخل على المراجعة على طول:\", \"D1.2\": \"الدولة أربع أركان: شعب، وحيز جغرافي، وسلطة، وسيادة. ومصر ليها ست مقومات حافظت عليها.\", \"D2.1\": \"نبدأ بأسئلة الفقرة في آخر صفحة تمنتاشر. الفكرة الرئيسة:\", \"D2.2\": \"دولة راسخة الأركان، يعني أركانها ثابتة، بتحمي سيادتها، وبترعى شعبها، وبتحقق التنمية.\", \"D2.3\": \"وعلاقة قوة الدولة بالتنمية؟ الدولة القوية بتحقق التنمية، والتنمية «خط دفاع أساسي عن الدولة».\", \"D2.4\": \"وأهمية دراسة الأركان؟ نفهم إزاي مصر حافظت على مكانتها.\", \"D2.5\": \"«سؤال التفسير المدعوم بالأدلة»: السلطة بتمكّن الدولة من سيادتها، فقرارها يفضل مستقل.\", \"D2.6\": \"والأدلة: الطيارة ما تدخلش من غير تصريح، والقضاء مستقل، ومصر بتمضي معاهداتها بنفسها.\", \"D2.7\": \"والمشروع البحثي: اختار ركن، عرّفه، وهات أمثلة من الدرس.\", \"D3.1\": \"«تدريبات الدرس». التمرين الأول «اختر»، ووقّف واختار قبل الإجابة.\", \"D3.2\": \"العامل الحاسم، يعني السبب اللي فرق، في التحول من تجمعات سكانية لدولة؟ الاختيارات قدامك. [[3.0]]\", \"D3.3\": \"(د) وجود سلطة مركزية، لأن الحكومة المركزية كانت «الأساس الحقيقي».\", \"D3.4\": \"علاقة التجانس، إن الناس متماسكين، بالاستقرار السياسي؟ [[3.0]]\", \"D3.5\": \"(أ) بيقلل الصراعات الداخلية، لأنه اتحاد متماسك يصعب تفتيته.\", \"D3.6\": \"والدولة اللي غابت عنها سيادتها؟ [[3.0]]\", \"D3.7\": \"(ب) بتفقد قدرتها على اتخاذ القرار.\", \"D3.8\": \"وخد بالك من التلاتة دول: أهم مورد هو النيل، وحمدان ركّز على الموقع،\", \"D3.9\": \"بس العامل الحاسم في «اختر» هو السلطة المركزية.\", \"D3.10\": \"التمرين التاني: صورة جوازات مطار القاهرة. وقّف وفكّر: مرتبطة بأنهي ركنين؟ [[3.0]]\", \"D3.11\": \"(أ) السلطة والسيادة. مؤسسة من الدولة، دي سلطة، بتقرر مين يدخل، دي سيادة.\", \"D3.12\": \"وعلاقتها بالحيز؟ الدولة بتتحكم في الدخول لأرضها ومجالها الجوي.\", \"D4.1\": \"التمرين التالت «بالتعاون مع زملائك». (أ) حاكم قديم رسّخ السلطة؟ مينا، وحّد القطرين وعمل سلطة واحدة.\", \"D4.2\": \"(ب) ترشيد المية، يعني نستعملها بحساب: النيل أهم مورد طبيعي، والحفاظ عليه حفاظ على الدولة.\", \"D4.3\": \"(ج) سبب لكل فريق: السلطة بتحفظ النظام والحقوق، والشعب مصدر السلطات.\", \"D4.4\": \"(د) الطبيعية ولا البشرية محتاجة دعم أكتر؟ رأي، وأي إجابة متبرّرة صح، زي ترشيد مية النيل.\", \"D4.5\": \"(هـ) لو القضاء اتعطل أسبوع؟ الحقوق مش هتلاقي حماية، والنظام والقانون هيتهزوا.\", \"D4.6\": \"يعني مؤسسة واحدة تقف، يتأثر ركنين: الشعب والسلطة.\", \"D5.1\": \"أسئلة المقال بالترتيب. رقم أربعة، «حلّل»: النشأة، يعني قيام الدولة، ما كانتش عامل واحد.\", \"D5.2\": \"المقومات الست اتفاعلت. والأكثر تأثيرًا في النشأة؟ الحكومة المركزية، «الأساس الحقيقي».\", \"D5.3\": \"رقم خمسة: «النيل هو العامل الحاسم»؟ أحسن إجابة: أتفق جزئيًا. يعني في حتة آه، وفي حتة لأ.\", \"D5.4\": \"النيل أساسي وطلب سلطة مركزية. بس النشأة ما كانتش عامل واحد، والموقع كان هيفرض نفسه.\", \"D5.5\": \"رقم ستة، «فسّر العلاقة». الشعب الواعي بحقوقه وواجباته بيخلّي الدولة أقوى.\", \"D5.6\": \"والسلطة بتحقق النظام، لأنها بتضع القوانين وبتنفذها.\", \"D5.7\": \"والسيادة استقلال القرار الوطني، لأنها قرار من غير خضوع لسلطة خارجية.\", \"D5.8\": \"والجيش بيضمن استمرار الدولة، لأنه بيحمي حدودها واستقرارها السياسي.\", \"D5.9\": \"رقم سبعة، «قارن» دور الشعب. في النشأة: استقر حوالين النيل، واشتغل جماعي في الري.\", \"D5.10\": \"وفي الاستمرارية، يعني إنها تكمّل: بيشارك، وبينتج، وبيحافظ على الهوية، وبيدافع عن الوطن.\", \"D5.11\": \"رقم تمانية، «حلّل» فقدان الأركان: شعب مش واعي يضعّف الدولة، ومن غير حدود مفيش دولة،\", \"D5.12\": \"ومن غير سلطة يضيع النظام، ومن غير سيادة يضيع القرار.\", \"D5.13\": \"رقم تسعة، «اختر مع التبرير»، يعني قول ليه: الأكثر تأثيرًا في الاستمرار، الموقع ولا الحكومة ولا الجيش؟\", \"D5.14\": \"مثلًا الجيش، لأنه «كان ولا يزال» بيحمي الحدود. والموقع كمان صح لو برّرته.\", \"D5.15\": \"رقم عشرة، «اكتب فقرة»: الشعب مصدر السلطات، والسلطة بتمكّن السيادة على الحيز،\", \"D5.16\": \"ولو ركن اختل، الدولة كلها بتتأثر.\", \"D5.17\": \"رقم حداشر، «تخيّل قريتك دولة مصغّرة». حيزها حدودها، ومصدر سلطتها أهلها، زي ما الشعب مصدر السلطات.\", \"D6.1\": \"ودلوقتي تلات لوحات «احفظ دي». وقّف وصوّر كل واحدة.\", \"D6.2\": \"الأولى: الدولة والحيز.\", \"D6.3\": \"الكروت دي فيها التعريفات، والأركان، والأدوار، والحدود. [[5.0]]\", \"D6.4\": \"التانية: السلطة والسيادة، والترابط، وأثر غياب كل ركن. [[5.0]]\", \"D6.5\": \"التالتة: المقومات الست، والنيل، ومينا، والجيش، والهوية. [[5.0]]\", \"D7.1\": \"سؤال الدرس: ليه دول عاشت عبر التاريخ، ودول اندثرت؟\", \"D7.2\": \"الدول اللي بتعيش هي اللي أركانها كاملة ومترابطة، ومقوماتها بتدعمها. وده اللي خلّى مصر تستمر.\", \"D7.3\": \"دلوقتي حلّ كويز الدرس في خُطوة.\", \"D7.4\": \"واكتبلي في الكومنتات: النيل ولا الموقع، مين العامل الحاسم في قيام مصر؟\", \"D7.2a\": \"كده إنت عرفت الدولة واقفة على إيه. [[0.5]] ودي كانت أول ورقة في الخريطة.\", \"D7.2b\": \"الحكاية الجاية بترجع لورا قوي. [[0.5]] للدولة المصرية القديمة.\", \"D7.2c\": \"وفاكر المفتاح؟ [[0.5]] لو حد من برّه حاول ياخده، أصحاب البيت بيعملوا إيه؟\", \"D7.2d\": \"دي حكاية «مقاومة الاحتلال». وهحكيهالك الدرس الجاي. [[1.0]]\", \"D7.4a\": \"أنا أحمد الألفي. خُطوة، من Add Value.\", \"D2.6m\": \"تلات أدلة: من السما، ومن المحكمة، ومن برّه.\", \"D5.8m\": \"كشف، وجرس، ومفتاح، ودرع. كل واحد وسهمه.\", \"D7.2m\": \"الإجابة كلها في رسمة: كرسي برجوله الأربعة، على أرض ثابتة.\", \"RD1\": \"آخر مراجعة: الدرس كله في دقيقة. غمّض، وجاوب قبلي.\", \"RD2\": \"الفصل الأول. أركان الدولة؟ [[2.0]] شعب، وحيز جغرافي، وسلطة، وسيادة.\", \"RD3\": \"والحيز فيه إيه؟ [[2.0]] يابس، ومياه إقليمية، ومجال جوي.\", \"RD4\": \"الفصل التاني. السلطات التلاتة؟ [[2.0]] تشريعية، وتنفيذية، وقضائية.\", \"RD5\": \"والسيادة؟ [[2.0]] استقلال قرار الدولة، داخلية وخارجية.\", \"RD6\": \"الفصل التالت. المقومات الست؟ [[2.0]] الموقع، والموارد، والتجانس، والحكومة المركزية، والقوة العسكرية، والهوية.\", \"RD7\": \"والعامل الحاسم في «اختر»؟ [[2.0]] وجود سلطة مركزية.\", \"RD8\": \"الفصل الرابع. الدول اللي بتعيش، بتعيش ليه؟ [[2.0]] أركانها كاملة ومترابطة، ومقوماتها بتدعمها.\", \"RD9\": \"انقل الجدول ده، وامشي عليه.\"},SRC={\"D1.1\": \"\", \"D1.2\": \"الكتاب ص١١، ص١٦–١٨\", \"D2.1\": \"الكتاب ص١٨\", \"D2.2\": \"الكتاب ص١٨ + شرح كلمة\", \"D2.3\": \"الكتاب ص١٦، ص١٨\", \"D2.4\": \"الكتاب ص١٨\", \"D2.5\": \"الكتاب ص١٨\", \"D2.6\": \"الكتاب ص١٣، ص١٤، ص١٥\", \"D2.7\": \"الكتاب ص١٨\", \"D3.1\": \"الكتاب ص١٩\", \"D3.2\": \"الكتاب ص١٩ + شرح كلمة\", \"D3.3\": \"الكتاب ص١٧\", \"D3.4\": \"الكتاب ص١٩ + تذكير\", \"D3.5\": \"الكتاب ص١٧\", \"D3.6\": \"الكتاب ص١٩\", \"D3.7\": \"الكتاب ص١٥\", \"D3.8\": \"الكتاب ص١٦، ص١٧\", \"D3.9\": \"الكتاب ص١٧، ص١٩\", \"D3.10\": \"الكتاب ص١٩\", \"D3.11\": \"الكتاب ص١٤، ص١٥، ص١٩\", \"D3.12\": \"الكتاب ص١٣، ص١٩\", \"D4.1\": \"الكتاب ص١٩\", \"D4.2\": \"الكتاب ص١٦، ص١٩ + شرح كلمة\", \"D4.3\": \"الكتاب ص١٩\", \"D4.4\": \"الكتاب ص١٩\", \"D4.5\": \"الكتاب ص١٥، ص١٩\", \"D4.6\": \"الكتاب ص١٩\", \"D5.1\": \"الكتاب ص٢٠ + شرح كلمة\", \"D5.2\": \"الكتاب ص١٧، ص٢٠\", \"D5.3\": \"الكتاب ص٢٠ + شرح كلمة\", \"D5.4\": \"الكتاب ص١٦، ص٢٠\", \"D
