<header><h1>سكريبت فيديو «خُطوة»: بناء الدولة المصرية واستمرارها عبر التاريخ</h1>
<div class="sub">تاريخ · تانية بكالوريا · الوحدة 1 · الدرس 1 — النسخة 3 بعد مراجعة 4 وكلاء (الأدلة، الامتحان، اللهجة، محامي الشيطان)</div>

<script>
const D={"boards": [{"id": "A1", "title": "«ليه في دول بتعيش ودول بتقع؟» (الافتتاح وخريطة الأسئلة) — السبورة A", "chap": "الفصل 1 — «الدولة وأركانها (١)» (السبورة A: الدولة والشعب، والسبورة A′: الحيز والحدود)", "rows": [["A1.1", "تعرف إن أول دولة مركزية عرفتها البشرية قامت على أرض مصر؟", "Did you know the first central state in human history rose on Egypt's land?", "الخريطة الأم لمصر (شكل خارجي بس، متشف من خريطة ص13، من غير أسامي) في نص السبورة A؛ تاج صغير يظهر على «مركزية».", "—", "ص6"], ["A1.2", "وفيه دول تانية كتير عبر التاريخ قامت واندثرت. طب ليه فيه دول بتستمر، ودول بتقع؟", "Many other states through history rose and vanished. So why do some last while others fall?", "سهم ✓ طالع من خريطة مصر (على «بتستمر»). على جنب: مربعين فاضيين مكتوب فيهم «دولة قديمة» وسهم مكسور ✗ من كل واحد (على «بتقع»). ولا سهم مكسور يلمس مصر.", "—", "ص11"], ["A1.3", "اكتب الأربع أسئلة اللي على الشاشة، سؤال لكل فصل.", "Copy the four questions on screen, one per chapter.", "الأربع أسئلة يظهروا مرة واحدة كقايمة جاهزة: «1- يعني إيه دولة؟ ومين شعبها، وفين حدودها؟ (ف1) · 2- يعني إيه سلطة وسيادة؟ ولو ركن غاب؟ (ف2) · 3- ليه مصر قامت واستمرت؟ (ف3) · 4- إزاي أجاوب في الامتحان؟ (ف4)».", "• 4 أسئلة = 4 فصول (على «لكل فصل»)", "ص9"]]}, {"id": "A2", "title": "«يعني إيه دولة؟» — السبورة A", "chap": "الفصل 1 — «الدولة وأركانها (١)» (السبورة A: الدولة والشعب، والسبورة A′: الحيز والحدود)", "rows": [["A2.1", "بص على بيتكم: فيه ناس ساكنة، ومساحة ليها حدود، وحد بيدير، وقراركم بإيدكم.", "Look at your home: people living there, a space with limits, someone running it, and decisions in your hands.", "بيت بسيط. كل حاجة تتكتب على كلمتها: الناس «ناس»، أرضية الشقة بخط حواليها «مساحة ليها حدود»، شخص عام «بيدير»، ومفتاح من غير اسم.", "—", "(تشبيه)"], ["A2.2", "ودي هي نفسها أركان الدولة، بس أكبر بكتير. وتعريفها في الكتاب:", "Those are the state's pillars, only much bigger. The book defines a state as:", "سهم من البيت للخريطة الأم.", "—", "ص11"], ["A2.3", "«وحدة سياسية تشغل حيزًا جغرافيًا مُحدّدًا، وتضم شعبًا يُقيم إقامة دائمة ويخضع لقوانينها».", "\"A political unit occupying a defined territory, with a permanently resident people subject to its laws.\"", "**كارت «احفظ دي» 1: تعريف الدولة** يبدأ يتكتب (على «وحدة سياسية»).", "—", "ص11"], ["A2.4", "«وتديرها سلطة منظمة تباشر اختصاصاتها بما يحقق الأمن والاستقرار، وتمارس سيادتها على شئونها الداخلية والخارجية».", "\"Run by an organized authority that exercises its powers to achieve security and stability, and exercising sovereignty over its internal and external affairs.\"", "الكارت 1 يكمل بالتعريف كامل زي الكتاب؛ خط ملوّن تحت «حيزًا» و«شعبًا» و«سلطة» و«سيادتها».", "• الدولة = وحدة سياسية (على «والخارجية»)", "ص11"], ["A2.5", "يعني بالبلدي، الدولة واقفة على أربع أركان: الشعب، والحيز الجغرافي، والسلطة، والسيادة.", "In plain words, a state stands on four pillars: people, territory, authority, sovereignty.", "**كارت «احفظ دي» 2: أركان الدولة** — سقف «الدولة» على 4 أعمدة مترقّمة 1–4، وكل عمود يظهر على كلمته.", "• 4 أركان: شعب، حيز جغرافي، سلطة، سيادة (على «والسيادة»)", "ص11"], ["A2.6", "وقّف الفيديو وفكّر: في البيت اللي رسمناه، أنهي حاجة هي السيادة؟", "Pause and think: in the home we drew, which thing is sovereignty?", "ساعة رملية «⏸ وقّف وفكّر» — **وقفة 3 ثواني**. [↺]", "—", "(تشبيه)"], ["A2.7", "المفتاح! يعني القرار جوّه البيت بإيدكم، محدش من برّه بيفرضه.", "The key! Decisions inside your home are yours; no outsider imposes them.", "كلمة «سيادة» تتكتب على المفتاح دلوقتي بس.", "—", "(تشبيه)"], ["A2.8", "والمادة الأولى من الدستور فيها الأركان الأربعة:", "Article One of the Constitution contains all four pillars:", "لفافة «م1». تاب صغير في الركن «أبحث وأحدّد ص11».", "—", "ص11"], ["A2.9", "«دولة ذات سيادة»، دي السيادة. «موحدة لا تقبل التجزئة»، ده الحيز.", "\"A sovereign state\": sovereignty. \"Unified and indivisible\": territory.", "كل عبارة تتكتب في اللفافة وسهم منها لعمودها.", "—", "ص11 (قرار 2)"], ["A2.10", "«نظامها جمهوري ديمقراطي»، دي السلطة. و«الشعب المصري»، ده الشعب.", "\"Its system is a democratic republic\": authority. \"The Egyptian people\": the people.", "سهمين كمان من اللفافة.", "• م1 فيها الأركان الأربعة (على «الشعب» الأخيرة)", "ص11 (قرار 2)"], ["A2.11", "وليه الدستور بيذكرهم؟ لأنه بيحط المبادئ اللي بتنظّم شئون الدولة.", "Why does the Constitution name them? Because it sets the principles that organize the state's affairs.", "تاب «وضّح ص11».", "—", "ص11"]]}, {"id": "A3", "title": "«مين شعبها؟» (الركن الأول) — السبورة A", "chap": "الفصل 1 — «الدولة وأركانها (١)» (السبورة A: الدولة والشعب، والسبورة A′: الحيز والحدود)", "rows": [["A3.1", "زميلك اللي غايب النهارده، يبقى خلاص مش من الفصل؟ [وقفة ثانية] لأ، اسمه لسه في الكشف.", "Your classmate who's absent today, is he no longer in the class? No, his name's still on the register.", "كشف فصل وكرسي فاضي عليه ✓ (على «الكشف»). [↺]", "—", "(تشبيه)"], ["A3.2", "والشعب أول ركن، وتعريفه في الكتاب:", "The people are the first pillar. The book defines them as:", "عمود 1 يتلوّن في أيقونة الأعمدة الصغيرة في ركن السبورة.", "—", "ص12"], ["A3.3", "«جميع المواطنين المقيمين داخل حدود الدولة أو خارجها ممن يحملون الجنسية المصرية».", "\"All citizens residing inside or outside the state's borders who hold Egyptian nationality.\"", "**كارت «احفظ دي» 3: تعريف الشعب** (على «جميع المواطنين»).", "—", "ص12"], ["A3.4", "والمادة الرابعة من الدستور بتقول: «السيادة للشعب وحده، يمارسها ويحميها، وهو مصدر السلطات».", "Article Four says: \"Sovereignty belongs to the people alone, who exercise and protect it, and they are the source of all powers.\"", "**كارت «احفظ دي» 4: «م4: الشعب مصدر السلطات»** (على «مصدر السلطات»).", "• الشعب مصدر السلطات (م4) (على «السلطات»)", "ص12"], ["A3.5", "وكل ما الشعب كان واعي بحقوقه وواجباته، الدولة بتبقى أقوى وأكثر تقدّمًا.", "The more aware people are of their rights and duties, the stronger and more advanced the state.", "سهم لفوق: «شعب واعي» ثم «دولة أقوى وأكثر تقدمًا».", "—", "ص12"], ["A3.6", "تفتكر دور الشعب إنه عدد وبس؟ [وقفة ثانية] لأ، ده بيشارك في بناء الدولة وحمايتها، في خمس أدوار:", "Do you think the people's role is just numbers? No, they help build and protect the state, in five roles:", "**كارت «احفظ دي» 5: أدوار الشعب** — 5 خانات فاضية (على «خمس»). [↺]", "—", "ص12"], ["A3.7", "واحد، المشاركة السياسية: ينتخب، ويراقب الحكومة عن طريق نوابه.", "One, political participation: voting, and overseeing the government through its deputies.", "1- المشاركة السياسية (صندوق انتخاب).", "—", "ص12"], ["A3.8", "اتنين، دعم أمن الدولة واستقرارها: يحترم الدستور والقوانين.", "Two, supporting security and stability: respecting the constitution and laws.", "2- دعم الأمن والاستقرار (كتاب قوانين).", "—", "ص12"], ["A3.9", "تلاتة، المساهمة في التنمية الاقتصادية: يشتغل، وينتج، ويدفع الضرايب.", "Three, contributing to economic development: working, producing, paying taxes.", "3- التنمية الاقتصادية (ترس).", "—", "ص12"], ["A3.10", "أربعة، الحفاظ على هوية المجتمع: تراثه، وعاداته وتقاليده.", "Four, preserving society's identity: its heritage, customs and traditions.", "4- الحفاظ على الهوية (لفافة).", "—", "ص12"], ["A3.11", "خمسة، الدفاع عن الوطن: يساند الجيش، ويتطوع وقت الأزمات.", "Five, defending the nation: backing the army and volunteering in crises.", "5- الدفاع عن الوطن (درع). تاب «حدّد دورك ص12».", "• للشعب 5 أدوار (على «والكوارث»)", "ص12"], ["A3.12", "وقّف الفيديو وفكّر: أنهي ثورة شاركت فيها مختلف فئات المجتمع ضد الاحتلال؟", "Pause and think: which revolution against the occupation did every class of society join?", "ساعة رملية — **وقفة 3 ثواني**. [↺]", "—", "ص12"], ["A3.13", "ثورة ألف وتسعمية وتسعتاشر، بقيادة الزعيم سعد زغلول، ضد الاحتلال البريطاني، وهدفها الاستقلال.", "The 1919 revolution, led by Saad Zaghloul, against the British occupation, aiming for independence.", "سهم زمني صغير «1919م»؛ أشخاص عامّين من غير وجوه ماسكين لافتة سادة «الاستقلال».", "—", "ص12"], ["A3.14", "ونتيجتها: الوعي الوطني زاد، وقيم المواطنة اترسّخت، والاحتلال اضطر يراجع سياساته.", "Its result: national awareness grew, citizenship took root, and the occupation had to rethink its policies.", "3 أسهم نتيجة. تاب «أفكّر وأجيب: وضّح ص12».", "• 1919: الشعب اتحد، والاحتلال راجع سياساته (على «سياساته»)", "ص12"], ["A3.15", "فالشعب «القوة المحركة للتغيير» لما يتحد حوالين قضية وطنية.", "So the people are \"the driving force of change\" when they unite around a national cause.", "الجملة تحت السهم الزمني.", "—", "ص12"]]}, {"id": "A4", "title": "«وفين حدودها؟» (الركن التاني: الحيز الجغرافي) — السبورة A′", "chap": "الفصل 1 — «الدولة وأركانها (١)» (السبورة A: الدولة والشعب، والسبورة A′: الحيز والحدود)", "rows": [["A4.1", "تخيّل ملعب كورة. الخطوط بتحدده، وصفّارة الحكم ماشية جوّاه بس.", "Picture a football field. The lines mark it, and the referee's whistle counts only inside.", "انتقال للسبورة A′. ملعب صغير بخطوط وصفّارة. [↺]", "—", "(تشبيه)"], ["A4.2", "وده تاني ركن: الحيز الجغرافي. والكتاب بيعرّفه:", "That's the second pillar: territory. The book defines it as:", "الخريطة الأم كبيرة في نص A′. أيقونة الأعمدة في الركن، وعمود 2 يتلوّن.", "—", "ص13"], ["A4.3", "«الرقعة المحددة التي تمارس الدولة سيادتها عليها». وفيه تلات حاجات:", "\"The defined area over which the state exercises its sovereignty.\" It has three parts:", "**كارت «احفظ دي» 6: تعريف الحيز** (على «الرقعة»).", "—", "ص13"], ["A4.4", "اليابس، والمياه الإقليمية، والمجال الجوي. وخد بالك، مفيش دولة من غير حدود محددة معترف بيها.", "Land, territorial waters, airspace. And note: no state exists without defined, recognized borders.", "على الخريطة: اليابس بلون، وشريط بحري أزرق، وقبة سما؛ مرقّمين 1–3 كل واحد على كلمته.", "• الحيز = يابس + مياه إقليمية + مجال جوي (على «الجوي»)", "ص13"], ["A4.5", "اليابس هو «المساحة الأرضية التي يعيش عليها السكان»، جوّه الحدود السياسية للدولة.", "Land is \"the ground area where the population lives,\" within the state's political borders.", "**كارت «احفظ دي» 7: اليابس وحدوده** يبدأ (على «المساحة الأرضية»).", "—", "ص13"], ["A4.6", "وحدوده أربعة، بترتيب الكتاب:", "Its borders are four, in the book's order:", "4 خانات مترقّمة جنب الخريطة (على «أربعة»).", "—", "ص13"], ["A4.7", "واحد، الحد الجنوبي: دائرة عرض اتنين وعشرين شمالًا، وبتفصلنا عن السودان، واترسمت سنة ألف وتمنمية وتسعة وتسعين.", "One, the southern border: latitude 22° north, separating us from Sudan, drawn in 1899.", "خط مستقيم على الحد الجنوبي + «دائرة عرض 22° شمالًا — 1899م»؛ كلمة «السودان» تحت الخط.", "—", "ص13"], ["A4.8", "والحد الشمالي إيه؟ [وقفة ثانية] اتنين: ساحل البحر المتوسط.", "And the northern border? Two: the Mediterranean coast.", "«2- ساحل المتوسط» على الحد الفوقاني. [↺]", "—", "ص13"], ["A4.9", "تلاتة، الحد الشرقي: ساحل البحر الأحمر وخليج العقبة، والحد البري مع فلسطين، اترسم سنة ألف وتسعمية وستة.", "Three, the eastern border: the Red Sea and Gulf of Aqaba coasts, and the land border with Palestine, drawn in 1906.", "«3- البحر الأحمر + خليج العقبة + الحد البري — 1906م» على الحد الشرقي. «فلسطين» تتكتب في الكارت 7 بس، مش على الخريطة.", "—", "ص13"], ["A4.10", "أربعة، الحد الغربي: خط طول خمسة وعشرين شرقًا، وبيفصلنا عن ليبيا، واترسم سنة ألف وتسعمية وخمسة وعشرين.", "Four, the western border: longitude 25° east, separating us from Libya, drawn in 1925.", "خط على الحد الغربي (يسار الخريطة) + «خط طول 25° شرقًا — 1925م»؛ كلمة «ليبيا». الكارت 7 يكمل.", "• الحدود: الجنوب دائرة عرض 22° شمالًا · الشمال المتوسط · الشرق الأحمر والعقبة وفلسطين · الغرب خط طول 25° شرقًا (على «وعشرين» الأخيرة)", "ص13"], ["A4.11", "والبحر؟ المياه الإقليمية «المساحات البحرية» اللي بتمتد عادةً اتناشر ميل بحري من خط الأساس للساحل.", "And the sea? Territorial waters are \"the sea areas\" typically extending 12 nautical miles from the coastal baseline.", "**كارت «احفظ دي» 8: المياه الإقليمية والمجال الجوي** يبدأ، و«12» تتكتب على الشريط الأزرق (على «اتناشر»).", "• مياه إقليمية = 12 ميل بحري (على «ميل»)", "ص13"], ["A4.12", "ولو حد طيّر درون فوق بيتكم من غير إذن؟ هتعترضوا. والدولة كمان.", "And if someone flew a drone over your house without asking? You'd object. So does the state.", "(منطوق بس.) [↺]", "—", "(تشبيه)"], ["A4.13", "ده المجال الجوي: «المساحة الرأسية التي تعلو الحيز الجغرافي للدولة»، والدولة بتمارس سيادتها عليه.", "That's airspace: \"the vertical space above the state's territory,\" and the state exercises sovereignty over it.", "القبة تتلوّن؛ الكارت 8 يكمل (على «المساحة الرأسية»).", "—", "ص13"], ["A4.14", "عشان كده مفيش طيارة تدخل المجال الجوي المصري من غير تصريح رسمي. وده فيه ركنين:", "That's why no plane enters Egyptian airspace without official permission. That involves two pillars:", "طيارة مدنية عند حافة القبة + ✋. تاب «اشرح علامَ تدل ص13».", "—", "ص13"], ["A4.15", "الحيز الجغرافي، لأن السما جزء منه، والسيادة، لأن الدولة هي اللي بتسمح.", "territory, since the sky is part of it, and sovereignty, since the state gives permission.", "«حيز + سيادة» على الطيارة.", "• الطيارة = حيز جغرافي + سيادة (على «بتسمح»)", "ص13"], ["A4.16", "ونفس الفكرة في قناة السويس، الدولة بتحميها وبتراقب السفن العابرة.", "Same idea with the Suez Canal: the state protects it and monitors passing ships.", "سفينة صغيرة على القناة + أيقونة عين.", "—", "ص13"], ["A4.17", "ودي أدلتك في «دلّل»: الدولة كيان متكامل مش مجرد أرض.", "That's your evidence for \"prove\": a state is an integrated entity, not just land.", "تاب «دلّل ص13».", "—", "ص13"], ["A4.18", "ووحدة الأرض أساس قيام الدولة، والحدود «رمز لوحدة الوطن واستقراره».", "The land's unity is the basis of the state, and borders are \"a symbol of the nation's unity and stability.\"", "تاب «قيم أتعلمها ص13».", "—", "ص13"]]}, {"id": "A5", "title": "ملخص الفصل 1 وأول جزء في الإجابة — السبورة A′ ثم A", "chap": "الفصل 1 — «الدولة وأركانها (١)» (السبورة A: الدولة والشعب، والسبورة A′: الحيز والحدود)", "rows": [["A5.1", "اختبر نفسك قبل ما نراجع: الدولة أركانها كام؟ [وقفة ثانية] أربعة: شعب، وحيز جغرافي، وسلطة، وسيادة.", "Test yourself before we review: how many pillars? Four: people, territory, authority, sovereignty.", "الكاميرا تتحرك من A′ لـA وترجع. الكارتين 1–2 ينوّروا. [↺]", "• 4 أركان (على «وسيادة»)", "ص11"], ["A5.2", "والشعب مصدر السلطات، وليه خمس أدوار.", "The people are the source of all powers, with five roles.", "الكروت 3–5 تنوّر.", "—", "ص12"], ["A5.3", "والحيز: يابس، ومياه إقليمية اتناشر ميل، ومجال جوي.", "Territory: land, 12-mile territorial waters, airspace.", "الكارتين 6 و8 ينوّروا.", "—", "ص13"], ["A5.4", "والحدود: الجنوب دائرة عرض اتنين وعشرين شمالًا، والغرب خط طول خمسة وعشرين شرقًا،", "Borders: the south at latitude 22° north, the west at longitude 25° east,", "الكارت 7 ينوّر، و«22° شمالًا» و«25° شرقًا» بلون مختلف.", "• الجنوب: دائرة عرض 22° شمالًا · الغرب: خط طول 25° شرقًا (على «شرقًا»)", "ص13"], ["A5.5", "والشمال المتوسط، والشرق البحر الأحمر وخليج العقبة والحد مع فلسطين.", "the north the Mediterranean, the east the Red Sea, the Gulf of Aqaba and the border with Palestine.", "—", "—", "ص13"], ["A5.6", "وده أول جزء في إجابة سؤالنا: الدولة اللي بتعيش ليها شعب واعي، وحدود معترف بيها.", "That's the first part of our answer: a state that lasts has an aware people and recognized borders.", "خانة «الإجابة» رقم 1 تتملي جنب سهم ✓ على السبورة A.", "—", "ص12، ص13"], ["A5.7", "الفصل الجاي: مين بيعمل القوانين؟ وإمتى يبقى قرار الدولة بإيدها؟", "Next chapter: who makes the laws? And when is a state's decision its own?", "كارت عنوان «الفصل 2: الدولة وأركانها (٢)» (4 ثواني). [↺]", "—", "ص14–15"]]}, {"id": "B1", "title": "افتتاح الفصل", "chap": "الفصل 2 — «الدولة وأركانها (٢)» (السبورة B)", "rows": [["B1.1", "لو داخل على الفصل ده على طول، ابدأ بالمعلومة دي:", "If you're jumping straight to this chapter, start with this:", "سبورة B فاضية؛ أيقونة الأعمدة الأربعة في ركنها.", "—", "—"], ["B1.2", "الدولة واقفة على أربع أركان: شعب، وحيز جغرافي، وسلطة، وسيادة.", "A state stands on four pillars: people, territory, authority, sovereignty.", "الأعمدة الأربعة؛ عمود 1 و2 عليهم ✓ صغيرة.", "• 4 أركان (على «وسيادة»)", "ص11"], ["B1.3", "هنا هنكمّل بالسلطة والسيادة، ولو ركن غاب يحصل إيه.", "Here we continue with authority, sovereignty, and what happens if a pillar goes.", "عمود 3 و4 حواليهم دايرة.", "—", "ص9"]]}, {"id": "B2", "title": "«مين بيدير الدولة؟» (الركن التالت: السلطة) — السبورة B", "chap": "الفصل 2 — «الدولة وأركانها (٢)» (السبورة B)", "rows": [["B2.1", "خد مدرستك: فيه لايحة بتتكتب، وإدارة بتطبّقها، وحد بيفصل في المشاكل.", "Take your school: rules get written, an administration applies them, and someone settles disputes.", "3 أيقونات: ورقة لايحة، جرس، صفّارة (مش ميزان).", "—", "(تشبيه)"], ["B2.2", "الدولة بتشتغل بنفس الطريقة. تالت ركن: السلطة، وتعريفها:", "A state works the same way. Pillar three: authority. Its definition:", "عمود 3 يتلوّن.", "—", "ص14"], ["B2.3", "«المؤسسات التي تدير شئون الدولة وتضع القوانين وتعمل على تنفيذها»، وبتحافظ على الأمن العام.", "\"The institutions that run the state's affairs, make laws and enforce them,\" and keep public order.", "**كارت «احفظ دي» 9: تعريف السلطة** (على «المؤسسات»).", "• السلطة = مؤسسات بتدير وتشرّع وتنفّذ (على «تنفيذها»)", "ص14"], ["B2.4", "والدستور قسّمها تلات سلطات، في أربع مواد، لأن التنفيذية ليها مادتين.", "The Constitution divides it into three powers, in four articles, because the executive has two.", "**كارت «احفظ دي» 10: السلطات التلاتة** — 3 صناديق (على «تلات سلطات»)؛ الصندوق التاني فيه قوس للمادتين.", "—", "ص14"], ["B2.5", "الأولى بتعمل القانون، والتانية بتنفّذه، والتالتة بتحكم بيه.", "The first makes the law, the second carries it out, the third judges by it.", "«تعمل / تنفّذ / تحكم» تحت الصناديق التلاتة.", "—", "ص14"], ["B2.6", "تفتكر مين بيعمل القوانين؟ [وقفة ثانية] مجلس النواب! ودي السلطة التشريعية.", "Who do you think makes the laws? The House of Representatives! That's the legislative power.", "1- «التشريعية — مجلس النواب (م101)». [↺]", "—", "ص14"], ["B2.7", "والمادة مية وواحد: مجلس النواب «يتولى سلطة التشريع»، وبيقرّ السياسة العامة والموازنة.", "Article 101: the House \"holds legislative power\" and approves general policy and the budget.", "تحت الصندوق: «تشريع / سياسة عامة».", "—", "ص14"], ["B2.8", "وكمان «يمارس الرقابة على أعمال السلطة التنفيذية».", "And it \"oversees the work of the executive power.\"", "سهم «رقابة» من صندوق 1 لصندوق 2.", "—", "ص14"], ["B2.9", "السلطة التانية، التنفيذية. المادة مية تسعة وتلاتين: رئيس الجمهورية «رئيس الدولة ورئيس السلطة التنفيذية».", "The second, the executive. Article 139: the President is \"head of state and head of the executive.\"", "2- «التنفيذية — رئيس الجمهورية (م139)» (من غير تاج ولا صورة).", "—", "ص14"], ["B2.10", "والمادة مية تلاتة وستين: الحكومة «الهيئة التنفيذية والإدارية العليا للدولة».", "Article 163: the government is \"the state's supreme executive and administrative body.\"", "«+ الحكومة (م163)» جوّه الصندوق 2.", "—", "ص14"], ["B2.11", "السلطة التالتة: القضائية. والمادة مية أربعة وتمانين: «السلطة القضائية مستقلة».", "The third power: the judiciary. Article 184: \"The judicial power is independent.\"", "3- «القضائية — مستقلة (م184)» + ميزان (الميزان للقضاء بس).", "—", "ص14"], ["B2.12", "بتتولاها المحاكم بكل أنواعها ودرجاتها، وبتصدر أحكامها حسب القانون.", "It is held by courts of all types and levels, issuing rulings according to the law.", "تاب «أفكّر وأحلّل ص14». الكارت 10 يكمل.", "• 3 سلطات: تشريعية (م101)، تنفيذية (م139 وم163)، قضائية (م184) (على «القانون»)", "ص14"], ["B2.13", "وقّف وخمّن: الموازنة العامة للدولة، مين بيقرّها؟", "Pause and guess: who approves the state's general budget?", "ساعة رملية — **وقفة 3 ثواني**. [↺]", "—", "ص14"], ["B2.14", "مجلس النواب، يعني السلطة التشريعية.", "The House of Representatives, the legislative power.", "«موازنة» تلمع تحت الصندوق 1.", "—", "ص14"]]}, {"id": "B3", "title": "«السلطات علاقتها ببعض إيه؟ والسلطة مهمة ليه؟» — السبورة B", "chap": "الفصل 2 — «الدولة وأركانها (٢)» (السبورة B)", "rows": [["B3.1", "والعلاقة بينهم؟ التشريعية بتراقب التنفيذية، والقضائية مستقلة، وكلهم ماشيين حسب الدستور.", "How are they linked? The legislature oversees the executive, the judiciary is independent, and all follow the Constitution.", "**شكل تخطيطي**: سهم «رقابة» من 1 لـ2، ودايرة «مستقلة» حوالين 3، وإطار «الدستور» حوالين الكل. تاب «ارسم شكلًا تخطيطيًا ص15».", "• العلاقة: رقابة + قضاء مستقل (على «الدستور»)", "ص14، ص15"], ["B3.2", "وعشان كده «استقرار الدولة مرتبط بقوة مؤسساتها وتنظيمها».", "That's why \"the state's stability is tied to the strength and organization of its institutions.\"", "تاب «قيم أتعلمها ص14».", "—", "ص14"], ["B3.3", "طب السلطة مهمة ليه؟ فيه أربع أسباب، احفظهم:", "So why does authority matter? There are four reasons; memorize them:", "**كارت «احفظ دي» 11: أهمية السلطة** — 4 خانات (على «أربع أسباب»).", "—", "ص15"], ["B3.4", "واحد، تحفظ النظام والقانون. اتنين، تحقق الاستقرار السياسي والاجتماعي.", "One, it keeps order and law. Two, it achieves political and social stability.", "1- النظام والقانون 2- الاستقرار.", "—", "ص15"], ["B3.5", "تلاتة، تحمي حقوق المواطنين. أربعة، تمكّن الدولة من ممارسة سيادتها.", "Three, it protects citizens' rights. Four, it enables the state to exercise its sovereignty.", "3- حقوق المواطنين 4- **تمكين السيادة** (بلون مختلف + سهم لعمود 4).", "• أهمية السلطة 4 (على «سيادتها»)", "ص15"]]}, {"id": "B4", "title": "«إمتى يبقى قرار الدولة بإيدها؟» (الركن الرابع: السيادة) — السبورة B", "chap": "الفصل 2 — «الدولة وأركانها (٢)» (السبورة B)", "rows": [["B4.1", "ينفع حد من برّه البيت يقرر إنتو هتصرفوا فلوسكم في إيه؟", "Can someone outside your home decide how you spend your money?", "بيت وإيد من برّه عليها ✗. [↺]", "—", "(تشبيه)"], ["B4.2", "لأ. والفكرة دي هي رابع ركن: السيادة. وتعريفها:", "No. And that idea is the fourth pillar: sovereignty. Its definition:", "عمود 4 يتلوّن (أيقونة مفتاح، مش طيارة حربية).", "—", "ص15"], ["B4.3", "«استقلال الدولة في اتخاذ قراراتها فيما يتعلق بشئونها الداخلية والخارجية» [نَفَس] «من دون خضوع لسلطة خارجية».", "\"The state's independence in making decisions on its internal and external affairs, without submitting to any outside authority.\"", "**كارت «احفظ دي» 12: تعريف السيادة** (على «استقلال»).", "—", "ص15"], ["B4.4", "والسيادة ليها نوعين. داخليًا: الدولة بتحط قوانينها، وبتحفظ أمنها، وبتدير شئون مواطنيها،", "Two kinds. Internally: the state makes its laws, keeps its security, and runs its citizens' affairs,", "**كارت «احفظ دي» 13: نوعين السيادة** — دايرة نصين: «داخلية» (على «نوعين»).", "—", "ص15"], ["B4.5", "من غير أي ضغوط من برّه.", "without any outside pressure.", "—", "• داخلية: قوانين، أمن، شئون المواطنين (على «برّه»)", "ص15"], ["B4.6", "وخارجيًا: مستقلة في علاقاتها الدولية، وبتمضي معاهداتها، وبتعمل علاقات دبلوماسية،", "Externally: independent in its international relations, signing its treaties, building diplomatic ties,", "النص التاني «خارجية» (مصافحة + لفافة معاهدة).", "—", "ص15"], ["B4.7", "وبتحمي مصالحها، وليها تمثيل في المنظمات الدولية.", "protecting its interests, and represented in international organizations.", "الكارت 13 يكمل.", "• خارجية: علاقات دولية، معاهدات، دبلوماسية، مصالح، منظمات (على «الدولية»)", "ص15"], ["B4.8", "يعني بالبلدي: السلطة بتدير، والسيادة إن قرار الدولة ما يتفرضش عليها.", "In plain words: authority runs things, and sovereignty means the state's decisions aren't imposed on it.", "«السلطة = بتدير / السيادة = قرار مستقل».", "—", "ص14–15"], ["B4.9", "والعلاقة بينهم إن السلطة هي اللي بتمكّن الدولة تمارس سيادتها.", "The link: authority is what enables the state to exercise its sovereignty.", "سهم «بتمكّن» من صندوق السلطة لعمود 4.", "• السلطة بتمكّن السيادة (على «سيادتها»)", "ص15"], ["B4.10", "وفاكر المادة الرابعة؟ [وقفة ثانية] الشعب مصدر السلطات، والدولة بسلطاتها بتمارس السيادة.", "Remember Article Four? The people are the source of powers, and the state exercises sovereignty through its authorities.", "سهم صغير من «م4» لعمود 3 ثم 4. [↺]", "—", "ص12، ص15 (قرار 1)"], ["B4.11", "ومثال لسعي مصر لاستقلال قرارها، من التاريخ الحديث: ثورة ألف وتسعمية وتسعتاشر.", "An example of Egypt seeking an independent decision, from modern history: the 1919 revolution.", "تاب «أفكّر وأحلّل ص15» + أيقونة «1919» صغيرة.", "—", "ص12، ص15"], ["B4.12", "والأمثلة القديمة هتقابلها في الدرس الجاي.", "The ancient examples come in the next lesson.", "—", "—", "ص12، ص5"]]}, {"id": "B5", "title": "«لو ركن غاب، يحصل إيه؟» — السبورة B", "chap": "الفصل 2 — «الدولة وأركانها (٢)» (السبورة B)", "rows": [["B5.1", "هات كرسي بأربع رجول، وشيل رجل واحدة. [وقفة ثانيتين]", "Take a four-legged chair and remove one leg.", "كرسي بأربع رجول؛ رجل تتشال. [↺]", "—", "(تشبيه)"], ["B5.2", "الكرسي هيميل، ويبقى مهدد يقع. وأركان الدولة كده بالظبط، مترابطة،", "The chair tilts and is at risk of falling. The state's pillars are exactly like that, interlinked,", "الكرسي يميل.", "—", "ص9"], ["B5.3", "و«إذا اختل أحدها تأثّر كيان الدولة بأكمله».", "and \"if one fails, the whole state is affected.\"", "**كارت «احفظ دي» 14: الأركان مترابطة** (على «اختل»).", "• ركن يختل = الدولة كلها تتأثر (على «بأكمله»)", "ص9"], ["B5.4", "من غير شعب، مفيش مين يشارك ويبني. ولو مش واعي، الدولة بتضعف.", "Without a people, no one takes part or builds. If they aren't aware, the state weakens.", "**كارت «احفظ دي» 15: أثر غياب كل ركن** — 4 سطور (على «من غير شعب»)؛ عمود 1 يميل.", "—", "ص12 (قرار 3)"], ["B5.5", "ومن غير حدود محددة معترف بيها، مفيش دولة أصلًا.", "Without defined, recognized borders, there's no state at all.", "عمود 2 يميل.", "—", "ص13"], ["B5.6", "ومن غير سلطة، يضيع النظام والقانون، وحقوق المواطنين ما تلاقيش حماية.", "Without authority, order and law are lost, and citizens' rights go unprotected.", "عمود 3 يميل.", "—", "ص15"], ["B5.7", "ومن غير سيادة، الدولة ما تقدرش تاخد قرارها بنفسها.", "Without sovereignty, the state can't make its own decisions.", "عمود 4 يميل؛ الكارت 15 يكمل.", "• أثر غياب كل ركن (على «بنفسها»)", "ص15، ص19"]]}, {"id": "B6", "title": "ملخص الفصل 2 وتاني جزء في الإجابة — السبورة B", "chap": "الفصل 2 — «الدولة وأركانها (٢)» (السبورة B)", "rows": [["B6.1", "نراجع. فاكر كام سلطة؟ [وقفة ثانية] تلاتة: تشريعية، وتنفيذية، وقضائية.", "Review. How many powers? Three: legislative, executive, judicial.", "زووم أوت على السبورة B كلها؛ الكارتين 9–10 ينوّروا. [↺]", "• 3 سلطات (على «وقضائية»)", "ص14"], ["B6.2", "وأهمية السلطة في أربع حاجات: النظام والقانون، والاستقرار، والحقوق، وتمكين السيادة.", "Authority matters in four ways: order and law, stability, rights, and enabling sovereignty.", "الكارت 11 ينوّر.", "—", "ص15"], ["B6.3", "والسيادة: استقلال قرار الدولة، وليها نوعين: داخلية وخارجية.", "Sovereignty: the state's independent decision-making, in two kinds: internal and external.", "الكارتين 12–13 ينوّروا.", "• السيادة: داخلية + خارجية (على «وخارجية»)", "ص15"], ["B6.4", "ولو ركن اختل، الدولة كلها بتتأثر.", "If one pillar fails, the whole state is affected.", "الكارتين 14–15 والكرسي المايل.", "—", "ص9"], ["B6.5", "وده تاني جزء في الإجابة: الدولة اللي بتعيش ليها سلطة بتحفظ النظام، وقرار مستقل.", "The second part of the answer: a state that lasts has an authority that keeps order, and independent decisions.", "خانة «الإجابة» رقم 2 (نسخة صغيرة من سهم ✓ في ركن B).", "—", "ص15"], ["B6.6", "طب إيه اللي خلّى مصر بالذات تستمر آلاف السنين؟ ده الفصل الجاي.", "So what kept Egypt in particular going for thousands of years? That's the next chapter.", "كارت عنوان «الفصل 3: مقومات الدولة المصرية» (4 ثواني). [↺]", "—", "ص9"]]}, {"id": "C1", "title": "افتتاح الفصل", "chap": "الفصل 3 — «مقومات الدولة المصرية» (السبورة C)", "rows": [["C1.1", "لو لسه داخل: الدولة واقفة على أربع أركان، شعب، وحيز، وسلطة، وسيادة.", "If you just joined: a state stands on four pillars, people, territory, authority, sovereignty.", "سبورة C؛ الخريطة الأم في النص (نفس الشكل المتشف). أيقونة الأعمدة في الركن.", "—", "ص11"], ["C1.2", "بس الأركان لوحدها مش كفاية. الدول بتنشأ لما مقومات تتجمّع،", "But pillars alone aren't enough. States arise when foundations come together,", "—", "—", "ص15"], ["C1.3", "ويحوّلوا «تجمعات بشرية مشتتة» لـ«كيان سياسي منظم».", "turning \"scattered human groups\" into \"an organized political entity.\"", "نقط متفرقة، سهم، مربع منظم.", "• المقومات بتحوّل التجمعات لكيان منظم (على «منظم»)", "ص15"], ["C1.4", "ومصر عندها ست مقومات، بترتيب الكتاب.", "Egypt has six foundations, in the book's order.", "**كارت «احفظ دي» 16: المقومات الست** — 6 خانات مترقّمة حوالين الخريطة (على «ست»).", "—", "ص16–18"]]}, {"id": "C2", "title": "«الموقع والموارد» (المقوّم 1 و2) — السبورة C", "chap": "الفصل 3 — «مقومات الدولة المصرية» (السبورة C)", "rows": [["C2.1", "لو أبوك عنده محل، يفتحه في شارع رئيسي ولا في حارة سد؟", "If your dad had a shop, would he open it on a main street or a dead-end alley?", "محلّين: واحد على شارع زحمة، وواحد في حارة فاضية. [↺]", "—", "(تشبيه)"], ["C2.2", "أكيد الشارع الرئيسي. أول مقوّم: الموقع الجغرافي والحدود الطبيعية.", "The main street, of course. Foundation one: geographic location and natural borders.", "خانة 1 تتملي.", "—", "ص16"], ["C2.3", "مصر في قلب قارات العالم القديم، فبقت مركز للتواصل الحضاري والتبادل التجاري.", "Egypt sits at the heart of the Old World, a hub of cultural contact and trade.", "أشكال قارات بس (من غير حدود ولا أسماء دول) ونجمة على مصر.", "—", "ص16"], ["C2.4", "وحدودها الطبيعية كانت حواجز بتحمي قلب الدولة، الوادي والدلتا.", "Its natural borders were barriers protecting the heart of the state, the Valley and the Delta.", "الوادي والدلتا بالأخضر؛ صحرا وبحر حواليهم (من غير أسوار).", "—", "ص16"], ["C2.5", "فالمصريين استقروا، وركّزوا في الزراعة والعمران، وده دعم نشأة الدولة واستقرارها.", "So Egyptians settled and focused on farming and building, which supported the state's rise and stability.", "سنبلة + بيت. تاب «وضّح ص16».", "• الموقع والحدود الطبيعية سبب الاستقرار (على «استقروا»)", "ص16"], ["C2.6", "وجمال حمدان قال في «شخصية مصر»: «فمصر موضعًا دولة نهر، وموقعًا دولة برزخ».", "Gamal Hamdan wrote in \"The Personality of Egypt\": \"By its site Egypt is a river state, and by its location an isthmus state.\"", "لفافة فيها الاقتباس + أيقونة كتاب (من غير وجه).", "—", "ص16"], ["C2.7", "«دولة نهر» بسبب النيل، و«دولة برزخ» يعني موقعها بيربط القارات ببعض.", "\"River state\" because of the Nile, and \"isthmus state\" means its location links the continents.", "«موضع = النيل» و«موقع = برزخ» + سهمين بين القارات. تاب «في ضوء النص ص16 (1)».", "—", "ص16 (قرار 4)"], ["C2.8", "وقّف الفيديو وفكّر: لو مفيش نيل، مصر كانت هتبقى مهمة؟", "Pause and think: without the Nile, would Egypt still matter?", "ساعة رملية — **وقفة 3 ثواني**. [↺]", "—", "ص16"], ["C2.9", "حمدان بيجاوب: «ولو لم يكن النيل فرضًا لفرض الموقع نفسه يقينًا».", "Hamdan answers: \"Had the Nile not imposed itself, the location would surely have imposed itself.\"", "السطر التاني في اللفافة. تاب «(2) و(3)»: الموقع لوحده كان هيخلّي مصر مركز للتفاعل الحضاري (مكتوب بس).", "—", "ص16"], ["C2.10", "تاني مقوّم: الموارد الطبيعية، وأهمها نهر النيل. وده أساس قيام الحضارة المصرية،", "Foundation two: natural resources, above all the Nile. It's the basis of Egyptian civilization,", "خانة 2: «الموارد الطبيعية» + خط النيل.", "—", "ص16"], ["C2.11", "لأنه خلّى المصري يتحوّل من «جامع للثمار» لـ«مزارع مستقر».", "because it turned Egyptians from fruit gatherers into settled farmers.", "شخص بيجمع ثمار، سهم، شخص بيزرع جنب النيل.", "—", "ص16"], ["C2.12", "تخيّل عمارة فيها خزان مية واحد. لازم حد ينظّم التوزيع، وإلا الخناقات تبدأ.", "Imagine a building with one water tank. Someone must organize sharing, or fights break out.", "عمارة + خزان + سهم لكل شقة. [↺]", "—", "(تشبيه)"], ["C2.13", "والنيل كده. الري والسدود محتاجين شغل جماعي، وسلطة مركزية قوية.", "The Nile too. Irrigation and dams needed teamwork and a strong central authority.", "فلاحين (أشكال عامة) على قناة واحدة؛ القنوات راجعة لتاج واحد. **كارت «احفظ دي» 17: النيل احتاج سلطة مركزية** (على «سلطة مركزية»).", "—", "ص16"], ["C2.14", "السلطة دي كانت بتنظّم توزيع المية، وبتحل النزاعات بين الأقاليم.", "That authority organized water distribution and settled disputes between regions.", "—", "• النيل احتاج سلطة مركزية (على «الأقاليم»)", "ص16"], ["C2.15", "والنيل كمان كان شريان بيربط الشمال بالجنوب.", "The Nile was also an artery linking north and south.", "سهم بالاتجاهين على خط النيل.", "—", "ص16"], ["C2.16", "والمصري القديم غنّى للنيل: «تحيةً لك يا حابي… لكي يعطي الحياة لمصر».", "Ancient Egyptians sang to the Nile: \"Hail to you, Hapi… to give life to Egypt.\"", "لفافة «أنشودة النيل». تاب «أقرأ وأحلّل ص17 (1)».", "—", "ص17"], ["C2.17", "وفي كتاب الموتى أقسم: «لم أُلوّث ماء النهر». «لم أمنع الماء في موسمه». «لم أُقِم سدًا أمام الماء المتدفق».", "In the Book of the Dead he swore: \"I did not pollute the river's water. I did not withhold water in its season. I did not dam the flowing water.\"", "لفافة تانية بـ3 سطور. [↺]", "—", "ص17"], ["C2.18", "يعني النيل ما كانش مجرد مية. ده زراعة واستقرار، وسلطة مركزية، ومقدّس كمان.", "So the Nile was never just water. It meant farming, stability, central authority, and it was sacred too.", "تاب «اشرح العبارة (2)».", "—", "ص16، ص17"], ["C2.19", "وجنب النيل فيه أراضي خصبة، ومعادن، وأحجار بناء.", "Beside the Nile there's fertile land, minerals, and building stone.", "**كارت «احفظ دي» 18: الموارد الطبيعية** — 4 أيقونات (على «خصبة»).", "—", "ص16"], ["C2.20", "ودول نشّطوا الزراعة والصناعة والتجارة، ودعموا الاستقرار الاقتصادي.", "These boosted farming, industry and trade, and economic stability.", "—", "• الموارد: النيل، أراضي خصبة، معادن، أحجار بناء (على «الاقتصادي»)", "ص16"]]}, {"id": "C3", "title": "«التجانس، والحكومة المركزية، والجيش، والهوية» (المقوّم 3 لـ6) — السبورة C", "chap": "الفصل 3 — «مقومات الدولة المصرية» (السبورة C)", "rows": [["C3.1", "عيلة كبيرة بتتكلم بنفس الطريقة، وبتفرح وتزعل مع بعض. صعب حد يفرّقها، صح؟", "A big family that talks the same way and shares joy and sorrow is hard to split, right?", "عيلة عامّة حوالين سفرة. [↺]", "—", "(تشبيه)"], ["C3.2", "تالت مقوّم: التجانس البشري والوحدة الوطنية. المصريين اتصهروا في ثقافة واحدة من فجر التاريخ.", "Foundation three: human homogeneity and national unity. Egyptians fused into one culture since the dawn of history.", "خانة 3: أشخاص مختلفين ماسكين إيد بعض في دايرة.", "—", "ص17"], ["C3.3", "والكتاب بيسميها «بوتقة ثقافية واحدة»، طلّعت «اتحادًا متماسكًا يصعب تفتيته».", "The book calls it \"one cultural melting pot,\" producing \"a cohesive union that is hard to break apart.\"", "«اتحاد متماسك يصعب تفتيته». **كارت «احفظ دي» 19: التجانس** (على «اتحادًا»).", "—", "ص17"], ["C3.4", "فالوحدة السياسية بقت حاجة طبيعية، والمصريين ما اتأثروش بثقافة المحتل، وحافظوا على هويتهم المميزة.", "So political unity came naturally, Egyptians weren't swayed by the occupier's culture, and kept their distinct identity.", "—", "• التجانس سبب الوحدة السياسية (على «طبيعية»)", "ص17"], ["C3.5", "يعني التجانس بيقوّي الدولة، لأنه بيصعّب تفتيت وحدتها.", "So homogeneity strengthens the state, because it makes its unity hard to break.", "تاب «أفكّر وأبحث ص17».", "—", "ص17"], ["C3.6", "قريتين، كل واحدة بتعمل اللي هي عايزاه من غير تنسيق؟ أكيد هيتخانقوا.", "Two villages, each doing as it pleases with no coordination? They'll surely fight.", "قريتين بأسهم متلخبطة. [↺]", "—", "(تشبيه)"], ["C3.7", "رابع مقوّم: الحكومة المركزية القوية. الملك مينا، أو نعرمر، وحّد القطرين، الشمال والجنوب.", "Foundation four: strong central government. King Menes, or Narmer, unified the Two Lands, north and south.", "خانة 4: نصين خريطة بيتقفلوا على بعض وتاج واحد.", "—", "ص17"], ["C3.8", "وبعدها قامت حكومة مركزية قوية، وده كان «الأساس الحقيقي لظهور الدولة المصرية».", "Then a strong central government arose, and that was \"the true basis for the rise of the Egyptian state.\"", "**كارت «احفظ دي» 20: مينا (نعرمر) والأساس الحقيقي** (على «الأساس الحقيقي»).", "• مينا وحّد القطرين = الأساس الحقيقي (على «الحقيقي»)", "ص17"], ["C3.9", "ومصر بقت دولة ليها سلطة واحدة ونظام إداري موحد.", "Egypt became a state with one authority and one administrative system.", "نقط صغيرة، سهم، مربع واحد.", "—", "ص17"], ["C3.10", "فاكر خزان المية؟ [وقفة ثانية] الحاجة للتنظيم هي اللي جابت الحكومة المركزية.", "Remember the water tank? The need for organization is what brought central government.", "أيقونة الخزان الصغيرة تلمع. تاب «كيف أسهمت الحاجة إلى التنظيم؟ ص17». [↺]", "—", "ص16، ص17"], ["C3.11", "خامس مقوّم: القوة العسكرية. جيش من أبناء مصر بيدافع عن أرضها.", "Foundation five: military strength. An army of Egypt's sons defending its land.", "خانة 5: درع على حدود الخريطة الأم.", "—", "ص17"], ["C3.12", "والكتاب بيوصف الجيش إنه «الأداة التي تحمي حدود الدولة» [نَفَس] «وتصون إنجازاتها الحضارية وتضمن استقرارها السياسي».", "The book describes the army as \"the tool that protects the state's borders, guards its achievements, and ensures its political stability.\"", "**كارت «احفظ دي» 21: دور الجيش** (على «الأداة»).", "—", "ص17"], ["C3.13", "وعقيدته: «يبني ويحمي ويحافظ على الأرض ولا يعتدي».", "Its doctrine: \"it builds, protects, preserves the land, and does not attack.\"", "سطر تحت الدرع.", "—", "ص17"], ["C3.14", "«أفكّر وأناقش»: بعد التوحيد، مصر احتاجت جيش يحمي حدودها واستقرارها.", "\"Think and discuss\": after unification, Egypt needed an army to protect its borders and stability.", "تاب «أفكّر وأناقش ص18».", "—", "ص17، ص18"], ["C3.15", "والنهارده محتاجاه في أعلى جاهزية لنفس السبب، لأنه «كان ولا يزال» الأداة دي.", "Today it needs it at top readiness for the same reason: it \"was and still is\" that tool.", "—", "—", "ص17، ص18"], ["C3.16", "سؤال سريع: الجيش ركن ولا مقوّم؟ [وقفة ثانية] مقوّم! وده بيوقّع ناس كتير.", "Quick question: is the army a pillar or a foundation? A foundation! That trips up many people.", "«؟» على الدرع، ثم «مقوّم ✓ مش ركن». [↺]", "• الجيش مقوّم مش ركن (على «مقوّم»)", "ص11، ص17"], ["C3.17", "سادس مقوّم: الحفاظ على الهوية المصرية. وتعريف الهوية الوطنية:", "Foundation six: preserving Egyptian identity. The definition of national identity:", "خانة 6.", "—", "ص18"], ["C3.18", "«مجموعة من الخصائص التي تميّز الشعب المصري عبر التاريخ، وتشكّل شخصيته وتعكس انتماءه الوطني».", "\"A set of traits that distinguish the Egyptian people through history, shape its character and reflect its national belonging.\"", "**كارت «احفظ دي» 22: الهوية الوطنية** (على «مجموعة»).", "—", "ص18"], ["C3.19", "ومرتكزاتها تلاتة: الدين، واللغة، والتاريخ.", "Its foundations are three: religion, language, and history.", "الكارت 22 يكمل بالتلات مرتكزات.", "• الهوية: الدين، اللغة، التاريخ (على «والتاريخ»)", "ص18"], ["C3.20", "والمصريين حافظوا عليها بلغتهم وتراثهم، فالدولة فضلت باقية.", "Egyptians kept it through language and heritage, so the state endured.", "—", "—", "ص18"], ["C3.21", "حتى لما اللغة اتغيرت، من المصرية القديمة للقبطية للعربية، الهوية فضلت مصرية.", "Even when the language changed, from Ancient Egyptian to Coptic to Arabic, the identity stayed Egyptian.", "شريط لغات في ركن منفصل من السبورة: 3 مربعات بأسهم (بعيد عن سطر C3.4). [↺]", "—", "ص17"], ["C3.22", "والدولة بتحافظ عليها بتلات إجراءات: حماية التراث والاحتفال بالمناسبات الوطنية،", "The state preserves it with three measures: protecting heritage and celebrating national occasions,", "**كارت «احفظ دي» 23: إجراءات الهوية** — 3 أيقونات (على «تلات إجراءات»).", "—", "ص18"], ["C3.23", "وتعريف الأجيال بتاريخ مصر، ودعم الثقافة والفنون، زي الأوبرا وقصور الثقافة.", "teaching generations Egypt's history, and supporting culture and the arts, like the Opera and culture palaces.", "معبد + احتفال · كتاب وجيل · قناع مسرح.", "• 3 إجراءات للهوية (على «الثقافة» الأخيرة)", "ص18"], ["C3.24", "وإنت تقدر تشارك: زور مكان أثري، أو احكي لإخواتك تاريخ مصر.", "You can take part too: visit a heritage site, or tell your siblings Egypt's history.", "تاب «ناقش مع زميلك ص18 (1)».", "—", "ص9، ص18"], ["C3.25", "ومسئولية مين؟ الدولة وكل مواطن، لأنها من أدوار الشعب الخمسة.", "Whose duty is it? The state's and every citizen's, since it's one of the people's five roles.", "تاب «(2)».", "—", "ص12، ص18"]]}, {"id": "C4", "title": "ملخص الفصل 3 وتالت جزء في الإجابة — السبورة C", "chap": "الفصل 3 — «مقومات الدولة المصرية» (السبورة C)", "rows": [["C4.1", "نراجع المقومات الست بالترتيب: الموقع والحدود الطبيعية، والموارد الطبيعية، والتجانس،", "Let's review the six foundations in order: location and natural borders, natural resources, homogeneity,", "زووم أوت على السبورة C كلها؛ الخانات الست تنوّر واحدة واحدة.", "—", "ص16–18"], ["C4.2", "والحكومة المركزية القوية، والقوة العسكرية، والحفاظ على الهوية.", "strong central government, military strength, and preserving identity.", "الكارت 16 ينوّر.", "• 6 مقومات (على «الهوية»)", "ص17–18"], ["C4.3", "وده تالت جزء في الإجابة: الدولة اللي بتعيش ليها مقومات بتدعم نشأتها واستقرارها.", "The third part of the answer: a state that lasts has foundations supporting its rise and stability.", "خانة «الإجابة» رقم 3 (نسخة صغيرة من سهم ✓ في ركن C).", "—", "ص9"], ["C4.4", "الفصل الجاي: ركن الامتحان ولوحات الحفظ.", "Next chapter: the exam corner and the memory panels.", "كارت عنوان «الفصل 4: ركن الامتحان واحفظ دي» (4 ثواني). [↺]", "—", "—"]]}, {"id": "D1", "title": "افتتاح الفصل", "chap": "الفصل 4 — «ركن الامتحان واحفظ دي» (السبورة D)", "rows": [["D1.1", "لو داخل على المراجعة على طول:", "If you're jumping straight to the review:", "سبورة D؛ أيقونة الأعمدة الأربعة + 6 خانات صغيرة في الركن.", "—", "—"], ["D1.2", "الدولة أربع أركان: شعب، وحيز جغرافي، وسلطة، وسيادة. ومصر ليها ست مقومات حافظت عليها.", "A state has four pillars: people, territory, authority, sovereignty. And Egypt has six foundations that kept it going.", "الأعمدة والخانات تنوّر.", "• 4 أركان + 6 مقومات (على «حافظت»)", "ص11، ص16–18"]]}, {"id": "D2", "title": "أسئلة آخر ص18 (الفقرة، والتفسير المدعوم بالأدلة، والمشروع) — السبورة D", "chap": "الفصل 4 — «ركن الامتحان واحفظ دي» (السبورة D)", "rows": [["D2.1", "نبدأ بأسئلة الفقرة في آخر صفحة تمنتاشر. الفكرة الرئيسة:", "We start with the paragraph questions at the end of page 18. The main idea:", "تاب «ما الفكرة الرئيسة؟ ص18».", "—", "ص18"], ["D2.2", "دولة راسخة الأركان، بتحمي سيادتها، وبترعى شعبها، وبتحقق التنمية.", "A state with firm pillars that protects its sovereignty, cares for its people, and achieves development.", "—", "—", "ص18"], ["D2.3", "وعلاقة قوة الدولة بالتنمية؟ الدولة القوية بتحقق التنمية، والتنمية «خط دفاع أساسي عن الدولة».", "The link between a strong state and development? A strong state achieves development, and development is \"a key line of defense for the state.\"", "تاب «استنتج العلاقة».", "• الدولة القوية تحقق التنمية، والتنمية تحميها (على «الدولة» الأخيرة)", "ص16، ص18"], ["D2.4", "وأهمية دراسة الأركان؟ نفهم إزاي مصر حافظت على مكانتها.", "Why study the pillars? To see how Egypt kept its standing.", "تاب «استخلص».", "—", "ص18"], ["D2.5", "«سؤال التفسير المدعوم بالأدلة»: السلطة بتمكّن الدولة من سيادتها، فقرارها يفضل مستقل.", "\"Evidence-based explanation\": authority enables the state's sovereignty, so its decisions stay independent.", "تاب «سؤال التفسير المدعوم بالأدلة ص18». [↺]", "—", "ص18"], ["D2.6", "والأدلة: الطيارة ما تدخلش من غير تصريح، والقضاء مستقل، ومصر بتمضي معاهداتها بنفسها.", "Evidence: no plane enters without permission, the judiciary is independent, and Egypt signs its own treaties.", "3 أيقونات أدلة: طيارة، ميزان، لفافة معاهدة.", "—", "ص13، ص14، ص15"], ["D2.7", "والمشروع البحثي: اختار ركن، عرّفه، وهات أمثلة من الدرس.", "The research project: pick a pillar, define it, and give examples from the lesson.", "تاب «مشروع بحثي ص18».", "—", "ص18"]]}, {"id": "D3", "title": "«تدريبات الدرس» 1 و2: «اختر» وسؤال الصورة — السبورة D", "chap": "الفصل 4 — «ركن الامتحان واحفظ دي» (السبورة D)", "rows": [["D3.1", "«تدريبات الدرس». التمرين الأول «اختر»، ووقّف واختار قبل الإجابة.", "\"Lesson exercises.\" The first is \"Choose\": pause and pick before the answer.", "تاب «تدريبات الدرس ص19 (1) اختر».", "—", "ص19"], ["D3.2", "العامل الحاسم في التحول من تجمعات سكانية لدولة؟ الاختيارات قدامك.", "The decisive factor in turning communities into a state? The options are on screen.", "4 اختيارات (أ–د) — **وقفة 3 ثواني**. [↺]", "—", "ص19"], ["D3.3", "(د) وجود سلطة مركزية، لأن الحكومة المركزية كانت «الأساس الحقيقي».", "(d) Central authority, because central government was \"the true basis.\"", "دايرة على (د).", "—", "ص17"], ["D3.4", "علاقة التجانس بالاستقرار السياسي؟", "How does homogeneity relate to political stability?", "4 اختيارات — **وقفة 3 ثواني**.", "—", "ص19"], ["D3.5", "(أ) بيقلل الصراعات الداخلية، لأنه اتحاد متماسك يصعب تفتيته.", "(a) It reduces internal conflict, since it's a cohesive union hard to break.", "دايرة على (أ).", "—", "ص17"], ["D3.6", "والدولة اللي غابت عنها سيادتها؟", "And a state that has lost its sovereignty?", "4 اختيارات — **وقفة 3 ثواني**.", "—", "ص19"], ["D3.7", "(ب) بتفقد قدرتها على اتخاذ القرار.", "(b) It loses its ability to make decisions.", "دايرة على (ب).", "• «اختر»: (د) سلطة مركزية · (أ) يقلل الصراعات · (ب) تفقد القرار (على «القرار»)", "ص15"], ["D3.8", "وخد بالك من التلاتة دول: أهم مورد هو النيل، وحمدان ركّز على الموقع،", "Watch these three: the key resource is the Nile, Hamdan stressed location,", "جدول صغير 3 صفوف: «أهم مورد = النيل · حمدان = الموقع · العامل الحاسم = السلطة المركزية».", "—", "ص16، ص17"], ["D3.9", "بس العامل الحاسم في «اختر» هو السلطة المركزية.", "but the decisive factor in \"Choose\" is central authority.", "الصف التالت يلمع.", "—", "ص17، ص19"], ["D3.10", "التمرين التاني: صورة جوازات مطار القاهرة. وقّف وفكّر: مرتبطة بأنهي ركنين؟", "Exercise two: Cairo Airport passport control. Pause and think: which two pillars?", "تاب «(2) في ضوء الصورة». أيقونة جواز سفر + ختم + بوابة (مش الصورة، لأن فيها وشوش حقيقية) — **وقفة 3 ثواني**. [↺]", "—", "ص19"], ["D3.11", "(أ) السلطة والسيادة. مؤسسة من الدولة، دي سلطة، بتقرر مين يدخل، دي سيادة.", "(a) Authority and sovereignty. A state institution, that's authority, decides who enters, that's sovereignty.", "دايرة على (أ).", "—", "ص14، ص15، ص19"], ["D3.12", "وعلاقتها بالحيز؟ الدولة بتتحكم في الدخول لأرضها ومجالها الجوي.", "Its link to territory? The state controls entry to its land and airspace.", "سهم من الجواز للخريطة الصغيرة.", "—", "ص13، ص19"]]}, {"id": "D4", "title": "«تدريبات الدرس» 3: «بالتعاون مع زملائك» (أ–هـ) — السبورة D", "chap": "الفصل 4 — «ركن الامتحان واحفظ دي» (السبورة D)", "rows": [["D4.1", "التمرين التالت «بالتعاون مع زملائك». (أ) حاكم قديم رسّخ السلطة؟ مينا، وحّد القطرين وعمل سلطة واحدة.", "Exercise three, \"with your classmates.\" (a) An ancient ruler who established authority? Menes, who unified the Two Lands under one authority.", "تاب «(3) بالتعاون مع زملائك».", "—", "ص19"], ["D4.2", "(ب) ترشيد المية: النيل أهم مورد طبيعي، والحفاظ عليه حفاظ على الدولة.", "(b) Saving water: the Nile is the key natural resource, and protecting it protects the state.", "حنفية مقفولة.", "—", "ص16، ص19"], ["D4.3", "(ج) سبب لكل فريق: السلطة بتحفظ النظام والحقوق، والشعب مصدر السلطات.", "(c) One reason per team: authority keeps order and rights, and the people are the source of powers.", "ميزان بكفّتين متساويتين.", "—", "ص19"], ["D4.4", "(د) الطبيعية ولا البشرية محتاجة دعم أكتر؟ رأي، وأي إجابة متبرّرة صح، زي ترشيد مية النيل.", "(d) Do natural or human foundations need more support? Opinion; any justified answer works, like conserving the Nile.", "—", "—", "ص19"], ["D4.5", "(هـ) لو القضاء اتعطل أسبوع؟ الحقوق مش هتلاقي حماية، والنظام والقانون هيتهزوا.", "(e) If the judiciary stopped for a week? Rights would go unprotected, and order and law would be shaken.", "الميزان بيشرخ. [↺]", "—", "ص15، ص19"], ["D4.6", "يعني مؤسسة واحدة تقف، يتأثر ركنين: الشعب والسلطة.", "One institution stops, and two pillars suffer: the people and authority.", "عمودين يميلوا مع بعض.", "• (هـ): مؤسسة تقف، ركنين يتأثروا (على «والسلطة»)", "ص19"]]}, {"id": "D5", "title": "«تدريبات الدرس» 4–11 (أسئلة المقال، بترتيب ص20) — السبورة D", "chap": "الفصل 4 — «ركن الامتحان واحفظ دي» (السبورة D)", "rows": [["D5.1", "أسئلة المقال بالترتيب. رقم أربعة، «حلّل»: النشأة ما كانتش عامل واحد.", "The essay questions in order. Number four, \"Analyze\": the rise wasn't one factor.", "تاب «(4) حلّل ص20».", "—", "ص20"], ["D5.2", "المقومات الست اتفاعلت. والأكثر تأثيرًا في النشأة؟ الحكومة المركزية، «الأساس الحقيقي».", "The six foundations interacted. The most influential in the rise? Central government, \"the true basis.\"", "الخانات الست تنوّر، وخانة 4 أكتر.", "—", "ص17، ص20"], ["D5.3", "رقم خمسة: «النيل هو العامل الحاسم»؟ أحسن إجابة: أتفق جزئيًا.", "Number five: \"The Nile was decisive\"? Best answer: partly agree.", "تاب «(5) ما مدى اتفاقك».", "—", "ص20"], ["D5.4", "النيل أساسي وطلب سلطة مركزية. بس النشأة ما كانتش عامل واحد، والموقع كان هيفرض نفسه.", "The Nile was essential and required central authority. But the rise had several factors, and location would have prevailed.", "عمودين «أتفق / بس».", "—", "ص16، ص20"], ["D5.5", "رقم ستة، «فسّر العلاقة». الشعب الواعي بحقوقه وواجباته بيخلّي الدولة أقوى.", "Number six, \"Explain the link.\" A people aware of its rights and duties makes the state stronger.", "تاب «(6) فسّر العلاقة» + 4 أسهم بالاتجاهين زي الكتاب. [↺]", "—", "ص12، ص20"], ["D5.6", "والسلطة بتحقق النظام، لأنها بتضع القوانين وبتنفذها.", "Authority achieves order, because it makes and enforces laws.", "—", "—", "ص14"], ["D5.7", "والسيادة استقلال القرار الوطني، لأنها قرار من غير خضوع لسلطة خارجية.", "Sovereignty is independent national decision-making, free of outside authority.", "—", "—", "ص15"], ["D5.8", "والجيش بيضمن استمرار الدولة، لأنه بيحمي حدودها واستقرارها السياسي.", "The army ensures the state's continuity, because it protects its borders and political stability.", "—", "• فسّر: 4 علاقات، وكل واحدة بالسبب (على «السياسي»)", "ص17"], ["D5.9", "رقم سبعة، «قارن» دور الشعب. في النشأة: استقر حوالين النيل، واشتغل جماعي في الري.", "Number seven, \"Compare\" the people's role. At the start: they settled by the Nile and worked together on irrigation.", "تاب «(7) قارن» + جدول عمودين «النشأة / الاستمرارية».", "—", "ص16، ص20"], ["D5.10", "وفي الاستمرارية: بيشارك، وبينتج، وبيحافظ على الهوية، وبيدافع عن الوطن.", "For continuity: they take part, produce, preserve identity, and defend the nation.", "العمود الأول يتملي.", "—", "ص16، ص17"], ["D5.11", "رقم تمانية، «حلّل» فقدان الأركان: شعب مش واعي يضعّف الدولة، ومن غير حدود مفيش دولة،", "Number eight, \"Analyze\" losing pillars: an unaware people weakens the state, without borders there's no state,", "تاب «(8) حلّل».", "—", "ص20"], ["D5.12", "ومن غير سلطة يضيع النظام، ومن غير سيادة يضيع القرار.", "without authority order is lost, without sovereignty decisions are lost.", "4 أعمدة صغيرة بيميلوا واحد واحد.", "—", "ص12، ص13"], ["D5.13", "رقم تسعة، «اختر مع التبرير»: الأكثر تأثيرًا في الاستمرار، الموقع ولا الحكومة ولا الجيش؟", "Number nine, \"Choose and justify\": what mattered most for continuity, location, government, or the army?", "تاب «(9) اختر مع التبرير». [↺]", "—", "ص20"], ["D5.14", "مثلًا الجيش، لأنه «كان ولا يزال» بيحمي الحدود. والموقع كمان صح لو برّرته.", "For example the army, because it \"was and still is\" protecting the borders. Location is right too if justified.", "—", "—", "ص16، ص17"], ["D5.15", "رقم عشرة، «اكتب فقرة»: الشعب مصدر السلطات، والسلطة بتمكّن السيادة على الحيز،", "Number ten, \"Write a paragraph\": the people are the source of powers, authority enables sovereignty over the territory,", "تاب «(10) اكتب فقرة».", "—", "ص12، ص15"], ["D5.16", "ولو ركن اختل، الدولة كلها بتتأثر.", "and if one pillar fails, the whole state is affected.", "—", "—", "ص9، ص13"], ["D5.17", "رقم حداشر، «تخيّل قريتك دولة مصغّرة». حيزها حدودها، ومصدر سلطتها أهلها، زي ما الشعب مصدر السلطات.", "Number eleven, \"Imagine your village as a mini-state.\" Its territory is its limits, and its authority comes from its people, as the people are the source of powers.", "تاب «(11) تخيّل» + قرية صغيرة جوّه خط حدود.", "—", "ص12، ص20"]]}, {"id": "D6", "title": "لوحات «احفظ دي» (3 لوحات، كل لوحة تملا الشاشة)", "chap": "الفصل 4 — «ركن الامتحان واحفظ دي» (السبورة D)", "rows": [["D6.1", "ودلوقتي تلات لوحات «احفظ دي». وقّف وصوّر كل واحدة.", "Now three \"Memorize this\" panels. Pause and screenshot each one.", "تاب «📸 وقّف وصوّر». [↺]", "—", "—"], ["D6.2", "الأولى: الدولة والحيز.", "The first: the state and territory.", "**لوحة 1** تملا الشاشة: الكروت 1–8، عمودين × 4، كلمات مفتاحية بس. كل كارت ينوّر على كلمته.", "—", "ص11–13"], ["D6.3", "الكروت دي فيها التعريفات، والأركان، والأدوار، والحدود.", "These cards hold the definitions, pillars, roles and borders.", "**ثبات 5 ثواني بصمت.**", "—", "ص13"], ["D6.4", "التانية: السلطة والسيادة، والترابط، وأثر غياب كل ركن.", "The second: authority and sovereignty, interdependence, and losing a pillar.", "**لوحة 2**: الكروت 9–15. **ثبات 5 ثواني بصمت.**", "—", "ص9، ص14–15"], ["D6.5", "التالتة: المقومات الست، والنيل، ومينا، والجيش، والهوية.", "The third: the six foundations, the Nile, Menes, the army, identity.", "**لوحة 3**: الكروت 16–23. **ثبات 5 ثواني بصمت.**", "—", "ص16–18"]]}, {"id": "D7", "title": "الإجابة الكاملة لسؤال الدرس والختام — السبورة D", "chap": "الفصل 4 — «ركن الامتحان واحفظ دي» (السبورة D)", "rows": [["D7.1", "سؤال الدرس: ليه دول عاشت عبر التاريخ، ودول اندثرت؟", "The lesson's question: why did some states last through history while others vanished?", "نسخة من سهم ✓ والمربعين «دولة قديمة» على السبورة D (من غير رجوع للسبورة A). [↺]", "—", "ص11"], ["D7.2", "الدول اللي بتعيش هي اللي أركانها كاملة ومترابطة، ومقوماتها بتدعمها. وده اللي خلّى مصر تستمر.", "The states that last are those whose pillars are complete and linked, and whose foundations support them. That's what kept Egypt going.", "الأربع خانات «الإجابة» تتملي مع بعض.", "• الإجابة: أركان كاملة ومترابطة + مقومات (على «تستمر»)", "ص9"], ["D7.3", "دلوقتي حلّ كويز الدرس في خُطوة.", "Now take the lesson quiz in Khutwa.", "شعار «خُطوة» + زرار «حلّ الكويز».", "—", "—"], ["D7.4", "واكتبلي في الكومنتات: النيل ولا الموقع، مين العامل الحاسم في قيام مصر؟", "Tell me in the comments: the Nile or the location, which was decisive in Egypt's rise?", "فقاعة كومنت «النيل؟ ولا الموقع؟».", "—", "ص16، ص20"]]}], "dec": ["1. **B4.10، جملة الربط:** «الشعب مصدر السلطات، والدولة بسلطاتها بتمارس السيادة» بتحل اللخبطة بين م4 وتعريف السيادة. بس دي صياغة مني، مش نص الكتاب. تفضل ولا تتشال؟", "2. **A2.9–A2.10، ربط عبارات م1 بالأركان:** «موحدة لا تقبل التجزئة» = الحيز، و«نظامها جمهوري ديمقراطي» = السلطة. ده تحليل مني لنص المادة. الكتاب بيطلب الاستنتاج، وبيكتب النتيجة من غير ما يربط كل عبارة بركن. موافق على الربط ده؟", "3. **B5.4، «من غير شعب مفيش مين يشارك ويبني»:** استنتاج من دور الشعب في ص12، والكتاب ما قالهوش بالنص.", "4. **C2.7، شرح «دولة نهر / دولة برزخ»:** نص الاقتباس دلوقتي مظبوط من صورة ص16، بس الكتاب ما بيشرحش المعنى. الشرح مني: «نهر» يعني بسبب النيل، و«برزخ» يعني بيربط القارات.", "5. **تقسيم المقومات لطبيعية وبشرية:** صورة ص16 ما فيهاش عناوين فرعية بالتقسيم ده، فشلت تصنيف المقومات من السكريبت. سؤال (د) في D4.4 بيستخدم لفظ الكتاب بس. اتقفل، إلا لو عايز التصنيف يرجع.", "6. **المدة ≈ 24:30، والمطلوب 22–23 دقيقة.** الزيادة جاية من تغطية المراجعات الأربعة، ومعاها وقفات ولوحات بـ≈ 61 ث.", "   - لو عايزها ≈ 23:15، شيل ≈ 120 كلمة. التغطية مش هتتأثر:", "     - تشبيه الملعب (A4.1)", "     - تشبيه الدرون (A4.12)", "     - تشبيه الفلوس (B4.1)", "     - تشبيه القريتين (C3.6)", "     - الكلام اللي بيتقال على لوحات D6.2–D6.5 (اللوحات تفضل بثباتها)", "     - المشروع البحثي (D2.7)", "     - D3.8–D3.9 (الجدول يفضل على السبورة من غير كلام)", "   - بس الحاجات دي بتقلل الأمثلة وإعادة الجذب.", "7. **الخريطة:**", "   - الشكل الخارجي متشف من ص13، ولازم يتراجع على الخريطة الرسمية: الجنوب خط مستقيم، وسينا كاملة، ومن غير ما ترسم تيران وصنافير كجزر مصرية.", "   - على الخريطة «السودان» و«ليبيا» بس، و«فلسطين» في الكارت 7 بس، زي ما مراجعة devil قالت.", "   - خريطة الكتاب فيها كمان «الأردن» و«المملكة العربية السعودية». لو عايزهم على الخريطة قولي.", "8. **B4.12، «والأمثلة القديمة هتقابلها في الدرس الجاي»:** وعد مبني على عنوان الدرس التاني في الفهرس ص5، «الدولة المصرية القديمة ومقاومة الاحتلال». أكّد إن الدرس التاني فعلًا فيه مثال لاستقلال القرار.", "9. **إجابات من غير مفتاح في الكتاب:**", "   - «اختر» (أ) في التجانس، وإجابة سؤال الصورة (أ) السلطة والسيادة. سندهم قوي (ص15، ص17)، بس الكتاب ما فيهوش مفتاح إجابة.", "   - الإجابات النموذجية للأسئلة اللي فيها رأي: D4.4، وD5.14، وC3.24.", "10. **حذف تحريري، زي v2:** جزء خطاب الرئيس في ص15 («كلمات للتاريخ») مش في الفيديو، ومفيش عليه سؤال."], "chap": ["00:00 الفصل 1 — الدولة وأركانها (١): يعني إيه دولة؟ الشعب والحيز الجغرافي", "06:49 الفصل 2 — الدولة وأركانها (٢): السلطة والسيادة، ولو ركن غاب", "11:54 الفصل 3 — مقومات الدولة المصرية", "18:10 الفصل 4 — ركن الامتحان واحفظ دي", "علامات أدق، ممكن تتحط في الوصف:", "`00:22 تعريف الدولة · 01:45 الشعب · 03:34 الحيز والحدود · 05:54 ملخص الفصل 1 · 07:08 السلطات التلاتة · 08:39 العلاقة بين السلطات وأهميتها · 09:09 السيادة · 10:27 لو ركن غاب · 12:17 الموقع والموارد · 14:43 التجانس والحكومة المركزية والجيش والهوية · 18:23 أسئلة ص18 · 19:12 «اختر» وسؤال الصورة · 20:33 «بالتعاون مع زملائك» · 21:22 أسئلة المقال (ص20) · 23:29 لوحات «احفظ دي» · 24:06 إجابة سؤال الدرس`"]};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>');
const words=D.boards.reduce((a,b)=>a+b.rows.reduce((x,r)=>x+r[1].split(/\s+/).length,0),0);
function overview(){let h='<div class="card"><h3>الفيديو</h3><p>فيديو واحد على يوتيوب، 4 فصول، كل فصل على سبورة. حوالي <b>'+words+'</b> كلمة منطوقة ≈ <b>24 دقيقة</b>. '+D.boards.length+' شريحة = '+D.boards.length+' فويس نوت.</p><h3>فصول يوتيوب</h3>'+D.chap.map(l=>'<div>'+md(l)+'</div>').join('')+'</div>';
h+='<div class="card"><h3>قرارات محتاجة رأيك قبل التسجيل</h3>'+D.dec.map(l=>'<p>'+md(l)+'</p>').join('')+'</div>';return h}
function script(){let h='',c='';for(const b of D.boards){if(b.chap!==c){c=b.chap;h+='<h2>'+esc(c)+'</h2>'}
h+='<div class="card"><h3>'+b.id+' — '+md(b.title)+'</h3><div class="wrap"><table><tr><th>#</th><th>الكلام المنطوق</th><th>English</th><th>على السبورة</th><th>ملخص</th><th>مصدر</th></tr>'+b.rows.map(r=>'<tr><td class="id">'+r[0]+'</td><td class="sp">'+md(r[1])+'</td><td class="en">'+md(r[2])+'</td><td>'+md(r[3])+'</td><td>'+md(r[4])+'</td><td>'+md(r[5])+'</td></tr>').join('')+'</table></div></div>'}return h}
let sz=1.6;try{sz=+localStorage.getItem('tpsz')||1.6}catch(e){}
function tele(){let h='<div class="ctl card">حجم الخط: <button id="sm">أصغر</button><button id="lg">أكبر</button> · كل مربع = فويس نوت واحدة. اسكت ثانيتين قبل وبعد.</div><div class="tp" style="--tpsize:'+sz+'rem">';let c='';
for(const b of D.boards){if(b.chap!==c){c=b.chap;h+='<h2>'+esc(c)+'</h2>'}h+='<div class="board"><div class="nh">فويس نوت '+b.id+' — '+md(b.title)+'</div>'+b.rows.map(r=>'<p><span class="rid">'+r[0]+'</span>'+md(r[1])+'</p>').join('')+'</div>'}return h+'</div>'}
function show(v){if(!['overview','script','tele'].includes(v))v='overview';document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
document.getElementById('m').innerHTML=v==='overview'?overview():v==='script'?script():tele();
if(v==='tele'){const set=d=>{sz=Math.max(1,Math.min(3.2,sz+d));try{localStorage.setItem('tpsz',sz)}catch(e){}document.querySelector('.tp').style.setProperty('--tpsize',sz+'rem')};document.getElementById('sm').onclick=()=>set(-.2);document.getElementById('lg').onclick=()=>set(.2)}}
document.getElementById('tabs').onclick=e=>{const v=e.target.dataset.v;if(v){location.hash=v}};
addEventListener('hashchange',()=>show(location.hash.slice(1)));show(location.hash.slice(1));
</script></body></html>
