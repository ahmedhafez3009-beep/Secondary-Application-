<script id="boards" type="application/json">{"L2A": "<!doctype html><html lang=\"ar\" dir=\"rtl\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>خُطوة · تاريخ · الدرس ٢ · السبورة L2A (الفصل الأول · ص٢١–٢٤)<\/title>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@500;700&display=swap\">\n<style>\n*{box-sizing:border-box}body{margin:0;background:#0b1620;color:#e8eef0;font-family:Cairo,Tahoma,sans-serif}\n#wrap{max-width:1280px;margin:0 auto;padding:8px}\n#stage{position:relative;width:100%;aspect-ratio:16/9;background:#FCFCFA;border-radius:10px;overflow:hidden;user-select:none}\n#stage svg{position:absolute;inset:0;width:100%;height:100%}\n#world text{font-family:Lalezar,Cairo,Tahoma,sans-serif}\n#bar{position:absolute;inset:auto 0 0 0;height:12%;background:#0E2A47;display:flex;align-items:center;gap:1.2%;padding:0 2%;font-size:clamp(11px,2.1vw,26px);font-weight:700;color:#fff}\n#who{background:#1EA05F;border-radius:999px;padding:.1em .8em;font-size:.72em;white-space:nowrap}\n#sub{flex:1;min-width:0;line-height:1.35}#sub .w{color:#7f93a8}#sub .w.on{color:#fff}#sub .w.cur{color:#F5BE32}#sub .pz{font-size:.6em;border:1px dashed #7f93a8;border-radius:4px;padding:0 .35em;color:#7f93a8;white-space:nowrap}#sub .pz.cur{color:#fff;background:#D7463C;border-color:#D7463C}\n#cd{position:absolute;inset:0 0 12% 0;display:grid;place-items:center;font:400 22vw Lalezar,sans-serif;color:#D7463C;background:rgba(252,252,250,.6)}#cd[hidden]{display:none}#msg{color:#F5BE32;font-size:13px;width:100%}#src{font-size:.6em;color:#F5BE32;white-space:nowrap;font-weight:500}\n#badge{position:absolute;top:2.2%;right:1.6%;display:flex;align-items:center;gap:.5em;font-size:clamp(9px,1.5vw,19px);color:#0E2A47;font-weight:700;line-height:1.15}\n#badge i{width:2.4em;height:2.4em;border-radius:50%;border:.22em solid #1EA05F;display:grid;place-items:center;font-style:normal;font-family:Lalezar;font-size:1.2em;background:#fff}\n#badge b{display:block}#badge span span{color:#C99A1B;font-size:.85em}\n#sl{position:absolute;top:2.2%;left:1.6%;background:#0E2A47;color:#fff;border-radius:8px;padding:.15em .7em;font-size:clamp(9px,1.4vw,18px);font-weight:700}\n#ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;font-size:14px}\n#ctl button,#ctl label{background:#16212c;color:#e8eef0;border:1px solid #2a3945;border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}\n#ctl button[aria-pressed=true]{background:#1EA05F;border-color:#1EA05F}#seek{flex:1;min-width:140px}#tm{font-variant-numeric:tabular-nums}\n#note{color:#9aa9ad;font-size:13px;margin:8px 2px;line-height:1.7}\nbody.rec #ctl,body.rec #note{display:none}body.rec #wrap{max-width:none;padding:0}body.rec #stage{border-radius:0}\n@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}.blink{transform-box:fill-box;transform-origin:center;animation:blink 3.4s infinite}\n<\/style><\/head><body><div id=\"wrap\">\n<div id=\"stage\">\n <svg id=\"world\" viewBox=\"0 0 3200 1800\" preserveAspectRatio=\"xMidYMin slice\"><defs><pattern id=\"dots\" width=\"48\" height=\"48\" patternUnits=\"userSpaceOnUse\"><circle cx=\"24\" cy=\"24\" r=\"2\" fill=\"#d9dcd8\"/><\/pattern><\/defs><rect y=\"-1800\" width=\"3200\" height=\"9800\" fill=\"#FCFCFA\"/><rect y=\"-1800\" width=\"3200\" height=\"9800\" fill=\"url(#dots)\"/><g id=\"L\"><\/g><\/svg>\n <svg id=\"ov\" viewBox=\"0 0 1280 720\"><g id=\"pen\" visibility=\"hidden\"><g transform=\"rotate(28)\"><path d=\"M0,0 L-7,-22 L7,-22 Z\" fill=\"#e9d9b0\" stroke=\"#0E2A47\" stroke-width=\"1.5\"/><rect x=\"-7\" y=\"-112\" width=\"14\" height=\"90\" fill=\"#0E2A47\"/><rect x=\"-7\" y=\"-40\" width=\"14\" height=\"9\" fill=\"#1EA05F\"/><rect x=\"-8\" y=\"-128\" width=\"16\" height=\"18\" rx=\"3\" fill=\"#1EA05F\"/><\/g><\/g><\/svg>\n <div id=\"badge\"><i>أ<\/i><span><b>أحمد الألفي<\/b><span>خُطوة من Add Value<\/span><\/span><\/div><div id=\"sl\"><\/div>\n <div id=\"cd\" hidden><\/div><div id=\"bar\"><span id=\"who\">أحمد<\/span><span id=\"sub\"><\/span><span id=\"src\"><\/span><\/div>\n<\/div>\n<div id=\"ctl\">\n <button id=\"play\">▶ تشغيل<\/button><button id=\"re\">↺ إعادة<\/button><input id=\"seek\" type=\"range\" min=\"0\" max=\"1000\" value=\"0\"><span id=\"tm\">0:00<\/span>\n <button id=\"rec\" style=\"background:#D7463C;border-color:#D7463C\">● سجّل الشريحة (عدّ ٣)<\/button><label style=\"cursor:default\">السرعة <input id=\"spd\" type=\"range\" min=\"0.7\" max=\"1.4\" step=\"0.05\" value=\"1\" style=\"vertical-align:middle\"> <span id=\"spdv\">100%<\/span><\/label>\n <button id=\"prev\">→ الشريحة اللي قبل<\/button><button id=\"next\">الشريحة الجاية ←<\/button>\n <button id=\"mode\" aria-pressed=\"false\">وضع الشرايح<\/button><button id=\"snd\" aria-pressed=\"true\">الصوت<\/button>\n <label>ارفع فويس الشريحة دي <input id=\"af\" type=\"file\" accept=\"audio/*\" hidden><\/label><button id=\"sync\">ظبط التوقيت على صوتي<\/button><button id=\"tap\" style=\"background:#1EA05F;border-color:#1EA05F\">جملة (Enter)<\/button><button id=\"cp\">انسخ كود التوقيت<\/button><span id=\"msg\"><\/span><button id=\"recm\">وضع تسجيل الشاشة<\/button><button id=\"fs\">ملء الشاشة<\/button>\n<\/div>\n<p id=\"note\">نسخة v1 · السبورة L2A (الدرس ٢ · الفصل الأول · ص٢١–٢٤). <b>التسجيل:<\/b> دوس «سجّل الشريحة»، هيعدّ ٣ وبعدين الكلام يتعلّم كلمة كلمة تحت وإنت بتقرا، والرسم ماشي معاه (ظبّط السرعة على كلامك). <b>بعد التسجيل:<\/b> ارفع فويس الشريحة، دوس «ظبط التوقيت على صوتي»، ودوس Enter أول ما تسمع بداية كل جملة؛ الرسم هيتشدّ على صوتك. شغّل واتأكد، وبعدين «انسخ كود التوقيت» وابعتهولي أثبّته. في «وضع الشرايح»: دوسة على شمال الشاشة للشريحة الجاية وعلى اليمين للي قبلها، والمسافة للتشغيل، والعرض بيقف آخر كل شريحة. للخروج من وضع تسجيل الشاشة دوس Esc.<\/p>\n<\/div>\n<script>\nconst G='#1EA05F',GD='#106942',N='#0E2A47',R='#D7463C',Y='#F5BE32',YD='#C99A1B',SAND='#F3E3B5',GR='#666';\nconst CW=1066,CH=600,NS='http://www.w3.org/2000/svg';\nconst OS=1.35;let CUR=[],LASTW=null,IT=[],LINES=[],CAM=[[0,2133,0,CW,CH]],SL=[],SFX=[],T0=0,ox=0,oy=0,LD=0;\nconst sm=p=>{p=Math.max(0,Math.min(1,p));return p*p*(3-2*p)};\nfunction cell(c,r){ox=(2-c)*CW;oy=r*CH}\nfunction camTo(o,x,y,w,h,d=1.2){const t=T0+o,l=CAM[CAM.length-1];CAM.push([t,l[1],l[2],l[3],l[4]],[t+d,x,y,w,h]);SFX.push({t,k:'whoosh'})}\nfunction go(c,r){cell(c,r);camTo(0,ox,oy,CW,CH)}\nfunction line(id,src,txt,fn){const words=txt.replace(/\\[\\[[\\d.]+\\]\\]/g,'').trim().split(/\\s+/).length;let pz=0;txt.replace(/\\[\\[([\\d.]+)\\]\\]/g,(m,v)=>pz+=+v);\n LD=words*0.58+pz+0.45;let cu=0;const tk=txt.trim().split(/\\s+/).filter(Boolean).map(w=>{const m=w.match(/^\\[\\[([\\d.]+)\\]\\]$/),d=m?+m[1]:.58,o={w,p:!!m,v:m&&m[1],s:cu,e:cu+d};cu+=d;return o});\n CUR=tk;LINES.push({id,src,tk,t:T0,d:LD,txt:txt.replace(/\\s*\\[\\[[\\d.]+\\]\\]\\s*/g,' ').trim()});fn&&fn();T0+=LD}\n/* at('كلمة'[,n]) = وقت بداية أول (أو رقم n) كلمة فيها النص ده في السطر الحالي؛ استخدمها كـ offset لأي عنصر */\nfunction at(sub,n){let c=0;for(const k of CUR){if(!k.p&&k.w.includes(sub)){if(c==(n||0))return k.s/OS;c++}}throw new Error('at: «'+sub+'» مش في السطر: '+CUR.map(k=>k.w).join(' '))}\nfunction slide(name){SL.push({t:T0,name})}\nfunction W(o,x,y,txt,sz,col,a){IT.push(LASTW={k:'w',t:T0+o*OS,x:ox+x,y:oy+y,txt,sz,col,a:a||'end',d:Math.min(1.4,.06*txt.length+.3),cx:ox,cy:oy})}\nfunction P(o,d,col,w,dur,fill,cls){IT.push({k:'p',t:T0+o*OS,tx:ox,ty:oy,dd:d,col,w:w||3,d:dur||.8,fill,cls})}\nfunction ST(o,x,y,ok){IT.push({k:'s',t:T0+o*OS,x:ox+x,y:oy+y,ok,d:.5});SFX.push({t:T0+o*OS,k:ok?'chime':'tick'})}\nfunction Q(o,x,y,dur){o*=OS;IT.push({k:'q',t:T0+o,x:ox+x,y:oy+y,d:dur<3?dur:LD-o});SFX.push({t:T0+o,k:'tick'},{t:T0+o+1,k:'tick'},{t:T0+o+2,k:'tick'})}\nfunction AR(o,x1,y,x2){P(o,`M${x1},${y} H${x2} M${x2},${y} l14,-9 M${x2},${y} l14,9`,N,3,.4)}\nfunction CARD(o,x,y,w,h,col,fill){P(o,`M${x},${y} h${w} v${h} h${-w} Z`,col,3,.7,fill||'#fff');SFX.push({t:T0+o*OS,k:'chime'})}\nfunction BOOM(o){SFX.push({t:T0+o,k:'boom'})}\n\n\n/* ---- إضافات v5: تكملة نص على نفس السطر، إخفاء عنصر مؤقت، عدّاد وقفة، أشكال متكررة ---- */\nfunction WC(o,txt,col,gap){const p=LASTW;IT.push(LASTW={k:'w',t:T0+o*OS,x:p.x,y:p.y,txt,sz:p.sz,col:col||p.col,a:'end',d:Math.min(1.4,.06*txt.length+.3),cx:p.cx,cy:p.cy,af:p,gp:gap==null?p.sz*.28+12:gap})}\nfunction FADE(o,n){for(let i=1;i<=(n||1);i++)IT[IT.length-i].off=T0+o*OS}\nconst atp=n=>CUR.filter(k=>k.p)[n||0].s/OS,EOL=()=>LD/OS;\nconst CI=(x,y,r)=>`M${x-r},${y} a${r},${r} 0 1,0 ${2*r},0 a${r},${r} 0 1,0 ${-2*r},0 `;\nconst EL=(x,y,a,b)=>`M${x-a},${y} a${a},${b} 0 1,0 ${2*a},0 a${a},${b} 0 1,0 ${-2*a},0 `;\nconst MAN=(x,y,h)=>{const r=h*.15,f=v=>(v).toFixed(1);return CI(x,+f(y+r),+f(r))+`M${x},${f(y+2*r)} V${f(y+h*.66)} M${f(x-h*.2)},${f(y+h*.46)} L${x},${f(y+h*.38)} L${f(x+h*.2)},${f(y+h*.46)} M${x},${f(y+h*.66)} l${f(-h*.14)},${f(h*.34)} M${x},${f(y+h*.66)} l${f(h*.14)},${f(h*.34)} `};\nconst KEY=(x,y,s)=>CI(x,y,13*s)+`M${x+13*s},${y} h${48*s} M${x+47*s},${y} v${12*s} M${x+58*s},${y} v${9*s} `;\nconst CHAIR=(x,y)=>`M${x},${y} V${y-78} M${x},${y-38} H${x+46} V${y} `;\nconst BOOK=(x,y)=>`M${x},${y} q-18,-10 -34,0 v30 q16,-10 34,0 q18,-10 34,0 v-30 q-16,-10 -34,0 v30 `;\nfunction CDR(o,x,y,r,n){for(let k=0;k<n;k++){const a0=-Math.PI/2+k*2*Math.PI/n,a1=a0+2*Math.PI/n*.93,p=a=>`${(x+r*Math.cos(a)).toFixed(1)},${(y+r*Math.sin(a)).toFixed(1)}`;P(o+k/OS,`M${p(a0)} A${r},${r} 0 0,1 ${p(a1)}`,R,6,.92);IT[IT.length-1].off=T0+LD-.05;SFX.push({t:T0+(o+k/OS)*OS,k:'tick'})}}\n\n/*__CONTENT_START__*/\nconst S={\"2A.1\": \"إنت هنا: خلّصنا الدرس الأول. [[0.5]] وعرفنا إن الدولة زي البيت، ليه أربع أركان: شعب، وحيز جغرافي، وسلطة، وسيادة.\", \"2A.2\": \"وفاكر المفتاح؟ [[0.5]] المفتاح هو السيادة: قرار البيت في إيد أصحابه. النهارده هنشوف إيه اللي بيحصل لو حد حاول ياخده.\", \"2A.3\": \"تخيّل بيت على ميدان كبير، وتلات شوارع بتتقابل قدامه. [[0.5]] أرضه خصبة، وجنبه مخزن أكل، والكل عارف كده.\", \"2A.4\": \"وكل واحد معدّي بيبص عليه. [[0.5]] وهو ما عملش حاجة، هو بس حلو قوي. البيت ده اسمه مصر. وسؤال الدرس: «كيف كان الموقع الجغرافي لمصر سلاحًا ذا حدين؟» [[1.0]]\", \"2A.5\": \"سلاح ذو حدين يعني إيه؟ زي موبايل جديد غالي: حلو إنه معاك. [[0.5]] بس لو سبته على ترابيزة الكافيتريا، الكل هيبص عليه.\", \"2A.6\": \"وفي آخر الدرس هتبقى قادر على أربع حاجات: تفهم العلاقة بين موقع مصر والتنافس الدولي عليها. [[0.5]] وتفسّر إزاي الموارد بتتحول من مصدر قوة لسبب صراع.\", \"2A.7\": \"وتستنتج العلاقة بين قوة الدولة من جوّه والأطماع من برّه. [[0.5]] وليه تماسك المجتمع مهم عند المصريين زمان.\", \"2A.8\": \"والفكرة الرئيسة للدرس كله في جملة: الموقع المتميز والموارد الضخمة خلّوا مصر مهمة في العالم القديم. [[0.5]] لكن فترات ضعف الدولة خلّتها هدف للأطماع الخارجية.\", \"2A.9\": \"الحد الأول قوة، والحد التاني ضعف. [[0.5]] احفظ الصورة دي، لأن الدرس كله ماشي عليها.\", \"2A.10\": \"وندخل في التفاصيل. أولًا: دوافع احتلال مصر عبر التاريخ. [[0.5]] الكتاب بيقول إن مصر كانت «محورًا إستراتيجيًا» في السياسة الإقليمية والدولية. محور زي محور العجلة: كل حاجة بتلف حواليه.\", \"2A.11\": \"ودول الاحتلال أدركت إن السيطرة على مصر بتدّيها تفوق سياسي واقتصادي. [[0.5]] وكلمة «الاحتلال» هتتكرر في الدرس كله، فنفكّها دلوقتي.\", \"2A.12\": \"الكتاب بيعرّفه: «سيطرة دولة قوية على أراضي دولة وفرض نفوذها السياسي والإداري عليها من دون موافقة شعبها».\", \"2A.13\": \"«مما يؤدي إلى تقييد سيادة الدولة المحتلة». [[0.5]] وإنت فاكر السيادة: المفتاح. يعني المفتاح بيتشدّ من إيد أصحاب البيت. ونفوذ يعني كلمته ماشية عليك.\", \"2A.14\": \"والكتاب نفسه بيدّيك مثال في آخر الدرس. تخيّل إن عندك بيت صغير وحديقة. [[0.5]] وجارك جاي يرغب في السيطرة على الحديقة.\", \"2A.15\": \"في الأول بأسلوب ناعم: هيغرس لك شجر فاكهة يجيب لكم دخل. وبعدين يبني استراحة في الحديقة. وبعدين يستبيح بيتك ويستخدم الميّه والكهربا.\", \"2A.16\": \"ده المثال اللي الكتاب بيستخدمه علشان تحس بمعنى السيطرة من برّه. [[0.5]] وهتعمل إيه فيه؟ [[1.0]] سيب إجابتك لآخر الدرس.\", \"2A.17\": \"تاني كلمة: «التنافس الدولي». الكتاب بيقول: «صراع بين القوى الكبرى للسيطرة على مناطق النفوذ والمصالح؛ لتوسيع هيمنتها وتحقيق مكاسب سياسية واقتصادية على حساب الآخرين».\", \"2A.18\": \"تخيّل فريقين في المدرسة، وفيه ملعب كورة واحد حلو. كل فريق عايزه لنفسه. [[0.5]] وهيمنة يعني تتحكم.\", \"2A.19\": \"وتالت كلمة: «الأمن القومي». «قدرة الدولة على حماية أراضيها وسيادتها وشعبها ومواردها ومصالحها من التهديدات الداخلية والخارجية، بما يضمن الاستقرار وتحقيق التنمية المستدامة».\", \"2A.20\": \"يعني ترباس البيت وحراسة الباب، من أي خطر من برّه أو من جوّه. [[0.5]] احفظ التلاتة بالصورة: مفتاح اتسحب، وكورة بيتشدّوا عليها، وترباس على الباب.\", \"2A.21\": \"دلوقتي قدامك ستة دوافع لاحتلال مصر. [[0.5]] والكتاب بيطلب تصنّفها: عسكرية، واقتصادية، وإستراتيجية.\", \"2A.22\": \"هنمشي عليهم بالترتيب زي مشوار. واحد: الموقع على مفترق طرق تلات قارات. [[0.5]] واتنين: الإشراف على طرق التجارة العالمية.\", \"2A.23\": \"تلاتة: خصوبة الأرض ووفرة المحاصيل. [[0.5]] وأربعة: مخزن الحبوب للدول الكبرى، زي روما.\", \"2A.24\": \"خمسة: التوسع والتنافس الدولي. [[0.5]] وستة: الرغبة في السيطرة على موازين القوى بالمنطقة. يعني مين الأقوى فيها.\", \"2A.25\": \"الستة جُم بالترتيب ده في الكتاب، فخلّيهم اتنين اتنين: موقع، وموارد، وتنافس. [[0.5]] وده نفس التلات حاجات اللي بيسألك عنها الامتحان.\", \"2A.26\": \"والكتاب بيقول: مصر كانت هدف دايم لقوى الاحتلال، وتعددت محاولات إخضاعها زي الهكسوس والفرس واليونان والرومان. [[0.5]] وده هدّد أمنها القومي بشكل مباشر.\", \"2A.27\": \"وهنبدأ بأول واحدة: الهكسوس.\", \"2A.28\": \"البيت كان واقف سليم. [[0.5]] بس مع نهاية عصر الدولة الوسطى، السلطة المركزية ضعفت. يعني الإدارة الواحدة اللي بتمسك البلد كلها.\", \"2A.29\": \"وبقت مش قادرة تحمي حدودها الشمالية الشرقية. [[0.5]] وده كان بوابة مصر نحو آسيا. وفي وسط الاضطرابات دي، الهكسوس اتسللوا من هناك. واحد واحد، لحد دلتا النيل.\", \"2A.30\": \"والكتاب بيقولك قيمة: «الانتماء يعني التضحية من أجل تراب هذا الوطن».\", \"2A.31\": \"وخد بالك من الصورة اللي في الكتاب: «نموذج لعجلة حربية مصرية من الدولة الحديثة». [[0.5]] هترجعلك كمان شوية.\", \"2A.32\": \"سؤال: ليه نجح الهكسوس؟ [[2.0]] الكتاب بيقول مش بس لضعف الدولة. كان معاهم أسلحة منحتهم التفوق العسكري.\", \"2A.33\": \"وقدرة على الحركة والمناورة في المعركة، ما كانتش متوفرة عند المصريين. المناورة يعني تتحرك وتغيّر مكانك بسرعة.\", \"2A.34\": \"يبقى التلاتة: سلطة ضعيفة، وحدود مش محمية، وأسلحة أقوى. [[0.5]] خد صورة البيت.\", \"2A.35\": \"واختاروا الدلتا يتمركزوا فيها. ليه؟ لأنها «النبض الاقتصادي لمصر»، وأقرب مناطقها اتصالًا بالتجارة اللي جاية من آسيا.\", \"2A.36\": \"وبكده تحكّموا في جزء كبير من الموارد الاقتصادية. [[0.5]] واتخذوا من مدينة أواريس عاصمة سياسية وعسكرية لهم في الشمال.\", \"2A.37\": \"والمقاومة بدأت من الجنوب. [[0.5]] على إيد أمراء طيبة في الأسرة السابعة عشرة. أعلنوا استقلالهم السياسي، وسيطروا على الجنوب. وطيبة كانت مركزهم السياسي والعسكري.\", \"2A.38\": \"وفي عهد كامس، لوحة بتوصف الوضع. [[0.5]] بتقول: «إن مصر مقسمة معي، فهناك حاكم آسيوي في أواريس، وآخر في كوش، وكل رجل يشاركني قطعة من مصر».\", \"2A.39\": \"تلات حكام، ومصر حتت حتت. [[0.5]] والكتاب بيسألك: هل مقولة كامس دعوة مباشرة للتحرير؟ [[3.0]] فكّر: النص بيوصف الأزمة بس، ولا بيدعو لحاجة؟\", \"2A.40\": \"دلوقتي نحكي حرب التحرير نفسها. تلات مراحل، وتلات ناس. [[0.5]] وكأنهم سباق تتابع، والشعلة بتتسلّم من واحد للتاني.\", \"2A.41\": \"المرحلة الأولى: «من التحدي إلى المواجهة». سقنن رع تولّى قيادة طيبة، وكانت بتتمتع بالاستقلال الذاتي. يعني بتدير نفسها بنفسها.\", \"2A.42\": \"وسّع نفوذه لحد أبيدوس، وبدأ يزقّ نفوذ الهكسوس شمالًا. [[0.5]] وهنا الهكسوس أدركوا الخطر الحقيقي: الجيش المصري صحي.\", \"2A.43\": \"والمرحلة دي انتهت بمقتل سقنن رع. [[0.5]] لكن شرارة المقاومة المسلحة ما انطفتش.\", \"2A.44\": \"المرحلة التانية: «من المقاومة إلى التخطيط». كامس تولّى الحكم بعد أبوه، وما اكتفاش بالدفاع. بدأ ينظّم الجيش بروح هجومية.\", \"2A.45\": \"حارب الهكسوس في مصر الوسطى وانتصر عليهم، وبعدين اتجه شمالًا. ولو سألت ليه؟ الكتاب بيدّيك تلات أسباب: يمنعهم من إعادة التمركز، ويضيّق الخناق عليهم، وينقل المعركة لمناطق نفوذ العدو.\", \"2A.46\": \"وكمان قطع طرق الإمدادات اللي جاية من مملكة كوش. الإمدادات يعني الأكل والسلاح اللي بيوصل للجيش.\", \"2A.47\": \"عشان يعزلهم، وينشّف قدراتهم الاقتصادية واحدة واحدة، تمهيدًا للمعركة الحاسمة.\", \"2A.48\": \"ومهارة نتعلمها من أمراء طيبة: التخطيط. [[0.5]] خطّط ليومك ومذاكرتك، وهتبقى أكتر فعالية.\", \"2A.49\": \"بس كامس اتوفّى قبل المعركة الفاصلة. [[0.5]] ومع كده خطته مهّدت الطريق لأحمس. يبقى سؤال الكتاب: هل كامس مهندس النصر رغم إنه ما شهدش المعركة الفاصلة؟ [[3.0]]\", \"2A.50\": \"رأيي من كلام الكتاب: آه ينفع، لأن خطته مهّدت لأحمس. المهندس بيرسم الخطة، حتى لو غيره هو اللي يقطع الشريط.\", \"2A.51\": \"المرحلة التالتة: «الحسم والنصر». أحمس الأول كمّل مسيرة أخوه كامس وأبوه سقنن رع. [[0.5]] وبدأ حملة شاملة ضد الهكسوس.\", \"2A.52\": \"واحد: حاصرهم في منف وأواريس. اتنين: طاردهم خارج حدود مصر، وقضى عليهم نهائيًا.\", \"2A.53\": \"وتلاتة: أخضع حكام الأقاليم تحت نفوذ الدولة، مع إنهم احتفظوا بألقابهم وامتيازاتهم. وده لضمان الاستقرار واستمرار ولائهم له.\", \"2A.54\": \"وما كانش أحمس لوحده. الملكة إياح حتب كانت نموذج للقيادة الوطنية في الأزمات. [[0.5]] حافظت على وحدة الدولة واستقرارها.\", \"2A.55\": \"ودعمت الجيش المصري في حرب التحرير ضد الهكسوس. [[0.5]] وده ساعد على تهيئة الظروف لتحرير البلاد بقيادة أحمس، واستعادة السيادة المصرية. المفتاح رجع.\", \"2A.56\": \"هنا الكتاب بيقول: هكذا تتحول الأزمات الكبرى إلى نقطة انطلاق لمرحلة جديدة. [[0.5]] وأدرك المصريون بعدها ضرورة تطوير الجيش وتأمين حدودهم. وده ساعد في بناء أول إمبراطورية في التاريخ المصري القديم.\", \"2A.57\": \"وفاكر العجلة الحربية؟ الكتاب بيسميها «عبقرية المصريين». [[0.5]] اتعرّفوا عليها وطوّروها. خلّوها أخف وزنًا وأسرع وأكفأ في الحركة والقتال. وده رفع قدرة الجيش على حماية الحدود.\", \"2A.58\": \"وده بيوضّح قدرة المصريين على الاستفادة من الخبرات الوافدة وتطويرها. [[0.5]] بس الحكاية ما خلصتش. فيه قوة جاية: الفرس.\", \"RA1\": \"دقيقة مراجعة. غمّض، وجاوب قبلي.\", \"RA2\": \"الفكرة الرئيسة في صورة؟ [[2.0]] الموقع والموارد قوة، وفترات الضعف خطر.\", \"RA3\": \"الدوافع الستة؟ [[2.0]] موقع على مفترق طرق ثلاث قارات، وطرق التجارة، وخصوبة الأرض، ومخزن الحبوب، والتوسع والتنافس، وموازين القوى.\", \"RA4\": \"ليه نجح الهكسوس؟ [[2.0]] سلطة ضعيفة، وحدود مش محمية، وأسلحة متفوقة.\", \"RA5\": \"مراحل الطرد بالترتيب؟ [[2.0]] سقنن رع، كامس، أحمس.\", \"RA6\": \"وكامس عمل إيه؟ [[2.0]] قطع الإمدادات من كوش، ونقل المعركة شمالًا.\", \"RA7\": \"أحمس؟ [[2.0]] حصار، ومطاردة، وإخضاع حكام الأقاليم.\", \"RA8\": \"ودرس مصر من الهكسوس؟ [[2.0]] تطوير الجيش وتأمين الحدود. وسمّعهم تاني بكرة.\"},SRC={\"2A.1\": \"الدرس الأول\", \"2A.2\": \"الدرس الأول + عنوان الدرس\", \"2A.3\": \"الكتاب تشبيه لـ ص٢٢\", \"2A.4\": \"الكتاب ص٢٢\", \"2A.5\": \"الكتاب ص٢٢ + شرح كلمة + تشبيه\", \"2A.6\": \"الكتاب ص٢١\", \"2A.7\": \"الكتاب ص٢١\", \"2A.8\": \"الكتاب ص٢١\", \"2A.9\": \"الكتاب ص٢١\", \"2A.10\": \"الكتاب ص٢٢ + شرح كلمة\", \"2A.11\": \"الكتاب ص٢٢\", \"2A.12\": \"الكتاب ص٢٢\", \"2A.13\": \"الكتاب ص٢٢ + الدرس الأول + شرح كلمة\", \"2A.14\": \"الكتاب ص٢٨\", \"2A.15\": \"الكتاب ص٢٨\", \"2A.16\": \"الكتاب ص٢٨\", \"2A.17\": \"الكتاب ص٢٢\", \"2A.18\": \"الكتاب ص٢٢ + شرح كلمة + تشبيه\", \"2A.19\": \"الكتاب ص٢٢\", \"2A.20\": \"الكتاب ص٢٢ + تشبيه\", \"2A.21\": \"الكتاب ص٢٢\", \"2A.22\": \"الكتاب ص٢٢\", \"2A.23\": \"الكتاب ص٢٢\", \"2A.24\": \"الكتاب ص٢٢ + شرح كلمة\", \"2A.25\": \"الكتاب ص٢٢ + ص٢٩ + تقسيم للحفظ\", \"2A.26\": \"الكتاب ص٢٢\", \"2A.27\": \"الكتاب ص٢٢\", \"2A.28\": \"الكتاب ص٢٢ + شرح كلمة + الدرس الأول\", \"2A.29\": \"الكتاب ص٢٢\", \"2A.30\": \"الكتاب ص٢٢\", \"2A.31\": \"الكتاب ص٢٢\", \"2A.32\": \"الكتاب ص٢٣\", \"2A.33\": \"الكتاب ص٢٣ + شرح كلمة\", \"2A.34\": \"الكتاب ص٢٢–٢٣\", \"2A.35\": \"الكتاب ص٢٣\", \"2A.36\": \"الكتاب ص٢٣\", \"2A.37\": \"الكتاب ص٢٣\", \"2A.38\": \"الكتاب ص٢٤\", \"2A.39\": \"الكتاب ص٢٤\", \"2A.40\": \"الكتاب ص٢٣–٢٤ + تشبيه\", \"2A.41\": \"الكتاب ص٢٣ + شرح كلمة\", \"2A.42\": \"الكتاب ص٢٣\", \"2A.43\": \"الكتاب ص٢٣\", \"2A.44\": \"الكتاب ص٢٣\", \"2A.45\": \"الكتاب ص٢٣\", \"2A.46\": \"الكتاب ص٢٣ + شرح كلمة\", \"2A.47\": \"الكتاب ص٢٣ + شرح كلمة\", \"2A.48\": \"الكتاب ص٢٣ + تشبيه\", \"2A.49\": \"الكتاب ص٢٣–٢٤\", \"2A.50\": \"الكتاب ص٢٣–٢٤ + تشبيه\", \"2A.51\": \"الكتاب ص٢٤\", \"2A.52\": \"الكتاب ص٢٤\", \"2A.53\": \"الكتاب ص٢٤ + شرح كلمة\", \"2A.54\": \"الكتاب ص٢٤\", \"2A.55\": \"الكتاب ص٢٤ + الدرس الأول\", \"2A.56\": \"الكتاب ص٢٤ + شرح كلمة\", \"2A.57\" /button>\n <label>ارفع فويس الشريحة دي <input id=\"af\" type=\"file\" accept=\"audio/*\" hidden><\/label><button id=\"sync\">ظبط التوقيت على صوتي<\/button><button id=\"tap\" style=\"background:#1EA05F;border-color:#1EA05F\">جملة (Enter)<\/button><button id=\"cp\">انسخ كود التوقيت<\/button><span id=\"msg\"><\/span><button id=\"recm\">وضع تسجيل الشاشة<\/button><button id=\"fs\">ملء الشاشة<\/button>\n<\/div>\n<p id=\"note\">نسخة v1 · السبورة L2B (الدرس ٢ · الفصل ٢ · الفرس والإسكندر والبطالمة). <b>التسجيل:<\/b> دوس «سجّل الشريحة»، هيعدّ ٣ وبعدين الكلام يتعلّم كلمة كلمة تحت وإنت بتقرا، والرسم ماشي معاه (ظبّط السرعة على كلامك). <b>بعد التسجيل:<\/b> ارفع فويس الشريحة، دوس «ظبط التوقيت على صوتي»، ودوس Enter أول ما تسمع بداية كل جملة؛ الرسم هيتشدّ على صوتك. شغّل واتأكد، وبعدين «انسخ كود التوقيت» وابعتهولي أثبّته. في «وضع الشرايح»: دوسة على شمال الشاشة للشريحة الجاية وعلى اليمين للي قبلها، والمسافة للتشغيل، والعرض بيقف آخر كل شريحة. للخروج من وضع تسجيل الشاشة دوس Esc.<\/p>\n<\/div>\n<script>\nconst G='#1EA05F',GD='#106942',N='#0E2A47',R='#D7463C',Y='#F5BE32',YD='#C99A1B',SAND='#F3E3B5',GR='#666';\nconst CW=1066,CH=600,NS='http://www.w3.org/2000/svg';\nconst OS=1.35;let CUR=[],LASTW=null,IT=[],LINES=[],CAM=[[0,2133,0,CW,CH]],SL=[],SFX=[],T0=0,ox=0,oy=0,LD=0;\nconst sm=p=>{p=Math.max(0,Math.min(1,p));return p*p*(3-2*p)};\nfunction cell(c,r){ox=(2-c)*CW;oy=r*CH}\nfunction camTo(o,x,y,w,h,d=1.2){const t=T0+o,l=CAM[CAM.length-1];CAM.push([t,l[1],l[2],l[3],l[4]],[t+d,x,y,w,h]);SFX.push({t,k:'whoosh'})}\nfunction go(c,r){cell(c,r);camTo(0,ox,oy,CW,CH)}\nfunction line(id,src,txt,fn){const words=txt.replace(/\\[\\[[\\d.]+\\]\\]/g,'').trim().split(/\\s+/).length;let pz=0;txt.replace(/\\[\\[([\\d.]+)\\]\\]/g,(m,v)=>pz+=+v);\n LD=words*0.58+pz+0.45;let cu=0;const tk=txt.trim().split(/\\s+/).filter(Boolean).map(w=>{const m=w.match(/^\\[\\[([\\d.]+)\\]\\]$/),d=m?+m[1]:.58,o={w,p:!!m,v:m&&m[1],s:cu,e:cu+d};cu+=d;return o});\n CUR=tk;LINES.push({id,src,tk,t:T0,d:LD,txt:txt.replace(/\\s*\\[\\[[\\d.]+\\]\\]\\s*/g,' ').trim()});fn&&fn();T0+=LD}\n/* at('كلمة'[,n]) = وقت بداية أول (أو رقم n) كلمة فيها النص ده في السطر الحالي؛ استخدمها كـ offset لأي عنصر */\nfunction at(sub,n){let c=0;for(const k of CUR){if(!k.p&&k.w.includes(sub)){if(c==(n||0))return k.s/OS;c++}}throw new Error('at: «'+sub+'» مش في السطر: '+CUR.map(k=>k.w).join(' '))}\nfunction slide(name){SL.push({t:T0,name})}\nfunction W(o,x,y,txt,sz,col,a){IT.push(LASTW={k:'w',t:T0+o*OS,x:ox+x,y:oy+y,txt,sz,col,a:a||'end',d:Math.min(1.4,.06*txt.length+.3),cx:ox,cy:oy})}\nfunction P(o,d,col,w,dur,fill,cls){IT.push({k:'p',t:T0+o*OS,tx:ox,ty:oy,dd:d,col,w:w||3,d:dur||.8,fill,cls})}\nfunction ST(o,x,y,ok){IT.push({k:'s',t:T0+o*OS,x:ox+x,y:oy+y,ok,d:.5});SFX.push({t:T0+o*OS,k:ok?'chime':'tick'})}\nfunction Q(o,x,y,dur){o*=OS;IT.push({k:'q',t:T0+o,x:ox+x,y:oy+y,d:dur<3?dur:LD-o});SFX.push({t:T0+o,k:'tick'},{t:T0+o+1,k:'tick'},{t:T0+o+2,k:'tick'})}\nfunction AR(o,x1,y,x2){P(o,`M${x1},${y} H${x2} M${x2},${y} l14,-9 M${x2},${y} l14,9`,N,3,.4)}\nfunction CARD(o,x,y,w,h,col,fill){P(o,`M${x},${y} h${w} v${h} h${-w} Z`,col,3,.7,fill||'#fff');SFX.push({t:T0+o*OS,k:'chime'})}\nfunction BOOM(o){SFX.push({t:T0+o,k:'boom'})}\n\n\n/* ---- إضافات v5: تكملة نص على نفس السطر، إخفاء عنصر مؤقت، عدّاد وقفة، أشكال متكررة ---- */\nfunction WC(o,txt,col,gap){const p=LASTW;IT.push(LASTW={k:'w',t:T0+o*OS,x:p.x,y:p.y,txt,sz:p.sz,col:col||p.col,a:'end',d:Math.min(1.4,.06*txt.length+.3),cx:p.cx,cy:p.cy,af:p,gp:gap==null?p.sz*.28:gap})}\nfunction FADE(o,n){for(let i=1;i<=(n||1);i++)IT[IT.length-i].off=T0+o*OS}\nconst atp=n=>CUR.filter(k=>k.p)[n||0].s/OS,EOL=()=>LD/OS;\nconst CI=(x,y,r)=>`M${x-r},${y} a${r},${r} 0 1,0 ${2*r},0 a${r},${r} 0 1,0 ${-2*r},0 `;\nconst EL=(x,y,a,b)=>`M${x-a},${y} a${a},${b} 0 1,0 ${2*a},0 a${a},${b} 0 1,0 ${-2*a},0 `;\nconst MAN=(x,y,h)=>{const r=h*.15,f=v=>(v).toFixed(1);return CI(x,+f(y+r),+f(r))+`M${x},${f(y+2*r)} V${f(y+h*.66)} M${f(x-h*.2)},${f(y+h*.46)} L${x},${f(y+h*.38)} L${f(x+h*.2)},${f(y+h*.46)} M${x},${f(y+h*.66)} l${f(-h*.14)},${f(h*.34)} M${x},${f(y+h*.66)} l${f(h*.14)},${f(h*.34)} `};\nconst KEY=(x,y,s)=>CI(x,y,13*s)+`M${x+13*s},${y} h${48*s} M${x+47*s},${y} v${12*s} M${x+58*s},${y} v${9*s} `;\nconst CHAIR=(x,y)=>`M${x},${y} V${y-78} M${x},${y-38} H${x+46} V${y} `;\nconst BOOK=(x,y)=>`M${x},${y} q-18,-10 -34,0 v30 q16,-10 34,0 q18,-10 34,0 v-30 q-16,-10 -34,0 v30 `;\nfunction CDR(o,x,y,r,n){for(let k=0;k<n;k++){const a0=-Math.PI/2+k*2*Math.PI/n,a1=a0+2*Math.PI/n*.93,p=a=>`${(x+r*Math.cos(a)).toFixed(1)},${(y+r*Math.sin(a)).toFixed(1)}`;P(o+k/OS,`M${p(a0)} A${r},${r} 0 0,1 ${p(a1)}`,R,6,.92);IT[IT.length-1].off=T0+LD-.05;SFX.push({t:T0+(o+k/OS)*OS,k:'tick'})}}\n\n/*__CONTENT_START__*/\nconst S={\"2B.1\": \"إنت هنا: الهكسوس اتطردوا والمفتاح رجع. [[0.5]] بس القصة ما خلصتش. الدبوس بيتحرك للجزء اللي بعده: الغزو الفارسي.\", \"2B.2\": \"وسؤال الكتاب بيبدأ بيه: هل سقوط مصر كان بسبب قوة الفرس بس؟ [[2.0]] ولا بسبب ظروف داخلية أضعفت الدولة المصرية؟\", \"2B.3\": \"في العصر المتأخر، مصر كانت في اضطراب سياسي وصراع داخلي. [[0.5]] زي بيت أهله متخانقين: الباب مقفول، بس جوّه الكل مشغول بالخناق.\", \"2B.4\": \"وبكده بقت مصر هدف للأطماع الخارجية. [[0.5]] خاصةً من الإمبراطورية الفارسية.\", \"2B.5\": \"والكتاب بيقول عنها: «كانت إمبراطورية الفُرس عابرة للقارات». [[0.5]] يعني مش في قارة واحدة. وبيطلب منك تشوف الخريطة وتناقش.\", \"2B.6\": \"سنة خمسمية خمسة وعشرين قبل الميلاد، الجيشين المصري والفارسي اتقابلوا في شرق الدلتا.\", \"2B.7\": \"وانتهت المواجهة بدخول الفرس لمصر بقيادة الملك قمبيز التاني. وأخضعوها لسلطتهم.\", \"2B.8\": \"وأسسوا الأسرة السابعة والعشرين. [[0.5]] احفظ: خمسمية خمسة وعشرين، الخمسة في الأول وفي الآخر، واتنين في النص زي «قمبيز التاني».\", \"2B.9\": \"وسؤال: إيه أهمية ضم مصر لدولة الفرس؟ [[2.0]] فكّر. وسؤال تاني: هل المصريين قبلوا الاحتلال الفارسي من غير مقاومة؟\", \"2B.10\": \"لأ. الكتاب بيقول: ما قبلهوش. حصلت حركات مقاومة وثورات علشان يرجّعوا الاستقلال الوطني.\", \"2B.11\": \"وده بيعكس تمسّكهم بهُويتهم ورفضهم للسيطرة الأجنبية. [[0.5]] والهُوية يعني اللي بيقول إنت مين.\", \"2B.12\": \"يعني القيمة اللي نأكدها من المقاومة: التمسّك بالهوية ورفض السيطرة الأجنبية. وده نفس اللي حصل مع الهكسوس.\", \"2B.13\": \"رابعًا: الإسكندر الأكبر. [[0.5]] سنة تلتمية اتنين وتلاتين قبل الميلاد.\", \"2B.14\": \"صعدت قوة مقدونيا بقيادة الإسكندر، وبدأ حملة واسعة للقضاء على الفرس وطردهم من آسيا الصغرى. وبعد ما انتصر عليهم في عدة معارك حاسمة، اتجه نحو مصر.\", \"2B.15\": \"ومصر ساعتها كانت بتعاني وطأة الحكم الفارسي والضرائب التقيلة. [[0.5]] الضرايب يعني فلوس بتتاخد من الناس.\", \"2B.16\": \"فتقبّلوا قوة خارجية تقدر تقضي على الفرس. ودخل الإسكندر مصر من غير مقاومة تُذكر. [[0.5]] لأنهم لقوه فرصة يتخلصوا بيها من الحكم الفارسي.\", \"2B.17\": \"وخد بالك: الإجابة هنا مش «احترامه لهم»، ولا «قوته». هو دخل من غير مقاومة لأنهم كانوا متعبين من الفرس.\", \"2B.18\": \"واحفظ الرقم بإيقاع: تلاتة، تلاتة، اتنين. تلات دقات، وتلات دقات، ودقتين، والباب اتفتح من غير مقاومة.\", \"2B.19\": \"والكتاب بيقولك قيمة مهمة: «قد يُظهر لك عدوك التودد والمحبة، لكنه سيبقى عدوك الذي يريد القضاء على هُويتك».\", \"2B.20\": \"والكتاب بيقدّم رأيين في استقبال المصريين للإسكندر. الأول: «دخل مصر بعد أن أنهك الفُرس»، ومالقاش مقاومة لإن المصريين اعتبروه مُحرِّرًا.\", \"2B.21\": \"وعمل على احترام تقاليدهم الدينية، علشان يظهر بصورة الحاكم الشرعي، وحافظ على جيشه جاهز لأي تهديد.\", \"2B.22\": \"والتاني: المصريين استقبلوه بحذر، والكهنة ورجال الحكم والإدارة شكّوا في نيته، خصوصًا بعد السيطرة الفارسية الطويلة.\", \"2B.23\": \"ومع كده نجح في تقديم نفسه كحامي للمعابد، واستعادة النظام، ووازن بين القوة العسكرية والسياسة لكسب ثقة السكان.\", \"2B.24\": \"وسؤال الكتاب: قارن بين الرأيين، ووضّح أسباب الاختلاف. [[3.0]] اختلاف الرأيين راجع لإيه؟\", \"2B.25\": \"فكّر في إجابتك. ومن غير ما تنسى، الرأيين كمان ذكروا إنه نجح في الدخول. [[0.5]] وكيف ثبّت حكمه؟ الإسكندر عمل التلات حاجات دي:\", \"2B.26\": \"واحد: حصل على اعتراف ديني بسلطته، بادعائه إنه ابن الإله آمون.\", \"2B.27\": \"واتنين: احترم عادات المصريين وتقاليدهم.\", \"2B.28\": \"وتلاتة: أسّس مدينة الإسكندرية، علشان تبقى مركز تجاري وثقافي وعسكري.\", \"2B.29\": \"وبكده بدأت مرحلة جديدة في العلاقات بين مصر والإغريق. [[0.5]] والكتاب كمان بينقل عن الإسكندر: «أنا مدين لأبي لأنه منحني الحياة، ولأرسطو لأنه علّمني كيف أعيش الحياة بشكل صحيح».\", \"2B.30\": \"ومهارة الدرس هنا: قراءة الخريطة التاريخية. [[0.5]] بتدقّق في كل عناصرها، وتحلّل خط السير، وموقع القوى المتنازعة جغرافيًا.\", \"2B.31\": \"خامسًا: دولة البطالمة في مصر. [[0.5]] سنة تلتمية تلاتة وعشرين قبل الميلاد، الإسكندر مات.\", \"2B.32\": \"وإمبراطوريته واجهت أزمة كبيرة. قادة جيشه دخلوا في صراع طويل علشان كل واحد يسيطر على أكبر قدر من الأراضي.\", \"2B.33\": \"وهنا ظهر القائد بطلميوس بن لاجوس. فرض سيطرته على مصر، وخلّاها قاعدة حكمه.\", \"2B.34\": \"وبكده بدأت مرحلة جديدة في تاريخ مصر: دولة البطالمة. احفظها كده: الإسكندر مات، القادة اتخانقوا، وبطلميوس خد مصر.\", \"2B.35\": \"ولو الأرقام لخبطتك، فيه حيلة قراءة: قبل الميلاد، الرقم بينزل كل ما نقرّب من الميلاد.\", \"2B.36\": \"يبقى الأكبر هو الأقدم: خمسمية خمسة وعشرين الفرس، بعدها تلتمية اتنين وتلاتين الإسكندر دخل، وبعدها تلتمية تلاتة وعشرين مات.\", \"2B.37\": \"والفرق بين الفرس والإسكندر: المصريين قاوموا الفرس بثورات، واستقبلوا الإسكندر من غير مقاومة تُذكر.\", \"2B.38\": \"وده لأن الحكم الفارسي كان تقيل عليهم، والضرايب مثقلة.\", \"2B.39\": \"ولو سألك المدرس: هل مصر قبلت الإسكندر؟ [[1.0]] قول: دخل من غير مقاومة تُذكر، والآراء اتختلفت في درجة قبولهم.\", \"2B.40\": \"لخّصنا: الفرس دخلوا في وقت اضطراب، والمصريين قاوموا. الإسكندر دخل والمصريين تعبانين من الفرس، فدخل من غير مقاومة. وبعد وفاته، بطلميوس.\", \"2B.41\": \"والبطالمة نفسهم هيعانوا من اضطراب وصراعات على السلطة. وده هيفتح الباب لقوة جديدة.\", \"2B.42\": \"والفصل الجاي: الرومان. إيه اللي خلّاهم يبصّوا على مصر، وإزاي سيطروا عليها؟\", \"RB1\": \"دقيقة مراجعة. غمّض، وجاوب قبلي.\", \"RB2\": \"سنة دخول الفرس؟ [[2.0]] خمسمية خمسة وعشرين قبل الميلاد، قمبيز التاني، الأسرة السابعة والعشرين.\", \"RB3\": \"وإزاي المصريين تعاملوا معاهم؟ [[2.0]] قاوموا بثورات، علشان الهوية.\", \"RB4\": \"ليه دخل الإسكندر من غير مقاومة؟ [[2.0]] لإن المصريين تعبوا من الفرس.\", \"RB5\": \"وإزاي ثبّت حكمه؟ [[2.0] \"48\" patternUnits=\"userSpaceOnUse\"><circle cx=\"24\" cy=\"24\" r=\"2\" fill=\"#d9dcd8\"/><\/pattern><\/defs><rect y=\"-1800\" width=\"3200\" height=\"11400\" fill=\"#FCFCFA\"/><rect y=\"-1800\" width=\"3200\" height=\"11400\" fill=\"url(#dots)\"/><g id=\"L\"><\/g><\/svg>\n <svg id=\"ov\" viewBox=\"0 0 1280 720\"><g id=\"pen\" visibility=\"hidden\"><g transform=\"rotate(28)\"><path d=\"M0,0 L-7,-22 L7,-22 Z\" fill=\"#e9d9b0\" stroke=\"#0E2A47\" stroke-width=\"1.5\"/><rect x=\"-7\" y=\"-112\" width=\"14\" height=\"90\" fill=\"#0E2A47\"/><rect x=\"-7\" y=\"-40\" width=\"14\" height=\"9\" fill=\"#1EA05F\"/><rect x=\"-8\" y=\"-128\" width=\"16\" height=\"18\" rx=\"3\" fill=\"#1EA05F\"/><\/g><\/g><\/svg>\n <div id=\"badge\"><i>أ<\/i><span><b>أحمد الألفي<\/b><span>خُطوة من Add Value<\/span><\/span><\/div><div id=\"sl\"><\/div>\n <div id=\"cd\" hidden><\/div><div id=\"bar\"><span id=\"who\">أحمد<\/span><span id=\"sub\"><\/span><span id=\"src\"><\/span><\/div>\n<\/div>\n<div id=\"ctl\">\n <button id=\"play\">▶ تشغيل<\/button><button id=\"re\">↺ إعادة<\/button><input id=\"seek\" type=\"range\" min=\"0\" max=\"1000\" value=\"0\"><span id=\"tm\">0:00<\/span>\n <button id=\"rec\" style=\"background:#D7463C;border-color:#D7463C\">● سجّل الشريحة (عدّ ٣)<\/button><label style=\"cursor:default\">السرعة <input id=\"spd\" type=\"range\" min=\"0.7\" max=\"1.4\" step=\"0.05\" value=\"1\" style=\"vertical-align:middle\"> <span id=\"spdv\">100%<\/span><\/label>\n <button id=\"prev\">→ الشريحة اللي قبل<\/button><button id=\"next\">الشريحة الجاية ←<\/button>\n <button id=\"mode\" aria-pressed=\"false\">وضع الشرايح<\/button><button id=\"snd\" aria-pressed=\"true\">الصوت<\/button>\n <label>ارفع فويس الشريحة دي <input id=\"af\" type=\"file\" accept=\"audio/*\" hidden><\/label><button id=\"sync\">ظبط التوقيت على صوتي<\/button><button id=\"tap\" style=\"background:#1EA05F;border-color:#1EA05F\">جملة (Enter)<\/button><button id=\"cp\">انسخ كود التوقيت<\/button><span id=\"msg\"><\/span><button id=\"recm\">وضع تسجيل الشاشة<\/button><button id=\"fs\">ملء الشاشة<\/button>\n<\/div>\n<p id=\"note\">نسخة v1 · السبورة L2C (الدرس ٢ · الفصل ٣ · الرومان والمقاومة، ودرس الدرس، والمراجعة والختام). <b>التسجيل:<\/b> دوس «سجّل الشريحة»، هيعدّ ٣ وبعدين الكلام يتعلّم كلمة كلمة تحت وإنت بتقرا، والرسم ماشي معاه (ظبّط السرعة على كلامك). <b>بعد التسجيل:<\/b> ارفع فويس الشريحة، دوس «ظبط التوقيت على صوتي»، ودوس Enter أول ما تسمع بداية كل جملة؛ الرسم هيتشدّ على صوتك. شغّل واتأكد، وبعدين «انسخ كود التوقيت» وابعتهولي أثبّته. في «وضع الشرايح»: دوسة على شمال الشاشة للشريحة الجاية وعلى اليمين للي قبلها، والمسافة للتشغيل، والعرض بيقف آخر كل شريحة. للخروج من وضع تسجيل الشاشة دوس Esc.<\/p>\n<\/div>\n<script>\nconst G='#1EA05F',GD='#106942',N='#0E2A47',R='#D7463C',Y='#F5BE32',YD='#C99A1B',SAND='#F3E3B5',GR='#666';\nconst CW=1066,CH=600,NS='http://www.w3.org/2000/svg';\nconst OS=1.35;let CUR=[],LASTW=null,IT=[],LINES=[],CAM=[[0,2133,0,CW,CH]],SL=[],SFX=[],T0=0,ox=0,oy=0,LD=0;\nconst sm=p=>{p=Math.max(0,Math.min(1,p));return p*p*(3-2*p)};\nfunction cell(c,r){ox=(2-c)*CW;oy=r*CH}\nfunction camTo(o,x,y,w,h,d=1.2){const t=T0+o,l=CAM[CAM.length-1];CAM.push([t,l[1],l[2],l[3],l[4]],[t+d,x,y,w,h]);SFX.push({t,k:'whoosh'})}\nfunction go(c,r){cell(c,r);camTo(0,ox,oy,CW,CH)}\nfunction line(id,src,txt,fn){const words=txt.replace(/\\[\\[[\\d.]+\\]\\]/g,'').trim().split(/\\s+/).length;let pz=0;txt.replace(/\\[\\[([\\d.]+)\\]\\]/g,(m,v)=>pz+=+v);\n LD=words*0.58+pz+0.45;let cu=0;const tk=txt.trim().split(/\\s+/).filter(Boolean).map(w=>{const m=w.match(/^\\[\\[([\\d.]+)\\]\\]$/),d=m?+m[1]:.58,o={w,p:!!m,v:m&&m[1],s:cu,e:cu+d};cu+=d;return o});\n CUR=tk;LINES.push({id,src,tk,t:T0,d:LD,txt:txt.replace(/\\s*\\[\\[[\\d.]+\\]\\]\\s*/g,' ').trim()});fn&&fn();T0+=LD}\n/* at('كلمة'[,n]) = وقت بداية أول (أو رقم n) كلمة فيها النص ده في السطر الحالي؛ استخدمها كـ offset لأي عنصر */\nfunction at(sub,n){let c=0;for(const k of CUR){if(!k.p&&k.w.includes(sub)){if(c==(n||0))return k.s/OS;c++}}throw new Error('at: «'+sub+'» مش في السطر: '+CUR.map(k=>k.w).join(' '))}\nfunction slide(name){SL.push({t:T0,name})}\nfunction W(o,x,y,txt,sz,col,a){IT.push(LASTW={k:'w',t:T0+o*OS,x:ox+x,y:oy+y,txt,sz,col,a:a||'end',d:Math.min(1.4,.06*txt.length+.3),cx:ox,cy:oy})}\nfunction P(o,d,col,w,dur,fill,cls){IT.push({k:'p',t:T0+o*OS,tx:ox,ty:oy,dd:d,col,w:w||3,d:dur||.8,fill,cls})}\nfunction ST(o,x,y,ok){IT.push({k:'s',t:T0+o*OS,x:ox+x,y:oy+y,ok,d:.5});SFX.push({t:T0+o*OS,k:ok?'chime':'tick'})}\nfunction Q(o,x,y,dur){o*=OS;IT.push({k:'q',t:T0+o,x:ox+x,y:oy+y,d:dur<3?dur:LD-o});SFX.push({t:T0+o,k:'tick'},{t:T0+o+1,k:'tick'},{t:T0+o+2,k:'tick'})}\nfunction AR(o,x1,y,x2){P(o,`M${x1},${y} H${x2} M${x2},${y} l14,-9 M${x2},${y} l14,9`,N,3,.4)}\nfunction CARD(o,x,y,w,h,col,fill){P(o,`M${x},${y} h${w} v${h} h${-w} Z`,col,3,.7,fill||'#fff');SFX.push({t:T0+o*OS,k:'chime'})}\nfunction BOOM(o){SFX.push({t:T0+o,k:'boom'})}\n\n\n/* ---- إضافات v5: تكملة نص على نفس السطر، إخفاء عنصر مؤقت، عدّاد وقفة، أشكال متكررة ---- */\nfunction WC(o,txt,col,gap){const p=LASTW;IT.push(LASTW={k:'w',t:T0+o*OS,x:p.x,y:p.y,txt,sz:p.sz,col:col||p.col,a:'end',d:Math.min(1.4,.06*txt.length+.3),cx:p.cx,cy:p.cy,af:p,gp:gap==null?p.sz*.28:gap})}\nfunction FADE(o,n){for(let i=1;i<=(n||1);i++)IT[IT.length-i].off=T0+o*OS}\nconst atp=n=>CUR.filter(k=>k.p)[n||0].s/OS,EOL=()=>LD/OS;\nconst CI=(x,y,r)=>`M${x-r},${y} a${r},${r} 0 1,0 ${2*r},0 a${r},${r} 0 1,0 ${-2*r},0 `;\nconst EL=(x,y,a,b)=>`M${x-a},${y} a${a},${b} 0 1,0 ${2*a},0 a${a},${b} 0 1,0 ${-2*a},0 `;\nconst MAN=(x,y,h)=>{const r=h*.15,f=v=>(v).toFixed(1);return CI(x,+f(y+r),+f(r))+`M${x},${f(y+2*r)} V${f(y+h*.66)} M${f(x-h*.2)},${f(y+h*.46)} L${x},${f(y+h*.38)} L${f(x+h*.2)},${f(y+h*.46)} M${x},${f(y+h*.66)} l${f(-h*.14)},${f(h*.34)} M${x},${f(y+h*.66)} l${f(h*.14)},${f(h*.34)} `};\nconst KEY=(x,y,s)=>CI(x,y,13*s)+`M${x+13*s},${y} h${48*s} M${x+47*s},${y} v${12*s} M${x+58*s},${y} v${9*s} `;\nconst CHAIR=(x,y)=>`M${x},${y} V${y-78} M${x},${y-38} H${x+46} V${y} `;\nconst BOOK=(x,y)=>`M${x},${y} q-18,-10 -34,0 v30 q16,-10 34,0 q18,-10 34,0 v-30 q-16,-10 -34,0 v30 `;\nfunction CDR(o,x,y,r,n){for(let k=0;k<n;k++){const a0=-Math.PI/2+k*2*Math.PI/n,a1=a0+2*Math.PI/n*.93,p=a=>`${(x+r*Math.cos(a)).toFixed(1)},${(y+r*Math.sin(a)).toFixed(1)}`;P(o+k/OS,`M${p(a0)} A${r},${r} 0 0,1 ${p(a1)}`,R,6,.92);IT[IT.length-1].off=T0+LD-.05;SFX.push({t:T0+(o+k/OS)*OS,k:'tick'})}}\n\n/*__CONTENT_START__*/\nconst S={\"2C.1\": \"إنت هنا: البطالمة، ودلوقتي الرومان. [[0.5]] هنقفل الورقة التانية في الفرع الأول قريب.\", \"2C.2\": \"سادسًا: مصر تحت حكم الرومان. [[0.5]] في الوقت اللي روما كانت بتشهد فيه تحولات سياسية وعسكرية، كانت دولة البطالمة بتعاني اضطرابات داخلية وصراعات على السلطة.\", \"2C.3\": \"وده أضعف قدرتهم على حماية استقلالهم. [[0.5]] وشكّلت مصر للرومان مركز اقتصادي وإستراتيجي.\", \"2C.4\": \"ليه؟ لأن مصر من أهم مصادر الحبوب في العالم القديم.\", \"2C.5\": \"وكمان موقعها بيدّيها القدرة على التحكم في طرق التجارة بين الشرق والغرب.\", \"2C.6\": \"وده دفع الرومان يسعوا للسيطرة عليها. [[0.5]] يبقى: حبوب، وتجارة، ومركز إستراتيجي.\", \"2C.7\": \"وتمّ ده بعد هزيمة كليوبترا السابعة في معركة أكتيوم البحرية.\", \"2C.8\": \"وسيطرة أكتافيوس على مصر. [[0.5]] فبقت مصر ولاية رومانية، من أهم الولايات الرومانية تميزًا ساعتها.\", \"2C.9\": \"والكتاب بيسأل: لأي مدى سيطرة الرومان على مصر امتلاك لمفتاح القوة الاقتصادية في البحر المتوسط؟ [[3.0]]\", \"2C.10\": \"فكّر في الحبوب والتجارة معًا. [[0.5]] هما بيدّوا القوة الاقتصادية. وده اللي كان الرومان عايزينه.\", \"2C.11\": \"وكمان الكتاب بيطلب منك تحلّل جملة: «سقوط مصر في يد الرومان لم يكن مجرد نتيجة لهزيمة عسكرية، بل كان نتيجة تفاعل بين ضعف دولة البطالمة وصعود إمبراطورية جديدة».\", \"2C.12\": \"يعني الهزيمة العسكرية مش لوحدها. ضعف من جوّه، وقوة جديدة من برّه.\", \"2C.13\": \"وإزاي كانت مصر بتتدار؟ الكتاب بيقول: «كانت مصر تُدار بواسطة حاكم روماني يعيّنه الإمبراطور مباشرةً، ويخضع له وحده».\", \"2C.14\": \"«ولا يجوز لأي عضو من مجلس الشيوخ الروماني دخولها إلا بإذن خاص من الإمبراطور». [[0.5]] مجلس الشيوخ يعني مجلس كبار الرومان.\", \"2C.15\": \"ليه؟ «لما لمصر من أهمية إستراتيجية واقتصادية كبرى للإمبراطورية». [[0.5]] يعني مفتاح مصر كان في إيد الإمبراطور بس.\", \"2C.16\": \"وفيه جملة في الكتاب: «لا يستطيع أحد العبث بمصير مصر مهما كان؛ فالتاريخ يُثبت أن مصر هي التي تقود العالم».\", \"2C.17\": \"والمصريين كانوا بيقاوموا الحكم الروماني. [[0.5]] والاضطهاد زاد بعد ما اعتنقوا المسيحية.\", \"2C.18\": \"تعرضوا للتعذيب والسجن والقتل. وهُدمت كنايسهم، وأُحرقت كتبهم الدينية. [[0.5]] واضطهاد يعني معاملة قاسية بسبب معتقدك.\", \"2C.19\": \"وبلغ الاضطهاد قمّته في عهد الإمبراطور دقلديانوس. [[0.5]] حتى اتسمّى العصر ده في مصر «عصر الشهداء».\", \"2C.20\": \"وانتهى الاضطهاد لما الإمبراطور قسطنطين اعترف بالمسيحية، وأعلن سياسة التسامح الديني. [[0.5]] يعني كل واحد يعبد بحريته.\", \"2C.21\": \"وخد بالك من الترتيب: دقلديانوس الأول، وبعده قسطنطين. زي الأبجدية: الدال قبل القاف.\", \"2C.22\": \"وانتشار المسيحية في مصر أحدث تحولات دينية واجتماعية وثقافية وعمرانية.\", \"2C.23\": \"ترسّخت قيم المحبة والتسامح. وظهرت الرهبنة. وازدهرت اللغة والفنون القبطية. وبُنيت الكنائس والأديرة.\", \"2C.24\": \"ومع كده، المصريين ما قبلوش الحكم الروماني. حصلت ثورات بسبب الضرائب المفروضة عليهم. وحاولوا يستعيدوا حكمهم لبلادهم.\", \"2C.25\": \"والرومان تعاملوا بشدّة مع الاضطرابات دي. ليه؟ لأن فقدان السيطرة على مصر يهدد استقرار دولتهم.\", \"2C.26\": \"والمصريين رغم خضوعهم، فضلوا متمسكين بهُويتهم الوطنية، ورافضين للسيطرة الأجنبية.\", \"2C.27\": \"وهنا الكتاب بيسأل: هل المقاومة ضد الرومان امتداد لمقاومة الهكسوس والفرس؟ [[3.0]]\", \"2C.28\": \"رأيي من نص الكتاب: آه. القاسم المشترك: رفض السيطرة الأجنبية، والتمسك بالهوية.\", \"2C.29\": \"وسؤال تاني: كيف الحضارة المصرية حافظت على استمرارها رغم الحكم الروماني؟ [[3.0]] فكّر.\", \"2C.30\": \"الكتاب في الفقرة اللي قبلها بيقول إنهم فضلوا متمسكين بهويتهم. ابني إجابتك على كده. وفاكر الجار والحديقة؟ ده وقته: هتعمل إيه؟ [[2.0]]\", \"2C.31\": \"والكتاب بيطلب منك مشروع بحثي: لوحة رمزية بتجسّد مقاومة المصريين للغزو عبر التاريخ القديم. [[0.5]] ارسم هكسوس وفرس ورومان، وفي النص النيل.\", \"2C.32\": \"وسؤال التفسير: قرارات القيادة المصرية، سقنن رع وكامس وأحمس، مع الدليل على صواب كل قرار. [[0.5]] بداية المواجهة، وقطع الإمدادات، وحصار أواريس.\", \"2C.33\": \"دلوقتي درس الدرس. [[0.5]] إيه اللي ربط التلات حكايات ببعض؟\", \"2C.34\": \"الهكسوس دخلوا لما السلطة المركزية ضعفت والحدود اتفتحت. والفرس دخلوا في اضطراب وصراع داخلي. والبطالمة ضعفوا بصراعات على السلطة، فجه الرومان.\", \"2C.35\": \"العامل المشترك: ضعف داخلي. [[0.5]] وبرّه كان فيه حد بيستنّى الفرصة.\", \"2C.36\": \"وده بيجاوب سؤال الدرس: الموقع والموارد قوة، لكن الضعف الداخلي بيفتح الباب.\", \"2C.37\": \"ووصلنا لتقويم الدرس. [[0.5]] هنحل منه نماذج. السؤال الأول: «التحليل الأكثر دقة لأسباب احتلال مصر في العصور القديمة...»\", \"2C.38\": \"الإجابة (ب): ضعف داخلي وموقع متميز. وده السيف بحدّيه.\", \"2C.39\": \"تاني سؤال: أهم درس استفادته مصر من الهكسوس؟ الإجابة (ب): تطوير الجيش وتأمين الحدود.\", \"2C.40\": \"تالت سؤال: ليه الإسكندر دخل من غير مقاومة تُذكر؟ الإجابة (د): معاناة المصريين من حكم الفرس.\", \"2C.41\": \"ورابع سؤال: أبرز حقيقة كشفها الغزو الفارسي؟ الإجابة (أ): التماسك الداخلي أحد عناصر قوة الدولة.\", \"2C.42\": \"وسؤال مقالي: حدّد أهم أركان قيام الدولة اللي افتقدتها مصر بعد الغزو. [[2.0]] السيادة. [[0.5]] المفتاح اتسحب.\", \"2C.43\": \"وبعده: حلّل العلاقة بين الموقع، والموارد، والتنافس الدولي، والأطماع الخارجية.\", \"2C.44\": \"الموقع: مفترق طرق، فكل قوة عايزاه. الموارد: حبوب وخصوبة، فهي سبب صراع. التنافس: قوى كبرى بتتنافس عليها.\", \"2C.45\": \"وفي ص30: «احتلال مصر في العصور القديمة كان نتيجة ضعف داخلي أكثر منه قوة خارجية». ناقش العبارة من الجانبين، وقدّم حكمًا مدعّمًا.\", \"2C.46\": \"مع: الهكسوس دخلوا لما السلطة ضعفت. الفرس دخلوا في اضطراب. وضد: الهكسوس كان معاهم أسلحة متفوقة. والحكم: الضعف الداخلي أساس، والقوة الخارجية استغلته.\", \"2C.47\": \"وسؤال: قارن بين أسباب نجاح الهكسوس والفرس. [[2.0]] الهكسوس: ضعف السلطة وحدود مفتوحة وأسلحة. الفرس: اضطراب وصراع داخلي. والعامل المشترك: الضعف الداخلي.\", \"2C.48\": \"وأسئلة «ماذا لو...؟»: لو المصريين ما قاوموش الهكسوس؟ [[2.0]] مصر كانت هتفضل مقسمة زي ما قالت لوحة كامس. ولو ما كانش لمصر موقع إستراتيجي؟ [[2.0]] مش هتبقى مطمع بنفس الدرجة.\", \"2C.49\": \"وسؤال: إزاي تحولت مصر من جذب حضاري لساحة صراع دولي؟ وإزاي الموارد من قوة لسبب صراع؟ [[2.0]] بالموقع والموارد: كانوا قوة، وبقوا طمع لما الدولة ضعفت.\", \"2C.50\": \"وأي عامل أهم في طرد الهكسوس: التخطيط ولا القيادة ولا وحدة الشعب؟ [[2.0]] اختار واحد وبرّر.\", \"2C.51\": \"مثلًا القيادة: سقنن رع بدأ، وكامس خطط، وأحمس حسم، وإياح حتب حافظت على وحدة الدولة.\", \"2C.52\": \"وآخر سؤال: على لوحة الكرنك سجّل أحمس نص تخليدًا للملكة إياح حتب. «وهي التي تضع الخطط للناس»... «وهي التي جمعت جيشها، وحمت الناس، وأعادت الهاربين، ولمّت شتات المهاجرين».\", \"2C.53\": \"وتكمّل: «وهدّأت ما حلّ بالصعيد من خوف». [[0.5]] إنجازاتها: تخطيط، وجيش، وحماية، وتجميع للناس. ودلالة التسجيل: تخليد ليها وتسجيل لدورها.\", \"2C.54\": \"تعال نراجع في دقيقة.\", \"2C.55\": \"دلوقتي حلّ الكويز في خُطوة. [[0.5]] وبعدها اكتبلي في الكومنتات: احتلال مصر قديمًا كان ضعف داخلي، ولا قوة خارجية؟\", \"2C.56\": \"والدرس الجاي: «التحولات الكبرى في مصر: العصر الوسيط». [[0.5]] فاكر إن مصر كانت «ولاية» رومانية؟ في الدرس الجاي، الكتاب بيقول إنها هتنتقل من ولاية تابعة للدولة الإسلامية الكبرى إلى مركز قيادي في العالم الإسلامي. [[1.0]]\", \"2C.57\": \"أنا أحمد الألفي. خُطوة، من Add Value.\", \"RC1\": \"الدرس كله في دقيقة. غمّض، وجاوب قبلي.\", \"RC2\": \"سؤال الدرس؟ [[2.0]] الموقع سلاح ذو حدين: قوة وضعف.\", \"RC3\": \"الهكسوس دخلوا ليه، وإزاي اتطردوا؟ [[2.0]] ضعف سلطة وحدود وأسلحة. وسقنن رع، كامس، أحمس.\", \"RC4\": \"الفرس؟ [[2.0]] خمسمية خمسة وعشرين، قمبيز التاني. المصريين قاوموا.\", \"RC5\": \"الإسكندر؟ [[2.0]] تلتمية اتنين وتلاتين. دخل من غير مقاومة لإن المصريين تعبوا من الفرس.\", \"RC6\": \"البطالمة والرومان؟ [[2.0]] بطلميوس بعد تلتمية تلاتة وعشرين، وبعده أكتافيوس بعد أكتيوم.\", \"RC7\": \"والمقاومة للرومان؟ [[2.0]] اضطهاد دقلديانوس، وقسطنطين، وفضلوا متمسكين بهويتهم.\", \"RC8\": \"والعامل المشترك؟ [[2.0]] ضعف داخلي.\", \"RC9\": \"وإمتى تراجع؟ الليلة، وبكرة، وبعد أسبوع، وقبل الامتحان.\", \"RC10\": \"وكل مرة جاوب قبل ما تشوف الإجابة.\"},SRC={\"2C.1\": \"الكتاب ص٢٧\", \"2C.
