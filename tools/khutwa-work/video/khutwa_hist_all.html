خُطوة من Add Value<\/span><\/span><\/div><div id=\"sl\"><\/div>\n <div id=\"cd\" hidden><\/div><div id=\"bar\"><span id=\"who\">أحمد<\/span><span id=\"sub\"><\/span><span id=\"src\"><\/span><\/div>\n<\/div>\n<div id=\"ctl\">\n <button id=\"play\">▶ تشغيل<\/button><button id=\"re\">↺ إعادة<\/button><input id=\"seek\" type=\"range\" min=\"0\" max=\"1000\" value=\"0\"><span id=\"tm\">0:00<\/span>\n <button id=\"rec\" style=\"background:#D7463C;border-color:#D7463C\">● سجّل الشريحة (عدّ ٣)<\/button><label style=\"cursor:default\">السرعة <input id=\"spd\" type=\"range\" min=\"0.7\" max=\"1.4\" step=\"0.05\" value=\"1\" style=\"vertical-align:middle\"> <span id=\"spdv\">100%<\/span><\/label>\n <button id=\"prev\">→ الشريحة اللي قبل<\/button><button id=\"next\">الشريحة الجاية ←<\/button>\n <button id=\"mode\" aria-pressed=\"false\">وضع الشرايح<\/button><button id=\"snd\" aria-pressed=\"true\">الصوت<\/button>\n <label>ارفع فويس الشريحة دي <input id=\"af\" type=\"file\" accept=\"audio/*\" hidden><\/label><button id=\"sync\">ظبط التوقيت على صوتي<\/button><button id=\"tap\" style=\"background:#1EA05F;border-color:#1EA05F\">جملة (Enter)<\/button><button id=\"cp\">انسخ كود التوقيت<\/button><span id=\"msg\"><\/span><button id=\"recm\">وضع تسجيل الشاشة<\/button><button id=\"fs\">ملء الشاشة<\/button>\n<\/div>\n<p id=\"note\">نسخة v1 · السبورة L2C (الدرس ٢ · الفصل ٣ · الرومان والمقاومة، ودرس الدرس، والمراجعة والختام). <b>التسجيل:<\/b> دوس «سجّل الشريحة»، هيعدّ ٣ وبعدين الكلام يتعلّم كلمة كلمة تحت وإنت بتقرا، والرسم ماشي معاه (ظبّط السرعة على كلامك). <b>بعد التسجيل:<\/b> ارفع فويس الشريحة، دوس «ظبط التوقيت على صوتي»، ودوس Enter أول ما تسمع بداية كل جملة؛ الرسم هيتشدّ على صوتك. شغّل واتأكد، وبعدين «انسخ كود التوقيت» وابعتهولي أثبّته. في «وضع الشرايح»: دوسة على شمال الشاشة للشريحة الجاية وعلى اليمين للي قبلها، والمسافة للتشغيل، والعرض بيقف آخر كل شريحة. للخروج من وضع تسجيل الشاشة دوس Esc.<\/p>\n<\/div>\n<script>\nconst G='#1EA05F',GD='#106942',N='#0E2A47',R='#D7463C',Y='#F5BE32',YD='#C99A1B',SAND='#F3E3B5',GR='#666';\nconst CW=1066,CH=600,NS='http://www.w3.org/2000/svg';\nconst OS=1.35;let CUR=[],LASTW=null,IT=[],LINES=[],CAM=[[0,2133,0,CW,CH]],SL=[],SFX=[],T0=0,ox=0,oy=0,LD=0;\nconst sm=p=>{p=Math.max(0,Math.min(1,p));return p*p*(3-2*p)};\nfunction cell(c,r){ox=(2-c)*CW;oy=r*CH}\nfunction camTo(o,x,y,w,h,d=1.2){const t=T0+o,l=CAM[CAM.length-1];CAM.push([t,l[1],l[2],l[3],l[4]],[t+d,x,y,w,h]);SFX.push({t,k:'whoosh'})}\nfunction go(c,r){cell(c,r);camTo(0,ox,oy,CW,CH)}\nfunction line(id,src,txt,fn){const words=txt.replace(/\\[\\[[\\d.]+\\]\\]/g,'').trim().split(/\\s+/).length;let pz=0;txt.replace(/\\[\\[([\\d.]+)\\]\\]/g,(m,v)=>pz+=+v);\n LD=words*0.58+pz+0.45;let cu=0;const tk=txt.trim().split(/\\s+/).filter(Boolean).map(w=>{const m=w.match(/^\\[\\[([\\d.]+)\\]\\]$/),d=m?+m[1]:.58,o={w,p:!!m,v:m&&m[1],s:cu,e:cu+d};cu+=d;return o});\n CUR=tk;LINES.push({id,src,tk,t:T0,d:LD,txt:txt.replace(/\\s*\\[\\[[\\d.]+\\]\\]\\s*/g,' ').trim()});fn&&fn();T0+=LD}\n/* at('كلمة'[,n]) = وقت بداية أول (أو رقم n) كلمة فيها النص ده في السطر الحالي؛ استخدمها كـ offset لأي عنصر */\nfunction at(sub,n){let c=0;for(const k of CUR){if(!k.p&&k.w.includes(sub)){if(c==(n||0))return k.s/OS;c++}}throw new Error('at: «'+sub+'» مش في السطر: '+CUR.map(k=>k.w).join(' '))}\nfunction slide(name){SL.push({t:T0,name})}\nfunction W(o,x,y,txt,sz,col,a){IT.push(LASTW={k:'w',t:T0+o*OS,x:ox+x,y:oy+y,txt,sz,col,a:a||'end',d:Math.min(1.4,.06*txt.length+.3),cx:ox,cy:oy})}\nfunction P(o,d,col,w,dur,fill,cls){IT.push({k:'p',t:T0+o*OS,tx:ox,ty:oy,dd:d,col,w:w||3,d:dur||.8,fill,cls})}\nfunction ST(o,x,y,ok){IT.push({k:'s',t:T0+o*OS,x:ox+x,y:oy+y,ok,d:.5});SFX.push({t:T0+o*OS,k:ok?'chime':'tick'})}\nfunction Q(o,x,y,dur){o*=OS;IT.push({k:'q',t:T0+o,x:ox+x,y:oy+y,d:dur<3?dur:LD-o});SFX.push({t:T0+o,k:'tick'},{t:T0+o+1,k:'tick'},{t:T0+o+2,k:'tick'})}\nfunction AR(o,x1,y,x2){P(o,`M${x1},${y} H${x2} M${x2},${y} l14,-9 M${x2},${y} l14,9`,N,3,.4)}\nfunction CARD(o,x,y,w,h,col,fill){P(o,`M${x},${y} h${w} v${h} h${-w} Z`,col,3,.7,fill||'#fff');SFX.push({t:T0+o*OS,k:'chime'})}\nfunction BOOM(o){SFX.push({t:T0+o,k:'boom'})}\n\n\n/* ---- إضافات v5: تكملة نص على نفس السطر، إخفاء عنصر مؤقت، عدّاد وقفة، أشكال متكررة ---- */\nfunction WC(o,txt,col,gap){const p=LASTW;IT.push(LASTW={k:'w',t:T0+o*OS,x:p.x,y:p.y,txt,sz:p.sz,col:col||p.col,a:'end',d:Math.min(1.4,.06*txt.length+.3),cx:p.cx,cy:p.cy,af:p,gp:gap==null?p.sz*.28:gap})}\nfunction FADE(o,n){for(let i=1;i<=(n||1);i++)IT[IT.length-i].off=T0+o*OS}\nconst atp=n=>CUR.filter(k=>k.p)[n||0].s/OS,EOL=()=>LD/OS;\nconst CI=(x,y,r)=>`M${x-r},${y} a${r},${r} 0 1,0 ${2*r},0 a${r},${r} 0 1,0 ${-2*r},0 `;\nconst EL=(x,y,a,b)=>`M${x-a},${y} a${a},${b} 0 1,0 ${2*a},0 a${a},${b} 0 1,0 ${-2*a},0 `;\nconst MAN=(x,y,h)=>{const r=h*.15,f=v=>(v).toFixed(1);return CI(x,+f(y+r),+f(r))+`M${x},${f(y+2*r)} V${f(y+h*.66)} M${f(x-h*.2)},${f(y+h*.46)} L${x},${f(y+h*.38)} L${f(x+h*.2)},${f(y+h*.46)} M${x},${f(y+h*.66)} l${f(-h*.14)},${f(h*.34)} M${x},${f(y+h*.66)} l${f(h*.14)},${f(h*.34)} `};\nconst KEY=(x,y,s)=>CI(x,y,13*s)+`M${x+13*s},${y} h${48*s} M${x+47*s},${y} v${12*s} M${x+58*s},${y} v${9*s} `;\nconst CHAIR=(x,y)=>`M${x},${y} V${y-78} M${x},${y-38} H${x+46} V${y} `;\nconst BOOK=(x,y)=>`M${x},${y} q-18,-10 -34,0 v30 q16,-10 34,0 q18,-10 34,0 v-30 q-16,-10 -34,0 v30 `;\nfunction CDR(o,x,y,r,n){for(let k=0;k<n;k++){const a0=-Math.PI/2+k*2*Math.PI/n,a1=a0+2*Math.PI/n*.93,p=a=>`${(x+r*Math.cos(a)).toFixed(1)},${(y+r*Math.sin(a)).toFixed(1)}`;P(o+k/OS,`M${p(a0)} A${r},${r} 0 0,1 ${p(a1)}`,R,6,.92);IT[IT.length-1].off=T0+LD-.05;SFX.push({t:T0+(o+k/OS)*OS,k:'tick'})}}\n\n/*__CONTENT_START__*/\nconst S={\"2C.1\": \"إنت هنا: البطالمة، ودلوقتي الرومان. [[0.5]] هنقفل الورقة التانية في الفرع الأول قريب.\", \"2C.2\": \"سادسًا: مصر تحت حكم الرومان. [[0.5]] في الوقت اللي روما كانت بتشهد فيه تحولات سياسية وعسكرية، كانت دولة البطالمة بتعاني اضطرابات داخلية وصراعات على السلطة.\", \"2C.3\": \"وده أضعف قدرتهم على حماية استقلالهم. [[0.5]] وشكّلت مصر للرومان مركز اقتصادي وإستراتيجي.\", \"2C.4\": \"ليه؟ لأن مصر من أهم مصادر الحبوب في العالم القديم.\", \"2C.5\": \"وكمان موقعها بيدّيها القدرة على التحكم في طرق التجارة بين الشرق والغرب.\", \"2C.6\": \"وده دفع الرومان يسعوا للسيطرة عليها. [[0.5]] يبقى: حبوب، وتجارة، ومركز إستراتيجي.\", \"2C.7\": \"وتمّ ده بعد هزيمة كليوبترا السابعة في معركة أكتيوم البحرية.\", \"2C.8\": \"وسيطرة أكتافيوس على مصر. [[0.5]] فبقت مصر ولاية رومانية، من أهم الولايات الرومانية تميزًا ساعتها.\", \"2C.9\": \"والكتاب بيسأل: لأي مدى سيطرة الرومان على مصر امتلاك لمفتاح القوة الاقتصادية في البحر المتوسط؟ [[3.0]]\", \"2C.10\": \"فكّر في الحبوب والتجارة معًا. [[0.5]] هما بيدّوا القوة الاقتصادية. وده اللي كان الرومان عايزينه.\", \"2C.11\": \"وكمان الكتاب بيطلب منك تحلّل جملة: «سقوط مصر في يد الرومان لم يكن مجرد نتيجة لهزيمة عسكرية، بل كان نتيجة تفاعل بين ضعف دولة البطالمة وصعود إمبراطورية جديدة».\", \"2C.12\": \"يعني الهزيمة العسكرية مش لوحدها. ضعف من جوّه، وقوة جديدة من برّه.\", \"2C.13\": \"وإزاي كانت مصر بتتدار؟ الكتاب بيقول: «كانت مصر تُدار بواسطة حاكم روماني يعيّنه الإمبراطور مباشرةً، ويخضع له وحده».\", \"2C.14\": \"«ولا يجوز لأي عضو من مجلس الشيوخ الروماني دخولها إلا بإذن خاص من الإمبراطور». [[0.5]] مجلس الشيوخ يعني مجلس كبار الرومان.\", \"2C.15\": \"ليه؟ «لما لمصر من أهمية إستراتيجية واقتصادية كبرى للإمبراطورية». [[0.5]] يعني مفتاح مصر كان في إيد الإمبراطور بس.\", \"2C.16\": \"وفيه جملة في الكتاب: «لا يستطيع أحد العبث بمصير مصر مهما كان؛ فالتاريخ يُثبت أن مصر هي التي تقود العالم».\", \"2C.17\": \"والمصريين كانوا بيقاوموا الحكم الروماني. [[0.5]] والاضطهاد زاد بعد ما اعتنقوا المسيحية.\", \"2C.18\": \"تعرضوا للتعذيب والسجن والقتل. وهُدمت كنايسهم، وأُحرقت كتبهم الدينية. [[0.5]] واضطهاد يعني معاملة قاسية بسبب معتقدك.\", \"2C.19\": \"وبلغ الاضطهاد قمّته في عهد الإمبراطور دقلديانوس. [[0.5]] حتى اتسمّى العصر ده في مصر «عصر الشهداء».\", \"2C.20\": \"وانتهى الاضطهاد لما الإمبراطور قسطنطين اعترف بالمسيحية، وأعلن سياسة التسامح الديني. [[0.5]] يعني كل واحد يعبد بحريته.\", \"2C.21\": \"وخد بالك من الترتيب: دقلديانوس الأول، وبعده قسطنطين. زي الأبجدية: الدال قبل القاف.\", \"2C.22\": \"وانتشار المسيحية في مصر أحدث تحولات دينية واجتماعية وثقافية وعمرانية.\", \"2C.23\": \"ترسّخت قيم المحبة والتسامح. وظهرت الرهبنة. وازدهرت اللغة والفنون القبطية. وبُنيت الكنائس والأديرة.\", \"2C.24\": \"ومع كده، المصريين ما قبلوش الحكم الروماني. حصلت ثورات بسبب الضرائب المفروضة عليهم. وحاولوا يستعيدوا حكمهم لبلادهم.\", \"2C.25\": \"والرومان تعاملوا بشدّة مع الاضطرابات دي. ليه؟ لأن فقدان السيطرة على مصر يهدد استقرار دولتهم.\", \"2C.26\": \"والمصريين رغم خضوعهم، فضلوا متمسكين بهُويتهم الوطنية، ورافضين للسيطرة الأجنبية.\", \"2C.27\": \"وهنا الكتاب بيسأل: هل المقاومة ضد الرومان امتداد لمقاومة الهكسوس والفرس؟ [[3.0]]\", \"2C.28\": \"رأيي من نص الكتاب: آه. القاسم المشترك: رفض السيطرة الأجنبية، والتمسك بالهوية.\", \"2C.29\": \"وسؤال تاني: كيف الحضارة المصرية حافظت على استمرارها رغم الحكم الروماني؟ [[3.0]] فكّر.\", \"2C.30\": \"الكتاب في الفقرة اللي قبلها بيقول إنهم فضلوا متمسكين بهويتهم. ابني إجابتك على كده. وفاكر الجار والحديقة؟ ده وقته: هتعمل إيه؟ [[2.0]]\", \"2C.31\": \"والكتاب بيطلب منك مشروع بحثي: لوحة رمزية بتجسّد مقاومة المصريين للغزو عبر التاريخ القديم. [[0.5]] ارسم هكسوس وفرس ورومان، وفي النص النيل.\", \"2C.32\": \"وسؤال التفسير: قرارات القيادة المصرية، سقنن رع وكامس وأحمس، مع الدليل على صواب كل قرار. [[0.5]] بداية المواجهة، وقطع الإمدادات، وحصار أواريس.\", \"2C.33\": \"دلوقتي درس الدرس. [[0.5]] إيه اللي ربط التلات حكايات ببعض؟\", \"2C.34\": \"الهكسوس دخلوا لما السلطة المركزية ضعفت والحدود اتفتحت. والفرس دخلوا في اضطراب وصراع داخلي. والبطالمة ضعفوا بصراعات على السلطة، فجه الرومان.\", \"2C.35\": \"العامل المشترك: ضعف داخلي. [[0.5]] وبرّه كان فيه حد بيستنّى الفرصة.\", \"2C.36\": \"وده بيجاوب سؤال الدرس: الموقع والموارد قوة، لكن الضعف الداخلي بيفتح الباب.\", \"2C.37\": \"ووصلنا لتقويم الدرس. [[0.5]] هنحل منه نماذج. السؤال الأول: «التحليل الأكثر دقة لأسباب احتلال مصر في العصور القديمة...»\", \"2C.38\": \"الإجابة (ب): ضعف داخلي وموقع متميز. وده السيف بحدّيه.\", \"2C.39\": \"تاني سؤال: أهم درس استفادته مصر من الهكسوس؟ الإجابة (ب): تطوير الجيش وتأمين الحدود.\", \"2C.40\": \"تالت سؤال: ليه الإسكندر دخل من غير مقاومة تُذكر؟ الإجابة (د): معاناة المصريين من حكم الفرس.\", \"2C.41\": \"ورابع سؤال: أبرز حقيقة كشفها الغزو الفارسي؟ الإجابة (أ): التماسك الداخلي أحد عناصر قوة الدولة.\", \"2C.42\": \"وسؤال مقالي: حدّد أهم أركان قيام الدولة اللي افتقدتها مصر بعد الغزو. [[2.0]] السيادة. [[0.5]] المفتاح اتسحب.\", \"2C.43\": \"وبعده: حلّل العلاقة بين الموقع، والموارد، والتنافس الدولي، والأطماع الخارجية.\", \"2C.44\": \"الموقع: مفترق طرق، فكل قوة عايزاه. الموارد: حبوب وخصوبة، فهي سبب صراع. التنافس: قوى كبرى بتتنافس عليها.\", \"2C.45\": \"وفي ص30: «احتلال مصر في العصور القديمة كان نتيجة ضعف داخلي أكثر منه قوة خارجية». ناقش العبارة من الجانبين، وقدّم حكمًا مدعّمًا.\", \"2C.46\": \"مع: الهكسوس دخلوا لما السلطة ضعفت. الفرس دخلوا في اضطراب. وضد: الهكسوس كان معاهم أسلحة متفوقة. والحكم: الضعف الداخلي أساس، والقوة الخارجية استغلته.\", \"2C.47\": \"وسؤال: قارن بين أسباب نجاح الهكسوس والفرس. [[2.0]] الهكسوس: ضعف السلطة وحدود مفتوحة وأسلحة. الفرس: اضطراب وصراع داخلي. والعامل المشترك: الضعف الداخلي.\", \"2C.48\": \"وأسئلة «ماذا لو...؟»: لو المصريين ما قاوموش الهكسوس؟ [[2.0]] مصر كانت هتفضل مقسمة زي ما قالت لوحة كامس. ولو ما كانش لمصر موقع إستراتيجي؟ [[2.0]] مش هتبقى مطمع بنفس الدرجة.\", \"2C.49\": \"وسؤال: إزاي تحولت مصر من جذب حضاري لساحة صراع دولي؟ وإزاي الموارد من قوة لسبب صراع؟ [[2.0]] بالموقع والموارد: كانوا قوة، وبقوا طمع لما الدولة ضعفت.\", \"2C.50\": \"وأي عامل أهم في طرد الهكسوس: التخطيط ولا القيادة ولا وحدة الشعب؟ [[2.0]] اختار واحد وبرّر.\", \"2C.51\": \"مثلًا القيادة: سقنن رع بدأ، وكامس خطط، وأحمس حسم، وإياح حتب حافظت على وحدة الدولة.\", \"2C.52\": \"وآخر سؤال: على لوحة الكرنك سجّل أحمس نص تخليدًا للملكة إياح حتب. «وهي التي تضع الخطط للناس»... «وهي التي جمعت جيشها، وحمت الناس، وأعادت الهاربين، ولمّت شتات المهاجرين».\", \"2C.53\": \"وتكمّل: «وهدّأت ما حلّ بالصعيد من خوف». [[0.5]] إنجازاتها: تخطيط، وجيش، وحماية، وتجميع للناس. ودلالة التسجيل: تخليد ليها وتسجيل لدورها.\", \"2C.54\": \"تعال نراجع في دقيقة.\", \"2C.55\": \"دلوقتي حلّ الكويز في خُطوة. [[0.5]] وبعدها اكتبلي في الكومنتات: احتلال مصر قديمًا كان ضعف داخلي، ولا قوة خارجية؟\", \"2C.56\": \"والدرس الجاي: «التحولات الكبرى في مصر: العصر الوسيط». [[0.5]] فاكر إن مصر كانت «ولاية» رومانية؟ في الدرس الجاي، الكتاب بيقول إنها هتنتقل من ولاية تابعة للدولة الإسلامية الكبرى إلى مركز قيادي في العالم الإسلامي. [[1.0]]\", \"2C.57\": \"أنا أحمد الألفي. خُطوة، من Add Value.\", \"RC1\": \"الدرس كله في دقيقة. غمّض، وجاوب قبلي.\", \"RC2\": \"سؤال الدرس؟ [[2.0]] الموقع سلاح ذو حدين: قوة وضعف.\", \"RC3\": \"الهكسوس دخلوا ليه، وإزاي اتطردوا؟ [[2.0]] ضعف سلطة وحدود وأسلحة. وسقنن رع، كامس، أحمس.\", \"RC4\": \"الفرس؟ [[2.0]] خمسمية خمسة وعشرين، قمبيز التاني. المصريين قاوموا.\", \"RC5\": \"الإسكندر؟ [[2.0]] تلتمية اتنين وتلاتين. دخل من غير مقاومة لإن المصريين تعبوا من الفرس.\", \"RC6\": \"البطالمة والرومان؟ [[2.0]] بطلميوس بعد تلتمية تلاتة وعشرين، وبعده أكتافيوس بعد أكتيوم.\", \"RC7\": \"والمقاومة للرومان؟ [[2.0]] اضطهاد دقلديانوس، وقسطنطين، وفضلوا متمسكين بهويتهم.\", \"RC8\": \"والعامل المشترك؟ [[2.0]] ضعف داخلي.\", \"RC9\": \"وإمتى تراجع؟ الليلة، وبكرة، وبعد أسبوع، وقبل الامتحان.\", \"RC10\": \"وكل مرة جاوب قبل ما تشوف الإجابة.\"},SRC={\"2C.1\": \"الكتاب ص٢٧\", \"2C.2\": \"الكتاب ص٢٧\", \"2C.3\": \"الكتاب ص٢٧\", \"2C.4\": \"الكتاب ص٢٧\", \"2C.5\": \"الكتاب ص٢٧\", \"2C.6\": \"الكتاب ص٢٧\", \"2C.7\": \"الكتاب ص٢٧\", \"2C.8\": \"الكتاب ص٢٧ + شرح كلمة\", \"2C.9\": \"الكتاب ص٢٧\", \"2C.10\": \"الكتاب ص٢٧\", \"2C.11\": \"الكتاب ص٢٧\", \"2C.12\": \"الكتاب ص٢٧\", \"2C.13\": \"الكتاب ص٢٧\", \"2C.14\": \"الكتاب ص٢٧ + شرح كلمة\", \"2C.15\": \"الكتاب ص٢٧ + تشبيه\", \"2C.16\": \"الكتاب ص٢٧\", \"2C.17\": \"الكتاب ص٢٧\", \"2C.18\": \"الكتاب ص٢٧ + شرح كلمة\", \"2C.19\": \"الكتاب ص٢٧\", \"2C.20\": \"الكتاب ص٢٧ + شرح كلمة\", \"2C.21\": \"الكتاب ص٢٧ + ربط\", \"2C.22\": \"الكتاب ص٢٨\", \"2C.23\": \"الكتاب ص٢٨\", \"2C.24\": \"الكتاب ص٢٨\", \"2C.25\": \"الكتاب ص٢٨\", \"2C.26\": \"الكتاب ص٢٨\", \"2C.27\": \"الكتاب ص٢٨\", \"2C.28\": \"الكتاب ص٢٥، ">السرعة <input id=\"spd\" type=\"range\" min=\"0.7\" max=\"1.4\" step=\"0.05\" value=\"1\" style=\"vertical-align:middle\"> <span id=\"spdv\">100%<\/span><\/label>\n <button id=\"prev\">→ الشريحة اللي قبل<\/button><button id=\"next\">الشريحة الجاية ←<\/button>\n <button id=\"mode\" aria-pressed=\"false\">وضع الشرايح<\/button><button id=\"snd\" aria-pressed=\"true\">الصوت<\/button>\n <label>ارفع فويس الشريحة دي <input id=\"af\" type=\"file\" accept=\"audio/*\" hidden><\/label><button id=\"sync\">ظبط التوقيت على صوتي<\/button><button id=\"tap\" style=\"background:#1EA05F;border-color:#1EA05F\">جملة (Enter)<\/button><button id=\"cp\">انسخ كود التوقيت<\/button><span id=\"msg\"><\/span><button id=\"recm\">وضع تسجيل الشاشة<\/button><button id=\"fs\">ملء الشاشة<\/button>\n<\/div>\n<p id=\"note\">نسخة v1 · السبورة L3A (الدرس ٣ · الفصل ١ · التحول السياسي والاجتماعي، ودقيقة المراجعة RA). <b>التسجيل:<\/b> دوس «سجّل الشريحة»، هيعدّ ٣ وبعدين الكلام يتعلّم كلمة كلمة تحت وإنت بتقرا، والرسم ماشي معاه (ظبّط السرعة على كلامك). <b>بعد التسجيل:<\/b> ارفع فويس الشريحة، دوس «ظبط التوقيت على صوتي»، ودوس Enter أول ما تسمع بداية كل جملة؛ الرسم هيتشدّ على صوتك. شغّل واتأكد، وبعدين «انسخ كود التوقيت» وابعتهولي أثبّته. في «وضع الشرايح»: دوسة على شمال الشاشة للشريحة الجاية وعلى اليمين للي قبلها، والمسافة للتشغيل، والعرض بيقف آخر كل شريحة. للخروج من وضع تسجيل الشاشة دوس Esc.<\/p>\n<\/div>\n<script>\nconst G='#1EA05F',GD='#106942',N='#0E2A47',R='#D7463C',Y='#F5BE32',YD='#C99A1B',SAND='#F3E3B5',GR='#666';\nconst CW=1066,CH=600,NS='http://www.w3.org/2000/svg';\nconst OS=1.35;let CUR=[],LASTW=null,IT=[],LINES=[],CAM=[[0,2133,0,CW,CH]],SL=[],SFX=[],T0=0,ox=0,oy=0,LD=0;\nconst sm=p=>{p=Math.max(0,Math.min(1,p));return p*p*(3-2*p)};\nfunction cell(c,r){ox=(2-c)*CW;oy=r*CH}\nfunction camTo(o,x,y,w,h,d=1.2){const t=T0+o,l=CAM[CAM.length-1];CAM.push([t,l[1],l[2],l[3],l[4]],[t+d,x,y,w,h]);SFX.push({t,k:'whoosh'})}\nfunction go(c,r){cell(c,r);camTo(0,ox,oy,CW,CH)}\nfunction line(id,src,txt,fn){const words=txt.replace(/\\[\\[[\\d.]+\\]\\]/g,'').trim().split(/\\s+/).length;let pz=0;txt.replace(/\\[\\[([\\d.]+)\\]\\]/g,(m,v)=>pz+=+v);\n LD=words*0.58+pz+0.45;let cu=0;const tk=txt.trim().split(/\\s+/).filter(Boolean).map(w=>{const m=w.match(/^\\[\\[([\\d.]+)\\]\\]$/),d=m?+m[1]:.58,o={w,p:!!m,v:m&&m[1],s:cu,e:cu+d};cu+=d;return o});\n CUR=tk;LINES.push({id,src,tk,t:T0,d:LD,txt:txt.replace(/\\s*\\[\\[[\\d.]+\\]\\]\\s*/g,' ').trim()});fn&&fn();T0+=LD}\n/* at('كلمة'[,n]) = وقت بداية أول (أو رقم n) كلمة فيها النص ده في السطر الحالي؛ استخدمها كـ offset لأي عنصر */\nfunction at(sub,n){let c=0;for(const k of CUR){if(!k.p&&k.w.includes(sub)){if(c==(n||0))return k.s/OS;c++}}throw new Error('at: «'+sub+'» مش في السطر: '+CUR.map(k=>k.w).join(' '))}\nfunction slide(name){SL.push({t:T0,name})}\nfunction W(o,x,y,txt,sz,col,a){IT.push(LASTW={k:'w',t:T0+o*OS,x:ox+x,y:oy+y,txt,sz,col,a:a||'end',d:Math.min(1.4,.06*txt.length+.3),cx:ox,cy:oy})}\nfunction P(o,d,col,w,dur,fill,cls){IT.push({k:'p',t:T0+o*OS,tx:ox,ty:oy,dd:d,col,w:w||3,d:dur||.8,fill,cls})}\nfunction ST(o,x,y,ok){IT.push({k:'s',t:T0+o*OS,x:ox+x,y:oy+y,ok,d:.5});SFX.push({t:T0+o*OS,k:ok?'chime':'tick'})}\nfunction Q(o,x,y,dur){o*=OS;IT.push({k:'q',t:T0+o,x:ox+x,y:oy+y,d:dur<3?dur:LD-o});SFX.push({t:T0+o,k:'tick'},{t:T0+o+1,k:'tick'},{t:T0+o+2,k:'tick'})}\nfunction AR(o,x1,y,x2){P(o,`M${x1},${y} H${x2} M${x2},${y} l14,-9 M${x2},${y} l14,9`,N,3,.4)}\nfunction CARD(o,x,y,w,h,col,fill){P(o,`M${x},${y} h${w} v${h} h${-w} Z`,col,3,.7,fill||'#fff');SFX.push({t:T0+o*OS,k:'chime'})}\nfunction BOOM(o){SFX.push({t:T0+o,k:'boom'})}\n\n\n/* ---- إضافات v5: تكملة نص على نفس السطر، إخفاء عنصر مؤقت، عدّاد وقفة، أشكال متكررة ---- */\nfunction WC(o,txt,col,gap){const p=LASTW;IT.push(LASTW={k:'w',t:T0+o*OS,x:p.x,y:p.y,txt,sz:p.sz,col:col||p.col,a:'end',d:Math.min(1.4,.06*txt.length+.3),cx:p.cx,cy:p.cy,af:p,gp:gap==null?p.sz*.28:gap})}\nfunction FADE(o,n){for(let i=1;i<=(n||1);i++)IT[IT.length-i].off=T0+o*OS}\nconst atp=n=>CUR.filter(k=>k.p)[n||0].s/OS,EOL=()=>LD/OS;\nconst CI=(x,y,r)=>`M${x-r},${y} a${r},${r} 0 1,0 ${2*r},0 a${r},${r} 0 1,0 ${-2*r},0 `;\nconst EL=(x,y,a,b)=>`M${x-a},${y} a${a},${b} 0 1,0 ${2*a},0 a${a},${b} 0 1,0 ${-2*a},0 `;\nconst MAN=(x,y,h)=>{const r=h*.15,f=v=>(v).toFixed(1);return CI(x,+f(y+r),+f(r))+`M${x},${f(y+2*r)} V${f(y+h*.66)} M${f(x-h*.2)},${f(y+h*.46)} L${x},${f(y+h*.38)} L${f(x+h*.2)},${f(y+h*.46)} M${x},${f(y+h*.66)} l${f(-h*.14)},${f(h*.34)} M${x},${f(y+h*.66)} l${f(h*.14)},${f(h*.34)} `};\nconst KEY=(x,y,s)=>CI(x,y,13*s)+`M${x+13*s},${y} h${48*s} M${x+47*s},${y} v${12*s} M${x+58*s},${y} v${9*s} `;\nconst CHAIR=(x,y)=>`M${x},${y} V${y-78} M${x},${y-38} H${x+46} V${y} `;\nconst BOOK=(x,y)=>`M${x},${y} q-18,-10 -34,0 v30 q16,-10 34,0 q18,-10 34,0 v-30 q-16,-10 -34,0 v30 `;\nfunction CDR(o,x,y,r,n){for(let k=0;k<n;k++){const a0=-Math.PI/2+k*2*Math.PI/n,a1=a0+2*Math.PI/n*.93,p=a=>`${(x+r*Math.cos(a)).toFixed(1)},${(y+r*Math.sin(a)).toFixed(1)}`;P(o+k/OS,`M${p(a0)} A${r},${r} 0 0,1 ${p(a1)}`,R,6,.92);IT[IT.length-1].off=T0+LD-.05;SFX.push({t:T0+(o+k/OS)*OS,k:'tick'})}}\n\n/*__CONTENT_START__*/\nconst S={\"3A.1\": \"إنت هنا: خلّصنا درسين. [[0.5]] في الأول عرفنا إن الدولة زي البيت، ليه أربع أركان: شعب، وحيز جغرافي، وسلطة، وسيادة.\", \"3A.2\": \"وفي الدرس التاني شفنا الأختام على الخريطة: هكسوس، وفرس، ويونان، ورومان. [[0.5]] وآخر مشهد كان: مصر ولاية رومانية، والمفتاح في إيد الإمبراطور.\", \"3A.3\": \"النهارده المفتاح ده هيمشي مشوار طويل. [[0.5]] والكتاب بيبدأ بسؤال: «كيف تحولت مصر من ولاية رومانية إلى مركز يقود العالم الإسلامي خلال العصر الوسيط؟» [[1.0]]\", \"3A.4\": \"ولاية يعني إيه؟ تخيّل إن مدرستك ليها فرع صغير في حي تاني. الفرع ده ماشي على قرارات الإدارة الأم. [[0.5]] دي الولاية: إقليم تابع، وقراره جاي من برّه.\", \"3A.5\": \"ومركز قيادي؟ ده المدرسة الأم نفسها. اللي كل الفروع بتبص عليها وتستنى كلمتها. [[0.5]] يعني حكاية الدرس كله: الفرع بقى هو القيادة.\", \"3A.6\": \"والفكرة الرئيسة في الكتاب: مصر شهدت في العصر الوسيط تحولات سياسية، واجتماعية، واقتصادية، وحضارية. [[0.5]] والتحولات دي نقلتها من ولاية تابعة للدولة الإسلامية الكبرى، لمركز قيادي مؤثر في العالم الإسلامي.\", \"3A.7\": \"احفظها كده: من ولاية تابعة، لمركز قيادي. [[0.5]] سلّم، ومصر طالعاه درجة درجة.\", \"3A.8\": \"وفي آخر الدرس هتبقى عارف أبرز الأحداث اللي مرّت بيها مصر في العصر الوسيط. [[0.5]] وإزاي بقت مركز سياسي وحضاري في العالم الإسلامي. ودور العلماء والفقهاء في الحياة الفكرية والاجتماعية للمجتمع.\", \"3A.9\": \"ودور المؤسسات الدينية في إن مصر تبقى مركز علمي وثقافي عالمي. [[0.5]] وعلاقة قوة مصر العسكرية في العصر المملوكي بمكانتها كحامية للعالم الإسلامي. وتقدّر دور مصر في حماية الحضارة الإسلامية.\", \"3A.10\": \"وعنوان الدرس فيه كلمة «التحولات». فالكتاب بيعرّف التحول التاريخي: «عملية التغيير الجذري والتدريجي في بنية المجتمعات وأنظمتها السياسية والاقتصادية». [[0.5]] وبالتالي «الانتقال من مرحلة تاريخية إلى مرحلة تاريخية أخرى مختلفة تمامًا».\", \"3A.11\": \"جذري يعني من الجدر، مش دهان على الوش. وتدريجي يعني واحدة واحدة. [[0.5]] زيّك إنت من أولى ابتدائي لحد النهارده: ما اتغيرتش في يوم، بس بقيت واحد تاني.\", \"3A.12\": \"احفظ التعريف في صورة: تغيير جذري وتدريجي، بينقل من مرحلة لمرحلة.\", \"3A.13\": \"والكتاب بيقول إن مصر مرّت بتحولات كبرى في العصر الوسيط، وهنرصد أهمها. [[0.5]] خمسة على صوابع إيدك: سياسي، واجتماعي، وثقافي وفكري، وعمراني، واقتصادي. وفي الآخر: مكانة مصر.\", \"3A.14\": \"أولًا: التحول السياسي. وأول محطة فيه: مصر من الحكم البيزنطي، اللي هما الروم، للولاية الإسلامية.\", \"3A.15\": \"مصر شهدت تحول سياسي مع الفتح الإسلامي، سنة ستمية واحد وأربعين ميلادية. [[0.5]] انتقلت من تبعيتها للإمبراطورية البيزنطية، وبقت ولاية فاعلة في الدولة الإسلامية.\", \"3A.16\": \"احفظ الرقم مع صورته: ستمية واحد وأربعين، من الروم للولاية الإسلامية.\", \"3A.17\": \"وبقت بتتدار وفق النظام الإداري للخلافة. [[0.5]] الخلافة يعني نظام الحكم في الدولة الإسلامية، وعلى راسه الخليفة. زي الإدارة الأم، وعلى راسها المدير.\", \"3A.18\": \"فمصر بقت جوّه كيان سياسي واسع، ممتد على مناطق كتير من العالم الإسلامي. [[0.5]] وفضلت كده أيام الخلافة الراشدة، والدولة الأموية، والعصر العباسي الأول.\", \"3A.19\": \"وبعدين، في العصر العباسي الثاني، ظهرت دول مستقلة في مصر. [[0.5]] ليه؟ سببين: ضعف الخلفاء، وبُعد مصر عن مركز الخلافة العباسية في بغداد.\", \"3A.20\": \"زي فرع المدرسة البعيد قوي، والإدارة الأم تعبانة ومش بتسأل. [[0.5]] الفرع هيبدأ يمشّي نفسه بنفسه.\", \"3A.21\": \"والدول دي نوعين. النوع الأول: دول مستقلة، مع الاعتراف بالتبعية للخلافة العباسية. [[0.5]] يعني بتدير نفسها، بس لسه رابطة شريط العباسيين على عَلَمها.\", \"3A.22\": \"ودول أربعة بالترتيب: الطولونية، والإخشيدية، والأيوبية، والمملوكية.\", \"3A.23\": \"والنوع التاني: دول مستقلة تمامًا عن الخلافة العباسية. [[0.5]] ودي واحدة بس: الدولة الفاطمية، اللي خدت القاهرة مركز للخلافة.\", \"3A.24\": \"احفظ دي: أربعة بشريط العباسيين: طولونية، إخشيدية، أيوبية، مملوكية. وواحدة من غير شريط: الفاطمية.\", \"3A.25\": \"واربطها ببيت الدرس الأول. [[0.5]] النوع الأول عنده عمود السلطة: بيحكم البلد من جوّه. بس لسه معترف بتبعية لحد برّه. والفاطمية ما اعترفتش بتبعية لحد. وده سؤال هييجي في التقويم.\", \"3A.26\": \"المحطة التانية: مصر مركز لقيادة العالم الإسلامي. [[0.5]] مكانة مصر السياسية بلغت ذروتها، يعني أعلى نقطة، لما القاهرة بقت مقر للخلافة الفاطمية.\", \"3A.27\": \"واتحولت لمركز رئيس لصُنع القرار السياسي والديني في العالم الإسلامي. [[0.5]] صُنع القرار يعني الكلمة بتطلع من هنا. زي أوضة المدير.\", \"3A.28\": \"والمكانة دي كمّلت في عهد الأيوبيين والمماليك. مصر بقت مركز للحكم في المنطقة. [[0.5]] خصوصًا مع مواجهة الحملات الصليبية، والتصدي لخطر المغول.\", \"3A.29\": \"وده إدّاها دور محوري في الدفاع عن العالم الإسلامي. [[0.5]] فاكر محور العجلة من الدرس التاني؟ كل حاجة بتلف حواليه.\", \"3A.30\": \"احفظ دي: فاطميين: مقر خلافة. أيوبيين ومماليك: درع قدام الصليبيين والمغول.\", \"3A.31\": \"والكتاب بيسألك: تتفق ولا تختلف مع العبارة دي؟ «يُعَد العصران الأيوبي والمملوكي ذروة الدور السياسي لمصر في العالم الإسلامي». وبرّر بالأدلة. [[3.0]]\", \"3A.32\": \"رأيي من كلام الكتاب: لو هتتفق، دليلك إن مصر بقت مركز للحكم، وواجهت الصليبيين، واتصدّت للمغول. [[0.5]] ولو هتختلف، دليلك إن القاهرة كانت مقر خلافة من أيام الفاطميين. المهم الدليل.\", \"3A.33\": \"وفي صندوق «مصر أولًا» الكتاب بيقول: «كانت مصر قلب العالم ونبضه وعقله المفكر لقرون عدة». [[0.5]] وهي دلوقتي كذلك، وهتبقى أقوى.\", \"3A.34\": \"وصندوق «تأمل» بيفكّرك: مصر بقت قلب الخلافة الفاطمية، وبعدها مركز للمقاومة الإسلامية بقيادة الأيوبيين. [[0.5]] وبيسألك: التحول ده أثّر إزاي على نظرة المصريين لنفسهم ولدورهم الحضاري؟ [[3.0]]\", \"3A.35\": \"المحطة التالتة: تحول مصر لولاية عثمانية. [[0.5]] الدولة العثمانية أدركت أهمية مصر، وسرعان ما ضمّتها لحكمها، سنة ألف وخمسمية وسبعتاشر ميلادية.\", \"3A.36\": \"ولمكانة مصر الاقتصادية والإستراتيجية، سمّتها «درة التاج العثماني». [[0.5]] الدرة يعني اللؤلؤة. أغلى حتة في التاج.\", \"3A.37\": \"احفظ الرقم التاني: ألف وخمسمية وسبعتاشر، مصر درة في تاج العثمانيين.\", \"3A.38\": \"والكتاب بيسأل: ليه الدولة العثمانية اتجهت لضم مصر؟ [[2.0]] من نص الكتاب: أدركت أهميتها، ومكانتها الاقتصادية والإستراتيجية.\", \"3A.39\": \"وبيطلب منك: حدّد تلات مراحل مرّت بيها مصر الإسلامية، وحط عنوان لكل مرحلة، وأهم حدث فيها. [[2.0]] مثلًا: ولاية إسلامية، وحدثها الفتح. مركز قيادة، وحدثها القاهرة مقر الخلافة. ولاية عثمانية، وحدثها الضم.\", \"3A.40\": \"واحفظ السلّم كله في نَفَس واحد: ولاية، وبعدين دول مستقلة، وبعدين قيادة، وبعدين ولاية عثمانية.\", \"3A.41\": \"ثانيًا: التحول الاجتماعي بعد الفتح الإسلامي. [[0.5]] وده حاجتين: لغة جديدة، وناس جديدة.\", \"3A.42\": \"الأولى: تعريب اللغة. تعريب يعني تحويل للعربي. [[0.5]] زي لما تغيّر لغة موبايلك: كل القوايم تبقى عربي.\", \"3A.43\": \"اللغة العربية انتشرت في مصر تدريجيًا بعد الفتح. خصوصًا مع إصلاحات الدولة الأموية، وتعريب الدواوين. [[0.5]] الدواوين يعني مكاتب الدولة ودفاترها.\", \"3A.44\": \"فالعربية بقت لغة الإدارة والمعاملات الرسمية. [[0.5]] ومع مرور الزمن بقت لغة العلم والثقافة. خصوصًا مع ازدهار المراكز العلمية في الفسطاط، وبعدها القاهرة.\", \"3A.45\": \"والتعريب ما وقفش عند لغة الإدارة. [[0.5]] ده ربط مصر بالعالم الإسلامي، وساهم في تشكيل الهُوية الثقافية للمجتمع المصري. الهُوية يعني: إنت مين.\", \"3A.46\": \"احفظ دي: دواوين، وبعدين علم وثقافة، وبعدين هُوية.\", \"3A.47\": \"والكتاب بيقولك اشرح العبارة دي: «انتشار اللغة العربية في مصر كان عملية تدريجية وليست مفاجئة». ووضّح العوامل والنتايج. [[3.0]]\", \"3A.48\": \"رأيي من الكتاب: العوامل: إصلاحات الأمويين وتعريب الدواوين، والمراكز العلمية، والهجرات العربية اللي جاية حالًا. [[0.5]] والنتايج: ربط مصر بالعالم الإسلامي، وهُوية ثقافية للمجتمع.\", \"3A.49\": \"التانية: الهجرات العربية. [[0.5]] بعد الفتح، قبايل عربية استقرت في الفسطاط، وبعض مناطق الدلتا والصعيد. وامتزجت بالسكان المحليين.\", \"3A.50\": \"امتزجت يعني اتخلطوا وعاشوا مع بعض. زي فصلين اتدمجوا في فصل واحد: بعد شهر الكل صحاب. [[0.5]] وده أدّى لانتشار اللغة العربية، والقيم والعادات الإسلامية.\", \"3A.51\": \"وأبناء القبايل دي شاركوا في إدارة الأقاليم، وفي الحياة العسكرية والسياسية. [[0.5]] وده ساعد على إبراز دور مصر في المجال الحضاري والثقافي للدولة الإسلامية.\", \"3A.52\": \"احفظ دي: استقروا، وامتزجوا، وشاركوا.\", \"3A.53\": \"وهنا الكتاب بيجيب ابن خلدون، من كتابه «المقدمة». بيقول: «اعلم أن لغات أهل الأمصار إنما تكون بلسان الأمة أو الجيل الغالبين عليها». [[0.5]] الأمصار يعني البلاد والمدن.\", \"3A.54\": \"ويكمّل: «وهجرت الأمم لغاتهم وألسنتهم في جميع الأمصار والممالك، وصار اللسان العربي لسانهم».\", \"3A.55\": \"يعني اللي غالب، لسانه بيمشي. [[0.5]] احفظ دي: ابن خلدون: اللغة بلسان الغالب.\", \"3A.56\": \"والكتاب بيطلب: طبّق النص ده على أوضاع مصر تحت الحكم الإسلامي. [[2.0]] مصر بقت ولاية في الدولة الإسلامية، والدواوين اتعرّبت. فالعربية بقت لغة الإدارة، وبعدين العلم والثقافة.\", \"3A.57\": \"السياسة اتغيرت، واللغة اتغيرت. [[0.5]] فاضل العقل والمدينة. الفصل الجاي: العلماء، والأزهر، والقاهرة.\", \"RA1\": \"دقيقة مراجعة. غمّض، وجاوب قبلي.\", \"RA2\": \"الفكرة الرئيسة في جملة؟ [[2.0]] من ولاية تابعة، لمركز قيادي.\", \"RA3\": \"الفتح الإسلامي سنة كام؟ [[2.0]] ستمية واحد وأربعين.\", \"RA4\": \"الدول اللي بشريط العباسيين؟ [[2.0]] طولونية، إخشيدية، أيوبية، مملوكية.\", \"RA5\": \"واللي من غير شريط؟ [[2.0]] الفاطمية، والقاهرة مقر خلافتها.\", \"RA6\": \"الأيوبيين والمماليك واجهوا مين؟ [[2.0]] الحملات الصليبية، وخطر المغول.\", \"RA7\": \"العثمانيين ضمّوا مصر سنة كام، وسمّوها إيه؟ [[2.0]] ألف وخمسمية وسبعتاشر، ودرة التاج العثماني.\", \"RA8\": \"التعريب مشي إزاي؟ [[2.0]] دواوين، وبعدين علم وثقافة، وبعدين هُوية.\", \"RA9\": \"والهجرات العربية؟ [[2.0]] استقروا، وامتزجوا، وشاركوا. وسمّعهم تاني بكرة.\"},SRC={\"3A.1\": \"الدرس ١ + الكتاب ص٣١\", \"3A.2\": \"الدرس ٢ + الكتاب ص٣٢\", \"3A.3\": \"الكتاب ص٣٢\", \"3A.4\": \"الكتاب ص٣٢ + شرح كلمة + تشبيه\", \"3A.5\": \"الكتاب ص٣١ + شرح كلمة + تشبيه\", \"3A.6\": \"الكتاب ص٣١\", \"3A.7\": \"الكتاب ص٣١ + تشبيه\", \"3A.8\": \"الكتاب ص٣١\", \"3A.9\": \"الكتاب ص٣١\", \"3A.10\": \"الكتاب ص٣٢\", \"3A.11\": \"الكتاب ص٣٢ + شرح كلمة + تشبيه\", \"3A.12\": \"الكتاب ص٣٢\", \"3A.13\": \"الكتاب ص٣٢–٣٨\", \"3A.14\": \"الكتاب ص٣٢\", \"3A.15\": \"الكتاب ص٣٢\", \"3A.16\": \"الكتاب ص٣٢\", \"3A.17\": \"الكتاب ص٣٢ + شرح كلمة + تشبيه\", \"3A.18\": \"الكتاب ص٣٢\", \"3A.19\": \"الكتاب ص٣٢\", \"3A.20\": \"تشبيه لـ الكتاب ص٣٢\", \"3A.21\": \"الكتاب ص٣٢ + شرح كلمة + تشبيه\", \"3A.22\": \"الكتاب ص٣٢\", \"3A.23\": \"الكتاب ص٣٢ + ص٣٦\", \"3A.24\": \"الكتاب ص٣٢ + تشبيه\", \"3A.25\": \"الدرس ١ + الكتاب ص٣٢ + ص٤٠ + رأي\", \"3A.26\": \"الكتاب ص٣٢ + ص٣٦ + شرح كلمة\", \"3A.27\": \"الكتاب ص٣٢ + شرح كلمة + تشبيه\", \"3A.28\": \"الكتاب ص٣٢\", \"3A.29\": \"الكتاب ص٣٢ + الدرس ٢\", \"3A.30\": \"الكتاب ص٣٢ + تشبيه\", \"3A.31\": \"الكتاب ص٣٢\", \"3A.32\": \"الكتاب ص٣٢ + رأي\", \"3A.33\": \"الكتاب ص٣٢\", \"3A.34\": \"الكتاب ص٣٢\", \"3A.35\": \"الكتاب ص٣٢\", \"3A.36\": \"الكتاب ص٣٢ + شرح كلمة\", \"3A.37\": \"الكتاب ص٣٢\", \"3A.38\": \"الكتاب ص٣٢–٣٣\", \"3A.39\": \"الكتاب ص٣٣ + رأي\", \"3A.40\": \"الكتاب ص٣٢\", \"3A.41\": \"الكتاب ص٣٣\", \"3A.42\": \"الكتاب ص٣٣ + شرح كلمة + تشبيه\", \"3A.43\": \"الكتاب ص٣٣ + شرح كلمة\", \"3A.44\": \"الكتاب ص٣٣\", \"3A.45\": \"الكتاب ص٣٣ + شرح كلمة\", \"3A.46\": \"الكتاب ص٣٣\", \"3A.47\": \"الكتاب ص٣٣\", \"3A.48\": \"الكتاب ص٣٣ + رأي\", \"3A.49\": \"الكتاب ص٣٣\", \"3A.50\": \"الكتاب ص٣٣ + شرح كلمة + تشبيه\", \"3A.51\": \"الكتاب ص٣٣\", \"3A.52\": \"الكتاب ص٣٣\", \"3A.53\": \"الكتاب ص٣٤ + شرح كلمة\", \"3A.54\": \"الكتاب ص٣٤\", \"3A.55\": \"الكتاب ص \/g><\/svg>\n <div id=\"badge\"><i>أ<\/i><span><b>أحمد الألفي<\/b><span>خُطوة من Add Value<\/span><\/span><\/div><div id=\"sl\"><\/div>\n <div id=\"cd\" hidden><\/div><div id=\"bar\"><span id=\"who\">أحمد<\/span><span id=\"sub\"><\/span><span id=\"src\"><\/span><\/div>\n<\/div>\n<div id=\"ctl\">\n <button id=\"play\">▶ تشغيل<\/button><button id=\"re\">↺ إعادة<\/button><input id=\"seek\" type=\"range\" min=\"0\" max=\"1000\" value=\"0\"><span id=\"tm\">0:00<\/span>\n <button id=\"rec\" style=\"background:#D7463C;border-color:#D7463C\">● سجّل الشريحة (عدّ ٣)<\/button><label style=\"cursor:default\">السرعة <input id=\"spd\" type=\"range\" min=\"0.7\" max=\"1.4\" step=\"0.05\" value=\"1\" style=\"vertical-align:middle\"> <span id=\"spdv\">100%<\/span><\/label>\n <button id=\"prev\">→ الشريحة اللي قبل<\/button><button id=\"next\">الشريحة الجاية ←<\/button>\n <button id=\"mode\" aria-pressed=\"false\">وضع الشرايح<\/button><button id=\"snd\" aria-pressed=\"true\">الصوت<\/button>\n <label>ارفع فويس الشريحة دي <input id=\"af\" type=\"file\" accept=\"audio/*\" hidden><\/label><button id=\"sync\">ظبط التوقيت على صوتي<\/button><button id=\"tap\" style=\"background:#1EA05F;border-color:#1EA05F\">جملة (Enter)<\/button><button id=\"cp\">انسخ كود التوقيت<\/button><span id=\"msg\"><\/span><button id=\"recm\">وضع تسجيل الشاشة<\/button><button id=\"fs\">ملء الشاشة<\/button>\n<\/div>\n<p id=\"note\">نسخة v1 · السبورة L3B (الدرس ٣ · الفصل ٢ · العقل والمدينة: التحول الثقافي والعمراني، ودقيقة المراجعة). <b>التسجيل:<\/b> دوس «سجّل الشريحة»، هيعدّ ٣ وبعدين الكلام يتعلّم كلمة كلمة تحت وإنت بتقرا، والرسم ماشي معاه (ظبّط السرعة على كلامك). <b>بعد التسجيل:<\/b> ارفع فويس الشريحة، دوس «ظبط التوقيت على صوتي»، ودوس Enter أول ما تسمع بداية كل جملة؛ الرسم هيتشدّ على صوتك. شغّل واتأكد، وبعدين «انسخ كود التوقيت» وابعتهولي أثبّته. في «وضع الشرايح»: دوسة على شمال الشاشة للشريحة الجاية وعلى اليمين للي قبلها، والمسافة للتشغيل، والعرض بيقف آخر كل شريحة. للخروج من وضع تسجيل الشاشة دوس Esc.<\/p>\n<\/div>\n<script>\nconst G='#1EA05F',GD='#106942',N='#0E2A47',R='#D7463C',Y='#F5BE32',YD='#C99A1B',SAND='#F3E3B5',GR='#666';\nconst CW=1066,CH=600,NS='http://www.w3.org/2000/svg';\nconst OS=1.35;let CUR=[],LASTW=null,IT=[],LINES=[],CAM=[[0,2133,0,CW,CH]],SL=[],SFX=[],T0=0,ox=0,oy=0,LD=0;\nconst sm=p=>{p=Math.max(0,Math.min(1,p));return p*p*(3-2*p)};\nfunction cell(c,r){ox=(2-c)*CW;oy=r*CH}\nfunction camTo(o,x,y,w,h,d=1.2){const t=T0+o,l=CAM[CAM.length-1];CAM.push([t,l[1],l[2],l[3],l[4]],[t+d,x,y,w,h]);SFX.push({t,k:'whoosh'})}\nfunction go(c,r){cell(c,r);camTo(0,ox,oy,CW,CH)}\nfunction line(id,src,txt,fn){const words=txt.replace(/\\[\\[[\\d.]+\\]\\]/g,'').trim().split(/\\s+/).length;let pz=0;txt.replace(/\\[\\[([\\d.]+)\\]\\]/g,(m,v)=>pz+=+v);\n LD=words*0.58+pz+0.45;let cu=0;const tk=txt.trim().split(/\\s+/).filter(Boolean).map(w=>{const m=w.match(/^\\[\\[([\\d.]+)\\]\\]$/),d=m?+m[1]:.58,o={w,p:!!m,v:m&&m[1],s:cu,e:cu+d};cu+=d;return o});\n CUR=tk;LINES.push({id,src,tk,t:T0,d:LD,txt:txt.replace(/\\s*\\[\\[[\\d.]+\\]\\]\\s*/g,' ').trim()});fn&&fn();T0+=LD}\n/* at('كلمة'[,n]) = وقت بداية أول (أو رقم n) كلمة فيها النص ده في السطر الحالي؛ استخدمها كـ offset لأي عنصر */\nfunction at(sub,n){let c=0;for(const k of CUR){if(!k.p&&k.w.includes(sub)){if(c==(n||0))return k.s/OS;c++}}throw new Error('at: «'+sub+'» مش في السطر: '+CUR.map(k=>k.w).join(' '))}\nfunction slide(name){SL.push({t:T0,name})}\nfunction W(o,x,y,txt,sz,col,a){IT.push(LASTW={k:'w',t:T0+o*OS,x:ox+x,y:oy+y,txt,sz,col,a:a||'end',d:Math.min(1.4,.06*txt.length+.3),cx:ox,cy:oy})}\nfunction P(o,d,col,w,dur,fill,cls){IT.push({k:'p',t:T0+o*OS,tx:ox,ty:oy,dd:d,col,w:w||3,d:dur||.8,fill,cls})}\nfunction ST(o,x,y,ok){IT.push({k:'s',t:T0+o*OS,x:ox+x,y:oy+y,ok,d:.5});SFX.push({t:T0+o*OS,k:ok?'chime':'tick'})}\nfunction Q(o,x,y,dur){o*=OS;IT.push({k:'q',t:T0+o,x:ox+x,y:oy+y,d:dur<3?dur:LD-o});SFX.push({t:T0+o,k:'tick'},{t:T0+o+1,k:'tick'},{t:T0+o+2,k:'tick'})}\nfunction AR(o,x1,y,x2){P(o,`M${x1},${y} H${x2} M${x2},${y} l14,-9 M${x2},${y} l14,9`,N,3,.4)}\nfunction CARD(o,x,y,w,h,col,fill){P(o,`M${x},${y} h${w} v${h} h${-w} Z`,col,3,.7,fill||'#fff');SFX.push({t:T0+o*OS,k:'chime'})}\nfunction BOOM(o){SFX.push({t:T0+o,k:'boom'})}\n\n\n/* ---- إضافات v5: تكملة نص على نفس السطر، إخفاء عنصر مؤقت، عدّاد وقفة، أشكال متكررة ---- */\nfunction WC(o,txt,col,gap){const p=LASTW;IT.push(LASTW={k:'w',t:T0+o*OS,x:p.x,y:p.y,txt,sz:p.sz,col:col||p.col,a:'end',d:Math.min(1.4,.06*txt.length+.3),cx:p.cx,cy:p.cy,af:p,gp:gap==null?p.sz*.28:gap})}\nfunction FADE(o,n){for(let i=1;i<=(n||1);i++)IT[IT.length-i].off=T0+o*OS}\nconst atp=n=>CUR.filter(k=>k.p)[n||0].s/OS,EOL=()=>LD/OS;\nconst CI=(x,y,r)=>`M${x-r},${y} a${r},${r} 0 1,0 ${2*r},0 a${r},${r} 0 1,0 ${-2*r},0 `;\nconst EL=(x,y,a,b)=>`M${x-a},${y} a${a},${b} 0 1,0 ${2*a},0 a${a},${b} 0 1,0 ${-2*a},0 `;\nconst MAN=(x,y,h)=>{const r=h*.15,f=v=>(v).toFixed(1);return CI(x,+f(y+r),+f(r))+`M${x},${f(y+2*r)} V${f(y+h*.66)} M${f(x-h*.2)},${f(y+h*.46)} L${x},${f(y+h*.38)} L${f(x+h*.2)},${f(y+h*.46)} M${x},${f(y+h*.66)} l${f(-h*.14)},${f(h*.34)} M${x},${f(y+h*.66)} l${f(h*.14)},${f(h*.34)} `};\nconst KEY=(x,y,s)=>CI(x,y,13*s)+`M${x+13*s},${y} h${48*s} M${x+47*s},${y} v${12*s} M${x+58*s},${y} v${9*s} `;\nconst CHAIR=(x,y)=>`M${x},${y} V${y-78} M${x},${y-38} H${x+46} V${y} `;\nconst BOOK=(x,y)=>`M${x},${y} q-18,-10 -34,0 v30 q16,-10 34,0 q18,-10 34,0 v-30 q-16,-10 -34,0 v30 `;\nfunction CDR(o,x,y,r,n){for(let k=0;k<n;k++){const a0=-Math.PI/2+k*2*Math.PI/n,a1=a0+2*Math.PI/n*.93,p=a=>`${(x+r*Math.cos(a)).toFixed(1)},${(y+r*Math.sin(a)).toFixed(1)}`;P(o+k/OS,`M${p(a0)} A${r},${r} 0 0,1 ${p(a1)}`,R,6,.92);IT[IT.length-1].off=T0+LD-.05;SFX.push({t:T0+(o+k/OS)*OS,k:'tick'})}}\n\n/*__CONTENT_START__*/\nconst S={\"3B.1\": \"إنت هنا: خلّصنا التحول السياسي والاجتماعي. [[0.5]] فاضل على الكف تلات صوابع. ودلوقتي التالت والرابع.\", \"3B.2\": \"ثالثًا: التحول الثقافي والفكري. [[0.5]] الكتاب بيقول فيه عوامل دلّت عليه في ظل الدولة الإسلامية. وهم تلاتة: علماء، ومؤسسات، وتأليف وترجمة.\", \"3B.3\": \"تخيّل نفسك داخل مسجد في الفسطاط. [[0.5]] شايف حلقة: شيخ قاعد، وحواليه طلبة سامعين. الكتاب راسمها: «صورة تخيلية لإحدى حلقات العلم بالمسجد».\", \"3B.4\": \"دول العلماء والفقهاء. الفقهاء يعني علماء أحكام الدين. [[0.5]] والكتاب بيقول كان ليهم دور كبير في إدارة المجتمع والسياسة، بشكل غير مباشر.\", \"3B.5\": \"غير مباشر يعني إيه؟ مش هو الحاكم، بس كلمته مسموعة. [[0.5]] زي المدرس اللي المدرسة كلها بتحترمه: مش هو المدير، بس رأيه بيفرق.\", \"3B.6\": \"وإزاي؟ تولّوا تلات حاجات: القضاء، والتعليم، وتنظيم الشئون الدينية.\", \"3B.7\": \"ولعبوا دور كبير في حاجتين. الأولى: نشر التعليم الديني، وترسيخ الهُوية والثقافة الإسلامية. [[0.5]] ترسيخ يعني تثبيت.\", \"3B.8\": \"والتانية: بناء قاعدة علمية، ساعدت على ظهور مراكز علمية في الفسطاط والقاهرة.\", \"3B.9\": \"فالعلماء بقوا ركائز أساسية في المجتمع المصري بعد الفتح. ركائز يعني عمدان شايلة. [[0.5]] وساهموا في تحويل مصر لمركز علمي وثقافي في العالم الإسلامي.\", \"3B.10\": \"احفظ دي: قضاء، وتعليم، وشئون دينية. والنتيجة: هُوية، وقاعدة علمية.\", \"3B.11\": \"والكتاب بيطلب تناقش عبارة: إن تأثير العلماء والفقهاء ما كانش تأثير ديني بس، «بل كان تأثيرًا فكريًا واجتماعيًا أيضًا». [[3.0]]\", \"3B.12\": \"رأيي من الكتاب: الفكري: التعليم، والقاعدة العلمية اللي طلّعت مراكز علم. [[0.5]] والاجتماعي: القضاء بين الناس، وترسيخ الهُوية.\", \"3B.13\": \"وخد تطبيق حياتي من الكتاب: الدول كل ما تهتم بالعلم والعلماء، ده بيجيب تحولات ثقافية إيجابية سريعة.\", \"3B.14\": \"اتنين: المؤسسات العلمية والدينية. [[0.5]] المؤسسة يعني مكان ثابت وليه نظام. زي مدرستك: المدرسين بيتغيروا، والمدرسة فاضلة.\", \"3B.15\": \"والحياة العلمية اتطورت بعد تأسيس المؤسسات دي. وعلى راسها: مسجد عمرو بن العاص. [[0.5]] الكتاب بيقول إنه بيمثّل البداية التاريخية للتعليم في مصر الإسلامية.\", \"3B.16\": \"كان مركز مبكر لنشر العلوم الدينية. وساهم في تأسيس النواة الأولى للحياة العلمية والثقافية. [[0.5]] النواة يعني البذرة اللي كل حاجة طلعت منها.\", \"3B.17\": \"وبعدين الأزهر الشريف. الكتاب بيوصفه: منارة للعلم والثقافة بمصر. [[0.5]] منارة زي الفنار: نوره بيوصل لبعيد.\", \"3B.18\": \"ودوره ما وقفش عند ممارسة الشعائر الدينية. الشعائر يعني العبادات. [[0.5]] ده كان مركز لتدريس العلوم الشرعية، واللغة العربية.\", \"3B.19\": \"وساهم في إعداد العلماء والقضاة. يعني بيخرّجهم.\", \"3B.20\": \"وكمان عزّز التواصل العلمي والثقافي بين مصر والمراكز الثقافية في العالم الإسلامي. [[0.5]] وخلّاها مركز لتبادل العلوم والمعرفة بين العلماء والطلاب.\", \"3B.21\": \"احفظ دي: عمرو البداية، والأزهر المنارة.\", \"3B.22\": \"وأدوار الأزهر عدّها تلاتة: تدريس، وإعداد علماء وقضاة، وتواصل مع العالم الإسلامي.\", \"3B.23\": \"والكتاب بيسأل: لأي مدى الأزهر نقطة تحول في تاريخ التعليم في مصر؟ [[3.0]] رأيي: البداية كانت نشر علوم دينية في مسجد عمرو. ومع الأزهر بقى فيه تدريس، وإعداد علماء وقضاة، وتبادل علم مع العالم الإسلامي.\", \"3B.24\": \"تلاتة: ازدهار التأليف والترجمة. [[0.5]] مصر شهدت نشاط علمي واسع في مجالات متعددة، زي: الفقه، والفلسفة، والطب، والتاريخ، والعلوم الطبيعية.\", \"3B.25\": \"احفظ دي: فقه، وفلسفة، وطب، وتاريخ، وعلوم طبيعية.\", \"3B.26\": \"وحركة الترجمة ساعدت في نقل علوم الحضارات القديمة: اليونانية، والفارسية، والهندية، للثقافة العربية.\", \"3B.27\": \"والكتاب راسم المشهد: «تصوّر لمركز ترجمة عند المسلمين». [[0.5]] تخيّل ترابيزة طويلة، ومترجمين قاعدين، والكتب داخلة بلغة وخارجة بلغة.\", \"3B.28\": \"وده ساهم في ربط مصر بالحضارة الإسلامية، وتعزيز دورها في نشر المعرفة، والتفاعل الحضاري مع المناطق المجاورة.\", \"3B.29\": \"احفظ دي: يوناني، وفارسي، وهندي، دخلوا عربي.\", \"3B.30\": \"وسؤال الكتاب: إزاي حركة الترجمة ساهمت في ازدهار التأليف العلمي في مصر؟ [[2.0]] رأيي: علوم الحضارات القديمة بقت قدام العلماء بالعربي. فيقروها، ويبنوا عليها، ويألّفوا.\", \"3B.31\": \"ومهارة من الكتاب: لما تترجم نص تاريخي مكتوب بلغة غير عربية، لازم تراعي السياق الثقافي للمجتمع اللي اتكتبت فيه الوثيقة. [[0.5]] يعني افهم الناس دي كانت عايشة إزاي، قبل ما تترجم كلامهم.\", \"3B.32\": \"وبرز في مصر مؤرخين دوّنوا تاريخ المجتمع المصري، وحلّلوا أحداثه السياسية والاجتماعية. [[0.5]] دوّنوا يعني كتبوا وسجّلوا. وأشهرهم: المقريزي، وابن إياس.\", \"3B.33\": \"احفظ دي: المقريزي وابن إياس: كتبوا تاريخ المجتمع المصري.\", \"3B.34\": \"والكتاب بيقولك حقيقة: التاريخ بيساهم بشكل كبير في تعزيز الهوية الوطنية للدول، والحفاظ على ذاكرتها التاريخية. علشان تفضل خالدة عبر العصور.\", \"3B.35\": \"رابعًا: التحول العمراني والحضاري. [[0.5]] العمراني يعني البُنا والمدن. ودلوقتي هنبني تلات مدن.\", \"3B.36\": \"أول حاجة: تأسيس العواصم الإسلامية. [[0.5]] عمرو بن العاص أسّس مدينة الفسطاط، علشان تبقى مركز للحكم والإدارة.\", \"3B.37\": \"وموقعها اتاختار لاعتبارات عسكرية، وإدارية، واقتصادية. [[0.5]] اعتبارات يعني حسابات.\", \"3B.38\": \"والكتاب بيسأل: ليه المسلمين فضّلوا ينشئوا عاصمة جديدة بدل مدينة الإسكندرية؟ [[3.0]] الكتاب مدّيك طرف الخيط: اعتبارات عسكرية وإدارية واقتصادية. ابني إجابتك عليها.\", \"3B.39\": \"وبعد قيام الدولة العباسية، أحمد بن طولون أسّس مدينة القطائع. [[0.5]] وخدها عاصمة لدولته، ومقر للحكم والإدارة.\", \"3B.40\": \"والمدن دي ساهمت في أربع حاجات. واحد: تنظيم الإدارة والحكم. اتنين: تطوير النشاط التجاري.\", \"3B.41\": \"تلاتة: دمج السكان المحليين مع العرب. وأربعة: تشكيل مجتمع حضري جديد في مصر الإسلامية. [[0.5]] حضري يعني بتاع مدن.\", \"3B.42\": \"احفظ دي: إدارة، وتجارة، ودمج، ومجتمع حضري.\", \"3B.43\": \"والمدينة الإسلامية في مصر ليها ملامح. امشي معايا مشوار جوّاها. [[0.5]] أول حاجة: مسجد وسط المدينة. وجنبه: مساكن للجند.\", \"3B.44\": \"وبعدها: أسواق وخانات. الخانات أماكن بينزل فيها التجار المسافرين. [[0.5]] وبعدها: مؤسسات ثقافية.\", \"3B.45\": \"وعلى الأطراف: قلاع وحصون، تحمي ده كله.\", \"3B.46\": \"احفظ المشوار: مسجد في النص، ومساكن جند، وأسواق وخانات، ومؤسسات ثقافية، وقلاع وحصون.\", \"3B.47\": \"وقيمة من الكتاب: من الضروري نحافظ على الإرث الحضاري والمادي للدولة. لأنه ذاكرة الأمة التاريخية. [[0.5]] الإرث يعني اللي ورثناه.\", \"3B.48\": \"تاني حاجة: القاهرة الفاطمية والمملوكية. [[0.5]] الفاطميين أسّسوا مدينة القاهرة، علشان تبقى مقر للخلافة الفاطمية. ومع مرور الوقت بقت واحدة من أهم مدن العالم الإسلامي. وفي العصر المملوكي شهدت ازدهار كبير.\", \"3B.49\": \"احفظ التلات مدن بأصحابها: عمرو بنى الفسطاط، وابن طولون بنى القطائع، والفاطميين بنوا القاهرة.\", \"3B.50\": \"والتطور ده خلّى القاهرة نموذج للمدينة الإسلامية الكبرى. اجتمعت فيها السُلطات السياسية، والاقتصادية، والثقافية. [[0.5]] وجذبت العلماء والتجار والطلاب من مختلف أنحاء العالم الإسلامي.\", \"3B.51\": \"والمقريزي بيقول: «كانت القاهرة مَجمَع التجار والعلماء والناس من سائر الأقطار». [[0.5]] مَجمَع يعني مكان بيتجمعوا فيه. وسائر الأقطار يعني كل البلاد.\", \"3B.52\": \"احفظ دي: القاهرة: سياسة واقتصاد وثقافة في مكان واحد.\", \"3B.53\": \"ونتج عن التطور العمراني ده تنشيط الحياة الاقتصادية والاجتماعية والثقافية. [[0.5]] وساهم في تدعيم الاستقرار الحضاري، وتعزيز التفاعل الاجتماعي.\", \"3B.54\": \"وسؤالين من الكتاب على كلام المقريزي. العبارة بتكشف إيه عن مكانة القاهرة؟ [[2.0]] إنها مدينة بتجذب الناس من كل البلاد. [[0.5]] والعمارة مؤشر على تطور المجتمع إزاي؟ [[2.0]] مدينة فيها مسجد وأسواق ومؤسسات ثقافية، وراها مجتمع حضري منظم.\", \"3B.55\": \"بس مدينة بالحجم ده محتاجة تاكل، وتشتغل، وتبيع وتشتري. [[0.5]] الفصل الجاي: الاقتصاد، ومكانة مصر، وحل التقويم.\", \"RB1\": \"دقيقة مراجعة. غمّض، وجاوب قبلي.\", \"RB2\": \"العلماء تولّوا إيه؟ [[2.0]] القضاء، والتعليم، وتنظيم الشئون الدينية.\", \"RB3\": \"البداية التاريخية للتعليم في مصر الإسلامية؟ [[2.0]] مسجد عمرو بن العاص.\", \"RB4\": \"والمنارة؟ وأدوارها؟ [[2.0]] الأزهر: تدريس، وإعداد علماء وقضاة، وتواصل مع العالم الإسلامي.\", \"RB5\": \"الترجمة نقلت علوم أنهي حضارات؟ [[2.0]] اليونانية، والفارسية، والهندية.\", \"RB6\": \"أشهر المؤرخين؟ [[2.0]] المقريزي، وابن إياس.\", \"RB7\": \"مين بنى إيه؟ [[2.0]] عمرو بن العاص: الفسطاط. أحمد بن طولون: القطائع. الفاطميين: القاهرة.\", \"RB8\": \"ملامح المدينة الخمسة؟ [[2.0]] مسجد في النص، ومساكن جند، وأسواق وخانات، ومؤسسات ثقافية، وقلاع وحصون.\", \"RB9\": \"والقاهرة اجتمع فيها إيه؟ [[2.0]] السلطات السياسية والاقتصادية والثقافية. وسمّعهم تاني بكرة.\"},SRC={\"3B.1\": \"الكتاب ص٣٤–٣٦\", \"3B.2\": \"الكتاب ص٣٤\", \"3B.3\": \"الكتاب ص٣٤\", \"3B.4\": \"الكتاب ص٣٤ + شرح كلمة\", \"3B.5\": \"الكتاب ص٣٤ + شرح كلمة + تشبيه\", \"3B.6\": \"الكتاب ص٣٤\", \"3B.7\": \"الكتاب ص٣٤ + شرح كلمة\", \"3B.8\": \"الكتاب ص٣٤\", \"3B.9\": \"الكتاب ص٣٤ + شرح كلمة\", \"3B.1 " y=\"-128\" width=\"16\" height=\"18\" rx=\"3\" fill=\"#1EA05F\"/><\/g><\/g><\/svg>\n <div id=\"badge\"><i>أ<\/i><span><b>أحمد الألفي<\/b><span>خُطوة من Add Value<\/span><\/span><\/div><div id=\"sl\"><\/div>\n <div id=\"cd\" hidden><\/div><div id=\"bar\"><span id=\"who\">أحمد<\/span><span id=\"sub\"><\/span><span id=\"src\"><\/span><\/div>\n<\/div>\n<div id=\"ctl\">\n <button id=\"play\">▶ تشغيل<\/button><button id=\"re\">↺ إعادة<\/button><input id=\"seek\" type=\"range\" min=\"0\" max=\"1000\" value=\"0\"><span id=\"tm\">0:00<\/span>\n <button id=\"rec\" style=\"background:#D7463C;border-color:#D7463C\">● سجّل الشريحة (عدّ ٣)<\/button><label style=\"cursor:default\">السرعة <input id=\"spd\" type=\"range\" min=\"0.7\" max=\"1.4\" step=\"0.05\" value=\"1\" style=\"vertical-align:middle\"> <span id=\"spdv\">100%<\/span><\/label>\n <button id=\"prev\">→ الشريحة اللي قبل<\/button><button id=\"next\">الشريحة الجاية ←<\/button>\n <button id=\"mode\" aria-pressed=\"false\">وضع الشرايح<\/button><button id=\"snd\" aria-pressed=\"true\">الصوت<\/button>\n <label>ارفع فويس الشريحة دي <input id=\"af\" type=\"file\" accept=\"audio/*\" hidden><\/label><button id=\"sync\">ظبط التوقيت على صوتي<\/button><button id=\"tap\" style=\"background:#1EA05F;border-color:#1EA05F\">جملة (Enter)<\/button><button id=\"cp\">انسخ كود التوقيت<\/button><span id=\"msg\"><\/span><button id=\"recm\">وضع تسجيل الشاشة<\/button><button id=\"fs\">ملء الشاشة<\/button>\n<\/div>\n<p id=\"note\">نسخة v1 · السبورة L3C (الدرس ٣ · الفصل ٣ · الاقتصاد ومكانة مصر، وتدريبات الدرس، ومراجعة الدرس كله والختام). <b>التسجيل:<\/b> دوس «سجّل الشريحة»، هيعدّ ٣ وبعدين الكلام يتعلّم كلمة كلمة تحت وإنت بتقرا، والرسم ماشي معاه (ظبّط السرعة على كلامك). <b>بعد التسجيل:<\/b> ارفع فويس الشريحة، دوس «ظبط التوقيت على صوتي»، ودوس Enter أول ما تسمع بداية كل جملة؛ الرسم هيتشدّ على صوتك. شغّل واتأكد، وبعدين «انسخ كود التوقيت» وابعتهولي أثبّته. في «وضع الشرايح»: دوسة على شمال الشاشة للشريحة الجاية وعلى اليمين للي قبلها، والمسافة للتشغيل، والعرض بيقف آخر كل شريحة. للخروج من وضع تسجيل الشاشة دوس Esc.<\/p>\n<\/div>\n<script>\nconst G='#1EA05F',GD='#106942',N='#0E2A47',R='#D7463C',Y='#F5BE32',YD='#C99A1B',SAND='#F3E3B5',GR='#666';\nconst CW=1066,CH=600,NS='http://www.w3.org/2000/svg';\nconst OS=1.35;let CUR=[],LASTW=null,IT=[],LINES=[],CAM=[[0,2133,0,CW,CH]],SL=[],SFX=[],T0=0,ox=0,oy=0,LD=0;\nconst sm=p=>{p=Math.max(0,Math.min(1,p));return p*p*(3-2*p)};\nfunction cell(c,r){ox=(2-c)*CW;oy=r*CH}\nfunction camTo(o,x,y,w,h,d=1.2){const t=T0+o,l=CAM[CAM.length-1];CAM.push([t,l[1],l[2],l[3],l[4]],[t+d,x,y,w,h]);SFX.push({t,k:'whoosh'})}\nfunction go(c,r){cell(c,r);camTo(0,ox,oy,CW,CH)}\nfunction line(id,src,txt,fn){const words=txt.replace(/\\[\\[[\\d.]+\\]\\]/g,'').trim().split(/\\s+/).length;let pz=0;txt.replace(/\\[\\[([\\d.]+)\\]\\]/g,(m,v)=>pz+=+v);\n LD=words*0.58+pz+0.45;let cu=0;const tk=txt.trim().split(/\\s+/).filter(Boolean).map(w=>{const m=w.match(/^\\[\\[([\\d.]+)\\]\\]$/),d=m?+m[1]:.58,o={w,p:!!m,v:m&&m[1],s:cu,e:cu+d};cu+=d;return o});\n CUR=tk;LINES.push({id,src,tk,t:T0,d:LD,txt:txt.replace(/\\s*\\[\\[[\\d.]+\\]\\]\\s*/g,' ').trim()});fn&&fn();T0+=LD}\n/* at('كلمة'[,n]) = وقت بداية أول (أو رقم n) كلمة فيها النص ده في السطر الحالي؛ استخدمها كـ offset لأي عنصر */\nfunction at(sub,n){let c=0;for(const k of CUR){if(!k.p&&k.w.includes(sub)){if(c==(n||0))return k.s/OS;c++}}throw new Error('at: «'+sub+'» مش في السطر: '+CUR.map(k=>k.w).join(' '))}\nfunction slide(name){SL.push({t:T0,name})}\nfunction W(o,x,y,txt,sz,col,a){IT.push(LASTW={k:'w',t:T0+o*OS,x:ox+x,y:oy+y,txt,sz,col,a:a||'end',d:Math.min(1.4,.06*txt.length+.3),cx:ox,cy:oy})}\nfunction P(o,d,col,w,dur,fill,cls){IT.push({k:'p',t:T0+o*OS,tx:ox,ty:oy,dd:d,col,w:w||3,d:dur||.8,fill,cls})}\nfunction ST(o,x,y,ok){IT.push({k:'s',t:T0+o*OS,x:ox+x,y:oy+y,ok,d:.5});SFX.push({t:T0+o*OS,k:ok?'chime':'tick'})}\nfunction Q(o,x,y,dur){o*=OS;IT.push({k:'q',t:T0+o,x:ox+x,y:oy+y,d:dur<3?dur:LD-o});SFX.push({t:T0+o,k:'tick'},{t:T0+o+1,k:'tick'},{t:T0+o+2,k:'tick'})}\nfunction AR(o,x1,y,x2){P(o,`M${x1},${y} H${x2} M${x2},${y} l14,-9 M${x2},${y} l14,9`,N,3,.4)}\nfunction CARD(o,x,y,w,h,col,fill){P(o,`M${x},${y} h${w} v${h} h${-w} Z`,col,3,.7,fill||'#fff');SFX.push({t:T0+o*OS,k:'chime'})}\nfunction BOOM(o){SFX.push({t:T0+o,k:'boom'})}\n\n\n/* ---- إضافات v5: تكملة نص على نفس السطر، إخفاء عنصر مؤقت، عدّاد وقفة، أشكال متكررة ---- */\nfunction WC(o,txt,col,gap){const p=LASTW;IT.push(LASTW={k:'w',t:T0+o*OS,x:p.x,y:p.y,txt,sz:p.sz,col:col||p.col,a:'end',d:Math.min(1.4,.06*txt.length+.3),cx:p.cx,cy:p.cy,af:p,gp:gap==null?p.sz*.28:gap})}\nfunction FADE(o,n){for(let i=1;i<=(n||1);i++)IT[IT.length-i].off=T0+o*OS}\nconst atp=n=>CUR.filter(k=>k.p)[n||0].s/OS,EOL=()=>LD/OS;\nconst CI=(x,y,r)=>`M${x-r},${y} a${r},${r} 0 1,0 ${2*r},0 a${r},${r} 0 1,0 ${-2*r},0 `;\nconst EL=(x,y,a,b)=>`M${x-a},${y} a${a},${b} 0 1,0 ${2*a},0 a${a},${b} 0 1,0 ${-2*a},0 `;\nconst MAN=(x,y,h)=>{const r=h*.15,f=v=>(v).toFixed(1);return CI(x,+f(y+r),+f(r))+`M${x},${f(y+2*r)} V${f(y+h*.66)} M${f(x-h*.2)},${f(y+h*.46)} L${x},${f(y+h*.38)} L${f(x+h*.2)},${f(y+h*.46)} M${x},${f(y+h*.66)} l${f(-h*.14)},${f(h*.34)} M${x},${f(y+h*.66)} l${f(h*.14)},${f(h*.34)} `};\nconst KEY=(x,y,s)=>CI(x,y,13*s)+`M${x+13*s},${y} h${48*s} M${x+47*s},${y} v${12*s} M${x+58*s},${y} v${9*s} `;\nconst CHAIR=(x,y)=>`M${x},${y} V${y-78} M${x},${y-38} H${x+46} V${y} `;\nconst BOOK=(x,y)=>`M${x},${y} q-18,-10 -34,0 v30 q16,-10 34,0 q18,-10 34,0 v-30 q-16,-10 -34,0 v30 `;\nfunction CDR(o,x,y,r,n){for(let k=0;k<n;k++){const a0=-Math.PI/2+k*2*Math.PI/n,a1=a0+2*Math.PI/n*.93,p=a=>`${(x+r*Math.cos(a)).toFixed(1)},${(y+r*Math.sin(a)).toFixed(1)}`;P(o+k/OS,`M${p(a0)} A${r},${r} 0 0,1 ${p(a1)}`,R,6,.92);IT[IT.length-1].off=T0+LD-.05;SFX.push({t:T0+(o+k/OS)*OS,k:'tick'})}}\n\n/*__CONTENT_START__*/\nconst S={\"3C.1\": \"إنت هنا: أربع صوابع خلصوا: سياسي، واجتماعي، وثقافي، وعمراني. [[0.5]] فاضل الخامس: الاقتصاد. وبعده مكانة مصر، ونحل التقويم سوا.\", \"3C.2\": \"خامسًا: التحول الاقتصادي. [[0.5]] الاقتصاد يعني البلد بتاكل منين وبتكسب منين. والكتاب بيقول إن الحياة الاقتصادية اتطورت بشكل ملحوظ في ظل الدولة الإسلامية. من تلات أبواب: زراعة، وصناعة، وتجارة.\", \"3C.3\": \"واحد: الزراعة. لعبت دور مهم في استقرار الدولة اقتصاديًا وسياسيًا. [[0.5]] لأنها وفّرت الموارد اللازمة لتمويل احتياجات الشعب والجيش. تمويل يعني الصرف عليهم.\", \"3C.4\": \"والزراعة كانت الركيزة الأساسية للاقتصاد المصري، بفضل تلات حاجات. [[0.5]] الأولى: تنظيم الري. زي إنشاء مقياس النيل.\", \"3C.5\": \"ومن اسمه: بيقيس ميّة النيل. [[0.5]] زي مؤشر البنزين في العربية: تبص عليه، تعرف معاك قد إيه، وتحسب مشوارك.\", \"3C.6\": \"التانية: استخدام القنوات والسواقي والمصارف. وده ساعد على زيادة الإنتاج الزراعي.\", \"3C.7\": \"التالتة: تنوّع المحاصيل. زي القمح، والشعير، والكتان. [[0.5]] وده دعم الأمن الغذائي، ووفّر فائض للتجارة والتصدير. الفائض يعني اللي زاد عن حاجتك.\", \"3C.8\": \"احفظ دي: ري، وقنوات وسواقي ومصارف، ومحاصيل: قمح وشعير وكتان.\", \"3C.9\": \"اتنين: الصناعة. مصر شهدت ازدهار في الصناعات التقليدية، ودي كانت جزء من الاقتصاد. [[0.5]] وأبرزها تلاتة.\", \"3C.10\": \"صناعة النسيج: إنتاج الملابس والأقمشة من الكتان. [[0.5]] خد بالك: نفس الكتان اللي لسه زارعينه.\", \"3C.11\": \"وصناعة السكر: اعتمادًا على زراعة قصب السكر.\", \"3C.12\": \"وصناعة الزجاج: إنتاج الأواني والزخارف الزجاجية. الكتاب راسمها: «تصوّر لصناعة الزجاج في مصر الإسلامية».\", \"3C.13\": \"احفظ دي: نسيج من الكتان، وسكر من القصب، وزجاج.\", \"3C.14\": \"والصناعات دي ساعدت على دعم التجارة الداخلية والخارجية، وتوفير فرص عمل، وتعزيز النشاط الاقتصادي في المدن.\", \"3C.15\": \"وسؤال الكتاب: إزاي الصناعات التقليدية ساهمت في ازدهار التجارة في مصر؟ [[2.0]] اللي بيتصنع بيتباع جوّه وبرّه. الكتاب قالها: دعمت التجارة الداخلية والخارجية.\", \"3C.16\": \"وعلشان تربط التلات أبواب ببعض، امشي ورا الكتان. [[0.5]] احفظ دي: الكتان من الغيط، للنول، للسوق.\", \"3C.17\": \"تلاتة: التجارة. مع تطور المدن الإسلامية، خصوصًا القاهرة، مصر بقت مركز تجاري بيربط بين الشرق والغرب.\", \"3C.18\": \"وده راجع لتلات عوامل. واحد: موقع مصر على طرق التجارة بين آسيا، وإفريقيا، وأوروبا. [[0.5]] فاكر الميدان بتلات شوارع من الدرس التاني؟ هو هو.\", \"3C.19\": \"اتنين: وجود مواني نهرية وبحرية مهمة. [[0.5]] وتلاتة: ازدهار الأسواق التجارية، اللي جذبت التجار من مختلف البلاد.\", \"3C.20\": \"احفظ دي: موقع، ومواني، وأسواق.\", \"3C.21\": \"والنشاط التجاري ساهم في تلات حاجات: تنشيط الاقتصاد، وتمويل الدولة، وتعزيز مكانة مصر في العالم الإسلامي.\", \"3C.22\": \"والمقريزي تاني: «إن حركة الأسواق في القاهرة اعتمدت على تداول الذهب والفضة بين التجار». [[0.5]] تداول يعني بتتنقل من إيد لإيد.\", \"3C.23\": \"والكتاب بيسأل على كلام المقريزي: إيه العلاقة بين ازدهار التجارة ونمو المدن الإسلامية في مصر؟ [[2.0]] الكتاب ربطهم: مع تطور المدن، خصوصًا القاهرة، مصر بقت مركز تجاري. والأسواق جذبت التجار للمدن.\", \"3C.24\": \"وحقيقة من الكتاب: مصر استفادت من موقعها الجغرافي، وبقت محطة تجارية بين الشرق والغرب في العصر الإسلامي. [[0.5]] ولو عايز تفاصيل أكتر عن تاريخ مصر الإسلامية، الكتاب بيرشّح لك «البداية والنهاية» لابن كثير.\", \"3C.25\": \"سادسًا: مكانة مصر الإقليمية والدولية في العصر الوسيط. [[0.5]] نتيجة التحولات دي كلها، مصر بقت دولة محورية، فاعلة ومؤثرة في العالم الإسلامي. الإقليمية يعني في المنطقة اللي حواليها.\", \"3C.26\": \"وبقت أربع حاجات. واحد: قاعدة عسكرية مهمة لحماية حدود الدولة الإسلامية. اتنين: مركز سياسي وثقافي.\", \"3C.27\": \"تلاتة: مركز للإمدادات الاقتصادية والغذائية. فاكر الإمدادات من الدرس التاني؟ الأكل والحاجة اللي بتوصل. [[0.5]] وأربعة: حلقة وصل بين طرق التجارة في البحر المتوسط والبحر الأحمر.\", \"3C.28\": \"احفظ دي: قاعدة عسكرية، ومركز سياسي وثقافي، ومركز إمدادات، وحلقة وصل بين البحرين.\", \"3C.29\": \"وصندوق «مصر اليوم» بيقول: مصر النهارده ليها مكانة محورية على الساحة الدولية. بوابة إقليمية للأمن والاستقرار في الشرق الأوسط وشمال إفريقيا. [[0.5]] وموقعها الحيوي بيربط بين تلات قارات.\", \"3C.30\": \"والكتاب بيسأل: إزاي الظروف السياسية بعد حكم المماليك غيّرت وضع مصر الإقليمي؟ [[3.0]] ارجع للسلّم: بعد المماليك، الدولة العثمانية ضمّت مصر سنة ألف وخمسمية وسبعتاشر. فرجعت ولاية، بعد ما كانت مركز للحكم.\", \"3C.31\": \"وفيه مشروع بحثي مع زمايلك عن التحولات الكبرى في العصر الوسيط. [[0.5]] غلاف بعنوان جذاب، ومقدمة، وفهرس، وموضوعات، وقايمة مصادر، وملخص. وخد بالك من دقة التوثيق، وحقوق الملكية الفكرية.\", \"3C.32\": \"وسؤال التفسير المدعوم بالأدلة: حلّل العوامل اللي أدّت لتحولات اجتماعية في مصر بعد الفتح الإسلامي. [[2.0]] معاك كارتين جاهزين: التعريب، والهجرات العربية.\", \"3C.33\": \"ندخل على التقويم. اختر: التحول السياسي الأبرز لمصر في العصر الوسيط، تحول من إيه لإيه؟ [[2.0]] الإجابة ب: ولاية إلى مركز قيادي. دي الفكرة الرئيسة بنصها.\", \"3C.34\": \"تاني سؤال: مصر ازدهرت اقتصاديًا في العصر الوسيط بسبب إيه؟ [[2.0]] الإجابة ب: موقعها الجغرافي وكثرة مواردها.\", \"3C.35\": \"احفظ الاتنين: ولاية لمركز قيادي، وموقع وموارد.\", \"3C.36\": \"تالت سؤال: التحليل الأدق لدور العلماء في مصر في العصر الوسيط؟ [[2.0]] استبعد معايا: مش دور هامشي، ولا عسكري، ولا اقتصادي. الكتاب قال تولّوا القضاء والتعليم والشئون الدينية. يبقى الاختيار أ: حلقة وصل.\", \"3C.37\": \"وسؤال الصورة: الصورة في الكتاب من غير اسم، بس شكلها شكل الجامع الأزهر. [[0.5]] استبعد معايا: مش أول مؤسسة علمية، الأول مسجد عمرو. ومش الوحيدة. والكتاب ما ربطهاش بالدولة الطولونية. يبقى الأقرب ج: أبرز مؤسسة تعليمية في تاريخ مصر الإسلامية.\", \"3C.38\": \"وسؤال مقالي: دلّل على إن مصر شهدت في العصر الإسلامي نهضة علمية وثقافية كبيرة. [[2.0]] أدلتك من الكروت: مسجد عمرو، والأزهر، والتأليف والترجمة، والمقريزي وابن إياس.\", \"3C.39\": \"وبعده: إزاي مصر اتحولت من ولاية تابعة لمركز قيادي في العالم الإسلامي؟ [[2.0]] اطلع السلّم: ولاية. وبعدين دول مستقلة. وبعدين القاهرة مقر الخلافة الفاطمية. وبعدين مركز للحكم أيام الأيوبيين والمماليك.\", \"3C.40\": \"وفي الصفحة اللي بعدها: فسّر العلاقة بين تلات أزواج. [[0.5]] الأزهر والمكانة العلمية لمصر. والتجارة ومكانة مصر. والموقع والدور الإقليمي اللي مصر لعبته. [[2.0]]\", \"3C.41\": \"الأزهر: تدريس وإعداد علماء وتبادل علوم، فمصر بقت مركز علمي. [[0.5]] التجارة: نشّطت الاقتصاد وموّلت الدولة، فعزّزت مكانة مصر. [[0.5]] الموقع: على طرق تلات قارات، فمصر بقت حلقة وصل.\", \"3C.42\": \"احفظ دي: الأزهر علم، والتجارة تمويل، والموقع حلقة وصل.\", \"3C.43\": \"وسؤال ماذا لو: لو المؤسسات العلمية ما ظهرتش في مصر في العصر الإسلامي؟ [[2.0]] اقلب كلام الكتاب: مفيش مركز لتدريس العلوم الشرعية واللغة العربية، ولا إعداد علماء وقضاة، ولا تبادل علوم مع العالم الإسلامي.\", \"3C.44\": \"وفسّر: ازدهار القاهرة ما كانش مجرد نمو عمراني، «بل تعبير عن قوة الدولة». [[2.0]] القاهرة كانت مقر الخلافة، واجتمعت فيها السُلطات السياسية والاقتصادية والثقافية. فكل ما الدولة قويت، مدينتها كبرت.\", \"3C.45\": \"واختر مع التبرير: العامل الأهم في قوة مصر في العصر الإسلامي: الاقتصاد، ولا الجيش، ولا الثقافة؟ [[3.0]] مفيش إجابة واحدة صح. الدرجة على التبرير.\", \"3C.46\": \"وده تبرير كل واحد من الكتاب. احفظ دي: اقتصاد يموّل، وجيش يحمي، وثقافة تنوّر.\", \"3C.47\": \"وآخر سؤال: قارن بين وضع مصر السياسي في الدولة الطولونية والدولة الفاطمية، من حيث ركنا السلطة والسيادة. [[2.0]] وهنا بيت الدرس الأول بيرجع.\", \"3C.48\": \"الطولونية: دولة مستقلة، بس مع الاعتراف بالتبعية للخلافة العباسية. [[0.5]] الفاطمية: مستقلة تمامًا، والقاهرة مقر خلافتها. [[0.5]] احفظ دي: الطولونية بشريط، والفاطمية من غير شريط.\", \"3C.49\": \"تعال نراجع الدرس كله في دقيقة.\", \"3C.50\": \"دلوقتي حلّ الكويز في خُطوة. [[0.5]] وبعدها اكتبلي في الكومنتات: العامل الأهم في قوة مصر: الاقتصاد، ولا الجيش، ولا الثقافة؟ وليه؟\", \"3C.51\": \"والدرس الجاي: «التحولات الكبرى في مصر: العصر الحديث». [[0.5]] سيبنا مصر درة في تاج العثمانيين. يا ترى السلّم هيطلع تاني إزاي؟ [[1.0]]\", \"3C.52\": \"أنا أحمد الألفي. خُطوة، من Add Value.\", \"RC1\": \"الدرس كله في دقيقة. غمّض، وجاوب قبلي.\", \"RC2\": \"الفكرة الرئيسة؟ [[2.0]] من ولاية تابعة، لمركز قيادي.\", \"RC3\": \"التاريخين؟ [[2.0]] ستمية واحد وأربعين: الفتح الإسلامي. وألف وخمسمية وسبعتاشر: الضم العثماني.\", \"RC4\": \"الدول بشريط، والدولة من غير شريط؟ [[2.0]] طولونية، إخشيدية، أيوبية، مملوكية. والفاطمية لوحدها.\", \"RC5\": \"التحول الاجتماعي؟ [[2.0]] تعريب اللغة، والهجرات العربية.\", \"RC6\": \"التحول الثقافي؟ [[2.0]] علماء، ومؤسسات زي مسجد عمرو والأزهر، وتأليف وترجمة.\", \"RC7\": \"التلات مدن؟ [[2.0]] الفسطاط، والقطائع، والقاهرة.\", \"RC8\": \"أبواب الاقتصاد؟ [[2.0]] زراعة، وصناعة، وتجارة. والكتان ماشي في التلاتة.\", \"RC9\": \"مكانة مصر في أربع؟ [[2.0]] قاعدة عسكرية، ومركز سياسي وثقافي، ومركز إمدادات، وحلقة وصل بين البحرين.\", \"RC10\": \"وإمتى تراجع؟ الليلة، وبكرة، وبعد أسبوع، وقبل الامتحان.\", \"RC11\": \"وكل مرة جاوب قبل ما تشوف الإجابة.\"},SRC={\"3C.1\": \"الكتاب ص٣٧–٤٠\", \"3C.2\": \"الكتاب ص٣٧ + شرح كلمة\", \"3C.3\": \"الكتاب ص٣٧ + شرح كلمة\", \"3C.4\": \"الكتاب ص٣٧\", \"3C.5\": \"الكتاب ص٣٧ + شرح كلمة + تشبيه\", \"3C.6\": \"الكتاب ص٣٧\", \"3C.7\": \"الكتاب ص٣٧ + شرح كلمة\", \"3C.8\": \"الكتاب ص٣٧\", \"3C.9\": \"الكتاب ص٣٧\", \"3C.10\": \"الكتاب ص٣٧\", \"3C.11\": \"الكتاب ص٣٧\", \"3C.12\": \"الكتاب ص٣٧\", \"3C.13\": \"الكتاب ص٣٧\", \"3C.14\": \"الكتاب ص٣٧\", \"3C.15\": \"الكتاب ص٣٧ + رأي\", \"3C.16\": \"الكتاب ص٣٧ + تشبيه\", \"3C.17\": \"الكتاب ص٣٧\", \"3C.18\": \"الكتاب ص٣٧ + الدرس ٢\", \"3C.19\": \"الكتاب ص٣٧\", \"3C.20\": \"الكتاب ص٣٧\", \"3C.21\": \"الكتاب ص٣٧\", \"3C.22\": \"الكتاب ص٣٧ + شرح كلمة\", \"3C.23\": \"الكتاب ص٣٧ + رأي\", \"3C.24\": \"الكتاب ص٣٧\", \"3C.25\": \"الكتاب ص٣٨ + شرح كلمة\", \"3C.26\": \"الكتاب ص٣٨\", \"3C.27\": \"الكتاب ص٣٨ + الدرس ٢ + شرح كلمة\", \"3C.28\": \"الكتاب ص٣٨\", \"3C.29\": \"الكتاب ص٣٨\", \"3C.30\": \"الكتاب ص٣٢ + ص٣٨ + رأي\", \"3C.31\": \"الكتاب ص٣٨\", \"3C.32\": \"الكتاب ص٣٣ + ص٣٨ + رأي\", \"3C.33\": \"الكتاب ص٣١ + ص٣٩ + رأي\", \"3C.34\": \"الكتاب ص٣٧ + ص٣٩ + رأي\", \"3C.35\": \"الكتاب ص٣٩ + رأي\", \"3C.36\": \"الكتاب ص٣٤ + ص٣٩ + رأي\", \"3C.37\": \"الكتاب ص٣٥ + ص٣٩ + رأي\", \"3C.38\": \"الكتاب ص٣٥ + ص٣٩ + رأي\", \"3C.39\": \"الكتاب ص٣٢ + ص٣٩ + رأي\", \"3C.40\": \"الكتاب ص٤٠\", \"3C.41\": \"الكتاب ص٣٥ + ص٣٧ + ص٣٨ + رأي\", \"3C.42\": \"الكتاب ص٤٠ + رأي\", \"3C.43\": \"الكتاب ص٣٥ + ص٤٠ + رأي\", \"3C.44\": \"الكتاب ص٣٦ + ص٤٠ + رأي\", \"3C.45\": \"الكتاب ص٤٠\", \"3C.46\": \"الكتاب ص٣٢ + ص٣٥ + ص٣٧ + ص٤٠ + رأي\", \"3C.47\": \"الدرس ١ + الكتاب ص٤٠\", \"3C.48\": \"الدرس ١ + الكتاب ص٣٢ + ص٤٠ + رأي\", \"3C.49\": \"الكتاب ص٣١–٤٠\", \"3C.50\": \"الكتاب ص٤٠\", \"3C.51\": \"المنهج + الكتاب ص٣٢\", \"3C.52\": \"توقيع ثا
