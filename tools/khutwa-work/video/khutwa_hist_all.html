nfunction ST(o,x,y,ok){IT.push({k:'s',t:T0+o*OS,x:ox+x,y:oy+y,ok,d:.5});SFX.push({t:T0+o*OS,k:ok?'chime':'tick'})}\nfunction Q(o,x,y,dur){o*=OS;IT.push({k:'q',t:T0+o,x:ox+x,y:oy+y,d:dur<3?dur:LD-o});SFX.push({t:T0+o,k:'tick'},{t:T0+o+1,k:'tick'},{t:T0+o+2,k:'tick'})}\nfunction AR(o,x1,y,x2){P(o,`M${x1},${y} H${x2} M${x2},${y} l14,-9 M${x2},${y} l14,9`,N,3,.4)}\nfunction CARD(o,x,y,w,h,col,fill){P(o,`M${x},${y} h${w} v${h} h${-w} Z`,col,3,.7,fill||'#fff');SFX.push({t:T0+o*OS,k:'chime'})}\nfunction BOOM(o){SFX.push({t:T0+o,k:'boom'})}\n\n\n/* ---- إضافات v5: تكملة نص على نفس السطر، إخفاء عنصر مؤقت، عدّاد وقفة، أشكال متكررة ---- */\nfunction WC(o,txt,col,gap){const p=LASTW;IT.push(LASTW={k:'w',t:T0+o*OS,x:p.x,y:p.y,txt,sz:p.sz,col:col||p.col,a:'end',d:Math.min(1.4,.06*txt.length+.3),cx:p.cx,cy:p.cy,af:p,gp:gap==null?p.sz*.28:gap})}\nfunction FADE(o,n){for(let i=1;i<=(n||1);i++)IT[IT.length-i].off=T0+o*OS}\nconst atp=n=>CUR.filter(k=>k.p)[n||0].s/OS,EOL=()=>LD/OS;\nconst CI=(x,y,r)=>`M${x-r},${y} a${r},${r} 0 1,0 ${2*r},0 a${r},${r} 0 1,0 ${-2*r},0 `;\nconst EL=(x,y,a,b)=>`M${x-a},${y} a${a},${b} 0 1,0 ${2*a},0 a${a},${b} 0 1,0 ${-2*a},0 `;\nconst MAN=(x,y,h)=>{const r=h*.15,f=v=>(v).toFixed(1);return CI(x,+f(y+r),+f(r))+`M${x},${f(y+2*r)} V${f(y+h*.66)} M${f(x-h*.2)},${f(y+h*.46)} L${x},${f(y+h*.38)} L${f(x+h*.2)},${f(y+h*.46)} M${x},${f(y+h*.66)} l${f(-h*.14)},${f(h*.34)} M${x},${f(y+h*.66)} l${f(h*.14)},${f(h*.34)} `};\nconst KEY=(x,y,s)=>CI(x,y,13*s)+`M${x+13*s},${y} h${48*s} M${x+47*s},${y} v${12*s} M${x+58*s},${y} v${9*s} `;\nconst CHAIR=(x,y)=>`M${x},${y} V${y-78} M${x},${y-38} H${x+46} V${y} `;\nconst BOOK=(x,y)=>`M${x},${y} q-18,-10 -34,0 v30 q16,-10 34,0 q18,-10 34,0 v-30 q-16,-10 -34,0 v30 `;\nfunction CDR(o,x,y,r,n){for(let k=0;k<n;k++){const a0=-Math.PI/2+k*2*Math.PI/n,a1=a0+2*Math.PI/n*.93,p=a=>`${(x+r*Math.cos(a)).toFixed(1)},${(y+r*Math.sin(a)).toFixed(1)}`;P(o+k/OS,`M${p(a0)} A${r},${r} 0 0,1 ${p(a1)}`,R,6,.92);IT[IT.length-1].off=T0+LD-.05;SFX.push({t:T0+(o+k/OS)*OS,k:'tick'})}}\n\n/*__CONTENT_START__*/\nconst S={\"A4.0a\": \"إنت هنا: عرفنا الدولة وشعبها. [[0.5]] فاضل: حدودها فين؟\", \"A4.1\": \"تخيّل ملعب كورة. الخطوط بتحدده، وصفّارة الحكم ماشية جوّاه بس.\", \"A4.2\": \"وده تاني ركن: الحيز الجغرافي. والكتاب بيعرّفه:\", \"A4.3\": \"«الرقعة المحددة التي تمارس الدولة سيادتها عليها».\", \"A4.3a\": \"يعني مساحة حدودها معروفة، وقرار الدولة ماشي عليها. [[0.5]] وفيها تلات حاجات:\", \"A4.4\": \"اليابس، والمياه الإقليمية، والمجال الجوي. [[0.5]] يعني تحت رجلك أرض، قدامك بحر، وفوقك سما.\", \"A4.4a\": \"وخد بالك، مفيش دولة من غير حدود محددة معترف بيها. يعني الدول التانية مقرّة بيها.\", \"A4.5\": \"اليابس هو «المساحة الأرضية التي يعيش عليها السكان»، جوّه الحدود السياسية للدولة، يعني خطوطها الرسمية.\", \"A4.5a\": \"دايرة العرض خط نايم على الخريطة، وخط الطول خط واقف.\", \"A4.6\": \"وحدوده أربعة، بترتيب الكتاب:\", \"A4.7\": \"واحد، الحد الجنوبي: دائرة عرض اتنين وعشرين شمالًا، وبتفصلنا عن السودان، واترسمت سنة ألف وتمنمية وتسعة وتسعين.\", \"A4.8\": \"والحد الشمالي إيه؟ [[1.0]] اتنين: ساحل البحر المتوسط.\", \"A4.9\": \"تلاتة، الحد الشرقي: ساحل البحر الأحمر وخليج العقبة، والحد البري مع فلسطين، اترسم سنة ألف وتسعمية وستة.\", \"A4.10\": \"أربعة، الحد الغربي: خط طول خمسة وعشرين شرقًا، وبيفصلنا عن ليبيا، واترسم سنة ألف وتسعمية وخمسة وعشرين.\", \"A4.11\": \"والبحر؟ المياه الإقليمية «المساحات البحرية» اللي بتمتد عادةً اتناشر ميل بحري من خط الأساس للساحل.\", \"A4.11a\": \"والميل البحري مقياس لمسافات البحر. [[0.5]] يعني شريط بحر، زي الرصيف قدام بيتكم.\", \"A4.12\": \"ولو حد طيّر درون فوق بيتكم من غير إذن؟ هتعترضوا. والدولة كمان.\", \"A4.13\": \"ده المجال الجوي: «المساحة الرأسية التي تعلو الحيز الجغرافي للدولة». يعني طالعة لفوق. والدولة بتمارس سيادتها عليه.\", \"A4.14\": \"عشان كده مفيش طيارة تدخل المجال الجوي المصري من غير تصريح رسمي. وده فيه ركنين:\", \"A4.15\": \"الحيز الجغرافي، لأن السما جزء منه، والسيادة، لأن الدولة هي اللي بتسمح.\", \"A4.16\": \"ونفس الفكرة في قناة السويس، الدولة بتحميها وبتراقب السفن العابرة.\", \"A4.17\": \"ودي أدلتك في «دلّل»: الدولة كيان متكامل، أرض وبحر وسما، مش مجرد أرض.\", \"A4.18\": \"ووحدة الأرض أساس قيام الدولة، والحدود «رمز لوحدة الوطن واستقراره».\", \"A5.1\": \"اختبر نفسك قبل ما نراجع: الدولة أركانها كام؟ [[1.0]] أربعة: شعب، وحيز جغرافي، وسلطة، وسيادة.\", \"A5.2\": \"والشعب مصدر السلطات، وليه خمس أدوار.\", \"A5.3\": \"والحيز: يابس، ومياه إقليمية اتناشر ميل، ومجال جوي.\", \"A5.4\": \"والحدود: الجنوب دائرة عرض اتنين وعشرين شمالًا، والغرب خط طول خمسة وعشرين شرقًا،\", \"A5.5\": \"والشمال المتوسط، والشرق البحر الأحمر وخليج العقبة والحد مع فلسطين.\", \"A5.6\": \"وده أول جزء في إجابة سؤالنا: الدولة اللي بتعيش ليها شعب واعي، وحدود معترف بيها.\", \"A5.7\": \"الفصل الجاي: مين بيعمل القوانين؟ وإمتى يبقى قرار الدولة بإيدها؟\", \"R1\": \"دقيقة مراجعة. غمّض، وجاوب قبلي.\", \"R2\": \"الدولة أركانها كام، وإيه هم؟ [[2.0]] أربعة: شعب، وحيز جغرافي، وسلطة، وسيادة.\", \"R3\": \"الشعب مين؟ [[2.0]] كل حاملي الجنسية، جوّه مصر وبرّاها.\", \"R4\": \"مادة كام بتقول الشعب مصدر السلطات؟ [[2.0]] المادة الرابعة.\", \"R5\": \"أدوار الشعب الخمسة، على صوابعك؟ [[2.0]] سياسية، وأمن، وتنمية، وهوية، ودفاع.\", \"R6\": \"الحيز فيه إيه؟ [[2.0]] يابس، ومياه إقليمية، ومجال جوي.\", \"R7\": \"المياه الإقليمية كام ميل؟ [[2.0]] اتناشر ميل بحري.\", \"R8\": \"والحد الجنوبي والغربي؟ [[2.0]] دائرة عرض اتنين وعشرين شمالًا، وخط طول خمسة وعشرين شرقًا.\", \"R9\": \"سمّعهم تاني بكرة، وبعد أسبوع.\"};\n/* ============ السبورة A45: الشرايح A4–A5 + دقيقة المراجعة ============ */\nconst BLU='#3E8FCF',BRN='#B8860B',SKY='#DCEEFB',PUR='#8E44AD',CREAM='#FBF3DC';\n/* خريطة مصر (وحدة 400×300): الحد الغربي، ساحل المتوسط، الحد البري الشرقي، خليج العقبة، خليج السويس، ساحل البحر الأحمر، الحد الجنوبي */\nconst EGU={W:[[0,300],[0,6]],N:[[0,6],[40,12],[74,8],[131,25],[165,12],[181,5],[205,0],[228,3],[245,10],[280,16],[309,9]],E:[[309,9],[333,66]],AQ:[[333,66],[311,122]],SG:[[311,122],[290,95],[252,52]],RS:[[252,52],[262,80],[296,136],[345,215],[400,300]],\n NL:[[212,300],[240,262],[265,234],[262,200],[259,169],[242,173],[225,150],[208,137], file\" accept=\"audio/*\" hidden><\/label><button id=\"sync\">ظبط التوقيت على صوتي<\/button><button id=\"tap\" style=\"background:#1EA05F;border-color:#1EA05F\">جملة (Enter)<\/button><button id=\"cp\">انسخ كود التوقيت<\/button><span id=\"msg\"><\/span><button id=\"recm\">وضع تسجيل الشاشة<\/button><button id=\"fs\">ملء الشاشة<\/button>\n<\/div>\n<p id=\"note\">نسخة v1 · السبورة B (الفصل الثاني · الشرايح B1–B6). <b>التسجيل:<\/b> دوس «سجّل الشريحة»، هيعدّ ٣ وبعدين الكلام يتعلّم كلمة كلمة تحت وإنت بتقرا، والرسم ماشي معاه (ظبّط السرعة على كلامك). <b>بعد التسجيل:<\/b> ارفع فويس الشريحة، دوس «ظبط التوقيت على صوتي»، ودوس Enter أول ما تسمع بداية كل جملة؛ الرسم هيتشدّ على صوتك. شغّل واتأكد، وبعدين «انسخ كود التوقيت» وابعتهولي أثبّته. في «وضع الشرايح»: دوسة على شمال الشاشة للشريحة الجاية وعلى اليمين للي قبلها، والمسافة للتشغيل، والعرض بيقف آخر كل شريحة. للخروج من وضع تسجيل الشاشة دوس Esc.<\/p>\n<\/div>\n<script>\nconst G='#1EA05F',GD='#106942',N='#0E2A47',R='#D7463C',Y='#F5BE32',YD='#C99A1B',SAND='#F3E3B5',GR='#666';\nconst CW=1066,CH=600,NS='http://www.w3.org/2000/svg';\nconst OS=1.35;let CUR=[],LASTW=null,IT=[],LINES=[],CAM=[[0,2133,0,CW,CH]],SL=[],SFX=[],T0=0,ox=0,oy=0,LD=0;\nconst sm=p=>{p=Math.max(0,Math.min(1,p));return p*p*(3-2*p)};\nfunction cell(c,r){ox=(2-c)*CW;oy=r*CH}\nfunction camTo(o,x,y,w,h,d=1.2){const t=T0+o,l=CAM[CAM.length-1];CAM.push([t,l[1],l[2],l[3],l[4]],[t+d,x,y,w,h]);SFX.push({t,k:'whoosh'})}\nfunction go(c,r){cell(c,r);camTo(0,ox,oy,CW,CH)}\nfunction line(id,src,txt,fn){const words=txt.replace(/\\[\\[[\\d.]+\\]\\]/g,'').trim().split(/\\s+/).length;let pz=0;txt.replace(/\\[\\[([\\d.]+)\\]\\]/g,(m,v)=>pz+=+v);\n LD=words*0.58+pz+0.45;let cu=0;const tk=txt.trim().split(/\\s+/).filter(Boolean).map(w=>{const m=w.match(/^\\[\\[([\\d.]+)\\]\\]$/),d=m?+m[1]:.58,o={w,p:!!m,v:m&&m[1],s:cu,e:cu+d};cu+=d;return o});\n CUR=tk;LINES.push({id,src,tk,t:T0,d:LD,txt:txt.replace(/\\s*\\[\\[[\\d.]+\\]\\]\\s*/g,' ').trim()});fn&&fn();T0+=LD}\n/* at('كلمة'[,n]) = وقت بداية 34)} `};\nconst KEY=(x,y,s)=>CI(x,y,13*s)+`M${x+13*s},${y} h${48*s} M${x+47*s},${y} v${12*s} M${x+58*s},${y} v${9*s} `;\nconst CHAIR=(x,y)=>`M${x},${y} V${y-78} M${x},${y-38} H${x+46} V${y} `;\nconst BOOK=(x,y)=>`M${x},${y} q-18,-10 -34,0 v30 q16,-10 34,0 q18,-10 34,0 v-30 q-16,-10 -34,0 v30 `;\nfunction CDR(o,x,y,r,n){for(let k=0;k<n;k++){const a0=-Math.PI/2+k*2*Math.PI/n,a1=a0+2*Math.PI/n*.93,p=a=>`${(x+r*Math.cos(a)).toFixed(1)},${(y+r*Math.sin(a)).toFixed(1)}`;P(o+k/OS,`M${p(a0)} A${r},${r} 0 0,1 ${p(a1)}`,R,6,.92);IT[IT.length-1].off=T0+LD-.05;SFX.push({t:T0+(o+k/OS)*OS,k:'tick'})}}\n\n/*__CONTENT_START__ (اكتب محتوى السبورة هنا: slide()/go()/line()...) */\nconst SP={\"B1.1\": \"إنت هنا: خلّصنا ركنين، الشعب والحيز الجغرافي. [[0.5]] ولو داخل على الفصل ده على طول، خد دي:\", \"B1.2\": \"الدولة واقفة على أربع أركان: شعب، وحيز جغرافي، وسلطة، وسيادة.\", \"B1.3\": \"هنا هنكمّل بالسلطة والسيادة، ولو ركن غاب يحصل إيه.\", \"B2.1\": \"خد مدرستك: فيه لايحة بتتكتب، وإدارة بتطبّقها، وحد بيفصل في المشاكل.\", \"B2.2\": \"الدولة بتشتغل بنفس الطريقة. تالت ركن: السلطة، الجهة اللي بتدير. وتعريفها:\", \"B2.3\": \"«المؤسسات التي تدير شئون الدولة وتضع القوانين وتعمل على تنفيذها»، وبتحافظ على الأمن العام.\", \"B2.3a\": \"المؤسسات جهات منظّمة، بتكمّل شغلها حتى لو الأشخاص اتغيّروا. زي مدرستك.\", \"B2.4\": \"والدستور قسّمها تلات سلطات، في أربع مواد، لأن التنفيذية ليها مادتين.\", \"B2.5\": \"الأولى بتعمل القانون، والتانية بتنفّذه، والتالتة بتحكم بيه.\", \"B2.6\": \"تفتكر مين بيعمل القوانين؟ [[1.0]] مجلس النواب، اللي الشعب اختارهم! ودي السلطة التشريعية.\", \"B2.7\": \"والمادة مية وواحد: مجلس النواب «يتولى سلطة التشريع»، وبيقرّ السياسة العامة والموازنة.\", \"B2.7a\": \"بيقرّ يعني بيوافق. والموازنة خطة فلوس الدولة، زي مصروفك لما تقسّمه.\", \"B2.8\": \"وكمان «يمارس الرقابة على أعمال السلطة التنفيذية».\", \"B2.8a\": \"الرقابة يعني يتابع ويحاسب. زي حكم الفيديو لما يراجع القرار.\", \"B2.9\": \"السلطة التانية، التنفيذية. المادة مية تسعة وتلاتين: رئيس الجمهورية «رئيس الدولة ورئيس السلطة التنفيذية».\", \"B2.10\": \"والمادة مية تلاتة وستين: الحكومة «الهيئة التنفيذية والإدارية العليا للدولة».\", \"B2.10a\": \"يعني أعلى جهة بتنفّذ، وبتدير الشغل اليومي.\", \"B2.11\": \"السلطة التالتة: القضائية. والمادة مية أربعة وتمانين: «السلطة القضائية مستقلة».\", \"B2.11a\": \"مستقلة يعني محدش بيتدخّل في حكمها. زي الحكم في الماتش.\", \"B2.12\": \"بتتولاها المحاكم بكل أنواعها ودرجاتها، وبتصدر أحكامها حسب القانون.\", \"B2.13\": \"وقّف وخمّن: الموازنة العامة للدولة، مين بيقرّها؟ [[3.0]]\", \"B2.14\": \"مجلس النواب، يعني السلطة التشريعية.\", \"B3.1\": \"والعلاقة بينهم؟ التشريعية بتراقب التنفيذية، والقضائية مستقلة، وكلهم ماشيين حسب الدستور.\", \"B3.2\": \"وعشان كده «استقرار الدولة مرتبط بقوة مؤسساتها وتنظيمها».\", \"B3.3\": \"طب السلطة مهمة ليه؟ فيه أربع أسباب، احفظهم:\", \"B3.4\": \"واحد، تحفظ النظام والقانون. اتنين، تحقق الاستقرار السياسي والاجتماعي.\", \"B3.5\": \"تلاتة، تحمي حقوق المواطنين. أربعة، تمكّن الدولة من ممارسة سيادتها. يعني تخلّيها تقدر.\", \"B4.1\": \"ينفع حد من برّه البيت يقرر إنتو هتصرفوا فلوسكم في إيه؟\", \"B4.2\": \"لأ. وده المفتاح اللي قلنا عليه. رابع ركن: السيادة. وتعريفها:\", \"B4.3\": \"«استقلال الدولة في اتخاذ قراراتها فيما يتعلق بشئونها الداخلية والخارجية» [[0.5]] «من دون خضوع لسلطة خارجية».\", \"B4.3a\": \"يعني قرارها بإيدها، جوّه وبرّه، ومحدش بيمليه عليها.\", \"B4.4\": \"والسيادة ليها نوعين. داخلية، يعني جوّه البيت: الدولة بتحط قوانينها، وبتحفظ أمنها، وبتدير شئون مواطنيها،\", \"B4.5\": \"من غير أي ضغوط من برّه.\", \"B4.6\": \"وخارجية، يعني مع باقي الدول: مستقلة في علاقاتها الدولية، وبتمضي معاهداتها، وبتعمل علاقات دبلوماسية،\", \"B4.7\": \"وبتحمي مصالحها، وليها تمثيل في المنظمات الدولية.\", \"B4.7a\": \"المعاهدة اتفاق رسمي مكتوب بين دول. والدبلوماسية كلامهم الرسمي مع بعض.\", \"B4.8\": \"يعني بالبلدي: السلطة بتدير، والسيادة إن قرار الدولة ما يتفرضش عليها.\", \"B4.9\": \"والعلاقة بينهم إن السلطة هي اللي بتمكّن الدولة تمارس سيادتها.\", \"B4.10\": \"وفاكر المادة الرابعة؟ [[1.0]] الشعب مصدر السلطات، والدولة بسلطاتها بتمارس السيادة.\", \"B4.11\": \"ومثال لسعي مصر لاستقلال قرارها، من التاريخ الحديث: ثورة ألف وتسعمية وتسعتاشر.\", \"B4.12\": \"والأمثلة القديمة هتقابلها في الدرس الجاي.\", \"B5.1\": \"هات كرسي بأربع رجول، وشيل رجل واحدة. [[2.0]]\", \"B5.2\": \"الكرسي هيميل، ويبقى مهدد يقع. وأركان الدولة كده بالظبط، مترابطة،\", \"B5.3\": \"و«إذا اختل أحدها تأثّر كيان الدولة بأكمله».\", \"B5.4\": \"من غير شعب، مفيش مين يشارك ويبني. ولو مش واعي، الدولة بتضعف.\", \"B5.5\": \"ومن غير حدود محددة معترف بيها، مفيش دولة أصلًا.\", \"B5.6\": \"ومن غير سلطة، يضيع النظام والقانون، وحقوق المواطنين ما تلاقيش حماية.\", \"B5.7\": \"ومن غير سيادة، الدولة ما تقدرش تاخد قرارها بنفسها.\", \"B6.1\": \"نراجع. فاكر كام سلطة؟ [[1.0]] تلاتة: تشريعية، وتنفيذية، وقضائية.\", \"B6.2\": \"وأهمية السلطة في أربع حاجات: النظام والقانون، والاستقرار، والحقوق، وتمكين السيادة.\", \"B6.3\": \"والسيادة: استقلال قرار الدولة، وليها نوعين: داخلية وخارجية.\", \"B6.4\": \"ولو ركن اختل، الدولة كلها بتتأثر.\", \"B6.5\": \"وده تاني جزء في الإجابة: الدولة اللي بتعيش ليها سلطة بتحفظ النظام، وقرار مستقل.\", \"B6.6\": \"طب إيه اللي خلّى مصر بالذات تستمر آلاف السنين؟ ده الفصل الجاي.\", \"RB1\": \"دقيقة مراجعة. غمّض، وجاوب قبلي.\", \"RB2\": \"السلطة تعريفها إيه؟ [[2.0]] «المؤسسات التي تدير شئون الدولة وتضع القوانين وتعمل على تنفيذها».\", \"RB3\": \"السلطات كام، وكل واحدة بتعمل إيه؟ [[2.0]] تلاتة: تشريعية تعمل القانون، وتنفيذية تنفّذه، وقضائية تحكم بيه.\", \"RB4\": \"مواد الدستور الأربعة بالترتيب؟ [[2.0]] مية وواحد، مية تسعة وتلاتين، مية تلاتة وستين، مية أربعة وتمانين.\", \"RB5\": \"أهمية السلطة، بكلمة «ناحت»؟ [[2.0]] نظام وقانون، واستقرار، وحقوق المواطنين، وتمكين السيادة.\", \"RB6\": \"السيادة يعني إيه، ونوعيها؟ [[2.0]] استقلال قرار الدولة، من غير خضوع لسلطة خارجية. وهي داخلية وخارجية.\", \"RB7\": \"ولو ركن اختل؟ [[2.0]] الدولة كلها بتتأثر.\", \"RB8\": \"سمّعهم تاني بكرة، وبعد أسبوع.\", \"B2.3m\": \"المبنى، فالمكتب، فاللايحة، فالجرس، وترباس على البوابة.\", \"B2.8m\": \"مجلس النواب في كلمة: تسمّر. تشريع، سياسة، موازنة، رقابة.\", \"B3.5m\": \"أهمية السلطة في كلمة: ناحت. نظام، استقرار، حقوق، تمكين.\", \"B4.7m\": \"جوّه البيت تلاتة، وبرّه الباب خمسة.\", \"B4.11m\": \"تسعتاشر وتسعتاشر: نفس الرقم مرتين.\", \"B5.3m\": \"امشي على الأعمدة بالترتيب، واسأل: لو ده وقع، إيه يضيع؟\"},SRC={\"B1.1\": \"\", \"B1.2\": \"الكتاب ص١١\", \"B1.3\": \"الكتاب ص٩\", \"B2.1\": \"تشبيه\", \"B2.2\": \"الكتاب ص١٤ + تذكير\", \"B2.3\": \"الكتاب ص١٤\", \"B2.3a\": \"شرح كلمة + تشبيه\", \"B2.4\": \"الكتاب ص١٤\", \"B2.5\": \"الكتاب ص١٤\", \"B2.6\": \"الكتاب ص١٤ + تذكير\", \"B2.7\": \"الكتاب ص١٤\", \"B2.7a\": \"شرح كلمة + تشبيه\", \"B2.8\": \"الكتاب ص١٤\", \"B2.8a\": \"شرح كلمة + تشبيه\", \"B2.9\": \"الكتاب ص١٤\", \"B2.10\": \"الكتاب ص١٤\", \"B2.10a\": \"شرح كلمة\", \"B2.11\": \"الكتاب ص١٤\", \"B2.11a\": \"شرح كلمة + تشبيه\", \"B2.12\": \"الكتاب ص١٤\", \"B2.13\": \"الكتاب ص١٤\", \"B2.14\": \"الكتاب ص١٤\", \"B3.1\": \"الكتاب ص١٤، ص١٥\", \"B3.2\": \"الكتاب ص١٤\", \"B3.3\": \"الكتاب ص١٥\", \"B3.4\": \"الكتاب ص١٥\", \"B3.5\": \"الكتاب ص١٥ + شرح كلمة\", \"B4.1\": \"تشبيه\", \"B4.2\": \"الكتاب ص١٥ + تشبيه\", \"B4.3\": \"الكتاب ص١٥\", \"B4.3a\": \"شرح التعريف\", \"B4.4\": \"الكتاب ص١٥ + تشبيه\", \"B4.5\": \"الكتاب ص١٥\", \"B4.6\": \"الكتاب ص١٥ + شرح كلمة\", \"B4.7\": \"الكتاب ص١٥\", \"B4.7a\": \"شرح كلمة\", \"B4.8\": \"الكتاب ص١٤–١٥\", \"B4.9\": \"الكتاب ص١٥\", \"B4.10\": \"الكتاب ص١٢، ص١٥\", \"B4.11\": \"الكتاب ص١٢، ص١٥\", \"B4.12\": \"الكتاب ص١٢، ص٥\", \"B5.1\": \"تشبيه\", \"B5.2\": \"الكتاب ص٩\", \"B5.3\": \"الكتاب ص٩\", \"B5.4\": \"الكتاب ص١٢\", \"B5.5\": \"الكتاب ص١٣\", \"B5.6\": \"الكتاب ص١٥\", \"B5.7\": \"الكتاب ص١٥، ص١٩\", \"B6.1\": \"الكتاب ص١٤\", \"B6.2\": \"الكتاب ص١٥\", \"B6.3\": \"الكتاب ص١٥\", \"B6.4\": \"الكتاب ص٩\", \"B6.5\": \"الكتاب ص١٥\", \"B6.6\": \"الكتاب ص٩\", \"RB1\": \"مراجعة\", \"RB2\": \"مراجعة\", \"RB3\": \"مراجعة\", \"RB4\": \"مراجعة\", \"RB5\": \"مراجعة\", \"RB6\": \"مراجعة\", \"RB7\": \"مراجعة\", \"RB8\": \"مراجعة\", \"B2.3m\": \"رابط حفظ\", \"B2.8m\": \"رابط حفظ\", \"B3.5m\": \"رابط حفظ\", \"B4.7m\": \"رابط حفظ\", \"B4.11m\": \"رابط حفظ\", \"B5.3m\": \"ر d:#1EA05F;border-color:#1EA05F\">جملة (Enter)<\/button><button id=\"cp\">انسخ كود التوقيت<\/button><span id=\"msg\"><\/span><button id=\"recm\">وضع تسجيل الشاشة<\/button><button id=\"fs\">ملء الشاشة<\/button>\n<\/div>\n<p id=\"note\">نسخة v1 · السبورة C (الفصل الثالث · الشرايح C1–C4). <b>التسجيل:<\/b> دوس «سجّل الشريحة»، هيعدّ ٣ وبعدين الكلام يتعلّم كلمة كلمة تحت وإنت بتقرا، والرسم ماشي معاه (ظبّط السرعة على كلامك). <b>بعد التسجيل:<\/b> ارفع فويس الشريحة، دوس «ظبط التوقيت على صوتي»، ودوس Enter أول ما تسمع بداية كل جملة؛ الرسم هيتشدّ على صوتك. شغّل واتأكد، وبعدين «انسخ كود التوقيت» وابعتهولي أثبّته. في «وضع الشرايح»: دوسة على شمال الشاشة للشريحة الجاية وعلى اليمين للي قبلها، والمسافة للتشغيل، والعرض بيقف آخر كل شريحة. للخروج من وضع تسجيل الشاشة دوس Esc.<\/p>\n<\/div>\n<script>\nconst G='#1EA05F',GD='#106942',N='#0E2A47',R='#D7463C',Y='#F5BE32',YD='#C99A1B',SAND='#F3E3B5',GR='#666';\nconst CW=1066,CH=600,NS='http://www.w3.org/2000/svg';\nconst OS=1.35;let CUR=[],LASTW=null,IT=[],LINES=[],CAM=[[0,2133,0,CW,CH]],SL=[],SFX=[],T0=0,ox=0,oy=0,LD=0;\nconst sm=p=>{p=Math.max(0,Math.min(1,p));return p*p*(3-2*p)};\nfunction cell(c,r){ox=(2-c)*CW;oy=r*CH}\nfunction camTo(o,x,y,w,h,d=1.2){const t=T0+o,l=CAM[CAM.length-1];CAM.push([t,l[1],l[2],l[3],l[4]],[t+d,x,y,w,h]);SFX.push({t,k:'whoosh'})}\nfunction go(c,r){cell(c,r);camTo(0,ox,oy,CW,CH)}\nfunction line(id,src,txt,fn){const words=txt.replace(/\\[\\[[\\d.]+\\]\\]/g,'').trim().split(/\\s+/).length;let pz=0;txt.replace(/\\[\\[([\\d.]+)\\]\\]/g,(m,v)=>pz+=+v);\n LD=words*0.58+pz+0.45;let cu=0;const tk=txt.trim().split(/\\s+/).filter(Boolean).map(w=>{const m=w.match(/^\\[\\[([\\d.]+)\\]\\]$/),d=m?+m[1]:.58,o={w,p:!!m,v:m&&m[1],s:cu,e:cu+d};cu+=d;return o});\n CUR=tk;LINES.push({id,src,tk,t:T0,d:LD,txt:txt.replace(/\\s*\\[\\[[\\d.]+\\]\\]\\s*/g,' ').trim()});fn&&fn();T0+=LD}\n/* at('كلمة'[,n]) = وقت بداية أول (أو رقم n) كلمة فيها النص ده في السطر الحالي؛ استخدمها كـ offset لأي عنصر */\nfunction at(sub,n){let c=0;for(const k of CUR){if(!k.p&&k.w.includes(sub)){if(c==(n||0))return k.s/OS;c++}}throw new Error('at: «'+sub+'» مش في السطر: '+CUR.map(k=>k.w).join(' '))}\nfunction slide(name){SL.push({t:T0,name})}\nfunction W(o,x,y,txt,sz,col,a){IT.push(LASTW={k:'w',t:T0+o*OS,x:ox+x,y:oy+y,txt,sz,col,a:a||'end',d:Math.min(1.4,.06*txt.length+.3),cx:ox,cy:oy})}\nfunction P(o,d,col,w,dur,fill,cls){IT.push({k:'p',t:T0+o*OS,tx:ox,ty:oy,dd:d,col,w:w||3,d:dur||.8,fill,cls})}\nfunction ST(o,x,y,ok){IT.push({k:'s',t:T0+o*OS,x:ox+x,y:oy+y,ok,d:.5});SFX.push({t:T0+o*OS,k:ok?'chime':'tick'})}\nfunction Q(o,x,y,dur){o*=OS;IT.push({k:'q',t:T0+o,x:ox+x,y:oy+y,d:dur<3?dur:LD-o});SFX.push({t:T0+o,k:'tick'},{t:T0+o+1,k:'tick'},{t:T0+o+2,k:'tick'})}\nfunction AR(o,x1,y,x2){P(o,`M${x1},${y} H${x2} M${x2},${y} l14,-9 M${x2},${y} l14,9`,N,3,.4)}\nfunction CARD(o,x,y,w,h,col,fill){P(o,`M${x},${y} h${w} v${h} h${-w} Z`,col,3,.7,fill||'#fff');SFX.push({t:T0+o*OS,k:'chime'})}\nfunction BOOM(o){SFX.push({t:T0+o,k:'boom'})}\n\n\n/* ---- إضافات v5: تكملة نص على نفس السطر، إخفاء عنصر مؤقت، عدّاد وقفة، أشكال متكررة ---- */\nfunction WC(o,txt,col,gap){const p=LASTW;IT.push(LASTW={k:'w',t:T0+o*OS,x:p.x,y:p.y,txt,sz:p.sz,col:col||p.col,a:'end',d:Math.min(1.4,.06*txt.length+.3),cx:p.cx,cy:p.cy,af:p,gp:gap==null?p.sz*.28:gap})}\nfunction FADE(o,n){for(let i=1;i<=(n||1);i++)IT[IT.length-i].off=T0+o*OS}\nconst atp=n=>CUR.filter(k=>k.p)[n||0].s/OS,EOL=()=>LD/OS;\nconst CI=(x,y,r)=>`M${x-r},${y} a${r},${r} 0 1,0 ${2*r},0 a${r},${r} 0 1,0 ${-2*r},0 `;\nconst EL=(x,y,a,b)=>`M${x-a},${y} a${a},${b} 0 1,0 ${2*a},0 a${a},${b} 0 1,0 ${-2*a},0 `;\nconst MAN=(x,y,h)=>{const r=h*.15,f=v=>(v).toFixed(1);return CI(x,+f(y+r),+f(r))+`M${x},${f(y+2*r)} V${f(y+h*.66)} M${f(x-h*.2)},${f(y+h*.46)} L${x},${f(y+h*.38)} L${f(x+h*.2)},${f(y+h*.46)} M${x},${f(y+h*.66)} l${f(-h*.14)},${f(h*.34)} M${x},${f(y+h*.66)} l${f(h*.14)},${f(h*.34)} `};\nconst KEY=(x,y,s)=>CI(x,y,13*s)+`M${x+13*s},${y} h${48*s} M${x+47*s},${y} v${12*s} M${x+58*s},${y} v${9*s} `;\nconst CHAIR=(x,y)=>`M${x},${y} V${y-78} M${x},${y-38} H${x+46} V${y} `;\nconst BOOK=(x,y)=>`M${x},${y} q-18,-10 -34,0 v30 q16,-10 34,0 q18,-10 34,0 v-30 q-16,-10 -34,0 v30 `;\nfunction CDR(o,x,y,r,n){for(let k=0;k<n;k++){const a0=-Math.PI/2+k*2*Math.PI/n,a1=a0+2*Math.PI/n*.93,p=a=>`${(x+r*Math.cos(a)).toFixed(1)},${(y+r*Math.sin(a)).toFixed(1)}`;P(o+k/OS,`M${p(a0)} A${r},${r} 0 0,1 ${p(a1)}`,R,6,.92);IT[IT.length-1].off=T0+LD-.05;SFX.push({t:T0+(o+k/OS)*OS,k:'tick'})}}\n\n/*__CONTENT_START__*/\nconst S={\"C1.1\": \"إنت هنا: خلّصنا الأركان الأربعة، شعب، وحيز، وسلطة، وسيادة. [[0.5]] فاضل السؤال الكبير: مصر كمّلت ليه؟\", \"C1.2\": \"بس الأركان لوحدها مش كفاية. الدول بتنشأ لما مقومات، يعني حاجات بتساعدها تقوم وتكمّل، تتجمّع،\", \"C1.3\": \"ويحوّلوا «تجمعات بشرية مشتتة» لـ«كيان سياسي منظم».\", \"C1.3a\": \"يعني من ناس متفرّقين، لبلد واحدة منظّمة.\", \"C1.4\": \"ومصر عندها ست مقومات، بترتيب الكتاب.\", \"C2.1\": \"لو أبوك عنده محل، يفتحه في شارع رئيسي ولا في حارة سد؟\", \"C2.2\": \"أكيد الشارع الرئيسي. أول مقوّم: الموقع الجغرافي، يعني مكانها على الخريطة، والحدود الطبيعية.\", \"C2.3\": \"مصر في قلب قارات العالم القديم، فبقت مركز للتواصل الحضاري والتبادل التجاري.\", \"C2.4\": \"وحدودها الطبيعية، صحرا وبحر، كانت حواجز بتحمي قلب الدولة، الوادي والدلتا.\", \"C2.5\": \"فالمصريين استقروا، وركّزوا في الزراعة والعمران، وده دعم نشأة الدولة واستقرارها.\", \"C2.6\": \"وجمال حمدان قال في «شخصية مصر»: «فمصر موضعًا دولة نهر، وموقعًا دولة برزخ».\", \"C2.7\": \"«دولة نهر» بسبب النيل، و«دولة برزخ» يعني موقعها بيربط القارات ببعض.\", \"C2.8\": \"وقّف الفيديو وفكّر: لو مفيش نيل، مصر كانت هتبقى مهمة؟ [[3.0]]\", \"C2.9\": \"حمدان بيجاوب: «ولو لم يكن النيل فرضًا لفرض الموقع نفسه يقينًا».\", \"C2.9a\": \"يعني حتى من غير نيل، الموقع لوحده كان هيخلّيها مهمة.\", \"C2.10\": \"تاني مقوّم: الموارد الطبيعية، يعني خير الأرض، وأهمها نهر النيل. وده أساس قيام الحضارة المصرية،\", \"C2.11\": \"لأنه خلّى المصري يتحوّل من «جامع للثمار» لـ«مزارع مستقر».\", \"C2.11a\": \"يعني بطّل يلفّ على أكله، وقعد يزرع.\", \"C2.12\": \"تخيّل عمارة فيها خزان مية واحد. لازم حد ينظّم التوزيع، وإلا الخناقات تبدأ.\", \"C2.13\": \"والنيل كده. الري والسدود محتاجين شغل جماعي، وسلطة مركزية قوية، من مركز واحد.\", \"C2.14\": \"السلطة دي كانت بتنظّم توزيع المية، وبتحل النزاعات بين الأقاليم، يعني خلافات المناطق.\", \"C2.15\": \"والنيل كمان كان شريان بيربط الشمال بالجنوب.\", \"C2.16\": \"والمصري القديم غنّى للنيل: «تحيةً لك يا حابي… لكي يعطي الحياة لمصر».\", \"C2.17\": \"وفي كتاب الموتى أقسم، يعني حلف: «لم أُلوّث ماء النهر». «لم أمنع الماء في موسمه». «لم أُقِم سدًا أمام الماء المتدفق».\", \"C2.18\": \"يعني النيل ما كانش مجرد مية. ده زراعة واستقرار، وسلطة مركزية، ومقدّس كمان.\", \"C2.19\": \"وجنب النيل فيه أراضي خصبة، يعني بتطرح كويس، ومعادن، وأحجار بناء.\", \"C2.20\": \"ودول نشّطوا الزراعة والصناعة والتجارة، ودعموا الاستقرار الاقتصادي.\", \"C3.1\": \"عيلة كبيرة بتتكلم بنفس الطريقة، وبتفرح وتزعل مع بعض. صعب حد يفرّقها، صح؟\", \"C3.2\": \"تالت مقوّم: التجانس البشري، يعني الناس شبه بعض ومتماسكين، والوحدة الوطنية. المصريين اتصهروا في ثقافة واحدة من فجر التاريخ.\", \"C3.3\": \"والكتاب بيسميها «بوتقة ثقافية واحدة»، طلّعت «اتحادًا متماسكًا يصعب تفتيته».\", \"C3.3a\": \"البوتقة وعاء المعادن بتسيح فيه وتبقى حتة واحدة. يعني صعب يتكسّر.\", \"C3.4\": \"فالوحدة السياسية بقت حاجة طبيعية، والمصريين ما اتأثروش بثقافة المحتل، وحافظوا على هويتهم المميزة.\", \"C3.5\": \"يعني التجانس بيقوّي الدولة، لأنه بيصعّب تفتيت وحدتها.\", \"C3.6\": \"قريتين، كل واحدة بتعمل اللي هي عايزاه من غير تنسيق؟ أكيد هيتخانقوا.\", \"C3.7\": \"رابع مقوّم: الحكومة المركزية القوية. الملك مينا، أو نعرمر، وحّد القطرين، الشمال والجنوب.\", \"C3.8\": \"وبعدها قامت حكومة مركزية قوية، وده كان «الأساس الحقيقي لظهور الدولة المصرية».\", \"C3.9\": \"ومصر بقت دولة ليها سلطة واحدة ونظام إداري موحد، يعني إدارة واحدة للكل.\", \"C3.10\": \"فاكر خزان المية؟ [[1.0]] الحاجة للتنظيم هي اللي جابت الحكومة المركزية.\", \"C3.11\": \"خامس مقوّم: القوة العسكرية، يعني الجيش. جيش من أبناء مصر بيدافع عن أرضها.\", \"C3.12\": \"والكتاب بيوصف الجيش إنه «الأداة التي تحمي حدود الدولة» [[0.5]] «وتصون إنجازاتها الحضارية وتضمن استقرارها السياسي».\", \"C3.12a\": \"تصون يعني تحافظ. وإنجازاتها الحضارية: كل اللي بنته.\", \"C3.13\": \"وعقيدته، يعني مبدأه: «يبني ويحمي ويحافظ على الأرض ولا يعتدي».\", \"C3.14\": \"«أفكّر وأناقش»: بعد التوحيد، مصر احتاجت جيش يحمي حدودها واستقرارها.\", \"C3.15\": \"والنهارده محتاجاه في أعلى جاهزية، يعني مستعد دايمًا، لنفس السبب، لأنه «كان ولا يزال» الأداة دي.\", \"C3.16\": \"سؤال سريع: الجيش ركن ولا مقوّم؟ [[1.0]] مقوّم! وده بيوقّع ناس كتير.\", \"C3.17\": \"سادس مقوّم: الحفاظ على الهوية المصرية. وتعريف الهوية الوطنية:\", \"C3.18\": \"«مجموعة من الخصائص التي تميّز الشعب المصري عبر التاريخ، وتشكّل شخصيته وتعكس انتماءه الوطني».\", \"C3.18a\": \"يعني اللي بيخلّي المصري مصري، وحاسس إنه تبع بلده. زي النادي بلونه ونشيده.\", \"C3.19\": \"ومرتكزاتها، يعني اللي واقفة عليه، تلاتة: الدين، واللغة، والتاريخ.\", \"C3.20\": \"والمصريين حافظوا عليها بلغتهم وتراثهم، اللي ورثوه عن جدودهم، فالدولة فضلت باقية.\", \"C3.21\": \"حتى لما اللغة اتغيرت، من المصرية القديمة للقبطية للعربية، الهوية فضلت مصرية.\", \"C3.22\": \"والدولة بتحافظ عليها بتلات إجراءات: حماية التراث والاحتفال بالمناسبات الوطنية،\", \"C3.23\": \"وتعريف الأجيال بتاريخ مصر، ودعم الثقافة والفنون، زي الأوبرا وقصور الثقافة.\", \"C3.24\": \"وإنت تقدر تشارك: زور مكان أثري، أو احكي لإخواتك تاريخ مصر.\", \"C3.25\": \"ومسئولية مين؟ الدولة وكل مواطن، لأنها من أدوار الشعب الخمسة.\", \"C4.1\": \"نراجع المقومات الست بالترتيب: الموقع والحدود الطبيعية، والموارد الطبيعية، والتجانس،\", \"C4.2\": \"والحكومة المركزية القوية، والقوة العسكرية، والحفاظ على الهوية.\", \"C4.3\": \"وده تالت جزء في الإجابة: الدولة اللي بتعيش ليها مقومات بتدعم نشأتها واستقرارها.\", \"C4.4\": \"والكلام ده هييجي في الامتحان إزاي؟ الفصل الجاي: ركن الامتحان ولوحات الحفظ.\", \"C4.2m\": \"مكان حلو، فيه نيل، لمّ الناس، فاحتاجوا حكومة واحدة، وجيش يحميهم، وفضلوا مصريين.\", \"C2.7m\": \"موضع بالضاد زي ضفة النهر. وموقع بالقاف زي القارات.\", \"C2.17m\": \"تلاتة «لم»: ما وسّختش، ما منعتش، ما سدّيتش.\", \"C3.8m\": \"اسمين، وقطرين، وتاج واحد.\", \"C3.12m\": \"الدرع على الحد، ووراه المعبد، وتحتهم أرض ثابتة.\", \"C3.19m\": \"المرتكزات في كلمة: دلّت. دين، لغة، تاريخ.\", \"C3.23m\": \"تلات مباني بالميم: معبد، مدرسة، مسرح.\", \"RC1\": \"دقيقة مراجعة. غمّض، وجاوب قبلي.\", \"RC2\": \"المقومات الست بالترتيب، على الخريطة؟ [[2.0]] الموقع، والموارد، والتجانس، والحكومة المركزية، والقوة العسكرية، والهوية.\", \"RC3\": \"حمدان قال مصر موضعًا إيه، وموقعًا إيه؟ [[2.0]] «موضعًا دولة نهر، وموقعًا دولة برزخ».\", \"RC4\": \"أهم مورد طبيعي؟ وطلب إيه؟ [[2.0]] نهر النيل، وطلب سلطة مركزية قوية.\", \"RC5\": \"مين وحّد القطرين؟ [[2.0]] الملك مينا، أو نعرمر. وده «الأساس الحقيقي لظهور الدولة المصرية».\", \"RC6\": \"الجيش ركن ولا مقوّم؟ [[2.0]] مقوّم.\", \"RC7\": \"مرتكزات الهوية تلاتة، إيه هم؟ [[2.0]] الدين، واللغة، والتاريخ.\", \"RC8\": \"والدولة بتحافظ على الهوية بإيه؟ [[2.0]] حماية التراث والمناسبات، وتعريف الأجيال، ودعم الثقافة والفنون.\", \"RC9\": \"سمّعهم تاني بكرة، وبعد أسبوع.\"},SRC={\"C1.1\": \"الكتاب ص١١\", \"C1.2\": \"الكتاب ص١٥ + شرح كلمة + تشبيه مرسوم\", \"C1.3\": \"الكتاب ص١٥\", \"C1.3a\": \"شرح كلمة\", \"C1.4\": \"الكتاب ص١٦–١٨\", \"C2.1\": \"تشبيه\", \"C2.2\": \"الكتاب ص١٦ + شرح كلمة\", \"C2.3\": \"الكتاب ص١٦\", \"C2.4\": \"الكتاب ص١٦ + شرح كلمة\", \"C2.5\": \"الكتاب ص١٦\", \"C2.6\": \"الكتاب ص١٦\", \"C2.7\": \"الكتاب ص١٦\", \"C2.8\": \"الكتاب ص١٦\", \"C2.9\": \"الكتاب ص١٦\", \"C2.9a\": \"الكتاب ص١٦ + شرح الاقتباس\", \"C2.10\": \"الكتاب ص١٦ + شرح كلمة\", \"C2.11\": \"الكتاب ص١٦\", \"C2.11a\": \"شرح كلمة\", \"C2.12\": \"تشبيه\", \"C2.13\": \"الكتاب ص١٦ + تذكير\", \"C2.14\": \"الكتاب ص١٦ + شرح كلمة\", \"C2.15\": \"الكتاب ص١٦\", \"C2.16\": \"الكتاب ص١٧\", \"C2.17\": \"الكتاب ص١٧ + شرح كلمة\", \"C2.18\": \"الكتاب ص١٦، ص١٧\", \"C2.19\": \"الكتاب ص١٦ + شرح كلمة\", \"C2.20\": \"الكتاب ص١٦\", \"C3.1\": \"تشبيه\", \"C3.2\": \"الكتاب ص١٧ + شرح كلمة\", \"C3.3\": \"الكتاب ص١٧\", \"C3.3a\": \"شرح كلمة\", \"C3.4\": \"الكتاب ص١٧\", \"C3.5\": \"الكتاب ص١٧\", \"C3.6\": \"تشبيه\", \"C3.7\": \"الكتاب ص١٧\", \"C3.8\": \"الكتاب ص١٧\", \ pan id=\"tm\">0:00<\/span>\n <button id=\"rec\" style=\"background:#D7463C;border-color:#D7463C\">● سجّل الشريحة (عدّ ٣)<\/button><label style=\"cursor:default\">السرعة <input id=\"spd\" type=\"range\" min=\"0.7\" max=\"1.4\" step=\"0.05\" value=\"1\" style=\"vertical-align:middle\"> <span id=\"spdv\">100%<\/span><\/label>\n <button id=\"prev\">→ الشريحة اللي قبل<\/button><button id=\"next\">الشريحة الجاية ←<\/button>\n <button id=\"mode\" aria-pressed=\"false\">وضع الشرايح<\/button><button id=\"snd\" aria-pressed=\"true\">الصوت<\/button>\n <label>ارفع فويس الشريحة دي <input id=\"af\" type=\"file\" accept=\"audio/*\" hidden><\/label><button id=\"sync\">ظبط التوقيت على صوتي<\/button><button id=\"tap\" style=\"background:#1EA05F;border-color:#1EA05F\">جملة (Enter)<\/button><button id=\"cp\">انسخ كود التوقيت<\/button><span id=\"msg\"><\/span><button id=\"recm\">وضع تسجيل الشاشة<\/button><button id=\"fs\">ملء الشاشة<\/button>\n<\/div>\n<p id=\"note\">نسخة v1 · السبورة D (الفصل الرابع · الشرايح D1–D7). <b>التسجيل:<\/b> دوس «سجّل الشريحة»، هيعدّ ٣ وبعدين الكلام يتعلّم كلمة كلمة تحت وإنت بتقرا، والرسم ماشي معاه (ظبّط السرعة على كلامك). <b>بعد التسجيل:<\/b> ارفع فويس الشريحة، دوس «ظبط التوقيت على صوتي»، ودوس Enter أول ما تسمع بداية كل جملة؛ الرسم هيتشدّ على صوتك. شغّل واتأكد، وبعدين «انسخ كود التوقيت» وابعتهولي أثبّته. في «وضع الشرايح»: دوسة على شمال الشاشة للشريحة الجاية وعلى اليمين للي قبلها، والمسافة للتشغيل، والعرض بيقف آخر كل شريحة. للخروج من وضع تسجيل الشاشة دوس Esc.<\/p>\n<\/div>\n<script>\nconst G='#1EA05F',GD='#106942',N='#0E2A47',R='#D7463C',Y='#F5BE32',YD='#C99A1B',SAND='#F3E3B5',GR='#666';\nconst CW=1066,CH=600,NS='http://www.w3.org/2000/svg';\nconst OS=1.35;let CUR=[],LASTW=null,IT=[],LINES=[],CAM=[[0,2133,0,CW,CH]],SL=[],SFX=[],T0=0,ox=0,oy=0,LD=0;\nconst sm=p=>{p=Math.max(0,Math.min(1,p));return p*p*(3-2*p)};\nfunction cell(c,r){ox=(2-c)*CW;oy=r*CH}\nfunction camTo(o,x,y,w,h,d=1.2){const t=T0+o,l=CAM[CAM.length-1];CAM.push([t,l[1],l[2],l[3],l[4]],[t+d,x,y,w,h]);SFX.push({t,k:'whoosh'})}\nfunction go(c,r){cell(c,r);camTo(0,ox,oy,CW,CH)}\nfunction line(id,src,txt,fn){const words=txt.replace(/\\[\\[[\\d.]+\\]\\]/g,'').trim().split(/\\s+/).length;let pz=0;txt.replace(/\\[\\[([\\d.]+)\\]\\]/g,(m,v)=>pz+=+v);\n LD=words*0.58+pz+0.45;let cu=0;const tk=txt.trim().split(/\\s+/).filter(Boolean).map(w=>{const m=w.match(/^\\[\\[([\\d.]+)\\]\\]$/),d=m?+m[1]:.58,o={w,p:!!m,v:m&&m[1],s:cu,e:cu+d};cu+=d;return o});\n CUR=tk;LINES.push({id,src,tk,t:T0,d:LD,txt:txt.replace(/\\s*\\[\\[[\\d.]+\\]\\]\\s*/g,' ').trim()});fn&&fn();T0+=LD}\n/* at('كلمة'[,n]) = وقت بداية أول (أو رقم n) كلمة فيها النص ده في السطر الحالي؛ استخدمها كـ offset لأي عنصر */\nfunction at(sub,n){let c=0;for(const k of CUR){if(!k.p&&k.w.includes(sub)){if(c==(n||0))return k.s/OS;c++}}throw new Error('at: «'+sub+'» مش في السطر: '+CUR.map(k=>k.w).join(' '))}\nfunction slide(name){SL.push({t:T0,name})}\nfunction W(o,x,y,txt,sz,col,a){IT.push(LASTW={k:'w',t:T0+o*OS,x:ox+x,y:oy+y,txt,sz,col,a:a||'end',d:Math.min(1.4,.06*txt.length+.3),cx:ox,cy:oy})}\nfunction P(o,d,col,w,dur,fill,cls){IT.push({k:'p',t:T0+o*OS,tx:ox,ty:oy,dd:d,col,w:w||3,d:dur||.8,fill,cls})}\nfunction ST(o,x,y,ok){IT.push({k:'s',t:T0+o*OS,x:ox+x,y:oy+y,ok,d:.5});SFX.push({t:T0+o*OS,k:ok?'chime':'tick'})}\nfunction Q(o,x,y,dur){o*=OS;IT.push({k:'q',t:T0+o,x:ox+x,y:oy+y,d:dur<3?dur:LD-o});SFX.push({t:T0+o,k:'tick'},{t:T0+o+1,k:'tick'},{t:T0+o+2,k:'tick'})}\nfunction AR(o,x1,y,x2){P(o,`M${x1},${y} H${x2} M${x2},${y} l14,-9 M${x2},${y} l14,9`,N,3,.4)}\nfunction CARD(o,x,y,w,h,col,fill){P(o,`M${x},${y} h${w} v${h} h${-w} Z`,col,3,.7,fill||'#fff');SFX.push({t:T0+o*OS,k:'chime'})}\nfunction BOOM(o){SFX.push({t:T0+o,k:'boom'})}\n\n\n/* ---- إضافات v5: تكملة نص على نفس السطر، إخفاء عنصر مؤقت، عدّاد وقفة، أشكال متكررة ---- */\nfunction WC(o,txt,col,gap){const p=LASTW;IT.push(LASTW={k:'w',t:T0+o*OS,x:p.x,y:p.y,txt,sz:p.sz,col:col||p.col,a:'end',d:Math.min(1.4,.06*txt.length+.3),cx:p.cx,cy:p.cy,af:p,gp:gap==null?p.sz*.28:gap})}\nfunction FADE(o,n){for(let i=1;i<=(n||1);i++)IT[IT.length-i].off=T0+o*OS}\nconst atp=n=>CUR.filter(k=>k.p)[n||0].s/OS,EOL=()=>LD/OS;\nconst CI=(x,y,r)=>`M${x-r},${y} a${r},${r} 0 1,0 ${2*r},0 a${r},${r} 0 1,0 ${-2*r},0 `;\nconst EL=(x,y,a,b)=>`M${x-a},${y} a${a},${b} 0 1,0 ${2*a},0 a${a},${b} 0 1,0 ${-2*a},0 `;\nconst MAN=(x,y,h)=>{const r=h*.15,f=v=>(v).toFixed(1);return CI(x,+f(y+r),+f(r))+`M${x},${f(y+2*r)} V${f(y+h*.66)} M${f(x-h*.2)},${f(y+h*.46)} L${x},${f(y+h*.38)} L${f(x+h*.2)},${f(y+h*.46)} M${x},${f(y+h*.66)} l${f(-h*.14)},${f(h*.34)} M${x},${f(y+h*.66)} l${f(h*.14)},${f(h*.34)} `};\nconst KEY=(x,y,s)=>CI(x,y,13*s)+`M${x+13*s},${y} h${48*s} M${x+47*s},${y} v${12*s} M${x+58*s},${y} v${9*s} `;\nconst CHAIR=(x,y)=>`M${x},${y} V${y-78} M${x},${y-38} H${x+46} V${y} `;\nconst BOOK=(x,y)=>`M${x},${y} q-18,-10 -34,0 v30 q16,-10 34,0 q18,-10 34,0 v-30 q-16,-10 -34,0 v30 `;\nfunction CDR(o,x,y,r,n){for(let k=0;k<n;k++){const a0=-Math.PI/2+k*2*Math.PI/n,a1=a0+2*Math.PI/n*.93,p=a=>`${(x+r*Math.cos(a)).toFixed(1)},${(y+r*Math.sin(a)).toFixed(1)}`;P(o+k/OS,`M${p(a0)} A${r},${r} 0 0,1 ${p(a1)}`,R,6,.92);IT[IT.length-1].off=T0+LD-.05;SFX.push({t:T0+(o+k/OS)*OS,k:'tick'})}}\n\n/*__CONTENT_START__*/\nconst SP={\"D1.1\": \"إنت هنا: آخر محطة. فهمنا الدرس، وفاضل نجاوب بيه في الامتحان. [[0.5]] ولو داخل على المراجعة على طول:\", \"D1.2\": \"الدولة أربع أركان: شعب، وحيز جغرافي، وسلطة، وسيادة. ومصر ليها ست مقومات حافظت عليها.\", \"D2.1\": \"نبدأ بأسئلة الفقرة في آخر صفحة تمنتاشر. الفكرة الرئيسة:\", \"D2.2\": \"دولة راسخة الأركان، يعني أركانها ثابتة، بتحمي سيادتها، وبترعى شعبها، وبتحقق التنمية.\", \"D2.3\": \"وعلاقة قوة الدولة بالتنمية؟ الدولة القوية بتحقق التنمية، والتنمية «خط دفاع أساسي عن الدولة».\", \"D2.4\": \"وأهمية دراسة الأركان؟ نفهم إزاي مصر حافظت على مكانتها.\", \"D2.5\": \"«سؤال التفسير المدعوم بالأدلة»: السلطة بتمكّن الدولة من سيادتها، فقرارها يفضل مستقل.\", \"D2.6\": \"والأدلة: الطيارة ما تدخلش من غير تصريح، والقضاء مستقل، ومصر بتمضي معاهداتها بنفسها.\", \"D2.7\": \"والمشروع البحثي: اختار ركن، عرّفه، وهات أمثلة من الدرس.\", \"D3.1\": \"«تدريبات الدرس». التمرين الأول «اختر»، ووقّف واختار قبل الإجابة.\", \"D3.2\": \"العامل الحاسم، يعني السبب اللي فرق، في التحول من تجمعات سكانية لدولة؟ الاختيارات قدامك. [[3.0]]\", \"D3.3\": \"(د) وجود سلطة مركزية، لأن الحكومة المركزية كانت «الأساس الحقيقي».\", \"D3.4\": \"علاقة التجانس، إن الناس متماسكين، بالاستقرار السياسي؟ [[3.0]]\", \"D3.5\": \"(أ) بيقلل الصراعات الداخلية، لأنه اتحاد متماسك يصعب تفتيته.\", \"D3.6\": \"والدولة اللي غابت عنها سيادتها؟ [[3.0]]\", \"D3.7\": \"(ب) بتفقد قدرتها على اتخاذ القرار.\", \"D3.8\": \"وخد بالك من التلاتة دول: أهم مورد هو النيل، وحمدان ركّز على الموقع،\", \"D3.9\": \"بس العامل الحاسم في «اختر» هو السلطة المركزية.\", \"D3.10\": \"التمرين التاني: صورة جوازات مطار القاهرة. وقّف وفكّر: مرتبطة بأنهي ركنين؟ [[3.0]]\", \"D3.11\": \"(أ) السلطة والسيادة. مؤسسة من الدولة، دي سلطة، بتقرر مين يدخل، دي سيادة.\", \"D3.12\": \"وعلاقتها بالحيز؟ الدولة بتتحكم في الدخول لأرضها ومجالها الجوي.\", \"D4.1\": \"التمرين التالت «بالتعاون مع زملائك». (أ) حاكم قديم رسّخ السلطة؟ مينا، وحّد القطرين وعمل سلطة واحدة.\", \"D4.2\": \"(ب) ترشيد المية، يعني نستعملها بحساب: النيل أهم مورد طبيعي، والحفاظ عليه حفاظ على الدولة.\", \"D4.3\": \"(ج) سبب لكل فريق: السلطة بتحفظ النظام والحقوق، والشعب مصدر السلطات.\", \"D4.4\": \"(د) الطبيعية ولا البشرية محتاجة دعم أكتر؟ رأي، وأي إجابة متبرّرة صح، زي ترشيد مية النيل.\", \"D4.5\": \"(هـ) لو القضاء اتعطل أسبوع؟ الحقوق مش هتلاقي حماية، والنظام والقانون هيتهزوا.\", \"D4.6\": \"يعني مؤسسة واحدة تقف، يتأثر ركنين: الشعب والسلطة.\", \"D5.1\": \"أسئلة المقال بالترتيب. رقم أربعة، «حلّل»: النشأة، يعني قيام الدولة، ما كانتش عامل واحد.\", \"D5.2\": \"المقومات الست اتفاعلت. والأكثر تأثيرًا في النشأة؟ الحكومة المركزية، «الأساس الحقيقي».\", \"D5.3\": \"رقم خمسة: «النيل هو العامل الحاسم»؟ أحسن إجابة: أتفق جزئيًا. يعني في حتة آه، وفي حتة لأ.\", \"D5.4\": \"النيل أساسي وطلب سلطة مركزية. بس النشأة ما كانتش عامل واحد، والموقع كان هيفرض نفسه.\", \"D5.5\": \"رقم ستة، «فسّر العلاقة». الشعب الواعي بحقوقه وواجباته بيخلّي الدولة أقوى.\", \"D5.6\": \"والسلطة بتحقق النظام، لأنها بتضع القوانين وبتنفذها.\", \"D5.7\": \"والسيادة استقلال القرار الوطني، لأنها قرار من غير خضوع لسلطة خارجية.\", \"D5.8\": \"والجيش بيضمن استمرار الدولة، لأنه بيحمي حدودها واستقرارها السياسي.\", \"D5.9\": \"رقم سبعة، «قارن» دور الشعب. في النشأة: استقر حوالين النيل، واشتغل جماعي في الري.\", \"D5.10\": \"وفي الاستمرارية، يعني إنها تكمّل: بيشارك، وبينتج، وبيحافظ على الهوية، وبيدافع عن الوطن.\", \"D5.11\": \"رقم تمانية، «حلّل» فقدان الأركان: شعب مش واعي يضعّف الدولة، ومن غير حدود مفيش دولة،\", \"D5.12\": \"ومن غير سلطة يضيع النظام، ومن غير سيادة يضيع القرار.\", \"D5.13\": \"رقم تسعة، «اختر مع التبرير»، يعني قول ليه: الأكثر تأثيرًا في الاستمرار، الموقع ولا الحكومة ولا الجيش؟\", \"D5.14\": \"مثلًا الجيش، لأنه «كان ولا يزال» بيحمي الحدود. والموقع كمان صح لو برّرته.\", \"D5.15\": \"رقم عشرة، «اكتب فقرة»: الشعب مصدر السلطات، والسلطة بتمكّن السيادة على الحيز،\", \"D5.16\": \"ولو ركن اختل، الدولة كلها بتتأثر.\", \"D5.17\": \"رقم حداشر، «تخيّل قريتك دولة مصغّرة». حيزها حدودها، ومصدر سلطتها أهلها، زي ما الشعب مصدر السلطات.\", \"D6.1\": \"ودلوقتي تلات لوحات «احفظ دي». وقّف وصوّر كل واحدة.\", \"D6.2\": \"الأولى: الدولة والحيز.\", \"D6.3\": \"الكروت دي فيها التعريفات، والأركان، والأدوار، والحدود. [[5.0]]\", \"D6.4\": \"التانية: السلطة والسيادة، والترابط، وأثر غياب كل ركن. [[5.0]]\", \"D6.5\": \"التالتة: المقومات الست، والنيل، ومينا، والجيش، والهوية. [[5.0]]\", \"D7.1\": \"سؤال الدرس: ليه دول عاشت عبر التاريخ، ودول اندثرت؟\", \"D7.2\": \"الدول اللي بتعيش هي اللي أركانها كاملة ومترابطة، ومقوماتها بتدعمها. وده اللي خلّى مصر تستمر.\", \"D7.3\": \"دلوقتي حلّ كويز الدرس في خُطوة.\", \"D7.4\": \"واكتبلي في الكومنتات: النيل ولا الموقع، مين العامل الحاسم في قيام مصر؟\", \"D7.2a\": \"كده إنت عرفت الدولة واقفة على إيه. [[0.5]] ودي كانت أول ورقة في الخريطة.\", \"D7.2b\": \"الحكاية الجاية بترجع لورا قوي. [[0.5]] للدولة المصرية القديمة.\", \"D7.2c\": \"وفاكر المفتاح؟ [[0.5]] لو حد من برّه حاول ياخده، أصحاب البيت بيعملوا إيه؟\", \"D7.2d\": \"دي حكاية «مقاومة الاحتلال». وهحكيهالك الدرس الجاي. [[1.0]]\", \"D7.4a\": \"أنا أحمد الألفي. خُطوة، من Add Value.\", \"D2.6m\": \"تلات أدلة: من السما، ومن المحكمة، ومن برّه.\", \"D5.8m\": \"كشف، وجرس، ومفتاح، ودرع. كل واحد وسهمه.\", \"D7.2m\": \"الإجابة كلها في رسمة: كرسي برجوله الأربعة، على أرض ثابتة.\", \"RD1\": \"آخر مراجعة: الدرس كله في دقيقة. غمّض، وجاوب قبلي.\", \"RD2\": \"الفصل الأول. أركان الدولة؟ [[2.0]] شعب، وحيز جغرافي، وسلطة، وسيادة.\", \"RD3\": \"والحيز فيه إيه؟ [[2.0]] يابس، ومياه إقليمية، ومجال جوي.\", \"RD4\": \"الفصل التاني. السلطات التلاتة؟ [[2.0]] تشريعية، وتنفيذية، وقضائية.\", \"RD5\": \"والسيادة؟ [[2.0]] استقلال قرار الدولة، داخلية وخارجية.\", \"RD6\": \"الفصل التالت. المقومات الست؟ [[2.0]] الموقع، والموارد، والتجانس، والحكومة المركزية، والقوة العسكرية، والهوية.\", \"RD7\": \"والعامل الحاسم في «اختر»؟ [[2.0]] وجود سلطة مركزية.\", \"RD8\": \"الفصل الرابع. الدول اللي بتعيش، بتعيش ليه؟ [[2.0]] أركانها كاملة ومترابطة، ومقوماتها بتدعمها.\", \"RD9\": \"انقل الجدول ده، وامشي عليه.\"},SRC={\"D1.1\": \"\", \"D1.2\": \"الكتاب ص١١، ص١٦–١٨\", \"D2.1\": \"الكتاب ص١٨\", \"D2.2\": \"الكتاب ص١٨ + شرح كلمة\", \"D2.3\": \"الكتاب ص١٦، ص١٨\", \"D2.4\": \"الكتاب ص١٨\", \"D2.5\": \"الكتاب ص١٨\", \"D2.6\": \"الكتاب ص١٣، ص١٤، ص١٥\", \"D2.7\": \"الكتاب ص١٨\", \"D3.1\": \"الكتاب ص١٩\", \"D3.2\": \"الكتاب ص١٩ + شرح كلمة\", \"D3.3\": \"الكتاب ص١٧\", \"D3.4\": \"الكتاب ص١٩ + تذكير\", \"D3.5\": \"الكتاب ص١٧\", \"D3.6\": \"الكتاب ص١٩\", \"D3.7\": \"الكتاب ص١٥\", \"D3.8\": \"الكتاب ص١٦، ص١٧\", \"D3.9\": \"الكتاب ص١٧، ص١٩\", \"D3.10\": \"الكتاب ص١٩\", \"D3.11\": \"الكتاب ص١٤، ص١٥، ص١٩\", \"D3.12\": \"الكتاب ص١٣، ص١٩\", \"D4.1\": \"الكتاب ص١٩\", \"D4.2\": \"الكتاب ص١٦، ص١٩ + شرح كلمة\", \"D4.3\": \"الكتاب ص١٩\", \"D4.4\": \"الكتاب ص١٩\", \"D4.5\": \"الكتاب ص١٥، ص١٩\", \"D4.6\": \"الكتاب ص١٩\", \"D5.1\": \"الكتاب ص٢٠ + شرح كلمة\", \"D5.2\": \"الكتاب ص١٧، ص٢٠\", \"D5.3\": \"الكتاب ص٢٠ + شرح كلمة\", \"D5.4\": \"الكتاب ص١٦، ص٢٠\", \"D5. ax-width:none;padding:0}body.rec #stage{border-radius:0}\n@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}.blink{transform-box:fill-box;transform-origin:center;animation:blink 3.4s infinite}\n<\/style><\/head><body><div id=\"wrap\">\n<div id=\"stage\">\n <svg id=\"world\" viewBox=\"0 0 3200 1800\" preserveAspectRatio=\"xMidYMin slice\"><defs><pattern id=\"dots\" width=\"48\" height=\"48\" patternUnits=\"userSpaceOnUse\"><circle cx=\"24\" cy=\"24\" r=\"2\" fill=\"#d9dcd8\"/><\/pattern><\/defs><rect y=\"-1800\" width=\"3200\" height=\"9800\" fill=\"#FCFCFA\"/><rect y=\"-1800\" width=\"3200\" height=\"9800\" fill=\"url(#dots)\"/><g id=\"L\"><\/g><\/svg>\n <svg id=\"ov\" viewBox=\"0 0 1280 720\"><g id=\"pen\" visibility=\"hidden\"><g transform=\"rotate(28)\"><path d=\"M0,0 L-7,-22 L7,-22 Z\" fill=\"#e9d9b0\" stroke=\"#0E2A47\" stroke-width=\"1.5\"/><rect x=\"-7\" y=\"-112\" width=\"14\" height=\"90\" fill=\"#0E2A47\"/><rect x=\"-7\" y=\"-40\" width=\"14\" height=\"9\" fill=\"#1EA05F\"/><rect x=\"-8\" y=\"-128\" width=\"16\" height=\"18\" rx=\"3\" fill=\"#1EA05F\"/><\/g><\/g><\/svg>\n <div id=\"badge\"><i>أ<\/i><span><b>أحمد الألفي<\/b><span>خُطوة من Add Value<\/span><\/span><\/div><div id=\"sl\"><\/div>\n <div id=\"cd\" hidden><\/div><div id=\"bar\"><span id=\"who\">أحمد<\/span><span id=\"sub\"><\/span><span id=\"src\"><\/span><\/div>\n<\/div>\n<div id=\"ctl\">\n <button id=\"play\">▶ تشغيل<\/button><button id=\"re\">↺ إعادة<\/button><input id=\"seek\" type=\"range\" min=\"0\" max=\"1000\" value=\"0\"><span id=\"tm\">0:00<\/span>\n <button id=\"rec\" style=\"background:#D7463C;border-color:#D7463C\">● سجّل الشريحة (عدّ ٣)<\/button><label style=\"cursor:default\">السرعة <input id=\"spd\" type=\"range\" min=\"0.7\" max=\"1.4\" step=\"0.05\" value=\"1\" style=\"vertical-align:middle\"> <span id=\"spdv\">100%<\/span><\/label>\n <button id=\"prev\">→ الشريحة اللي قبل<\/button><button id=\"next\">الشريحة الجاية ←<\/button>\n <button id=\"mode\" aria-pressed=\"false\">وضع الشرايح<\/button><button id=\"snd\" aria-pressed=\"true\">الصوت<\/button>\n <label>ارفع فويس الشريحة دي <input id=\"af\" type=\"file\" accept=\"audio/*\" hidden><\/label><button id=\"sync\">ظبط التوقيت على صوتي<\/button><button id=\"tap\" style=\"background:#1EA05F;border-color:#1EA05F\">جملة (Enter)<\/button><button id=\"cp\">انسخ كود التوقيت<\/button><span id=\"msg\"><\/span><button id=\"recm\">وضع تسجيل الشاشة<\/button><button id=\"fs\">ملء الشاشة<\/button>\n<\/div>\n<p id=\"note\">نسخة v1 · السبورة L2A (الدرس ٢ · الفصل الأول · ص٢١–٢٤). <b>التسجيل:<\/b> دوس «سجّل الشريحة»، هيعدّ ٣ وبعدين الكلام يتعلّم كلمة كلمة تحت وإنت بتقرا، والرسم ماشي معاه (ظبّط السرعة على كلامك). <b>بعد التسجيل:<\/b> ارفع فويس الشريحة، دوس «ظبط التوقيت على صوتي»، ودوس Enter أول ما تسمع بداية كل جملة؛ الرسم هيتشدّ على صوتك. شغّل واتأكد، وبعدين «انسخ كود التوقيت» وابعتهولي أثبّته. في «وضع الشرايح»: دوسة على شمال الشاشة للشريحة الجاية وعلى اليمين للي قبلها، والمسافة للتشغيل، والعرض بيقف آخر كل شريحة. للخروج من وضع تسجيل الشاشة دوس Esc.<\/p>\n<\/div>\n<script>\nconst G='#1EA05F',GD='#106942',N='#0E2A47',R='#D7463C',Y='#F5BE32',YD='#C99A1B',SAND='#F3E3B5',GR='#666';\nconst CW=1066,CH=600,NS='http://www.w3.org/2000/svg';\nconst OS=1.35;let CUR=[],LASTW=null,IT=[],LINES=[],CAM=[[0,2133,0,CW,CH]],SL=[],SFX=[],T0=0,ox=0,oy=0,LD=0;\nconst sm=p=>{p=Math.max(0,Math.min(1,p));return p*p*(3-2*p)};\nfunction cell(c,r){ox=(2-c)*CW;oy=r*CH}\nfunction camTo(o,x,y,w,h,d=1.2){const t=T0+o,l=CAM[CAM.length-1];CAM.push([t,l[1],l[2],l[3],l[4]],[t+d,x,y,w,h]);SFX.push({t,k:'whoosh'})}\nfunction go(c,r){cell(c,r);camTo(0,ox,oy,CW,CH)}\nfunction line(id,src,txt,fn){const words=txt.replace(/\\[\\[[\\d.]+\\]\\]/g,'').trim().split(/\\s+/).length;let pz=0;txt.replace(/\\[\\[([\\d.]+)\\]\\]/g,(m,v)=>pz+=+v);\n LD=words*0.58+pz+0.45;let cu=0;const tk=txt.trim().split(/\\s+/).filter(Boolean).map(w=>{const m=w.match(/^\\[\\[([\\d.]+)\\]\\]$/),d=m?+m[1]:.58,o={w,p:!!m,v:m&&m[1],s:cu,e:cu+d};cu+=d;return o});\n CUR=tk;LINES.push({id,src,tk,t:T0,d:LD,txt:txt.replace(/\\s*\\[\\[[\\d.]+\\]\\]\\s*/g,' ').trim()});fn&&fn();T0+=LD}\n/* at('كلمة'[,n]) = وقت بداية أول (أو رقم n) كلمة فيها النص ده في السطر الحالي؛ استخدمها كـ offset لأي عنصر */\nfunction at(sub,n){let c=0;for(const k of CUR){if(!k.p&&k.w.includes(sub)){if(c==(n||0))return k.s/OS;c++}}throw new Error('at: «'+sub+'» مش في السطر: '+CUR.map(k=>k.w).join(' '))}\nfunction slide(name){SL.push({t:T0,name})}\nfunction W(o,x,y,txt,sz,col,a){IT.push(LASTW={k:'w',t:T0+o*OS,x:ox+x,y:oy+y,txt,sz,col,a:a||'end',d:Math.min(1.4,.06*txt.length+.3),cx:ox,cy:oy})}\nfunction P(o,d,col,w,dur,fill,cls){IT.push({k:'p',t:T0+o*OS,tx:ox,ty:oy,dd:d,col,w:w||3,d:dur||.8,fill,cls})}\nfunction ST(o,x,y,ok){IT.push({k:'s',t:T0+o*OS,x:ox+x,y:oy+y,ok,d:.5});SFX.push({t:T0+o*OS,k:ok?'chime':'tick'})}\nfunction Q(o,x,y,dur){o*=OS;IT.push({k:'q',t:T0+o,x:ox+x,y:oy+y,d:dur<3?dur:LD-o});SFX.push({t:T0+o,k:'tick'},{t:T0+o+1,k:'tick'},{t:T0+o+2,k:'tick'})}\nfunction AR(o,x1,y,x2){P(o,`M${x1},${y} H${x2} M${x2},${y} l14,-9 M${x2},${y} l14,9`,N,3,.4)}\nfunction CARD(o,x,y,w,h,col,fill){P(o,`M${x},${y} h${w} v${h} h${-w} Z`,col,3,.7,fill||'#fff');SFX.push({t:T0+o*OS,k:'chime'})}\nfunction BOOM(o){SFX.push({t:T0+o,k:'boom'})}\n\n\n/* ---- إضافات v5: تكملة نص على نفس السطر، إخفاء عنصر مؤقت، عدّاد وقفة، أشكال متكررة ---- */\nfunction WC(o,txt,col,gap){const p=LASTW;IT.push(LASTW={k:'w',t:T0+o*OS,x:p.x,y:p.y,txt,sz:p.sz,col:col||p.col,a:'end',d:Math.min(1.4,.06*txt.length+.3),cx:p.cx,cy:p.cy,af:p,gp:gap==null?p.sz*.28+12:gap})}\nfunction FADE(o,n){for(let i=1;i<=(n||1);i++)IT[IT.length-i].off=T0+o*OS}\nconst atp=n=>CUR.filter(k=>k.p)[n||0].s/OS,EOL=()=>LD/OS;\nconst CI=(x,y,r)=>`M${x-r},${y} a${r},${r} 0 1,0 ${2*r},0 a${r},${r} 0 1,0 ${-2*r},0 `;\nconst EL=(x,y,a,b)=>`M${x-a},${y} a${a},${b} 0 1,0 ${2*a},0 a${a},${b} 0 1,0 ${-2*a},0 `;\nconst MAN=(x,y,h)=>{const r=h*.15,f=v=>(v).toFixed(1);return CI(x,+f(y+r),+f(r))+`M${x},${f(y+2*r)} V${f(y+h*.66)} M${f(x-h*.2)},${f(y+h*.46)} L${x},${f(y+h*.38)} L${f(x+h*.2)},${f(y+h*.46)} M${x},${f(y+h*.66)} l${f(-h*.14)},${f(h*.34)} M${x},${f(y+h*.66)} l${f(h*.14)},${f(h*.34)} `};\nconst KEY=(x,y,s)=>CI(x,y,13*s)+`M${x+13*s},${y} h${48*s} M${x+47*s},${y} v${12*s} M${x+58*s},${y} v${9*s} `;\nconst CHAIR=(x,y)=>`M${x},${y} V${y-78} M${x},${y-38} H${x+46} V${y} `;\nconst BOOK=(x,y)=>`M${x},${y} q-18,-10 -34,0 v30 q16,-10 34,0 q18,-10 34,0 v-30 q-16,-10 -34,0 v30 `;\nfunction CDR(o,x,y,r,n){for(let k=0;k<n;k++){const a0=-Math.PI/2+k*2*Math.PI/n,a1=a0+2*Math.PI/n*.93,p=a=>`${(x+r*Math.cos(a)).toFixed(1)},${(y+r*Math.sin(a)).toFixed(1)}`;P(o+k/OS,`M${p(a0)} A${r},${r} 0 0,1 ${p(a1)}`,R,6,.92);IT[IT.length-1].off=T0+LD-.05;SFX.push({t:T0+(o+k/OS)*OS,k:'tick'})}}\n\n/*__CONTENT_START__*/\nconst S={\"2A.1\": \"إنت هنا: خلّصنا الدرس الأول. [[0.5]] وعرفنا إن الدولة زي البيت، ليه أربع أركان: شعب، وحيز جغرافي، وسلطة، وسيادة.\", \"2A.2\": \"وفاكر المفتاح؟ [[0.5]] المفتاح هو السيادة: قرار البيت في إيد أصحابه. النهارده هنشوف إيه اللي بيحصل لو حد حاول ياخده.\", \"2A.3\": \"تخيّل بيت على ميدان كبير، وتلات شوارع بتتقابل قدامه. [[0.5]] أرضه خصبة، وجنبه مخزن أكل، والكل عارف كده.\", \"2A.4\": \"وكل واحد معدّي بيبص عليه. [[0.5]] وهو ما عملش حاجة، هو بس حلو قوي. البيت ده اسمه مصر. وسؤال الدرس: «كيف كان الموقع الجغرافي لمصر سلاحًا ذا حدين؟» [[1.0]]\", \"2A.5\": \"سلاح ذو حدين يعني إيه؟ زي موبايل جديد غالي: حلو إنه معاك. [[0.5]] بس لو سبته على ترابيزة الكافيتريا، الكل هيبص عليه.\", \"2A.6\": \"وفي آخر الدرس هتبقى قادر على أربع حاجات: تفهم العلاقة بين موقع مصر والتنافس الدولي عليها. [[0.5]] وتفسّر إزاي الموارد بتتحول من مصدر قوة لسبب صراع.\", \"2A.7\": \"وتستنتج العلاقة بين قوة الدولة من جوّه والأطماع من برّه. [[0.5]] وليه تماسك المجتمع مهم عند المصريين زمان.\", \"2A.8\": \"والفكرة الرئيسة للدرس كله في جملة: الموقع المتميز والموارد الضخمة خلّوا مصر مهمة في العالم القديم. [[0.5]] لكن فترات ضعف الدولة خلّتها هدف للأطماع الخارجية.\", \"2A.9\": \"الحد الأول قوة، والحد التاني ضعف. [[0.5]] احفظ الصورة دي، لأن الدرس كله ماشي عليها.\", \"2A.10\": \"وندخل في التفاصيل. أولًا: دوافع احتلال مصر عبر التاريخ. [[0.5]] الكتاب بيقول إن مصر كانت «محورًا إستراتيجيًا» في السياسة الإقليمية والدولية. محور زي محور العجلة: كل حاجة بتلف حواليه.\", \"2A.11\": \"ودول الاحتلال أدركت إن السيطرة على مصر بتدّيها تفوق سياسي واقتصادي. [[0.5]] وكلمة «الاحتلال» هتتكرر في الدرس كله، فنفكّها دلوقتي.\", \"2A.12\": \"الكتاب بيعرّفه: «سيطرة دولة قوية على أراضي دولة وفرض نفوذها السياسي والإداري عليها من دون موافقة شعبها».\", \"2A.13\": \"«مما يؤدي إلى تقييد سيادة الدولة المحتلة». [[0.5]] وإنت فاكر السيادة: المفتاح. يعني المفتاح بيتشدّ من إيد أصحاب البيت. ونفوذ يعني كلمته ماشية عليك.\", \"2A.14\": \"والكتاب نفسه بيدّيك مثال في آخر الدرس. تخيّل إن عندك بيت صغير وحديقة. [[0.5]] وجارك جاي يرغب في السيطرة على الحديقة.\", \"2A.15\": \"في الأول بأسلوب ناعم: هيغرس لك شجر فاكهة يجيب لكم دخل. وبعدين يبني استراحة في الحديقة. وبعدين يستبيح بيتك ويستخدم الميّه والكهربا.\", \"2A.16\": \"ده المثال اللي الكتاب بيستخدمه علشان تحس بمعنى السيطرة من برّه. [[0.5]] وهتعمل إيه فيه؟ [[1.0]] سيب إجابتك لآخر الدرس.\", \"2A.17\": \"تاني كلمة: «التنافس الدولي». الكتاب بيقول: «صراع بين القوى الكبرى للسيطرة على مناطق النفوذ والمصالح؛ لتوسيع هيمنتها وتحقيق مكاسب سياسية واقتصادية على حساب الآخرين».\", \"2A.18\": \"تخيّل فريقين في المدرسة، وفيه ملعب كورة واحد حلو. كل فريق عايزه لنفسه. [[0.5]] وهيمنة يعني تتحكم.\", \"2A.19\": \"وتالت كلمة: «الأمن القومي». «قدرة الدولة على حماية أراضيها وسيادتها وشعبها ومواردها ومصالحها من التهديدات الداخلية والخارجية، بما يضمن الاستقرار وتحقيق التنمية المستدامة».\", \"2A.20\": \"يعني ترباس البيت وحراسة الباب، من أي خطر من برّه أو من جوّه. [[0.5]] احفظ التلاتة بالصورة: مفتاح اتسحب، وكورة بيتشدّوا عليها، وترباس على الباب.\", \"2A.21\": \"دلوقتي قدامك ستة دوافع لاحتلال مصر. [[0.5]] والكتاب بيطلب تصنّفها: عسكرية، واقتصادية، وإستراتيجية.\", \"2A.22\": \"هنمشي عليهم بالترتيب زي مشوار. واحد: الموقع على مفترق طرق تلات قارات. [[0.5]] واتنين: الإشراف على طرق التجارة العالمية.\", \"2A.23\": \"تلاتة: خصوبة الأرض ووفرة المحاصيل. [[0.5]] وأربعة: مخزن الحبوب للدول الكبرى، زي روما.\", \"2A.24\": \"خمسة: التوسع والتنافس الدولي. [[0.5]] وستة: الرغبة في السيطرة على موازين القوى بالمنطقة. يعني مين الأقوى فيها.\", \"2A.25\": \"الستة جُم بالترتيب ده في الكتاب، فخلّيهم اتنين اتنين: موقع، وموارد، وتنافس. [[0.5]] وده نفس التلات حاجات اللي بيسألك عنها الامتحان.\", \"2A.26\": \"والكتاب بيقول: مصر كانت هدف دايم لقوى الاحتلال، وتعددت محاولات إخضاعها زي الهكسوس والفرس واليونان والرومان. [[0.5]] وده هدّد أمنها القومي بشكل مباشر.\", \"2A.27\": \"وهنبدأ بأول واحدة: الهكسوس.\", \"2A.28\": \"البيت كان واقف سليم. [[0.5]] بس مع نهاية عصر الدولة الوسطى، السلطة المركزية ضعفت. يعني الإدارة الواحدة اللي بتمسك البلد كلها.\", \"2A.29\": \"وبقت مش قادرة تحمي حدودها الشمالية الشرقية. [[0.5]] وده كان بوابة مصر نحو آسيا. وفي وسط الاضطرابات دي، الهكسوس اتسللوا من هناك. واحد واحد، لحد دلتا النيل.\", \"2A.30\": \"والكتاب بيقولك قيمة: «الانتماء يعني التضحية من أجل تراب هذا الوطن».\", \"2A.31\": \"وخد بالك من الصورة اللي في الكتاب: «نموذج لعجلة حربية مصرية من الدولة الحديثة». [[0.5]] هترجعلك كمان شوية.\", \"2A.32\": \"سؤال: ليه نجح الهكسوس؟ [[2.0]] الكتاب بيقول مش بس لضعف الدولة. كان معاهم أسلحة منحتهم التفوق العسكري.\", \"2A.33\": \"وقدرة على الحركة والمناورة في المعركة، ما كانتش متوفرة عند المصريين. المناورة يعني تتحرك وتغيّر مكانك بسرعة.\", \"2A.34\": \"يبقى التلاتة: سلطة ضعيفة، وحدود مش محمية، وأسلحة أقوى. [[0.5]] خد صورة البيت.\", \"2A.35\": \"واختاروا الدلتا يتمركزوا فيها. ليه؟ لأنها «النبض الاقتصادي لمصر»، وأقرب مناطقها اتصالًا بالتجارة اللي جاية من آسيا.\", \"2A.36\": \"وبكده تحكّموا في جزء كبير من الموارد الاقتصادية. [[0.5]] واتخذوا من مدينة أواريس عاصمة سياسية وعسكرية لهم في الشمال.\", \"2A.37\": \"والمقاومة بدأت من الجنوب. [[0.5]] على إيد أمراء طيبة في الأسرة السابعة عشرة. أعلنوا استقلالهم السياسي، وسيطروا على الجنوب. وطيبة كانت مركزهم السياسي والعسكري.\", \"2A.38\": \"وفي عهد كامس، لوحة بتوصف الوضع. [[0.5]] بتقول: «إن مصر مقسمة معي، فهناك حاكم آسيوي في أواريس، وآخر في كوش، وكل رجل يشاركني قطعة من مصر».\", \"2A.39\": \"تلات حكام، ومصر حتت حتت. [[0.5]] والكتاب بيسألك: هل مقولة كامس دعوة مباشرة للتحرير؟ [[3.0]] فكّر: النص بيوصف الأزمة بس، ولا بيدعو لحاجة؟\", \"2A.40\": \"دلوقتي نحكي حرب التحرير نفسها. تلات مراحل، وتلات ناس. [[0.5]] وكأنهم سباق تتابع، والشعلة بتتسلّم من واحد للتاني.\", \"2A.41\": \"المرحلة الأولى: «من التحدي إلى المواجهة». سقنن رع تولّى قيادة طيبة، وكانت بتتمتع بالاستقلال الذاتي. يعني بتدير نفسها بنفسها.\", \"2A.42\": \"وسّع نفوذه لحد أبيدوس، وبدأ يزقّ نفوذ الهكسوس شمالًا. [[0.5]] وهنا الهكسوس أدركوا الخطر الحقيقي: الجيش المصري صحي.\", \"2A.43\": \"والمرحلة دي انتهت بمقتل سقنن رع. [[0.5]] لكن شرارة المقاومة المسلحة ما انطفتش.\", \"2A.44\": \"المرحلة التانية: «من المقاومة إلى التخطيط». كامس تولّى الحكم بعد أبوه، وما اكتفاش بالدفاع. بدأ ينظّم الجيش بروح هجومية.\", \"2A.45\": \"حارب الهكسوس في مصر الوسطى وانتصر عليهم، وبعدين اتجه شمالًا. ولو سألت ليه؟ الكتاب بيدّيك تلات أسباب: يمنعهم من إعادة التمركز، ويضيّق الخناق عليهم، وينقل المعركة لمناطق نفوذ العدو.\", \"2A.46\": \"وكمان قطع طرق الإمدادات اللي جاية من مملكة كوش. الإمدادات يعني الأكل والسلاح اللي بيوصل للجيش.\", \"2A.47\": \"عشان يعزلهم، وينشّف قدراتهم الاقتصادية واحدة واحدة، تمهيدًا للمعركة الحاسمة.\", \"2A.48\": \"ومهارة نتعلمها من أمراء طيبة: التخطيط. [[0.5]] خطّط ليومك ومذاكرتك، وهتبقى أكتر فعالية.\", \"2A.49\": \"بس كامس اتوفّى قبل المعركة الفاصلة. [[0.5]] ومع كده خطته مهّدت الطريق لأحمس. يبقى سؤال الكتاب: هل كامس مهندس النصر رغم إنه ما شهدش المعركة الفاصلة؟ [[3.0]]\", \"2A.50\": \"رأيي من كلام الكتاب: آه ينفع، لأن خطته مهّدت لأحمس. المهندس بيرسم الخطة، حتى لو غيره هو اللي يقطع الشريط.\", \"2A.51\": \"المرحلة التالتة: «الحسم والنصر». أحمس الأول كمّل مسيرة أخوه كامس وأبوه سقنن رع. [[0.5]] وبدأ حملة شاملة ضد الهكسوس.\", \"2A.52\": \"واحد: حاصرهم في منف وأواريس. اتنين: طاردهم خارج حدود مصر، وقضى عليهم نهائيًا.\", \"2A.53\": \"وتلاتة: أخضع حكام الأقاليم تحت نفوذ الدولة، مع إنهم احتفظوا بألقابهم وامتيازاتهم. وده لضمان الاستقرار واستمرار ولائهم له.\", \"2A.54\": \"وما كانش أحمس لوحده. الملكة إياح حتب كانت نموذج للقيادة الوطنية في الأزمات. [[0.5]] حافظت على وحدة الدولة واستقرارها.\", \"2A.55\": \"ودعمت الجيش المصري في حرب التحرير ضد الهكسوس. [[0.5]] وده ساعد على تهيئة الظروف لتحرير البلاد بقيادة أحمس، واستعادة السيادة المصرية. المفتاح رجع.\", \"2A.56\": \"هنا الكتاب بيقول: هكذا تتحول الأزمات الكبرى إلى نقطة انطلاق لمرحلة جديدة. [[0.5]] وأدرك المصريون بعدها ضرورة تطوير الجيش وتأمين حدودهم. وده ساعد في بناء أول إمبراطورية في التاريخ المصري القديم.\", \"2A.57\": \"وفاكر العجلة الحربية؟ الكتاب بيسميها «عبقرية المصريين». [[0.5]] اتعرّفوا عليها وطوّروها. خلّوها أخف وزنًا وأسرع وأكفأ في الحركة والقتال. وده رفع قدرة الجيش على حماية الحدود.\", \"2A.58\": \"وده بيوضّح قدرة المصريين على الاستفادة من الخبرات الوافدة وتطويرها. [[0.5]] بس الحكاية ما خلصتش. فيه قوة جاية: الفرس.\", \"RA1\": \"دقيقة مراجعة. غمّض، وجاوب قبلي.\", \"RA2\": \"الفكرة الرئيسة في صورة؟ [[2.0]] الموقع والموارد قوة، وفترات الضعف خطر.\", \"RA3\": \"الدوافع الستة؟ [[2.0]] موقع على مفترق طرق ثلاث قارات، وطرق التجارة، وخصوبة الأرض، ومخزن الحبوب، والتوسع والتنافس، وموازين القوى.\", \"RA4\": \"ليه نجح الهكسوس؟ [[2.0]] سلطة ضعيفة، وحدود مش محمية، وأسلحة متفوقة.\", \"RA5\": \"مراحل الطرد بالترتيب؟ [[2.0]] سقنن رع، كامس، أحمس.\", \"RA6\": \"وكامس عمل إيه؟ [[2.0]] قطع الإمدادات من كوش، ونقل المعركة شمالًا.\", \"RA7\": \"أحمس؟ [[2.0]] حصار، ومطاردة، وإخضاع حكام الأقاليم.\", \"RA8\": \"ودرس مصر من الهكسوس؟ [[2.0]] تطوير الجيش وتأمين الحدود. وسمّعهم تاني بكرة.\"},SRC={\"2A.1\": \"الدرس الأول\", \"2A.2\": \"الدرس الأول + عنوان الدرس\", \"2A.3\": \"الكتاب تشبيه لـ ص٢٢\", \"2A.4\": \"الكتاب ص٢٢\", \"2A.5\": \"الكتاب ص٢٢ + شرح كلمة + تشبيه\", \"2A.6\": \"الكتاب ص٢١\", \"2A.7\": \"الكتاب ص٢١\", \"2A.8\": \"الكتاب ص٢١\", \"2A.9\": \"الكتاب ص٢١\", \"2A.10\": \"الكتاب ص٢٢ + شرح كلمة\", \"2A.11\": \"الكتاب ص٢٢\", \"2A.12\": \"الكتاب ص٢٢\", \"2A.13\": \"الكتاب ص٢٢ + الدرس الأول + شرح كلمة\", \"2A.14\": \"الكتاب ص٢٨\", \"2A.15\": \"الكتاب ص٢٨\", \"2A.16\": \"الكتاب ص٢٨\", \"2A.17\": \"الكتاب ص٢٢\", \"2A.18\": \"الكتاب ص٢٢ + شرح كلم " stroke-width=\"1.5\"/><rect x=\"-7\" y=\"-112\" width=\"14\" height=\"90\" fill=\"#0E2A47\"/><rect x=\"-7\" y=\"-40\" width=\"14\" height=\"9\" fill=\"#1EA05F\"/><rect x=\"-8\" y=\"-128\" width=\"16\" height=\"18\" rx=\"3\" fill=\"#1EA05F\"/><\/g><\/g><\/svg>\n <div id=\"badge\"><i>أ<\/i><span><b>أحمد الألفي<\/b><span>خُطوة من Add Value<\/span><\/span><\/div><div id=\"sl\"><\/div>\n <div id=\"cd\" hidden><\/div><div id=\"bar\"><span id=\"who\">أحمد<\/span><span id=\"sub\"><\/span><span id=\"src\"><\/span><\/div>\n<\/div>\n<div id=\"ctl\">\n <button id=\"play\">▶ تشغيل<\/button><button id=\"re\">↺ إعادة<\/button><input id=\"seek\" type=\"range\" min=\"0\" max=\"1000\" value=\"0\"><span id=\"tm\">0:00<\/span>\n <button id=\"rec\" style=\"background:#D7463C;border-color:#D7463C\">● سجّل الشريحة (عدّ ٣)<\/button><label style=\"cursor:default\">السرعة <input id=\"spd\" type=\"range\" min=\"0.7\" max=\"1.4\" step=\"0.05\" value=\"1\" style=\"vertical-align:middle\"> <span id=\"spdv\">100%<\/span><\/label>\n <button id=\"prev\">→ الشريحة اللي قبل<\/button><button id=\"next\">الشريحة الجاية ←<\/button>\n <button id=\"mode\" aria-pressed=\"false\">وضع الشرايح<\/button><button id=\"snd\" aria-pressed=\"true\">الصوت<\/button>\n <label>ارفع فويس الشريحة دي <input id=\"af\" type=\"file\" accept=\"audio/*\" hidden><\/label><button id=\"sync\">ظبط التوقيت على صوتي<\/button><button id=\"tap\" style=\"background:#1EA05F;border-color:#1EA05F\">جملة (Enter)<\/button><button id=\"cp\">انسخ كود التوقيت<\/button><span id=\"msg\"><\/span><button id=\"recm\">وضع تسجيل الشاشة<\/button><button id=\"fs\">ملء الشاشة<\/button>\n<\/div>\n<p id=\"note\">نسخة v1 · السبورة L2B (الدرس ٢ · الفصل ٢ · الفرس والإسكندر والبطالمة). <b>التسجيل:<\/b> دوس «سجّل الشريحة»، هيعدّ ٣ وبعدين الكلام يتعلّم كلمة كلمة تحت وإنت بتقرا، والرسم ماشي معاه (ظبّط السرعة على كلامك). <b>بعد التسجيل:<\/b> ارفع فويس الشريحة، دوس «ظبط التوقيت على صوتي»، ودوس Enter أول ما تسمع بداية كل جملة؛ الرسم هيتشدّ على صوتك. شغّل واتأكد، وبعدين «انسخ كود التوقيت» وابعتهولي أثبّته. في «وضع الشرايح»: دوسة على شمال الشاشة للشريحة الجاية وعلى اليمين للي قبلها، والمسافة للتشغيل، والعرض بيقف آخر كل شريحة. للخروج من وضع تسجيل الشاشة دوس Esc.<\/p>\n<\/div>\n<script>\nconst G='#1EA05F',GD='#106942',N='#0E2A47',R='#D7463C',Y='#F5BE32',YD='#C99A1B',SAND='#F3E3B5',GR='#666';\nconst CW=1066,CH=600,NS='http://www.w3.org/2000/svg';\nconst OS=1.35;let CUR=[],LASTW=null,IT=[],LINES=[],CAM=[[0,2133,0,CW,CH]],SL=[],SFX=[],T0=0,ox=0,oy=0,LD=0;\nconst sm=p=>{p=Math.max(0,Math.min(1,p));return p*p*(3-2*p)};\nfunction cell(c,r){ox=(2-c)*CW;oy=r*CH}\nfunction camTo(o,x,y,w,h,d=1.2){const t=T0+o,l=CAM[CAM.length-1];CAM.push([t,l[1],l[2],l[3],l[4]],[t+d,x,y,w,h]);SFX.push({t,k:'whoosh'})}\nfunction go(c,r){cell(c,r);camTo(0,ox,oy,CW,CH)}\nfunction line(id,src,txt,fn){const words=txt.replace(/\\[\\[[\\d.]+\\]\\]/g,'').trim().split(/\\s+/).length;let pz=0;txt.replace(/\\[\\[([\\d.]+)\\]\\]/g,(m,v)=>pz+=+v);\n LD=words*0.58+pz+0.45;let cu=0;const tk=txt.trim().split(/\\s+/).filter(Boolean).map(w=>{const m=w.match(/^\\[\\[([\\d.]+)\\]\\]$/),d=m?+m[1]:.58,o={w,p:!!m,v:m&&m[1],s:cu,e:cu+d};cu+=d;return o});\n CUR=tk;LINES.push({id,src,tk,t:T0,d:LD,txt:txt.replace(/\\s*\\[\\[[\\d.]+\\]\\]\\s*/g,' ').trim()});fn&&fn();T0+=LD}\n/* at('كلمة'[,n]) = وقت بداية أول (أو رقم n) كلمة فيها النص ده في السطر الحالي؛ استخدمها كـ offset لأي عنصر */\nfunction at(sub,n){let c=0;for(const k of CUR){if(!k.p&&k.w.includes(sub)){if(c==(n||0))return k.s/OS;c++}}throw new Error('at: «'+sub+'» مش في السطر: '+CUR.map(k=>k.w).join(' '))}\nfunction slide(name){SL.push({t:T0,name})}\nfunction W(o,x,y,txt,sz,col,a){IT.push(LASTW={k:'w',t:T0+o*OS,x:ox+x,y:oy+y,txt,sz,col,a:a||'end',d:Math.min(1.4,.06*txt.length+.3),cx:ox,cy:oy})}\nfunction P(o,d,col,w,dur,fill,cls){IT.push({k:'p',t:T0+o*OS,tx:ox,ty:oy,dd:d,col,w:w||3,d:dur||.8,fill,cls})}\nfunction ST(o,x,y,ok){IT.push({k:'s',t:T0+o*OS,x:ox+x,y:oy+y,ok,d:.5});SFX.push({t:T0+o*OS,k:ok?'chime':'tick'})}\nfunction Q(o,x,y,dur){o*=OS;IT.push({k:'q',t:T0+o,x:ox+x,y:oy+y,d:dur<3?dur:LD-o});SFX.push({t:T0+o,k:'tick'},{t:T0+o+1,k:'tick'},{t:T0+o+2,k:'tick'})}\nfunction AR(o,x1,y,x2){P(o,`M${x1},${y} H${x2} M${x2},${y} l14,-9 M${x2},${y} l14,9`,N,3,.4)}\nfunction CARD(o,x,y,w,h,col,fill){P(o,`M${x},${y} h${w} v${h} h${-w} Z`,col,3,.7,fill||'#fff');SFX.push({t:T0+o*OS,k:'chime'})}\nfunction BOOM(o){SFX.push({t:T0+o,k:'boom'})}\n\n\n/* ---- إضافات v5: تكملة نص على نفس السطر، إخفاء عنصر مؤقت، عدّاد وقفة، أشكال متكررة ---- */\nfunction WC(o,txt,col,gap){const p=LASTW;IT.push(LASTW={k:'w',t:T0+o*OS,x:p.x,y:p.y,txt,sz:p.sz,col:col||p.col,a:'end',d:Math.min(1.4,.06*txt.length+.3),cx:p.cx,cy:p.cy,af:p,gp:gap==null?p.sz*.28:gap})}\nfunction FADE(o,n){for(let i=1;i<=(n||1);i++)IT[IT.length-i].off=T0+o*OS}\nconst atp=n=>CUR.filter(k=>k.p)[n||0].s/OS,EOL=()=>LD/OS;\nconst CI=(x,y,r)=>`M${x-r},${y} a${r},${r} 0 1,0 ${2*r},0 a${r},${r} 0 1,0 ${-2*r},0 `;\nconst EL=(x,y,a,b)=>`M${x-a},${y} a${a},${b} 0 1,0 ${2*a},0 a${a},${b} 0 1,0 ${-2*a},0 `;\nconst MAN=(x,y,h)=>{const r=h*.15,f=v=>(v).toFixed(1);return CI(x,+f(y+r),+f(r))+`M${x},${f(y+2*r)} V${f(y+h*.66)} M${f(x-h*.2)},${f(y+h*.46)} L${x},${f(y+h*.38)} L${f(x+h*.2)},${f(y+h*.46)} M${x},${f(y+h*.66)} l${f(-h*.14)},${f(h*.34)} M${x},${f(y+h*.66)} l${f(h*.14)},${f(h*.34)} `};\nconst KEY=(x,y,s)=>CI(x,y,13*s)+`M${x+13*s},${y} h${48*s} M${x+47*s},${y} v${12*s} M${x+58*s},${y} v${9*s} `;\nconst CHAIR=(x,y)=>`M${x},${y} V${y-78} M${x},${y-38} H${x+46} V${y} `;\nconst BOOK=(x,y)=>`M${x},${y} q-18,-10 -34,0 v30 q16,-10 34,0 q18,-10 34,0 v-30 q-16,-10 -34,0 v30 `;\nfunction CDR(o,x,y,r,n){for(let k=0;k<n;k++){const a0=-Math.PI/2+k*2*Math.PI/n,a1=a0+2*Math.PI/n*.93,p=a=>`${(x+r*Math.cos(a)).toFixed(1)},${(y+r*Math.sin(a)).toFixed(1)}`;P(o+k/OS,`M${p(a0)} A${r},${r} 0 0,1 ${p(a1)}`,R,6,.92);IT[IT.length-1].off=T0+LD-.05;SFX.push({t:T0+(o+k/OS)*OS,k:'tick'})}}\n\n/*__CONTENT_START__*/\nconst S={\"2B.1\": \"إنت هنا: الهكسوس اتطردوا والمفتاح رجع. [[0.5]] بس القصة ما خلصتش. الدبوس بيتحرك للجزء اللي بعده: الغزو الفارسي.\", \"2B.2\": \"وسؤال الكتاب بيبدأ بيه: هل سقوط مصر كان بسبب قوة الفرس بس؟ [[2.0]] ولا بسبب ظروف داخلية أضعفت الدولة المصرية؟\", \"2B.3\": \"في العصر المتأخر، مصر كانت في اضطراب سياسي وصراع داخلي. [[0.5]] زي بيت أهله متخانقين: الباب مقفول، بس جوّه الكل مشغول بالخناق.\", \"2B.4\": \"وبكده بقت مصر هدف للأطماع الخارجية. [[0.5]] خاصةً من الإمبراطورية الفارسية.\", \"2B.5\": \"والكتاب بيقول عنها: «كانت إمبراطورية الفُرس عابرة للقارات». [[0.5]] يعني مش في قارة واحدة. وبيطلب منك تشوف الخريطة وتناقش.\", \"2B.6\": \"سنة خمسمية خمسة وعشرين قبل الميلاد، الجيشين المصري والفارسي اتقابلوا في شرق الدلتا.\", \"2B.7\": \"وانتهت المواجهة بدخول الفرس لمصر بقيادة الملك قمبيز التاني. وأخضعوها لسلطتهم.\", \"2B.8\": \"وأسسوا الأسرة السابعة والعشرين. [[0.5]] احفظ: خمسمية خمسة وعشرين، الخمسة في الأول وفي الآخر، واتنين في النص زي «قمبيز التاني».\", \"2B.9\": \"وسؤال: إيه أهمية ضم مصر لدولة الفرس؟ [[2.0]] فكّر. وسؤال تاني: هل المصريين قبلوا الاحتلال الفارسي من غير مقاومة؟\", \"2B.10\": \"لأ. الكتاب بيقول: ما قبلهوش. حصلت حركات مقاومة وثورات علشان يرجّعوا الاستقلال الوطني.\", \"2B.11\": \"وده بيعكس تمسّكهم بهُويتهم ورفضهم للسيطرة الأجنبية. [[0.5]] والهُوية يعني اللي بيقول إنت مين.\", \"2B.12\": \"يعني القيمة اللي نأكدها من المقاومة: التمسّك بالهوية ورفض السيطرة الأجنبية. وده نفس اللي حصل مع الهكسوس.\", \"2B.13\": \"رابعًا: الإسكندر الأكبر. [[0.5]] سنة تلتمية اتنين وتلاتين قبل الميلاد.\", \"2B.14\": \"صعدت قوة مقدونيا بقيادة الإسكندر، وبدأ حملة واسعة للقضاء على الفرس وطردهم من آسيا الصغرى. وبعد ما انتصر عليهم في عدة معارك حاسمة، اتجه نحو مصر.\", \"2B.15\": \"ومصر ساعتها كانت بتعاني وطأة الحكم الفارسي والضرائب التقيلة. [[0.5]] الضرايب يعني فلوس بتتاخد من الناس.\", \"2B.16\": \"فتقبّلوا قوة خارجية تقدر تقضي على الفرس. ودخل الإسكندر مصر من غير مقاومة تُذكر. [[0.5]] لأنهم لقوه فرصة يتخلصوا بيها من الحكم الفارسي.\", \"2B.17\": \"وخد بالك: الإجابة هنا مش «احترامه لهم»، ولا «قوته». هو دخل من غير مقاومة لأنهم كانوا متعبين من الفرس.\", \"2B.18\": \"واحفظ الرقم بإيقاع: تلاتة، تلاتة، اتنين. تلات دقات، وتلات دقات، ودقتين، والباب اتفتح من غير مقاومة.\", \"2B.19\": \"والكتاب بيقولك قيمة مهمة: «قد يُظهر لك عدوك التودد والمحبة، لكنه سيبقى عدوك الذي يريد القضاء على هُويتك».\", \"2B.20\": \"والكتاب بيقدّم رأيين في استقبال المصريين للإسكندر. الأول: «دخل مصر بعد أن أنهك الفُرس»، ومالقاش مقاومة لإن المصريين اعتبروه مُحرِّرًا.\", \"2B.21\": \"وعمل على احترام تقاليدهم الدينية، علشان يظهر بصورة الحاكم الشرعي، وحافظ على جيشه جاهز لأي تهديد.\", \"2B.22\": \"والتاني: المصريين استقبلوه بحذر، والكهنة ورجال الحكم والإدارة شكّوا في نيته، خصوصًا بعد السيطرة الفارسية الطويلة.\", \"2B.23\": \"ومع كده نجح في تقديم نفسه كحامي للمعابد، واستعادة النظام، ووازن بين القوة العسكرية والسياسة لكسب ثقة السكان.\", \"2B.24\": \"وسؤال الكتاب: قارن بين الرأيين، ووضّح أسباب الاختلاف. [[3.0]] اختلاف الرأيين راجع لإيه؟\", \"2B.25\": \"فكّر في إجابتك. ومن غير ما تنسى، الرأيين كمان ذكروا إنه نجح في الدخول. [[0.5]] وكيف ثبّت حكمه؟ الإسكندر عمل التلات حاجات دي:\", \"2B.26\": \"واحد: حصل على اعتراف ديني بسلطته، بادعائه إنه ابن الإله آمون.\", \"2B.27\": \"واتنين: احترم عادات المصريين وتقاليدهم.\", \"2B.28\": \"وتلاتة: أسّس مدينة الإسكندرية، علشان تبقى مركز تجاري وثقافي وعسكري.\", \"2B.29\": \"وبكده بدأت مرحلة جديدة في العلاقات بين مصر والإغريق. [[0.5]] والكتاب كمان بينقل عن الإسكندر: «أنا مدين لأبي لأنه منحني الحياة، ولأرسطو لأنه علّمني كيف أعيش الحياة بشكل صحيح».\", \"2B.30\": \"ومهارة الدرس هنا: قراءة الخريطة التاريخية. [[0.5]] بتدقّق في كل عناصرها، وتحلّل خط السير، وموقع القوى المتنازعة جغرافيًا.\", \"2B.31\": \"خامسًا: دولة البطالمة في مصر. [[0.5]] سنة تلتمية تلاتة وعشرين قبل الميلاد، الإسكندر مات.\", \"2B.32\": \"وإمبراطوريته واجهت أزمة كبيرة. قادة جيشه دخلوا في صراع طويل علشان كل واحد يسيطر على أكبر قدر من الأراضي.\", \"2B.33\": \"وهنا ظهر القائد بطلميوس بن لاجوس. فرض سيطرته على مصر، وخلّاها قاعدة حكمه.\", \"2B.34\": \"وبكده بدأت مرحلة جديدة في تاريخ مصر: دولة البطالمة. احفظها كده: الإسكندر مات، القادة اتخانقوا، وبطلميوس خد مصر.\", \"2B.35\": \"ولو الأرقام لخبطتك، فيه حيلة قراءة: قبل الميلاد، الرقم بينزل كل ما نقرّب من الميلاد.\", \"2B.36\": \"يبقى الأكبر هو الأقدم: خمسمية خمسة وعشرين الفرس، بعدها تلتمية اتنين وتلاتين الإسكندر دخل، وبعدها تلتمية تلاتة وعشرين مات.\", \"2B.37\": \"والفرق بين الفرس والإسكندر: المصريين قاوموا الفرس بثورات، واستقبلوا الإسكندر من غير مقاومة تُذكر.\", \"2B.38\": \"وده لأن الحكم الفارسي كان تقيل عليهم، والضرايب مثقلة.\", \"2B.39\": \"ولو سألك المدرس: هل مصر قبلت الإسكندر؟ [[1.0]] قول: دخل من غير مقاومة تُذكر، والآراء اتختلفت في درجة قبولهم.\", \"2B.40\": \"لخّصنا: الفرس دخلوا في وقت اضطراب، والمصريين قاوموا. الإسكندر دخل والمصريين تعبانين من الفرس، فدخل من غير مقاومة. وبعد وفاته، بطلميوس.\", \"2B.41\": \"والبطالمة نفسهم هيعانوا من اضطراب وصراعات على السلطة. وده هيفتح الباب لقوة جديدة.\", \"2B.42\": \"والفصل الجاي: الرومان. إيه اللي خلّاهم يبصّوا على مصر، وإزاي سيطروا عليها؟\", \"RB1\": \"دقيقة مراجعة. غمّض، وجاوب قبلي.\", \"RB2\": \"سنة دخول الفرس؟ [[2.0]] خمسمية خمسة وعشرين قبل الميلاد، قمبيز التاني، الأسرة السابعة والعشرين.\", \"RB3\": \"وإزاي المصريين تعاملوا معاهم؟ [[2.0]] قاوموا بثورات، علشان الهوية.\", \"RB4\": \"ليه دخل الإسكندر من غير مقاومة؟ [[2.0]] لإن المصريين تعبوا من الفرس.\", \"RB5\": \"وإزاي ثبّت حكمه؟ [[2.0]] اعتراف ديني، واحترام التقاليد، وأسّس الإسكندرية.\", \"RB6\": \"وبعد وفاته؟ [[2.0]] بطلميوس خد مصر، وبدأت دولة البطالمة.\", \"RB7\": \"والتواريخ بالترتيب؟ [[2.0]] خمسمية خمسة وعشرين، تلتمية اتنين وتلاتين، تلتمية تلاتة وعشرين.\", \"RB8\": \"سمّعهم تاني بكرة، وبعد أسبوع.\"},SRC={\"2B.1\": \"الكتاب ص٢٤–٢٥ + الدرس ١\", \"2B.2\": \"الكتاب ص٢٥\", \"2B.3\": \"الكتاب ص٢٥\", \"2B.4\": \"الكتاب ص٢٥\", \"2B.5\": \"الكتاب ص٢٥\", \"2B.6\": \"الكتاب ص٢٥\", \"2B.7\": \"الكتاب ص٢٥\", \"2B.8\": \"الكتاب ص٢٥\", \"2B.9\": \"الكتاب ص٢٥\", \"2B.10\": \"الكتاب ص٢٥\", \"2B.11\": \"الكتاب ص٢٥\", \"2B.12\": \"الكتاب ص٢٥\", \"2B.13\": \"الكتاب ص٢٦\", \"2B.14\": \"الكتاب ص٢٦\", \"2B.15\": \"الكتاب ص٢٦\", \"2B.16\": \"الكتاب ص٢٦\", \"2B.17\": \"الكتاب ص٢٦\", \"2B.18\": \"الكتاب ص٢٦\", \"2
