<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>استوديو خُطوة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: sticky studio bar; record = full-height segment karaoke with the slide drawing pinned top-right; review = slips with notes and edits */
:root{
  --bg:#f3f5f2; --paper:#ffffff; --ink:#14202e; --mute:#5d6b70; --dim:#a7b2b4; --line:#d9e0dc;
  --navy:#0E2A47; --teal:#0F6E56; --green:#1f9a5f; --red:#c8483c; --amber:#b9821c; --chip:#e8efeb;
  --disp:"Lalezar","IBM Plex Sans Arabic",Tahoma,sans-serif; --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--paper:#16212c;--ink:#e8eef0;--mute:#9aa9ad;--dim:#4d5d68;--line:#2a3945;--navy:#8fb6e0;--teal:#4cc5a2;--green:#55c98c;--red:#ef7d70;--amber:#e3b552;--chip:#1f2e3a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1720;--paper:#16212c;--ink:#e8eef0;--mute:#9aa9ad;--dim:#4d5d68;--line:#2a3945;--navy:#8fb6e0;--teal:#4cc5a2;--green:#55c98c;--red:#ef7d70;--amber:#e3b552;--chip:#1f2e3a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;direction:rtl;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.brand{font-family:var(--disp);font-size:21px;color:var(--teal)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button{font-family:var(--body);font-size:14px;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:5px 11px}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
button[aria-pressed="true"]{background:var(--teal);color:#fff;border-color:var(--teal)}
.primary{background:var(--teal);color:#fff;border-color:var(--teal)}
.navyb{background:var(--navy);color:var(--paper);border-color:var(--navy)}
.push{margin-inline-start:auto}
main{max-width:1200px;margin:0 auto;padding-block:12px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--disp);font-weight:400;font-size:26px;margin:0;color:var(--navy);text-wrap:balance}
.meta{color:var(--mute);font-size:13px;display:flex;gap:12px;flex-wrap:wrap}
.how{background:var(--chip);border-radius:10px;padding:8px 12px;font-size:14px}
.chip{font-size:12px;padding:0 8px;border-radius:999px;background:var(--chip);white-space:nowrap}
.chip.q{background:color-mix(in srgb,var(--navy) 18%,transparent)}.chip.w{background:color-mix(in srgb,var(--amber) 25%,transparent)}
.chip.j{background:color-mix(in srgb,var(--green) 22%,transparent)}.chip.p{background:color-mix(in srgb,var(--red) 18%,transparent)}
.vt{font-variant-numeric:tabular-nums;font-size:12px;border:1px solid var(--teal);color:var(--teal);border-radius:6px;padding:0 6px}
.pz{display:inline-block;font-size:.55em;color:var(--mute);border:1px dashed var(--mute);border-radius:4px;padding:0 4px;margin:0 2px;vertical-align:middle;line-height:1.5}
.pz.long{color:var(--red);border-color:var(--red)}
/* record */
.rec{display:grid;grid-template-columns:minmax(200px,26%) minmax(0,1fr);grid-template-areas:"pv text";gap:14px;margin-top:8px}
.pvbox{grid-area:pv;position:sticky;top:64px;align-self:start;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
.pvbox video{width:100%;border-radius:8px;background:#fff;aspect-ratio:16/9}
.pvbox .cap{font-size:12px;color:var(--mute)}
.scrnow{font-size:13px;border-inline-start:3px solid var(--teal);padding:4px 8px;background:color-mix(in srgb,var(--teal) 7%,transparent);border-radius:4px}
.textcol{grid-area:text;min-width:0;display:flex;flex-direction:column;gap:8px}
.sig{display:flex;align-items:center;gap:10px;border-radius:10px;padding:6px 12px;font-weight:600;background:var(--chip);font-size:15px}
.sig.go{background:color-mix(in srgb,var(--green) 22%,var(--paper))}.sig.stop{background:color-mix(in srgb,var(--red) 20%,var(--paper))}.sig.soon{background:color-mix(in srgb,var(--amber) 25%,var(--paper))}
.sig .sn{font-family:var(--disp);font-size:26px;min-width:30px;text-align:center}
.tbar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}.tbar i{display:block;height:100%;background:var(--teal);width:100%}
.segtext{overflow-y:auto;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:30px;line-height:1.65}
.kl{padding:4px 8px;border-radius:8px;margin-bottom:.25em;color:var(--dim);cursor:default}
.kl.now{color:var(--ink);background:color-mix(in srgb,var(--teal) 6%,transparent);outline:2px solid color-mix(in srgb,var(--teal) 40%,transparent)}
.kl.past{color:var(--mute)}
.kl .tn{font-size:12px;margin-inline-end:6px;vertical-align:middle}
.kw{cursor:pointer}
.kl.now .kw{color:var(--mute);background:linear-gradient(to left,var(--ink) var(--p,0%),var(--mute) var(--p,0%));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.kl.now .kw.done{-webkit-text-fill-color:var(--ink)}
.kl.now .pz.on{color:var(--red);border-color:var(--red);font-weight:700}
.segtabs button{display:flex;align-items:center;gap:6px}.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block}.dot.ok{background:var(--green)}
.klrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start}.lid{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--mute);padding-top:.6em;direction:ltr}
.kltx{min-width:0}.tone{font-size:13px;color:var(--mute);line-height:1.5}.lbtn{display:flex;flex-direction:column;gap:4px}.lbtn button{font-size:12px;padding:1px 8px}
.stopb{background:var(--red);color:#fff;border-color:var(--red)}
.ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--mute)}
.ctl label{display:flex;align-items:center;gap:4px}
@media (max-width:760px){.bar{position:static}.rec{grid-template-columns:1fr;grid-template-areas:"text"}.pvbox{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:max(8px,env(safe-area-inset-right,0px));width:42vw;z-index:6;padding:4px}.pvbox .cap,.pvbox .scrnow,.pvbox .tbar{display:none}.segtext{font-size:20px}.lid{display:none}.klrow{grid-template-columns:minmax(0,1fr) auto}}
/* review */
.seg{margin-top:20px}.seghead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;border-bottom:2px solid var(--teal)}
.seghead b{font-family:var(--disp);font-weight:400;font-size:20px;color:var(--teal)}.seghead span{color:var(--mute);font-size:13px;min-width:0}
.ln{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.num{font-family:var(--disp);font-size:16px;color:var(--mute);text-align:center}
.ln .body{min-width:0}.say{font-size:19px;font-weight:500}
.style{color:var(--mute);font-size:13px}
.scr{font-size:13px;margin-top:3px;padding:4px 8px;border-inline-start:3px solid var(--teal);background:color-mix(in srgb,var(--teal) 7%,transparent);border-radius:4px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.acts button{font-size:12px;padding:2px 9px}
.note{font-size:13px;border:1px solid var(--line);border-radius:8px;padding:5px 9px;margin-top:5px;background:var(--paper)}
.note.done{opacity:.55}.note b{color:var(--navy)}.note .rp{color:var(--teal);margin-top:3px}
form.f{display:flex;flex-direction:column;gap:7px;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
form.f textarea,form.f input[type=text]{font-family:var(--body);font-size:15px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg);color:var(--ink);width:100%}
form.f textarea{min-height:60px}
.kinds{display:flex;gap:5px;flex-wrap:wrap}.kinds label{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;cursor:pointer}
.warn{color:var(--red);font-size:13px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre-wrap;direction:rtl;background:var(--chip);border-radius:8px;padding:8px;user-select:all}
.panel{position:fixed;inset:0 0 0 auto;width:min(440px,100%);background:var(--paper);border-inline-start:1px solid var(--line);z-index:20;overflow:auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));box-shadow:0 0 30px rgba(0,0,0,.18)}
.panel h2{font-family:var(--disp);font-weight:400;margin:0 0 6px;color:var(--navy)}
.empty{padding:30px;text-align:center;color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
.sylist{max-height:46vh;overflow:auto;padding-inline-start:28px;font-size:20px;line-height:1.7}.sylist li.now{background:#fff3c4;border-radius:8px}.sylist li.done .vt{color:#1e9f5f}.sylist .vt{display:inline-block;min-width:56px;font-variant-numeric:tabular-nums}
.vids{margin:10px 0 16px;border:1px solid #d9e3dc;border-radius:12px;padding:8px 12px;background:#fff}.vids summary{cursor:pointer;font-weight:700}.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:10px}.vgrid figure{margin:0}.vgrid video{width:100%;border-radius:8px;background:#000;aspect-ratio:16/9}.vgrid figcaption{font-size:13px;margin-top:4px}
</style>

ت «احفظ دي» 9: تعريف السلطة (على «المؤسسات»). ｜ ملخص الشريحة: السلطة = مؤسسات بتدير وتشرّع وتنفّذ (على «تنفيذها»)", "arrow": "", "tones": ["مصطلح"], "vt": null}, {"t": "والدستور قسّمها تلات سلطات، في أربع مواد، لأن التنفيذية ليها مادتين.", "style": "B2.4 · ص14 · EN: The Constitution divides it into three powers, in four articles, because the executive has two.", "screen": "كارت «احفظ دي» 10: السلطات التلاتة — 3 صناديق (على «تلات سلطات»)؛ الصندوق التاني فيه قوس للمادتين.", "arrow": "", "tones": [], "vt": null}, {"t": "الأولى بتعمل القانون، والتانية بتنفّذه، والتالتة بتحكم بيه.", "style": "B2.5 · ص14 · EN: The first makes the law, the second carries it out, the third judges by it.", "screen": "«تعمل / تنفّذ / تحكم» تحت الصناديق التلاتة.", "arrow": "", "tones": [], "vt": null}, {"t": "تفتكر مين بيعمل القوانين؟ [[1.0]] مجلس النواب! ودي السلطة التشريعية.", "style": "B2.6 · ص14 · EN: Who do you think makes the laws? The House of Representatives! That's the legislative power.", "screen": "1- «التشريعية — مجلس النواب (م101)». [↺]", "arrow": "", "tones": ["سؤال"], "vt": null}, {"t": "والمادة مية وواحد: مجلس النواب «يتولى سلطة التشريع»، وبيقرّ السياسة العامة والموازنة.", "style": "B2.7 · ص14 · EN: Article 101: the House \"holds legislative power\" and approves general policy and the budget.", "screen": "تحت الصندوق: «تشريع / سياسة عامة».", "arrow": "", "tones": [], "vt": null}, {"t": "وكمان «يمارس الرقابة على أعمال السلطة التنفيذية».", "style": "B2.8 · ص14 · EN: And it \"oversees the work of the executive power.\"", "screen": "سهم «رقابة» من صندوق 1 لصندوق 2.", "arrow": "", "tones": [], "vt": null}, {"t": "السلطة التانية، التنفيذية. المادة مية تسعة وتلاتين: رئيس الجمهورية «رئيس الدولة ورئيس السلطة التنفيذية».", "style": "B2.9 · ص14 · EN: The second, the executive. Article 139: the President is \"head of state and head of the executive.\"", "screen": "2- «التنفيذية — رئيس الجمهورية (م139)» (من غير تاج ولا صورة).", "arrow": "", "tones": [], "vt": null}, {"t": "والمادة مية تلاتة تقرار الدولة مرتبط بقوة مؤسساتها وتنظيمها».", "style": "B3.2 · ص14 · EN: That's why \"the state's stability is tied to the strength and organization of its institutions.\"", "screen": "تاب «قيم أتعلمها ص14».", "arrow": "", "tones": [], "vt": null}, {"t": "طب السلطة مهمة ليه؟ فيه أربع أسباب، احفظهم:", "style": "B3.3 · ص15 · EN: So why does authority matter? There are four reasons; memorize them:", "screen": "كارت «احفظ دي» 11: أهمية السلطة — 4 خانات (على «أربع أسباب»).", "arrow": "", "tones": ["سؤال"], "vt": null}, {"t": "واحد، تحفظ النظام والقانون. اتنين، تحقق الاستقرار السياسي والاجتماعي.", "style": "B3.4 · ص15 · EN: One, it keeps order and law. Two, it achieves political and social stability.", "screen": "1- النظام والقانون 2- الاستقرار.", "arrow": "", "tones": [], "vt": null}, {"t": "تلاتة، تحمي حقوق المواطنين. أربعة، تمكّن الدولة من ممارسة سيادتها.", "style": "B3.5 · ص15 · EN: Three, it protects citizens' rights. Four, it enables the state to exercise its sovereignty.", "screen": "3- حقوق المواطنين 4- تمكين السيادة (بلون مختلف + سهم لعمود 4). ｜ ملخص الشريحة: أهمية السلطة 4 (على «سيادتها»)", "arrow": "", "tones": [], "vt": null}]}, {"slide": "B4", "title": "«إمتى يبقى قرار الدولة بإيدها؟» (الركن الرابع: السيادة)", "lines": [{"t": "ينفع حد من برّه البيت يقرر إنتو هتصرفوا فلوسكم في إيه؟", "style": "B4.1 · (تشبيه) · EN: Can someone outside your home decide how you spend your money?", "screen": "بيت وإيد من برّه عليها ✗. [↺]", "arrow": "", "tones": ["سؤال"], "vt": null}, {"t": "لأ. والفكرة دي هي رابع ركن: السيادة. وتعريفها:", "style": "B4.2 · ص15 · EN: No. And that idea is the fourth pillar: sovereignty. Its definition:", "screen": "عمود 4 يتلوّن (أيقونة مفتاح، مش طيارة حربية).", "arrow": "", "tones": [], "vt": null}, {"t": "«استقلال الدولة في اتخاذ قراراتها فيما يتعلق بشئونها الداخلية والخارجية» [[0.5]] «من دون خضوع لسلطة خارجية».", "style": "B4.3 · ص15 · EN: \"The state's independence in making decisions on its internal and external affairs, without submitting to a ير حدود محددة معترف بيها، مفيش دولة أصلًا.", "style": "B5.5 · ص13 · EN: Without defined, recognized borders, there's no state at all.", "screen": "عمود 2 يميل.", "arrow": "", "tones": [], "vt": null}, {"t": "ومن غير سلطة، يضيع النظام والقانون، وحقوق المواطنين ما تلاقيش حماية.", "style": "B5.6 · ص15 · EN: Without authority, order and law are lost, and citizens' rights go unprotected.", "screen": "عمود 3 يميل.", "arrow": "", "tones": [], "vt": null}, {"t": "ومن غير سيادة، الدولة ما تقدرش تاخد قرارها بنفسها.", "style": "B5.7 · ص15، ص19 · EN: Without sovereignty, the state can't make its own decisions.", "screen": "عمود 4 يميل؛ الكارت 15 يكمل. ｜ ملخص الشريحة: أثر غياب كل ركن (على «بنفسها»)", "arrow": "", "tones": [], "vt": null}]}, {"slide": "B6", "title": "ملخص الفصل 2 وتاني جزء في الإجابة", "lines": [{"t": "نراجع. فاكر كام سلطة؟ [[1.0]] تلاتة: تشريعية، وتنفيذية، وقضائية.", "style": "B6.1 · ص14 · EN: Review. How many powers? Three: legislative, executive, judicial.", "screen": "زووم أوت على السبورة B كلها؛ الكارتين 9–10 ينوّروا. [↺] ｜ ملخص الشريحة: 3 سلطات (على «وقضائية»)", "arrow": "", "tones": ["سؤال"], "vt": null}, {"t": "وأهمية السلطة في أربع حاجات: النظام والقانون، والاستقرار، والحقوق، وتمكين السيادة.", "style": "B6.2 · ص15 · EN: Authority matters in four ways: order and law, stability, rights, and enabling sovereignty.", "screen": "الكارت 11 ينوّر.", "arrow": "", "tones": [], "vt": null}, {"t": "والسيادة: استقلال قرار الدولة، وليها نوعين: داخلية وخارجية.", "style": "B6.3 · ص15 · EN: Sovereignty: the state's independent decision-making, in two kinds: internal and external.", "screen": "الكارتين 12–13 ينوّروا. ｜ ملخص الشريحة: السيادة: داخلية + خارجية (على «وخارجية»)", "arrow": "", "tones": [], "vt": null}, {"t": "ولو ركن اختل، الدولة كلها بتتأثر.", "style": "B6.4 · ص9 · EN: If one pillar fails, the whole state is affected.", "screen": "الكارتين 14–15 والكرسي المايل.", "arrow": "", "tones": [], "vt": null}, {"t": "وده تاني جزء في الإجابة: الدولة اللي بتعيش ليها سلطة const chips=l=>l.tones.map(t=>`<span class="chip ${TC[t]||''}">${t}</span>`).join(' ');

function codeFor(x){const head=`#KH ${EP.some(e=>e.n===x.ep)?EL(x.ep):'S1E'+x.ep}-L${String(x.line).padStart(2,'0')} ${EP.some(e=>e.n===x.ep)?AR(x.ep):'ح'+x.ep} ج${x.line} م${x.seg} ش${x.slide}`;
  const loc=`\nالمكان: الحلقة ${x.ep} · المقطع ${x.seg} · الشريحة ${x.slide} · الجملة ${x.line} (صف ${x.line} في السكريبت)`;
  return x.kind==='تعديل سيناريو'?`${head} تعديل${loc}${x.phrase?`\nاستبدل العبارة: «${x.phrase}»`:''}\nالقديم: ${x.old}\nالجديد: ${x.new}\nالسبب: ${x.text||'—'}`:`${head}${x.t!=null?' ث'+fmt(x.t):''}${loc}\nالعبارة: «${x.phrase||x.quote}»\nالنوع: ${x.kind}\nالملاحظة: ${x.text}`}
function noteHTML(x){return `<div class="note ${x.status==='done'?'done':''}"><b>${esc(x.kind)}</b>${x.t!=null?` · <span class="vt">${fmt(x.t)}</span>`:''}${x.phrase?` · «${esc(x.phrase)}»`:''} — ${x.kind==='تعديل سيناريو'?`<div>الجديد: ${esc(x.new)}</div>${x.text?`<div class="style">السبب: ${esc(x.text)}</div>`:''}`:esc(x.text)}${x.reply?`<div class="rp">رد Claude: ${esc(x.reply)}</div>`:''}</div>`}

      h+=`<div class="ln" id="L${l.n}"><div class="num">ج${l.n}</div><div class="body"><div class="row">${l.vt!=null?`<span class="vt">${fmt(l.vt)}</span>`:''}${chips(l)}</div>
      <div class="say" data-n="${l.n}">${sayHTML(l.t)}</div>${l.style?`<div class="style">${esc(l.style)}</div>`:''}${l.screen?`<div class="scr">على الشاشة: ${esc(l.screen)}</div>`:''}

/* ---------- karaoke record ---------- */
let K={rec:false,tone:true,fsz:0,gap:1.5,playing:false,phase:'idle',ps:0,words:[],total:0,spd:1,raf:0,last:-9,AC:null,manual:false,paused:0};
try{const v=parseFloat(localStorage.getItem('kh1_spd'));if(v)K.spd=v;const f=parseFloat(localStorage.getItem('kh1_fsz'));if(f>=0)K.fsz=f;const g=parseFloat(localStorage.getItem('kh1_gap'));if(g)K.gap=g}catch(e){}
function beep(f,d){if(!$('#snd')?.checked)return;try{K.AC=K.AC||new (window.AudioContext||window.webkitAudioContext)();const o=K.AC.createOscillator(),g=K.AC.createGain();o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(K.AC.destination);o.start();o.stop(K.AC.currentTime+d)}catch(e){}}
function kparse(t){const o=[];let at=0;const spc=0.092/K.spd;t.split(/\s+/).filter(Boolean).forEach(w=>{const m=w.match(/^\[\[([\d.]+)\]\]$/);if(m){const d=+m[1];o.push({p:m[1],st:at,d});at+=d}else{const d=(w.length+1)*spc;o.push({w,st:at,d});at+=d}});K.words=o;K.total=at}
const pad=n=>String(n).padStart(2,'0');
const LID=(e,n)=>`${EL(e)}-L${pad(n)}`, SID=(e,si)=>`${EL(e)}-${pad(si+1)}`;
function segName(s){return plain(s.lines[0].t).split(' ').slice(0,3).join(' ')}
function doneSegs(){try{return JSON.parse(localStorage.getItem('kh1_done_'+cur)||'[]')}catch(e){return []}}
function markDone(si){try{const d=new Set(doneSegs());d.add(si);localStorage.setItem('kh1_done_'+cur,JSON.stringify([...d]))}catch(e){}}
function renderRec(){
  const e=ep();if(!e.segs.length){$('#main').innerHTML=`<div class="empty">نص الحلقة ${e.n} مش عندي. ابعته في الشات وأضيفه هنا.</div>`;return}
  const F=flat(e);rpos=Math.max(0,Math.min(rpos,F.length-1));const l=F[rpos];kparse(l.t);
  const segL=F.filter(x=>x.si===l.si),D=doneSegs();K.vm=!!(e.pv&&segL.every(x=>x.kw&&x.kw.length));K.segL=segL;
  $('#main').innerHTML=`<div class="row" style="justify-content:space-between"><h1>${(e.s||1)>1?`السلسلة ${e.s} · `:''}الحلقة ${e.k||e.n}: ${esc(e.title)}</h1>
    <div class="row"><button id="copyAll">نسخ كل الملاحظات</button><button id="dlNotes">ملف الملاحظات</button></div></div>
  <div class="row segtabs" style="margin-top:6px">${e.segs.map((s,i)=>`<button data-seg="${i}" aria-pressed="${i===l.si}"><span class="dot ${D.includes(i)?'ok':''}"></span>${pad(i+1)} ${esc(segName(s))}</button>`).join('')}</div>
  <div class="rec"><div class="textcol">
    <div class="sig" id="sig"><span class="sn" id="sn"></span><span id="st">${SID(e.n,l.si)}: سجّل الشريحة دي في فويس لوحده.</span></div><div class="tbar"><i id="tl"></i></div>
    <div class="segtext" id="segtext">${segL.map(x=>`<div class="kl ${x.n===l.n?'now':x.n<l.n?'past':''}" data-n="${x.n}"><div class="klrow"><span class="lid">${LID(e.n,x.n)}</span><div class="kltx">${x.kw?kwHTML(x):x.n===l.n?K.words.map((w,k)=>w.p!=null?`<span class="pz ${+w.p>=1?'long':''}" data-k="${k}">${w.p}</span>`:`<span class="kw" data-k="${k}">${esc(w.w)}</span>`).join(' '):x.t.split(/\s+/).filter(Boolean).map(w=>/^\[\[/.test(w)?`<span class="pz">${w.slice(2,-2)}</span>`:`<span class="kw">${esc(w)}</span>`).join(' ')}
      ${K.tone?`<div class="tone">${chips(x)} ${esc(x.style||'')}</div>`:''}</div><div class="lbtn"><button data-act="note" data-n="${x.n}">علّق</button><button data-act="code" data-n="${x.n}">كود</button></div></div></div>`).join('')}</div>
    <div class="scrnow" id="scrnow" ${l.screen?'':'hidden'}><b>على الشاشة دلوقتي:</b> <span>${esc(l.screen||'')}</span></div>
    <div class="ctl">
      <button class="primary" id="kRec">${K.playing&&K.rec?'⏸ إيقاف':'● ابدأ تسجيل الشريحة'}</button>
      <button id="kTry">${K.playing&&!K.rec?'⏸ إيقاف':'▶ تجربة من غير تسجيل'}</button>
      <button id="rNext">الجملة الجاية (مسافة)</button><button id="kEnd" class="stopb">■ إنهاء الشريحة</button>
      <button id="sPrev">→ الشريحة اللي قبل</button><button id="sNext">الشريحة الجاية ←</button>
      <button id="kAgain">↻ أعد الجملة (R)</button>
    </div>
    <div class="ctl">
      <label>السرعة <input id="kSpd" type="range" min="0.7" max="1.4" step="0.05" value="${K.spd}"> <span id="kSpdV">${Math.round(K.spd*100)}%</span></label>
      <label>الخط <input id="kFsz" type="range" min="0" max="60" step="2" value="${K.fsz}"> <span id="kFszV">${K.fsz?K.fsz+"px":"تلقائي"}</span></label>
      <label>سكوت بين الجمل <input id="kGap" type="range" min="0.5" max="5" step="0.5" value="${K.gap}"> <span id="kGapV">${K.gap} ث</span></label>
      <label><input type="checkbox" id="kMan" ${K.manual?'checked':''}> وقّف بعد كل جملة</label><label><input type="checkbox" id="kTone" ${K.tone?'checked':''}> النبرة</label><label><input type="checkbox" id="snd"> صوت تنبيه</label></div>
  </div>
  <aside class="pvbox">${(l.seg.pv||e.pv)?`<video id="pv" src="${l.seg.pv||e.pv}" muted playsinline preload="auto" onerror="this.closest('.pvbox').querySelector('.cap').textContent='الرسم مش متاح للحلقة دي لسه'"></video><div class="tbar"><i id="pvbar" style="width:0"></i></div><div class="cap row" style="justify-content:space-between"><span>${SID(e.n,l.si)} · الشريحة ${esc(l.seg.slide)} ${l.seg.pv?'(القصة)':'وهي بتترسم'+(e.synth?' (رسم مبدئي)':'')}</span><span id="pvt"></span></div>`:`<div class="cap">الرسم مش متاح للحلقة دي.</div>`}
</aside></div>`;
  fit();kpaint(0);if(K.vm){const v=$('#pv');const go=()=>{try{v.pause();v.currentTime=Math.max(0,lStart(l)-0.3)}catch(e){}vpaint(Math.max(0,lStart(l)-0.3))};v&&(v.readyState>=1?go():v.addEventListener('loadedmetadata',go,{once:true}))}else pvRest(l,F);pvWatch(l,F);$('.kl.now')?.scrollIntoView({block:'nearest'});
}
function segRange(F,si){const L=F.filter(x=>x.si===si);const a=L.find(x=>x.vt!=null)?.vt;let b=null;for(let j=F.indexOf(L[L.length-1])+1;j<F.length;j++)if(F[j].vt!=null){b=F[j].vt;break}return [a,b]}
function pvWatch(l,F){const v=$('#pv');if(!v)return;const [a,b]=segRange(F,l.si);if(a==null)return;v.ontimeupdate=()=>{const end=b??v.duration;const p=Math.max(0,Math.min(1,(v.currentTime-a)/((end||a+1)-a)));const bar=$('#pvbar');if(bar)bar.style.width=(p*100)+'%';const tt=$('#pvt');if(tt)tt.textContent=fmt(Math.max(0,v.currentTime-a))+' / '+fmt((end||a)-a)}}
function fit(){const b=$('#segtext');if(!b)return;const ctl=document.querySelector('.ctl');const avail=Math.max(220,window.innerHeight-b.getBoundingClientRect().top-(ctl?ctl.offsetHeight:60)-46);b.style.height=avail+'px';
  if(K.fsz){b.style.height='auto';b.style.fontSize=K.fsz+'px';return}
  let lo=11,hi=window.innerWidth<760?30:46;for(let i=0;i<9;i++){const m=(lo+hi)/2;b.style.fontSize=m+'px';if(b.scrollHeight<=b.clientHeight+1)lo=m;else hi=m}b.style.fontSize=lo+'px'}
addEventListener('resize',()=>{if(mode==='rec')fit()});try{document.fonts.ready.then(()=>{if(mode==='rec')fit()})}catch(e){}
function nextVt(F,i){for(let j=i+1;j<F.length;j++)if(F[j].vt!=null)return F[j].vt;return null}
function pvRest(l,F){const v=$('#pv');if(!v||l.vt==null)return;const nv=nextVt(F,rpos);const go=()=>{try{v.pause();v.currentTime=Math.max(0,(nv??l.vt+4)-0.2)}catch(e){}};v.readyState>=1?go():v.addEventListener('loadedmetadata',go,{once:true})}
function pvPlay(){const v=$('#pv');const F=flat(ep());const l=F[rpos];if(!v||l.vt==null)return;const nv=nextVt(F,rpos)??(l.vt+K.total);
  try{v.currentTime=l.vt;v.playbackRate=Math.min(4,Math.max(0.25,(nv-l.vt)/Math.max(0.5,K.total)));v.play().catch(()=>{})}catch(e){}}
function pvPause(){const v=$('#pv');if(v)try{v.pause()}catch(e){}}
function ksig(c,n,t){const g=$('#sig');if(!g)return;g.className='sig '+c;$('#sn').textContent=n;$('#st').textContent=t}
function kpaint(t){document.querySelectorAll('.kl.now [data-k]').forEach(el=>{const x=K.words[+el.dataset.k];if(!x)return;
  if(x.p!=null){el.classList.toggle('on',K.phase==='speak'&&t>=x.st&&t<x.st+x.d);return}
  if(K.phase==='hold'||(K.phase==='speak'&&t>=x.st+x.d)){el.classList.add('done');el.style.setProperty('--p','100%')}
  else if(K.phase==='speak'&&t>=x.st){el.classList.remove('done');el.style.setProperty('--p',Math.round((t-x.st)/x.d*100)+'%')}
  else{el.classList.remove('done');el.style.setProperty('--p','0%')}})}
function kenter(p){K.phase=p;K.ps=performance.now();K.last=-9;if(p==='speak')pvPlay();else if(p!=='hold')pvPause()}
function ktick(now){if(!K.playing||mode!=='rec'){K.raf=0;return}
  const F=flat(ep()),l=F[rpos],t=(now-K.ps)/1000,tl=$('#tl');
  if(K.phase==='gap'){const first=rpos===0||F[rpos-1].si!==l.si,g=first?Math.max(3,K.gap):K.gap,left=Math.ceil(g-t);if(left!==K.last){K.last=left;if(left>0)beep(440,.1)}
    ksig('stop',left>0?left:'',first?`المقطع ${l.si+1}: خد نفس…`:'سكوت… الجملة بتبدأ');if(tl)tl.style.width=Math.max(0,100-t/g*100)+'%';if(t>=g){kenter('speak');beep(880,.2)}}
  else if(K.phase==='speak'){const rem=K.total-t;if(tl)tl.style.width=Math.max(0,100-t/K.total*100)+'%';ksig(rem>1.2?'go':'soon','',rem>1.2?'اتكلم':'قرّبت تخلص');kpaint(t);if(t>=K.total){kenter('hold');kpaint(t)}}
  else if(K.phase==='hold'&&t>=0.6){pvPause();
    if(rpos<F.length-1&&F[rpos+1].si===l.si&&!K.manual){rpos++;renderRec();kenter('gap')}
    else{K.playing=false;K.phase='idle';const endSeg=rpos===F.length-1||F[rpos+1].si!==l.si;if(endSeg&&K.rec)markDone(l.si);
      if(endSeg&&rpos<F.length-1){rpos++;renderRec();ksig('stop','✓',`خلص المقطع ${l.si+1}. وقّف التسجيل وابعته «${AR(cur)} مقطع ${l.si+1}»، وبعدين «ابدأ» للمقطع ${l.si+2}.`)}
      else if(endSeg){ksig('stop','✓',`خلصت الحلقة. ابعت فويس «${AR(cur)} مقطع ${l.si+1}».`)}
      else{ksig('','','يدوي: دوس «الجاية» أو المسافة')}
      K.raf=0;syncBtns();return}}
  K.raf=requestAnimationFrame(ktick)}
function syncBtns(){const r=$('#kRec'),t=$('#kTry');if(r)r.textContent=K.playing&&K.rec?'⏸ إيقاف':'● ابدأ تسجيل الشريحة';if(t)t.textContent=K.playing&&!K.rec?'⏸ إيقاف':'▶ تجربة من غير تسجيل'}
function kstart(){K.playing=true;if(K.phase==='idle'||K.phase==='hold')kenter('gap');else{K.ps=performance.now()-K.paused*1000;if(K.phase==='speak')pvPlay()}syncBtns();if(!K.raf)K.raf=requestAnimationFrame(ktick)}
function kstop(){K.playing=false;K.paused=(performance.now()-K.ps)/1000;pvPause();syncBtns();ksig('','','واقف. دوس نفس الزرار تكمّل')}
function kreset(){K.playing=false;K.phase='idle';K.paused=0;pvPause()}


function kwHTML(x){const out=[];x.kw.forEach((cl,ci)=>{if(ci>0){const pe=x.kw[ci-1].at(-1)[2],ns=cl[0][1];out.push(`<span class="pz vp" data-s="${pe}" data-e="${ns}">${(ns-pe).toFixed(1)}</span>`)}
  cl.forEach(w=>out.push(`<span class="kw vk" data-s="${w[1]}" data-e="${w[2]}">${esc(w[0])}</span>`))});return out.join(' ')}
const lStart=x=>x.kw[0][0][1], lEnd=x=>x.kw.at(-1).at(-1)[2];
function vstart(){const v=$('#pv');if(!v){K.vm=false;return kstart()}K.playing=true;
  if(K.phase==='video'||K.phase==='mwait'){v.playbackRate=K.spd;v.play().catch(()=>{});K.phase='video'}
  else{K.phase='count';K.ps=performance.now();K.last=-9;const L=K.segL;const i=Math.max(0,L.findIndex(x=>x.n===flat(ep())[rpos].n));K.from=i;try{v.pause();v.currentTime=Math.max(0,lStart(L[i])-0.3)}catch(e){}}
  syncBtns();if(!K.raf)K.raf=requestAnimationFrame(vtick)}
function vstop(){K.playing=false;pvPause();syncBtns();ksig('','','واقف. دوس نفس الزرار تكمّل')}
function vpaint(t){let curN=null;document.querySelectorAll('#segtext .kl').forEach(row=>{const x=K.segL.find(y=>y.n===+row.dataset.n);if(!x||!x.kw)return;const s0=lStart(x),e0=lEnd(x);
  const isNow=t>=s0-0.3&&t<=e0+0.6||(curN==null&&t<s0-0.3&&x===K.segL[K.from||0]);if(t>=s0-0.3)curN=x.n;
  row.querySelectorAll('.vk').forEach(el=>{const a=+el.dataset.s,b=+el.dataset.e;if(t>=b){el.classList.add('done');el.style.setProperty('--p','100%')}else if(t>=a){el.classList.remove('done');el.style.setProperty('--p',Math.round((t-a)/Math.max(.05,b-a)*100)+'%')}else{el.classList.remove('done');el.style.setProperty('--p','0%')}});
  row.querySelectorAll('.vp').forEach(el=>el.classList.toggle('on',t>=+el.dataset.s&&t<+el.dataset.e))});
  if(curN==null)curN=K.segL[K.from||0].n;
  document.querySelectorAll('#segtext .kl').forEach(row=>{const n=+row.dataset.n;row.classList.toggle('now',n===curN);row.classList.toggle('past',n<curN)});
  const F=flat(ep());const gi=F.findIndex(y=>y.n===curN);if(gi!==rpos){rpos=gi;const sn=$('#scrnow');if(sn){sn.hidden=!F[gi].screen;sn.querySelector('span').textContent=F[gi].screen||''}document.querySelector('.kl.now')?.scrollIntoView({block:'nearest'})}
  return F[gi]}
function vtick(now){if(!K.playing||mode!=='rec'||!K.vm){K.raf=0;return}const v=$('#pv');
  if(K.phase==='count'){const t=(now-K.ps)/1000,left=Math.ceil(3-t);if(left!==K.last){K.last=left;if(left>0)beep(440,.1)}ksig('stop',left>0?left:'',`${SID(cur,flat(ep())[rpos].si)}: خد نفس…`);const tl=$('#tl');if(tl)tl.style.width=Math.max(0,100-t/3*100)+'%';
    if(t>=3){K.phase='video';v.playbackRate=K.spd;v.play().catch(()=>{});beep(880,.2)}}
  else if(K.phase==='video'){const t=v.currentTime;const x=vpaint(t);const L=K.segL,last=L.at(-1);
    const speaking=x&&x.kw.some(cl=>t>=cl[0][1]-0.05&&t<=cl.at(-1)[2]);const le=lEnd(x);
    ksig(speaking?(le-t<1.2?'soon':'go'):'stop','',speaking?(le-t<1.2?'قرّبت تخلص':'اتكلم'):'سكوت…');const tl=$('#tl');if(tl&&x)tl.style.width=Math.max(0,Math.min(100,100-(t-lStart(x))/Math.max(.5,le-lStart(x))*100))+'%';
    if(K.manual&&x!==last&&t>le+0.15){v.pause();K.phase='mwait';ksig('','','دوس «الجملة الجاية» أو المسافة')}
    if(t>=lEnd(last)+0.4){v.pause();K.playing=false;K.phase='idle';if(K.rec)markDone(x.si);const F=flat(ep());const more=F.findIndex(y=>y.si===x.si+1);
      ksig('stop','✓',more>=0?`خلصت الشريحة ${x.si+1}. وقّف التسجيل وابعته «${SID(cur,x.si)}»، وبعدين ابدأ الشريحة ${x.si+2}.`:`خلصت الحلقة. ابعت «${SID(cur,x.si)}».`);
      if(more>=0){rpos=more;renderRec();ksig('stop','✓',`خلصت الشريحة ${x.si+1}. ابعت الفويس «${SID(cur,x.si)}»، وبعدين ابدأ الشريحة ${x.si+2}.`)}syncBtns();K.raf=0;return}}
  K.raf=requestAnimationFrame(vtick)}
function vseekLine(dir){const v=$('#pv');const L=K.segL;let i=L.findIndex(y=>y.n===flat(ep())[rpos].n)+dir;if(i<0||i>=L.length)return false;rpos=flat(ep()).findIndex(y=>y.n===L[i].n);try{v.currentTime=Math.max(0,lStart(L[i])-0.25)}catch(e){}if(K.phase==='mwait'){K.phase='video';v.play().catch(()=>{})}vpaint(v.currentTime);return true}

/* ---------- shell ---------- */
function render(){
  const cs=EO(cur).s||1;$('#eps').innerHTML=`<div class="row" style="gap:6px;flex-wrap:wrap">${[...new Set(EP.map(e=>e.s||1))].map(s=>`<button class="sbtn" aria-pressed="${s===cs}" data-ser="${s}">س${s}: ${esc(SERIES[s]||'')}</button>`).join('')}</div><div class="row" style="gap:6px;margin-top:6px">${EP.filter(e=>(e.s||1)===cs).map(e=>`<button aria-pressed="${e.n===cur}" data-ep="${e.n}" title="${esc(e.title)}">${e.k||e.n}</button>`).join('')}</div>`;
  $('#mRec').setAttribute('aria-pressed',mode==='rec');$('#mRev').setAttribute('aria-pressed',mode==='rev');$('#mSync').setAttribute('aria-pressed',mode==='sync');
  $('#ncount').textContent=NOTES.filter(x=>x.status!=='done').length;
  if(mode!=='sync')SY.au&&SY.au.pause();
  mode==='rec'?renderRec():mode==='sync'?renderSync():renderReview();if(!$('#panel').hidden)renderPanel()}
function renderPanel(){const L=NOTES.slice().sort((a,b)=>(a.ep-b.ep)||(a.line-b.line));
  $('#panel').innerHTML=`<h2>ملاحظاتي</h2><p class="style">${db?'كل ملاحظة وتعديل بيتحفظوا. قولّي في الشات «راجع الملاحظات» وأنا أقراهم كاملين وأرد هنا.':'الحفظ شغّال في الصفحة المنشورة بس. هنا استخدم «انسخ الكود» والزقه في الشات.'}</p>
  ${L.length?L.map(x=>`<div style="margin-bottom:10px"><div class="style">ح${x.ep} · ج${x.line} · مقطع ${x.seg}</div>${noteHTML(x)}<div class="acts"><button data-act="toggle" data-id="${x.id}">${x.status==='done'?'رجّعها مفتوحة':'اتحلّت'}</button><button data-act="go" data-ep="${x.ep}" data-line="${x.line}">روح للجملة</button><button data-act="copyId" data-id="${x.id}">انسخ الكود</button></div></div>`).join(''):'<p>لسه مفيش ملاحظات.</p>'}<button id="closeP">اقفل</button>`}
function lineByN(n){return flat(ep()).find(x=>x.n===n)}
document.addEventListener('click',async ev=>{
  const kw=ev.target.closest('.kl .kw');if(kw&&mode==='rec'){kreset();const n=+kw.closest('.kl').dataset.n;const sel=String(getSelection()||'').trim();form={n,type:'note',phrase:sel||kw.textContent};mode='rev';render();$('#L'+n)?.scrollIntoView({block:'center'});return}
  const b=ev.target.closest('button');if(!b)return;const a=b.dataset.act;
  if(b.dataset.ser){const s=+b.dataset.ser;const f=EP.find(e=>(e.s||1)===s);if(f){kreset();cur=f.n;rpos=0;form=null;try{localStorage.setItem('kh1_ep',cur)}catch(e){}render();scrollTo(0,0)}return}
  if(b.dataset.ep&&!a){kreset();cur=+b.dataset.ep;rpos=0;form=null;try{localStorage.setItem('kh1_ep',cur)}catch(e){}render();scrollTo(0,0);return}
  if(b.id==='mSync'){kreset();mode='sync';form=null;try{localStorage.setItem('kh1_mode',mode)}catch(e){}render();return}
  if(b.dataset.sy){await syAct(b.dataset.sy,b);return}
  if(b.id==='mRec'||b.id==='mRev'){kreset();mode=b.id==='mRec'?'rec':'rev';form=null;try{localStorage.setItem('kh1_mode',mode)}catch(e){}render();return}
  if(b.dataset.seg!=null){kreset();const F=flat(ep());rpos=F.findIndex(x=>x.si===+b.dataset.seg);render();return}
  if(b.id==='kRec'||b.id==='kTry'){const want=b.id==='kRec';if(K.playing&&K.rec===want){K.vm?vstop():kstop();return}if(K.playing)(K.vm?vstop():kstop());
    if(K.phase==='idle'&&want){const F=flat(ep());rpos=F.findIndex(x=>x.si===F[rpos].si);renderRec()}K.rec=want;K.vm?vstart():kstart();return}
  if(b.id==='kEnd'){const F=flat(ep());const si=F[rpos].si;kreset();if(K.rec)markDone(si);K.rec=false;renderRec();ksig('stop','■',`انتهت الشريحة ${si+1}. ابعت الفويس «${SID(cur,si)}».`);return}
  if(b.id==='sPrev'||b.id==='sNext'){kreset();const F=flat(ep());const si=F[rpos].si+(b.id==='sNext'?1:-1);const i=F.findIndex(x=>x.si===si);if(i>=0){rpos=i;render()}return}
  if(b.id==='copyAll'){const L=NOTES.filter(x=>x.ep===cur&&x.status!=='done');copyText(L.length?L.map(codeFor).join('\n\n'):'مفيش ملاحظات مفتوحة في الحلقة دي.',b);return}
  if(b.id==='dlNotes'){const L=NOTES.filter(x=>x.ep===cur);const txt=L.length?L.map(codeFor).join('\n\n'):'مفيش ملاحظات.';try{const dl=await window.claude?.use?.('downloads');if(dl){await dl.save({filename:`AddValue_${EL(cur)}_notes.txt`,data:txt});return}}catch(e){}copyText(txt,b);return}
  if(b.id==='kAgain'){if(K.vm&&(K.phase==='video'||K.phase==='mwait')){vseekLine(0);return}kreset();renderRec();K.vm?vstart():kstart();return}
  if(b.id==='kSegAgain'){kreset();const F=flat(ep());rpos=F.findIndex(x=>x.si===F[rpos].si);renderRec();kstart();return}
  if(b.id==='rPrev'){kreset();rpos--;render();return} if(b.id==='rNext'&&K.vm&&K.phase!=='idle'&&K.phase!=='count'){vseekLine(1);return}
  if(b.id==='rNext'){if(K.playing||K.phase!=='idle'){const F=flat(ep());if(rpos<F.length-1&&F[rpos+1].si===F[rpos].si){rpos++;renderRec();K.playing=true;kenter('gap');if(!K.raf)K.raf=requestAnimationFrame(ktick);return}}kreset();rpos++;render();return}
  if(a==='note'||a==='edit'){const n=+b.dataset.n;if(mode==='rec'){kreset();mode='rev'}let ph='';const sel=String(getSelection()||'').trim();const sayEl=document.querySelector(`.say[data-n="${n}"]`);if(sel&&sayEl&&sayEl.textContent.includes(sel))ph=sel;form={n,type:a,phrase:ph};render();setTimeout(()=>(a==='edit'?$('#fNew'):$('#fX'))?.focus(),0);return}
  if(a==='code'){const l=lineByN(+b.dataset.n);copyText(`#KH ${LID(cur,l.n)} ${AR(cur)} ج${l.n} م${l.si+1} ش${l.seg.slide}\nالنص: ${plain(l.t)}\nملاحظتي: `,b);return}
  if(a==='cancel'){form=null;render();return}
  if(a==='copyNote'||a==='copyEdit'){const f=b.closest('form');const l=lineByN(+f.dataset.n);copyText(codeFor(draftFromForm(f,l)),b);return}
  if(b.id==='openNotes'){$('#panel').hidden=false;renderPanel();return} if(b.id==='closeP'){$('#panel').hidden=true;return}
  if(a==='go'){kreset();cur=+b.dataset.ep;mode='rev';$('#panel').hidden=true;render();$('#L'+b.dataset.line)?.scrollIntoView({block:'center'});return}
  if(a==='copyId'){const x=NOTES.find(y=>y.id===b.dataset.id);if(x)copyText(codeFor(x),b);return}
  if(a==='toggle'&&db){const x=NOTES.find(y=>y.id===b.dataset.id);if(x)try{await db.doc('notes/'+x.id).update({status:x.status==='done'?'open':'done'})}catch(e){}}
});
document.addEventListener('submit',async ev=>{ev.preventDefault();const f=ev.target;const l=lineByN(+f.dataset.n);const d=draftFromForm(f,l);const w=$('#fW');
  if(d.kind==='تعديل سيناريو'?!d.new||d.new===d.old:!d.text){w.textContent=d.kind==='تعديل سيناريو'?'غيّر النص الأول.':'اكتب الملاحظة الأول.';return}
  if(!db){w.textContent='الحفظ مش متاح هنا. دوس «انسخ الكود» والزقه في الشات.';return}
  try{await db.collection('notes').add({...d,status:'open',reply:'',created:Date.now(),by:me||''});form=null;render()}catch(e){w.textContent='ما اتحفظتش. جرّب تاني، أو انسخ الكود.'}});
document.addEventListener('keydown',ev=>{if(mode!=='rec'||/TEXTAREA|INPUT/.test(document.activeElement?.tagName))return;
  if(ev.key===' '){ev.preventDefault();if(K.vm){if(K.phase==='mwait')vseekLine(1);else if(K.playing)vstop();else vstart();return}if(K.manual||K.phase==='idle'&&!K.playing){$('#rNext')?.click()}else{K.playing?kstop():kstart()}}else if(ev.key==='ArrowLeft'){kreset();rpos++;render()}else if(ev.key==='ArrowRight'){kreset();rpos--;render()}else if(ev.key==='r'||ev.key==='R'){kreset();renderRec();kstart()}});
document.addEventListener('input',ev=>{if(ev.target.id==='kSpd'){K.spd=+ev.target.value;$('#kSpdV').textContent=Math.round(K.spd*100)+'%';try{localStorage.setItem('kh1_spd',K.spd)}catch(e){}if(!K.playing)kparse(flat(ep())[rpos].t);const v=$('#pv');if(v&&K.vm)v.playbackRate=K.spd}if(ev.target.id==='kMan')K.manual=ev.target.checked;
  if(ev.target.id==='kTone'){K.tone=ev.target.checked;renderRec()}
  if(ev.target.id==='kFsz'){K.fsz=+ev.target.value;$('#kFszV').textContent=K.fsz?K.fsz+'px':'تلقائي';try{localStorage.setItem('kh1_fsz',K.fsz)}catch(e){}fit()}
  if(ev.target.id==='kGap'){K.gap=+ev.target.value;$('#kGapV').textContent=K.gap+' ث';try{localStorage.setItem('kh1_gap',K.gap)}catch(e){}}});

// ---------------- tap-to-sync: Ahmed taps at the start of each sentence while his own slide recording plays (10 Nov)
const SY={sl:0,idx:-1,times:[],au:null,saved:{},check:false,raf:0};
function syEp(){return ep().sync||[]}
function renderSync(){const S=syEp();const m=$('#main');
  if(!S.length){m.innerHTML=`<section class="card"><h2>ظبط التوقيت</h2><p>الحلقة دي لسه ما اتسجلتش بصوتك. لما تبعت فويسات الشرايح، هتلاقيها هنا.</p></section>`;return}
  if(SY.sl>=S.length)SY.sl=0;const s=S[SY.sl];const sv=SY.saved[`${cur}_${s.slide}`];
  m.innerHTML=`<section class="card sync"><h2>ظبط التوقيت: الحلقة ${cur}</h2>
   <p class="style">شغّل فويس الشريحة، ودوس <b>مسطرة</b> (أو الزرار الأخضر الكبير) <b>أول ما تبدأ كل جملة</b>. لو فاتتك جملة، دوس «رجوع جملة». في الآخر دوس «احفظ»، وبعدها «اسمع بالتوقيت» عشان تتأكد.</p>
   <div class="row" role="tablist">${S.map((x,i)=>`<button data-sy="tab" data-i="${i}" aria-pressed="${i===SY.sl}">الشريحة ${x.slide} ${SY.saved[`${cur}_${x.slide}`]?'✓':''}</button>`).join('')}</div>
   <audio id="syAu" src="${s.src}" preload="auto" controls style="width:100%;margin:10px 0"></audio>
   <div class="row"><button class="primary" data-sy="start">▶ ابدأ من الأول</button><button data-sy="back">↶ رجوع جملة</button><button data-sy="save">احفظ توقيت الشريحة</button><button data-sy="check">${SY.check?'⏸ وقّف':'🔊 اسمع بالتوقيت'}</button><span class="warn" id="syW">${sv?'التوقيت ده متحفظ ✓':''}</span></div>
   <button class="primary" data-sy="tap" id="syTap" style="width:100%;font-size:26px;padding:22px;margin:12px 0">دوس هنا أول ما تبدأ الجملة (مسطرة)</button>
   <ol class="sylist">${s.clauses.map((c,i)=>`<li id="sy${i}" class="${i===SY.idx?'now':''} ${SY.times[i]!=null?'done':''}"><span class="vt">${SY.times[i]!=null?SY.times[i].toFixed(2):'—'}</span> ${esc(c)}</li>`).join('')}</ol></section>`;
  SY.au=$('#syAu');syPaint()}
function syPaint(){const s=syEp()[SY.sl];if(!s)return;s.clauses.forEach((c,i)=>{const el=$('#sy'+i);if(!el)return;el.classList.toggle('now',i===SY.idx);el.classList.toggle('done',SY.times[i]!=null);el.querySelector('.vt').textContent=SY.times[i]!=null?SY.times[i].toFixed(2):'—'});const n=$('#sy'+Math.max(0,SY.idx));n&&n.scrollIntoView({block:'nearest'})}
function syTap(){if(!SY.au)return;if(SY.au.paused){SY.au.play().catch(()=>{});return}const s=syEp()[SY.sl];if(SY.idx+1>=s.clauses.length)return;SY.idx++;SY.times[SY.idx]=Math.max(0,SY.au.currentTime);syPaint()}
function syLoop(){if(!SY.check||!SY.au){SY.raf=0;return}const t=SY.au.currentTime;let k=-1;SY.times.forEach((x,i)=>{if(x!=null&&x<=t)k=i});if(k!==SY.idx){SY.idx=k;syPaint()}SY.raf=requestAnimationFrame(syLoop)}
async function syLoad(){if(!db)return;try{const q=await db.collection('sync').get();q.docs.forEach(d=>{const x=d.data();const key=`${x.ep}_${x.slide}`;if(!SY.saved[key]||x.created>SY.saved[key].created)SY.saved[key]=x})}catch(e){}}
async function syAct(a,b){const S=syEp();const s=S[SY.sl];
  if(a==='tab'){SY.sl=+b.dataset.i;const sv=SY.saved[`${cur}_${S[SY.sl].slide}`];SY.times=sv?sv.times.slice():[];SY.idx=-1;SY.check=false;renderSync();return}
  if(a==='start'){SY.check=false;SY.times=[];SY.idx=-1;SY.au.currentTime=0;await SY.au.play().catch(()=>{});syPaint();b.blur();return}
  if(a==='tap'){syTap();b.blur();return}
  if(a==='back'){if(SY.idx>=0){SY.times[SY.idx]=undefined;SY.idx--;}SY.au.currentTime=Math.max(0,(SY.times[SY.idx]??0)-0.3);syPaint();return}
  if(a==='check'){SY.check=!SY.check;if(SY.check){const sv=SY.saved[`${cur}_${s.slide}`];if(!SY.times.filter(x=>x!=null).length&&sv)SY.times=sv.times.slice();SY.au.currentTime=0;SY.idx=-1;SY.au.play().catch(()=>{});if(!SY.raf)SY.raf=requestAnimationFrame(syLoop)}else SY.au.pause();renderSync();return}
  if(a==='save'){const w=$('#syW');const n=SY.times.filter(x=>x!=null).length;if(n<s.clauses.length){w.textContent=`لسه ${s.clauses.length-n} جملة من غير توقيت`;return}
    const d={ep:cur,slide:s.slide,times:SY.times.map(x=>+x.toFixed(3)),n:s.clauses.length,created:Date.now(),by:me||''};
    try{if(!db)throw 0;await db.collection('sync').add(d);SY.saved[`${cur}_${s.slide}`]=d;w.textContent='اتحفظ ✓ وClaude هيقراه';renderSync()}catch(e){copyText('#KHSYNC '+JSON.stringify(d),b);w.textContent='ما اتحفظش، انسخ الكود وابعتهولي'}return}}
document.addEventListener('keydown',ev=>{if(mode!=='sync'||/TEXTAREA|INPUT/.test(document.activeElement?.tagName))return;if(ev.key===' '){ev.preventDefault();syTap()}else if(ev.key==='Backspace'){ev.preventDefault();syAct('back')}});
render();
(async()=>{try{if(!window.claude?.use)return;db=await window.claude.use('db');const u=await window.claude.use('user');if(u){try{me=await u.id()}catch(e){}}if(!db)return;
  syLoad().then(()=>{if(mode==='sync')render()});
  db.collection('notes').onSnapshot(s=>{NOTES=s.docs.map(d=>({id:d.id,...d.data()}));if(form||mode==='rec'){$('#ncount').textContent=NOTES.filter(x=>x.status!=='done').length;if(!$('#panel').hidden)renderPanel();return}render()},()=>{})}catch(e){}})();
</script>
