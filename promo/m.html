<html dir="rtl"><head><meta charset="utf-8"><style id="fonts"></style><style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Cairo;background:#fbf8f1;background-image:radial-gradient(#d6cfbf 2px,transparent 2px);background-size:34px 34px;position:relative}
.V{width:1080px;height:1920px}.S{width:1080px;height:1080px}
.top{position:absolute;top:0;left:0;right:0;height:120px;background:#102a43;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 50px;font:900 48px Cairo}
.top b{color:#f5b301}
.sc{position:absolute;left:0;right:0;text-align:center;opacity:0}
.big{font-family:Lalezar;color:#102a43;line-height:1.15}
.red{color:#d63a2f}.grn{color:#1EA05F}
.num{font-family:Lalezar;color:#1EA05F;line-height:1}
.pill{display:inline-block;background:#1EA05F;color:#fff;font-weight:900;border:4px solid #102a43;border-radius:60px;padding:8px 44px}
.li{font-weight:900;color:#102a43;margin:14px 0}
.li span{display:inline-block;width:1.1em;color:#1EA05F}
.phone{position:absolute;border:6px solid #102a43;border-radius:40px;opacity:0;box-shadow:10px 10px 0 #102a43;background:transparent}
.foot{position:absolute;left:0;right:0;text-align:center;font-weight:800;color:#102a43}
</style></head><body>
<div class="top"><span>تطبيق <b>خُطوة</b></span><span style="font-size:42px">Add Value</span></div>
<div class="sc" id="s1"><div class="big" id="s1a">من <span class="red">21 يوم</span> بس</div><div class="big" id="s1b" style="opacity:0">نزّلنا تطبيق <span class="grn">خُطوة</span></div></div>
<div class="sc" id="s2"><div class="big" id="s2h">الحمد لله</div><div class="num" id="cnt">0</div><div class="big" id="s2t">تحميل للتطبيق</div><div id="s2p" style="opacity:0;margin-top:30px"><span class="pill" id="s2pp">في 21 يوم</span></div></div>
<div class="sc" id="s3"><div class="big" id="s3h">وابتدينا نشتغل على<br><span class="grn">المناهج والتطوير</span></div><div id="s3l"></div></div>
<div class="phone" id="ph"></div>
<div class="foot" id="ft">خُطوة · من Add Value</div>
<div class="sc" id="s4"><div class="big" id="s4a">شكرًا لكل طالب<br>بدأ معانا</div><div style="margin-top:36px"><span class="pill" id="s4p">مجاني · حمّله دلوقتي</span></div><div class="big" id="s4b" style="margin-top:40px">الثانوية مش قفزة.<br><span class="grn">الثانوية سلّم.</span></div><div id="s4c" style="margin-top:30px;font-weight:800;color:#102a43">اللينك في أول تعليق ↓</div></div>
<script>
const M=new URLSearchParams(location.search).get('m')||'V';document.body.className=M;const V=M=='V';
const $=i=>document.getElementById(i);
const L=["شرح الدروس بالفيديو","حل أسئلة الكتاب الوزاري","كويز ومراجعة","تعرف وصلت لفين في المنهج"];
$('s3l').innerHTML=L.map((x,i)=>`<div class="li" id="l${i}" style="opacity:0"><span>✓</span>${x}</div>`).join('');
// layout
const S=(id,css)=>Object.assign($(id).style,css);
if(V){S('s1',{top:'640px'});['s1a','s1b'].forEach(i=>$(i).style.fontSize='120px');
 S('s2',{top:'470px'});$('s2h').style.fontSize='96px';$('cnt').style.fontSize='420px';$('s2t').style.fontSize='110px';$('s2pp').style.fontSize='60px';
 S('s3',{top:'190px'});$('s3h').style.fontSize='88px';S('s3l',{display:'none'});
 S('ph',{left:'285px',top:'560px',width:'510px',height:'1020px'});
 S('s4',{top:'470px'});S('ft',{bottom:'90px',fontSize:'50px'});S('s2',{top:'520px'});$('s4a').style.fontSize='100px';$('s4p').style.fontSize='64px';$('s4b').style.fontSize='96px';$('s4c').style.fontSize='52px';}
else{S('s1',{top:'360px'});['s1a','s1b'].forEach(i=>$(i).style.fontSize='104px');
 S('s2',{top:'150px'});$('s2h').style.fontSize='70px';$('cnt').style.fontSize='300px';$('s2t').style.fontSize='84px';$('s2pp').style.fontSize='48px';
 S('s3',{top:'200px',left:'560px',right:'40px',textAlign:'right'});$('s3h').style.fontSize='64px';S('s3l',{marginTop:'30px',fontSize:'40px'});
 S('ph',{left:'70px',top:'150px',width:'445px',height:'890px'});
 S('s4',{top:'190px'});S('ft',{bottom:'30px',fontSize:'36px',left:'540px'});$('s4a').style.fontSize='80px';$('s4p').style.fontSize='50px';$('s4b').style.fontSize='74px';$('s4c').style.fontSize='42px';}
const cl=x=>Math.max(0,Math.min(1,x)),ease=x=>1-Math.pow(1-cl(x),3);
const show=(id,a,b,t,dy=40)=>{const i=ease((t-a)/.45),o=b?ease((b-t)/.35):1;const v=Math.min(i,o);$(id).style.opacity=v;$(id).style.transform=`translateY(${(1-i)*dy}px)`};
window.T=0;window.D=24;
window.render=t=>{
 show('s1',0,4.0,t);show('s1b',1.3,null,t);
 show('s2',4.0,10.0,t);const c=ease((t-4.6)/3.2);$('cnt').textContent=Math.round(332*c);
 $('cnt').style.transform=`scale(${1+0.08*Math.max(0,1-Math.abs(t-7.9)/0.4)})`;show('s2p',8.0,null,t);
 show('s3',10.0,18.0,t);show('ph',10.6,18.0,t,60);L.forEach((x,i)=>show('l'+i,11.4+i*1.2,null,t,20));
 show('s4',18.0,null,t);
};
render(0);
</script></body></html>
